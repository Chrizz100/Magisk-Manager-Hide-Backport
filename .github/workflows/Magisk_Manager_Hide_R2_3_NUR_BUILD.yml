permissions:
  contents: read

concurrency:
  group: magisk-manager-hide-r2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-audit:
    name: R2 - Verify original revisions and test reconstruction logic
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository with main.zip
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify existing R2.2 main.zip and apply reviewed R2.3 source overlay
        shell: bash
        run: |
          set -euo pipefail
          test -f main.zip
          printf '%s  main.zip\n' 'e0a5ad7a35ff631fee13395b9a4c140ab7813ad92737d85a8eb997003305fdb0' | sha256sum -c -
          unzip -t main.zip > /dev/null
          mkdir -p kit
          unzip -oq main.zip -d kit
          (cd kit && sha256sum -c MANIFEST.sha256)
          printf '%s' "$R23_SOURCE_OVERLAY_B64" | tr -d '[:space:]' | base64 -d > r23_source_overlay.tar.gz
          printf '%s  r23_source_overlay.tar.gz\n' '6e4206b6664a98ac886d7c0d7fcc331bb649f6ddc9bf574b2beb7f56dfa1194e' | sha256sum -c -
          tar -tzf r23_source_overlay.tar.gz | sort
          tar -xzf r23_source_overlay.tar.gz -C kit
          python3 -m py_compile kit/tools/reconstruct.py kit/tests/test_dynamic_loader_merge.py
          echo 'R2.3 source overlay applied in runner only; repository main.zip not modified.'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pinned YAML validator
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Validate R2 workflow and safety gates
        run: |
          python3 kit/tools/validate_workflow.py kit/.github/workflows/build.yml
          python3 - <<'PY_VALIDATE'
          import pathlib, yaml
          f=pathlib.Path('.github/workflows/build.yml')
          data=yaml.safe_load(f.read_text())
          assert set(data['jobs']) == {'source-audit','reconstruct-and-build'}
          assert data['jobs']['reconstruct-and-build']['needs'] == 'source-audit'
          assert 'R2.3' in data['name']
          s=f.read_text()
          assert s.count('R23_SOURCE_OVERLAY_B64') >= 3
          assert s.count('sha256sum -c -') >= 4
          assert 'python3 kit/tools/reconstruct.py --repo magisk --reports reports' in s
          assert 'fastboot flash' not in s and 'adb install' not in s
          assert 'continue-on-error: true' not in s
          print('Active R2.3 single-file workflow preflight: PASS')
          PY_VALIDATE

      - name: Publish SHA-pinned R2.2 main.zip from repository as GitHub artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: R2_3_PINNED_MAIN_ZIP_FROM_GITHUB
          path: main.zip
          if-no-files-found: error
          retention-days: 14

      - name: Run all R2 tests
        run: python3 -m unittest discover -s kit/tests -v

      - name: Checkout exact historical source before removal
        uses: actions/checkout@v4
        with:
          repository: topjohnwu/Magisk
          ref: ea16c8141eb64dc28b56a0e7fb536689ef465429
          path: pre-removal
          persist-credentials: false

      - name: Checkout official Magisk 31.1
        uses: actions/checkout@v4
        with:
          repository: topjohnwu/Magisk
          ref: 0972f67d97f9b6302b67c5171283330c74114b4a
          path: official-31-1
          persist-credentials: false

      - name: Run pinned upstream component audit
        run: |
          python3 kit/tools/audit.py \
            --pre pre-removal \
            --final official-31-1 \
            --output reports/R2_upstream_audit.json

      - name: Upload source audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R2_PINNED_SOURCE_AUDIT
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  reconstruct-and-build:
    name: R2.3 - Reconstruct 31.1 manager-hide and build only if clean
    needs: source-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - name: Checkout repository with main.zip
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify existing R2.2 main.zip and apply reviewed R2.3 source overlay
        shell: bash
        run: |
          set -euo pipefail
          test -f main.zip
          printf '%s  main.zip\n' 'e0a5ad7a35ff631fee13395b9a4c140ab7813ad92737d85a8eb997003305fdb0' | sha256sum -c -
          unzip -t main.zip > /dev/null
          mkdir -p kit
          unzip -oq main.zip -d kit
          (cd kit && sha256sum -c MANIFEST.sha256)
          printf '%s' "$R23_SOURCE_OVERLAY_B64" | tr -d '[:space:]' | base64 -d > r23_source_overlay.tar.gz
          printf '%s  r23_source_overlay.tar.gz\n' '6e4206b6664a98ac886d7c0d7fcc331bb649f6ddc9bf574b2beb7f56dfa1194e' | sha256sum -c -
          tar -tzf r23_source_overlay.tar.gz | sort
          tar -xzf r23_source_overlay.tar.gz -C kit
          python3 -m py_compile kit/tools/reconstruct.py kit/tests/test_dynamic_loader_merge.py
          echo 'R2.3 source overlay applied in runner only; repository main.zip not modified.'

      - name: Checkout official Magisk 31.1 with complete history and submodules
        uses: actions/checkout@v4
        with:
          repository: topjohnwu/Magisk
          ref: 0972f67d97f9b6302b67c5171283330c74114b4a
          fetch-depth: 0
          submodules: recursive
          path: magisk
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Revert all 8 removal commits with pinned manifest and native conflict reconciliation
        run: python3 kit/tools/reconstruct.py --repo magisk --reports reports

      - name: Set up Java 25 for Magisk build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Verify original Android 13 and ARM targets
        shell: bash
        run: |
          set -euo pipefail
          grep -qx 'abiList=arm64-v8a,armeabi-v7a' kit/config/sweet.prop
          grep -qx 'magisk.versionCode=31100' magisk/app/gradle.properties
          test -n "${ANDROID_HOME:-}"
          javac -version

      - name: Acquire official Magisk ONDK
        shell: bash
        run: cd magisk && python3 build.py -v ndk

      - name: Compile source candidate for ARM64 and ARM32
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          (cd magisk && python3 build.py -vr -c ../kit/config/sweet.prop all) \
            2>&1 | tee reports/R2_build.log

      - name: Verify unsigned source claims and APK archive structure
        run: |
          python3 kit/tools/verify_build.py \
            --apk magisk/out/app-release.apk \
            --output reports/R2_apk_check.json
          python3 kit/tools/verify_candidate.py \
            --apk magisk/out/app-release.apk \
            --output reports/R2_candidate_check.json

      - name: Mark candidate as untested, not for installation
        shell: bash
        run: |
          cat > magisk/out/DO_NOT_INSTALL_OR_FLASH.txt <<'EOF'
          UNTESTED MANAGER-HIDE R2 RESEARCH CANDIDATE
          Not Magisk Alpha 31100; fork of official Magisk 31.1.
          This is NOT a normal Magisk module or a verified bank/root-hiding fix.
          Native manager migration, APK signing and Android 13 emulator tests
          are REQUIRED before any installation on a physical device.
          Do not flash boot images. Do not install these APKs on your phone.
          EOF

      - name: Upload UNTESTED compiled candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: R2_EXPERIMENTAL_MAGISK_CANDIDATE_DO_NOT_FLASH
          path: magisk/out/
          if-no-files-found: error
          retention-days: 7

      - name: Upload reconstruction evidence and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R2_3_RECONSTRUCTION_AND_BUILD_REPORT
          path: reports/
          if-no-files-found: warn
          retention-days: 14
