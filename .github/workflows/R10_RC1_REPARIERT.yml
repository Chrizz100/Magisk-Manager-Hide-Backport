              # Do not bind the privileged root service on application startup.
              exact(ctx,'''        RootUtils.bindTask = RootService.bindOrTask(
                      intent<RootUtils>(),
                      UiThreadHandler.executor,
                      RootUtils.Connection
                  )''','''        // RC1: explicitly keep app's root service disconnected.
                  // Only the manually tapped, read-only diagnostic may request su.
                  RootUtils.bindTask = null''',r)
              exact(manifest,'<application android:localeConfig="@xml/locale_config">',f'<application android:localeConfig="@xml/locale_config" android:label="{LABEL}" tools:replace="android:label">',r)
              ElementTree.parse(manifest)
              exact(home,'''            first = {
                          if (uiState.isNoticeVisible) {''','''            first = {
                          PreReleaseDiagnosticsCard()
                          if (uiState.isNoticeVisible) {''',r)
              # Defensive blocks independent of the status of libsu, official/alpha daemon,
              # or whether a future caller bypasses the Compose UI. Local file patching
              # is retained; system partition / manager-mutation operations are not.
              exact(installer, '    protected suspend fun direct() = findImage() && extractFiles() && patchBoot() && flashBoot()',
                    '''    protected suspend fun direct(): Boolean {
                  console.add("! RC1: direct boot flash disabled for unverified Alpha backend")
                  return false
              }''',r)
              exact(installer,'''    protected suspend fun secondSlot() =
                  findSecondary() && extractFiles() && patchBoot() && flashBoot() && postOTA()''',
                    '''    protected suspend fun secondSlot(): Boolean {
                  console.add("! RC1: inactive-slot flash disabled")
                  return false
              }''',r)
              exact(installer, '    protected suspend fun fixEnv() = extractFiles() && "fix_env $installDir".sh().isSuccess',
                    '''    protected suspend fun fixEnv(): Boolean {
                  console.add("! RC1: native environment repair disabled")
                  return false
              }''',r)
              exact(installer, '    protected fun restore() = findImage() && "restore_imgs $targetImage".sh().isSuccess',
                    '''    protected fun restore(): Boolean {
                  console.add("! RC1: boot image restore disabled")
                  return false
              }''',r)
              exact(installer, '    protected fun uninstall() = "run_uninstaller $AppApkPath".sh().isSuccess',
                    '''    protected fun uninstall(): Boolean {
                  console.add("! RC1: native Magisk uninstall disabled")
                  return false
              }''',r)
              exact(migration,
                    '        if (context.packageName != APP_PACKAGE_NAME || isRunningAsStub || !Info.env.isActive) return false',
                    f'''        // RC1 never rebinds root permission ownership on a real phone.
                  if (context.packageName == "{PKG}") return false
                  if (context.packageName != APP_PACKAGE_NAME || isRunningAsStub || !Info.env.isActive) return false''',r)
              exact(migration,
                    '        if (!isRunningAsStub || context.packageName == APP_PACKAGE_NAME || !Info.env.isActive) {',
                    f'''        // RC1 cannot take over or restore the existing Alpha manager.
                  if (context.packageName == "{PKG}") return false
                  if (!isRunningAsStub || context.packageName == APP_PACKAGE_NAME || !Info.env.isActive) {{''',r)
              dest.write_text(DIAGNOSTICS.read_text(encoding='utf-8'),encoding='utf-8')
              r['changed'].append({'path':str(dest),'after':hashlib.sha256(dest.read_bytes()).hexdigest()})
              r['feature_flags']={'ui_home_settings':True,'root_diagnostic_explicit':True,'magisk_version_and_module_count':True,'patch_image_file_code_retained':True,'hide_restore_write':False,'boot_flash':False,'alpha_manager_control':False}
              assert PKG in setup.read_text() and PKG in gradle.read_text()
              assert 'Shell.FLAG_NON_ROOT_SHELL' in ctx.read_text() and 'RootService.bindOrTask(' not in ctx.read_text()
              assert 'PreReleaseDiagnosticsCard()' in home.read_text()
              assert 'RootUtils.bindTask = null' in ctx.read_text()
              assert 'patchFile(file: Uri' in installer.read_text() and 'protected suspend fun direct(): Boolean' in installer.read_text()
              assert 'if (context.packageName == "'+PKG+'") return false' in migration.read_text()
              report_path.parent.mkdir(parents=True,exist_ok=True)
              report_path.write_text(json.dumps(r,indent=2,ensure_ascii=False)+'\n')
              return r

          if __name__=='__main__':
              if len(sys.argv)!=3: sys.exit('usage: apply_r100.py magisk-source-directory report.json')
              print(json.dumps(apply(Path(sys.argv[1]),Path(sys.argv[2])),ensure_ascii=False))
          PY_R100_APPLY
          cat > PreReleaseDiagnosticsCard.kt <<'KT_R100_CARD'
          package com.topjohnwu.magisk.ui.home

          import androidx.compose.foundation.layout.Arrangement
          import androidx.compose.foundation.layout.Column
          import androidx.compose.foundation.layout.fillMaxWidth
          import androidx.compose.foundation.layout.padding
          import androidx.compose.material3.Button
          import androidx.compose.material3.Card
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.Text
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.remember
          import androidx.compose.runtime.rememberCoroutineScope
          import androidx.compose.runtime.setValue
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import java.util.concurrent.TimeUnit

          /**
           * R10.0: explicit, read-only device diagnostic for the owner's single phone.
           * No root request until the user taps the button. This does NOT attach the
           * official Magisk manager to an unrelated Magisk Alpha daemon.
           */
          @Composable
          internal fun PreReleaseDiagnosticsCard() {
              var output by remember { mutableStateOf("Noch nicht geprüft") }
              var running by remember { mutableStateOf(false) }
              val scope = rememberCoroutineScope()
              Card(modifier = Modifier.fillMaxWidth()) {
                  Column(
                      modifier = Modifier.padding(16.dp),
                      verticalArrangement = Arrangement.spacedBy(8.dp)
                  ) {
                      Text("Manager-Hide Vorab-Release R10.0", style = MaterialTheme.typography.titleMedium)
                      Text("Root-Status und Magisk-Version können geprüft werden. " +
                           "Die Root-Freigabe kann von Magisk gespeichert werden. " +
                           "Hide/Restore und Boot-Schreibzugriffe auf Magisk Alpha bleiben gesperrt.",
                           style = MaterialTheme.typography.bodySmall)
                      Button(
                          onClick = {
                              if (!running) {
                                  running = true
                                  output = "Root-Anfrage läuft; eventuell erscheint eine Freigabe von Magisk Alpha."
                                  scope.launch {
                                      output = withContext(Dispatchers.IO) { PreReleaseRootProbe.inspect() }
                                      running = false
                                  }
                              }
                          },
                          enabled = !running,
                      ) { Text(if (running) "Prüfung läuft" else "Root und Magisk prüfen (nur Lesen)") }
                      Text(output, style = MaterialTheme.typography.bodySmall)
                  }
              }
          }

          /** Read-only commands; unlike the Magisk app shell, this can request su once on tap. */
          private object PreReleaseRootProbe {
              private val command = listOf(
                  "printf 'ROOT_ID='; id",
                  "printf 'MAGISK_VERSION='; magisk -v",
                  "printf 'MAGISK_CODE='; magisk -V",
                  "printf 'DEVICE='; getprop ro.product.device",
                  "printf 'ANDROID='; getprop ro.build.version.release",
                  "printf 'MODULE_COUNT='; n=0; for d in /data/adb/modules/*; do [ -d \"\$d\" ] && n=\$((n+1)); done; echo \"\$n\"",
              ).joinToString("; ")

              fun inspect(): String {
                  return try {
                      val process = ProcessBuilder("su", "-c", command)
                          .redirectErrorStream(true)
                          .start()
                      if (!process.waitFor(15, TimeUnit.SECONDS)) {
                          process.destroyForcibly()
                          return "Zeitüberschreitung. Keine Boot- oder Systemdateien geschrieben."
                      }
                      val data = process.inputStream.bufferedReader().use { it.readText().take(2048) }
                      if (process.exitValue() != 0 || !data.contains("ROOT_ID=uid=0")) {
                          "Root nicht bestätigt oder Freigabe verweigert.\n" + data.take(320)
                      } else if (data.contains("-alpha", ignoreCase = true)) {
                          "Root funktioniert. Magisk Alpha erkannt.\n" + data +
                              "\nSchutz aktiv: keine Boot-/Manager-Änderungen."
                      } else {
                          "Root funktioniert, Version prüfen:\n" + data +
                              "\nKeine Freigabe für Boot-/Manager-Änderungen."
                      }
                  } catch (e: Exception) {
                      "Prüfung fehlgeschlagen: " + (e.javaClass.simpleName)
                  }
              }
          }
          KT_R100_CARD
          python3 -m py_compile apply_r100.py
          python3 apply_r100.py magisk reports/R100_SOURCE_POLICY.json

          test "$(git -C magisk rev-parse HEAD)" = '0972f67d97f9b6302b67c5171283330c74114b4a'
          mkdir -p reports dist
          for attempt in 1 2 3; do
            log="reports/r100_build_${attempt}.log"
            if (cd magisk && python3 build.py -vr -c ../r6-build.prop app) 2>&1 | tee "$log"; then
              printf 'BUILD_PASS_ON_ATTEMPT=%s\n' "$attempt" > reports/R100_BUILD_STATUS.txt
              break
            fi
            if ! grep -Eiq 'HTTP[^0-9]*5[0-9][0-9]|status code[^0-9]*5[0-9][0-9]|Gateway Time-out|Gateway Timeout|Service Unavailable|Connection reset|Connection timed out|Read timed out|UnknownHostException|TLS handshake' "$log"; then
              echo 'R10.0: compiler error, refusing blind retries' >&2
              exit 1
            fi
            test "$attempt" -lt 3 || { echo 'R10.0: network retries exceeded' >&2; exit 1; }
            sleep "$((attempt*10))"
          done

          test -s magisk/out/app-release.apk
          cp magisk/out/app-release.apk dist/R100_ALPHA_SAFE_PRERELEASE.apk
          python3 - <<'PY_R100_CHECK'
          from pathlib import Path
          import json,zipfile,hashlib
          p=Path('dist/R100_ALPHA_SAFE_PRERELEASE.apk')
          with zipfile.ZipFile(p) as z:
           assert z.testzip() is None
           assert any(n.startswith('classes') and n.endswith('.dex') for n in z.namelist())
          d=json.loads(Path('reports/R100_SOURCE_POLICY.json').read_text())
          assert d['package']=='org.chrizz100.magiskhide.prerelease'
          assert d['mode']=='SAFE_PRE_RELEASE'
          assert d['boot_write'] is False
          assert d['manager_rebinding'] is False
          assert d['auto_root_request'] is False
          assert d['real_device_tested'] is False
          sha=hashlib.sha256(p.read_bytes()).hexdigest()
          Path('dist/SHA256.txt').write_text(sha+'  R100_ALPHA_SAFE_PRERELEASE.apk\n')
          print('R10 release candidate source and APK integrity passed',sha)
          PY_R100_CHECK
          AAPT2="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/build-tools/37.0.0/aapt2"
          APKSIGNER="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/build-tools/37.0.0/apksigner"
          test -x "$AAPT2" && test -x "$APKSIGNER"
          "$AAPT2" dump packagename dist/R100_ALPHA_SAFE_PRERELEASE.apk | tee reports/R100_ANDROID_PACKAGE.txt
          grep -Fx 'org.chrizz100.magiskhide.prerelease' reports/R100_ANDROID_PACKAGE.txt
          "$APKSIGNER" verify --verbose --print-certs dist/R100_ALPHA_SAFE_PRERELEASE.apk > reports/R100_SIGNER.txt
          grep -Eq '^Verified$|Verifies$' reports/R100_SIGNER.txt
          cat > dist/READ_ME_FIRST.txt <<'R100_NOTICE'
          R10.0 RC1 - ALPHA-SAFE PRERELEASE (UNVERIFIED REAL DEVICE)

          This is a separately packaged prerelease, NOT a replacement for Magisk Alpha.
          Package: org.chrizz100.magiskhide.prerelease
          What is enabled: HOME/SETTINGS and explicit read-only su/Magisk version probe.
          Only tap the probe if you are prepared for Magisk Alpha to ask for su approval.
