          The ephemeral test key changes per workflow run. Uninstall this prerelease
          ONLY (not Magisk Alpha) before testing a later version with the same app ID.
          This cannot be guaranteed to defeat banking-app root detection.
          R100_NOTICE
          python3 - <<'PY_R100_SOURCE_ARCHIVE'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          import subprocess
          archive=Path('dist/R100_SOURCE_PATCHES.zip')
          diff=subprocess.run(['git','-C','magisk','diff','--binary'],capture_output=True,text=True,check=True).stdout
          assert len(diff)>1000,'Source diff unexpectedly empty'
          license=Path('magisk/LICENSE')
          assert license.is_file(),'Original license missing'
          with ZipFile(archive,'w',ZIP_DEFLATED,compresslevel=8) as z:
           z.writestr('PATCH_FROM_PINNED_MAGISK.diff',diff)
           z.write('apply_r100.py','patches/apply_r100.py')
           z.write('PreReleaseDiagnosticsCard.kt','patches/PreReleaseDiagnosticsCard.kt')
           z.write('reports/R100_SOURCE_POLICY.json','R100_SOURCE_POLICY.json')
           z.write(license,'upstream/LICENSE')
           z.writestr('README_SOURCE.txt',
                      'Reproducible complete source: github.com/topjohnwu/Magisk at\n'
                      '0972f67d97f9b6302b67c5171283330c74114b4a\n'
                      'plus .github/workflows/R100_PRE_RELEASE.yml from\n'
                      'github.com/Chrizz100/Magisk-Manager-Hide-Backport\n'
                      'The workflow also restores historical signer/stub source\n'
                      'from the pinned git history (all transformations are scripted).\n'
                      'This archive contains patch sources, not the full upstream checkout.\n')
          with ZipFile(archive) as z: assert z.testzip() is None
          print('R10 corresponding patch source bundle generated:',archive.stat().st_size)
          PY_R100_SOURCE_ARCHIVE

      - name: R10.0 - Prepare guarded prerelease Android 13 UI test
        shell: bash
        run: |
          set -euo pipefail
          cat > r100_ui_smoke.sh <<'SH_R98_UI_SMOKE'
          #!/usr/bin/env bash
          # Emulator only: never trigger the su button; no automatic root access or flashing.
          set -Eeuo pipefail
          PKG='org.chrizz100.magiskhide.prerelease'
          APK="$GITHUB_WORKSPACE/dist/R100_ALPHA_SAFE_PRERELEASE.apk"
          REP="$GITHUB_WORKSPACE/reports/r100_ui"
          mkdir -p "$REP"
          # Preserve Android diagnostics even when the UI test stops early.
          trap 'adb logcat -d -v brief > "$REP/logcat_on_exit.txt" 2>&1 || true; adb shell dumpsys activity activities > "$REP/activities_on_exit.txt" 2>&1 || true' EXIT
          fail() { printf '%s\n' "$*" | tee "$REP/FAILURE.txt" >&2; exit 1; }
          [[ -s "$APK" ]] || fail 'R100 APK absent'
          [[ "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" == '33' ]] || fail 'Require Android 13 emulator'
          [[ "$(adb shell getprop ro.kernel.qemu | tr -d '\r')" == '1' ]] || fail 'Refusing non-emulator target'
          [[ "$(adb devices | awk 'NR>1 && $2=="device"{print $1}' | wc -l)" -eq 1 ]] || fail 'Not exactly one emulator'
          [[ "$(adb devices | awk 'NR>1 && $2=="device"{print $1}')" == emulator-* ]] || fail 'Non-emulator serial'
          # Install without -r; no other installed app can be replaced.
          adb install "$APK" | tee "$REP/install.txt"
          adb shell pm path "$PKG" | tee "$REP/package_path.txt" | grep -F 'package:' >/dev/null || fail 'Isolated package not installed'
          # Notification prompt can cover UI in Android 13. Grant only on throwaway emulator.
          adb shell pm grant "$PKG" android.permission.POST_NOTIFICATIONS >"$REP/notification.txt" 2>&1 || true
          adb shell am start -W -n "$PKG/com.topjohnwu.magisk.ui.MainActivity" | tee "$REP/launch.txt"
          sleep 6
          get_ui() {
            local name="$1" found=0
            for attempt in 1 2 3 4 5; do
              adb shell uiautomator dump "/sdcard/r100_${name}.xml" >"$REP/${name}_dump_${attempt}.txt" 2>&1 || true
              if adb pull "/sdcard/r100_${name}.xml" "$REP/${name}.xml" >"$REP/${name}_pull_${attempt}.txt" 2>&1; then
                if python3 - "$REP/${name}.xml" <<'PYXML'
          import sys,xml.etree.ElementTree as E
          r=E.parse(sys.argv[1]).getroot()
          labels=[v for el in r.iter() for field in ('text','content-desc') if (v:=el.get(field))]
          assert 'Home' in labels and 'Magisk' in labels
          PYXML
                then found=1; break; fi
              fi
              sleep 3
            done
            [[ "$found" -eq 1 ]] || fail "No functional Magisk UI hierarchy: ${name}"
          }
          get_ui home
          python3 - "$REP/home.xml" <<'PY_R100_BUTTON'
          from xml.etree import ElementTree as ET
          import sys
          r=ET.parse(sys.argv[1]).getroot()
          texts=[node.attrib.get(k,'') for node in r.iter() for k in ('text','content-desc')]
          assert any('Root und Magisk prüfen' in t for t in texts), 'Actual prerelease Root probe button is missing'
          assert any('Manager-Hide Vorab-Release' in t for t in texts), 'Actual prerelease status card is missing'
          print('R10.0 prerelease card and explicit root probe button visible')
          PY_R100_BUTTON
          adb shell input tap 900 2236
          sleep 3
          # The Settings page is present in the genuine app; no root functions called.
          for attempt in 1 2 3 4 5; do
            adb shell uiautomator dump /sdcard/r100_settings.xml >"$REP/settings_dump_${attempt}.txt" 2>&1 || true
            adb pull /sdcard/r100_settings.xml "$REP/settings.xml" >"$REP/settings_pull_${attempt}.txt" 2>&1 || true
            if python3 - "$REP/settings.xml" <<'PYXML'
          import sys,xml.etree.ElementTree as E
          r=E.parse(sys.argv[1]).getroot()
          t={v for el in r.iter() for f in ('text','content-desc') if (v:=el.get(f))}
          assert {'Settings','Customization'} <= t, sorted(t)
          PYXML
            then break; fi
            [[ "$attempt" -lt 5 ]] || fail 'Settings screen failed to load'
            sleep 3
          done
          adb shell input tap 180 2236
          sleep 2
          get_ui returned_home
          adb logcat -d -v brief > "$REP/logcat.txt" 2>&1 || true
          python3 - "$REP" <<'PYRESULT'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          import json, sys
          p=Path(sys.argv[1]);home=ET.parse(p/'returned_home.xml').getroot()
          labels={v for n in home.iter() for f in ('text','content-desc') if (v:=n.get(f))}
          assert {'Magisk','Home'}<=labels
          # Never claim root compatibility or app concealment from this smoke test.
          d={'result':'GUARDED_PRERELEASE_UI_PASS','package':'org.chrizz100.magiskhide.prerelease',
             'api':33,'install_without_replace':True,'home':True,'settings':True,
             'root_access_tested':False,'root_diagnostic_button_visible':True,'manager_hide_tested':False,'alpha_31100_compatibility_tested':False,
             'physical_device_modified':False,'scope':'UI-only on throwaway x86_64 AVD'}
          (p/'RESULT.json').write_text(json.dumps(d,indent=2)+'\n')
          print('R10.0 guarded prerelease UI/emulator PASS; root probe visible, not pressed')
          PYRESULT
          SH_R98_UI_SMOKE
          chmod +x r100_ui_smoke.sh
          bash -n r100_ui_smoke.sh
          test -s dist/R100_ALPHA_SAFE_PRERELEASE.apk

