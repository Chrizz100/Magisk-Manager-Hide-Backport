         raise RuntimeError('No Android UI hierarchy '+title)
        def tap(root,label):
         for n in root.iter('node'):
          if label not in (n.get('text',''),n.get('content-desc','')):continue
          m=re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.get('bounds',''))
          if not m:continue
          x0,y0,x1,y1=map(int,m.groups())
          adb(f'input tap {(x0+x1)//2} {(y0+y1)//2}')
          return
         raise RuntimeError('Button not present: '+label)
        root=hierarchy('r11_beta_preclick')
        labels={n.get('text','') for n in root.iter('node')}
        assert any('R11 Funktions-Beta' in text for text in labels),'Root-beta card missing in actual UI'
        tap(root,'Magisk und Root abfragen')
        verified=False
        for i in range(12):
         time.sleep(3)
         root=hierarchy('r11_beta_postclick')
         labels={n.get('text','') for n in root.iter('node')}
         if any('UID=0' in s for s in labels):verified=True;break
        if not verified:raise RuntimeError('Root action did not yield UID=0 in actual beta UI')
        (R/'RESULT.json').write_text(json.dumps({'result':'R11_BETA_ROOT_AVD_PASS',
         'root_grant':True,'actual_root_button_pressed':True,'module_operations_in_real_beta_ui_tested':False,
         'alpha_31100_tested':False,'boot_partition_written':False,'physical_device_modified':False,
         'package':pkg,'uid':uid},indent=2)+'\n')
        print('R11 beta AVD root UID=0 with officially bootstrapped Magisk daemon: PASS')
        PY_R11_BETA_AVD

        SH_R11_ROOT
        chmod +x r11_beta_root_avd.sh
        bash -n r11_beta_root_avd.sh
    - name: 'R11 - Android-13 root AVD: beta GUI + actual Magisk su grant and module check'
      id: r100_avd
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
      with:
        api-level: 33
        target: google_apis
        arch: x86_64
        profile: pixel_5
        cores: 2
        ram-size: 3072M
        emulator-boot-timeout: 900
        emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -camera-back none
        script: bash r100_ui_smoke.sh && bash r11_beta_root_avd.sh

    - name: R10.0 - Gate prerelease on actual AVD result, package and blocked writers
      if: ${{ steps.r100_avd.outcome == 'success' }}
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY_R100_REPORT'
        import json
        from pathlib import Path
        ui=json.loads(Path('reports/r100_ui/RESULT.json').read_text())
        a=json.loads(Path('reports/R100_SOURCE_POLICY.json').read_text())
        assert ui['result']=='GUARDED_PRERELEASE_UI_PASS',ui
        assert ui['package']=='org.chrizz100.magiskhide.beta'
        assert ui['root_diagnostic_button_visible'] is True
        assert ui['alpha_31100_compatibility_tested'] is False
        assert ui['manager_hide_tested'] is False
        assert ui['physical_device_modified'] is False
        assert a['boot_write'] is False and a['manager_rebinding'] is False
        print('R10.0 guarded prerelease: package, UI button, actual AVD and write gates PASS')
        PY_R100_REPORT

    - name: R11 - Require beta app real-root AVD probe and original concealment PASS
      run: |
        set -euo pipefail
        python3 - <<'PY_R11_ROOT_GATE'
        import json
        from pathlib import Path
        a=json.loads(Path('reports/r11_beta_root/RESULT.json').read_text())
        assert a['result']=='R11_BETA_ROOT_AVD_PASS' and a['root_grant'] is True
        assert a['actual_root_button_pressed'] is True
        assert a['physical_device_modified'] is False and a['boot_partition_written'] is False
        assert a['alpha_31100_tested'] is False
        print('R11 beta root AVD verification PASS (Alpha device compatibility remains untested)')
        PY_R11_ROOT_GATE
    - name: R11 - Upload non-final functional Beta candidate only after verified rooted AVD
      if: ${{ steps.r100_avd.outcome == 'success' }}
      uses: actions/upload-artifact@v7
      with:
        name: R11_BETA_CANDIDATE_AVD_VERIFIED_NO_ALPHA_CLAIM
        path: |
          dist/R100_ALPHA_SAFE_PRERELEASE.apk
          dist/SHA256.txt
          dist/READ_ME_FIRST.txt
          dist/R100_SOURCE_PATCHES.zip
          reports/r11_beta_root/RESULT.json
        if-no-files-found: error
        retention-days: 30

    - name: R10.0 - Write honest release readiness report
      if: always()
      env:
        R100_BUILD: ${{ steps.r100_build.outcome }}
        R100_AVD: ${{ steps.r100_avd.outcome }}
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p reports
        python3 - <<'PY_R100_STATUS'
        import os,json
        from pathlib import Path
        b=os.getenv('R100_BUILD','skipped'); a=os.getenv('R100_AVD','skipped')
        result=Path('reports/r100_ui/RESULT.json')
        verified=result.exists() and json.loads(result.read_text()).get('result')=='GUARDED_PRERELEASE_UI_PASS'
        s={'release':'R10.0 RC1 alpha-safe prerelease','build':b,'emulator':a,
           'ui_and_diagnostics_present':bool(verified and a=='success'),
           'root_su_permission_flow_on_phone_tested':False,'magisk_alpha_31100_compatibility_tested':False,
           'real_hide_restore_on_phone_tested':False,'direct_flash_on_phone_enabled':False,
           'original_magisk31_e2e_reference_run':42629655712}
        Path('reports/R100_RELEASE_READINESS.json').write_text(json.dumps(s,indent=2)+'\n')
        print('R10 status:',json.dumps(s,sort_keys=True))
        with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
         f.write('### R10 RC1 guarded prerelease\n')
         for k,v in s.items():f.write(f'- {k}: `{v}`\n')
        PY_R100_STATUS

    - name: R10.0 - Upload failure/QA evidence without any signing key
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: R11_BETA_DIAGNOSTICS_NO_APK
        path: reports/
        if-no-files-found: error
        retention-days: 30

    needs: r11-research
