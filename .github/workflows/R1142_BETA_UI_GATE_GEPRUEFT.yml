                          'module disabled marker from actual GUI',seconds=35)
                self.mark('R11_MODULE_GUI_DISABLED')
                xml=self.ui_dump('r11_module_disabled')
                toggle(xml, False)
                self.wait(lambda:self.adb('test ! -e '+basedir+'/disable && echo YES || true')=='YES',
                          'module enabled marker from actual GUI',seconds=35)
                self.mark('R11_MODULE_GUI_ENABLED')
                self.adb('input keyevent KEYCODE_BACK')
                self.adb('am start -W -n '+ACTIVITY,timeout=50)
                # Real Magisk CLI install goes to its staging location until next boot.
                archive=self.report/'r11_module_install.zip'
                with zipfile.ZipFile(archive,'w',zipfile.ZIP_DEFLATED) as z:
                    z.writestr('module.prop',descriptor)
                self.cmd(['adb','push',str(archive),'/data/local/tmp/r11_module_install.zip'])
                result=self.adb('/data/adb/magisk/magisk --install-module /data/local/tmp/r11_module_install.zip',timeout=95,check=False,
                                output='r11_magisk_module_install.txt')
                staged=self.adb('test -f /data/adb/modules_update/'+mod+'/module.prop && echo YES || true')
                if staged!='YES':
                    raise RuntimeError('R11 actual Magisk CLI ZIP installation not staged: '+result[-700:])
                self.mark('R11_MODULE_CLI_INSTALL_STAGED')

        '''
        # Backslash pattern correction from Python triple-quoted text to regex literal.
        method=method.replace("r'\\\\[(\\\\d+),(\\\\d+)\\\\]\\\\[(\\\\d+),(\\\\d+)\\\\]'", "r'\\[(\\d+),(\\d+)\\]\\[(\\d+),(\\d+)\\]'")
        new=s.replace('    def run(self):\n',method+'    def run(self):\n',1)
        new=new.replace(start,start.replace('            self.enable_gui()\n','            self.r11_module_roundtrip()\n            self.enable_gui()\n'),1)
        assert new.count('self.r11_module_roundtrip()')==1
        p.write_text(new)
        print('R11 module integration injected into pinned emulator test harness')
        PY_R11_MODULE_SUITE
        python3 -m py_compile r9_root_emulator.py
        python3 r9_root_emulator.py --selftest
    - name: R11.4 - Observe genuine app concealment and restored original on AVD
      shell: bash
      run: |
        set -euo pipefail
        # Observe app-driven package removal and its recovery; the test harness
        # never removes/reinstalls a package on behalf of the app.
        cat > r114_patch_harness.py <<'PY_R114_HARNESS'
        #!/usr/bin/env python3
        """R11.4 Android-13 QEMU-only end-to-end: APP-owned original removal and restore.
        Strict: never let the TEST HARNESS uninstall the original package for the app.
        """
        from pathlib import Path
        import hashlib,json,sys
        
        BEFORE='''        # R9.7 scope: existing original stays installed as research rollback.
                # This is NOT proof that a detector cannot see its package name.
                self.original_visible_while_hidden = 'package:' in self.adb('pm path ' + ORIGINAL, check=False)
        '''
        AFTER='''        # R11.4 AVD preflight: the ORIGINAL package must exist before the
                # hidden app owns the concealment step. Test harness NEVER uninstalls it.
                if 'package:' not in self.adb('pm path ' + ORIGINAL, check=False):
                    raise RuntimeError('R11.4: original package absent BEFORE app-owned removal')
        '''
        ORIGINAL_STUB='''        self.mark('STUB_FOREGROUND')
                xml = self.wait_stub_restore_ui()
        '''
        NEW_STUB='''        self.mark('STUB_FOREGROUND')
                # Only the running hidden manager may perform the actual package change.
                # The harness observes, but does not call pm uninstall or reinstall.
                def finalize_visible():
                    xml = self.ui_dump('r114_concealment_button')
                    return xml if 'Complete Hide (AVD only)' in xml else None
                xml = self.wait(finalize_visible, 'AVD-only app-managed hide confirmation', seconds=70)
                find_node(xml, 'Complete Hide (AVD only)')
                self.tap(xml, 'Complete Hide (AVD only)')
                def app_original_removed():
                    path = self.adb('pm path ' + ORIGINAL, check=False)
                    return 'package:' not in path
                self.wait(app_original_removed, 'app-owned original package removal', seconds=90)
                self.original_visible_while_hidden = 'package:' in self.adb('pm path ' + ORIGINAL, check=False)
                user_list = self.adb('pm list packages --user 0 ' + ORIGINAL)
                if ('package:' + ORIGINAL) in user_list.splitlines():
                    raise RuntimeError('R11.4: original package still listed for user 0')
                if not self._focus_is(target):
                    raise RuntimeError('R11.4: hidden manager lost foreground after original removal')
                trace = self.adb("logcat -d -v brief -s 'R114Conceal:*'", check=False,
                                 output='R114_APP_CONCEALMENT_TRACE.txt')
                if 'ORIGINAL_UNINSTALLED_USER0_VERIFIED' not in trace:
                    raise RuntimeError('R11.4: missing app-owned successful concealment trace')
                self.mark('R114_CONCEALMENT_APP_CONFIRMED')
                xml = self.wait_stub_restore_ui()
        '''
        ORIGINAL_RESTORE='''        self.mark('ORIGINAL_FOREGROUND')
                self.ensure_su('MAGISK_SU_AFTER_RESTORE')
        '''
        NEW_RESTORE='''        self.mark('ORIGINAL_FOREGROUND')
                if 'package:' not in self.adb('pm path ' + ORIGINAL, check=False):
                    raise RuntimeError('R11.4: original package not reinstalled after restore')
                self.mark('R114_ORIGINAL_REINSTALLED')
                self.ensure_su('MAGISK_SU_AFTER_RESTORE')
        '''
        
        def patch(src):
            p=Path(src);s=p.read_text()
            for title,original,new in [('old original visibility probe',BEFORE,AFTER),('app-owned hide gate',ORIGINAL_STUB,NEW_STUB),('restore post-condition',ORIGINAL_RESTORE,NEW_RESTORE)]:
                occurrences=s.count(original)
                if occurrences!=1:raise AssertionError(f'R11.4: {title} expected once; found {occurrences}')
                s=s.replace(original,new,1)
            if s.count('R114_CONCEALMENT_APP_CONFIRMED')!=1:raise AssertionError('R11.4 app proof stage missing')
            if 'self.adb(\'pm uninstall' in s or 'self.adb(\'pm install' in s:
                raise AssertionError('R11.4 test harness must never uninstall or install original itself')
            p.write_text(s)
            return {'revision':'R11.4','script_sha256':hashlib.sha256(s.encode()).hexdigest(),'harness_only_observes_package_visibility':True}
        
        if __name__=='__main__':
            if len(sys.argv)!=3:raise SystemExit('usage: r114_patch_harness.py PYTEST JSON')
            report=patch(sys.argv[1]);out=Path(sys.argv[2]);out.parent.mkdir(exist_ok=True,parents=True);out.write_text(json.dumps(report,indent=2)+'\n')
            print('R11.4 harness checks installed:',report)
        PY_R114_HARNESS
        python3 -m py_compile r114_patch_harness.py
        python3 r114_patch_harness.py r9_root_emulator.py reports/R114_HARNESS_POLICY.json
        python3 -m py_compile r9_root_emulator.py
        python3 r9_root_emulator.py --selftest
        test -s reports/R114_HARNESS_POLICY.json

    - name: R8 - Enable hardware virtualization on GitHub Linux
      shell: bash
      run: |
        set -euo pipefail
        if [ ! -e /dev/kvm ]; then
          echo 'NO_KVM_ON_RUNNER: Android emulator unavailable on this runner' | tee reports/r8_emulator/ENVIRONMENT_BLOCKER.txt
          exit 1
        fi
        sudo chmod 0666 /dev/kvm
        test -r /dev/kvm && test -w /dev/kvm

    - name: R8 GUI + R9 hide/restore - Android 13 x86_64 emulator
      id: r92_emulator
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
      with:
        api-level: 33
        target: google_apis
        arch: x86_64
        profile: pixel_5
        cores: 2
        ram-size: 3072M
        emulator-boot-timeout: 900
        emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -camera-back none
        script: bash r8_emulator_gui.sh && python3 r9_root_emulator.py

    - name: R8 - Verify actual UI outcome and untested root scope
      if: ${{ steps.r92_emulator.outcome == 'success' }}
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p reports/r8_emulator
        if [ ! -f reports/r8_emulator/R8_RESULT.json ]; then
          printf '%s\n' 'EMULATOR_NOT_COMPLETED: no R8 GUI result file' > reports/r8_emulator/EMULATOR_NOT_COMPLETED.txt
        fi
        python3 - <<'R8_STATUS'
        from pathlib import Path
        import json
        p=Path('reports/r8_emulator/R8_RESULT.json')
        if p.is_file():
            o=json.loads(p.read_text())
            assert o['hide_and_restore_tested'] is False
            assert o['root_permissions_tested'] is False
            assert o['physical_device_modified'] is False
            assert o['result']=='GUI_PASS', 'R8 real GUI navigation did not pass'
            print('R8 actual GUI outcome:',o['result'])
        else:
            raise SystemExit('R8 emulator has not produced a real GUI result; see logs')
        R8_STATUS

    - name: R9 - Verify real Root + Hide + Restore (never infer from R8 success)
      if: ${{ steps.r92_emulator.outcome == 'success' }}
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p reports/r9_emulator
        if [ ! -f reports/r9_emulator/R9_RESULT.json ]; then
          echo 'R9_NOT_EXECUTED: root or emulator setup never finished' > reports/r9_emulator/R9_NOT_EXECUTED.txt
        fi
        python3 - <<'PY_R9_RESULT'
        import json
        from pathlib import Path
        p=Path('reports/r9_emulator/R9_RESULT.json')
        if not p.is_file():
            raise SystemExit('R9 root/hide/restore test was not executed')
        result=json.loads(p.read_text())
        assert result['physical_device_modified'] is False
        assert result['root_permissions_tested'] is True
        assert result['hide_and_restore_tested'] is True
        assert result['result']=='ROOT_HIDE_RESTORE_PASS', result.get('error') or result.get('missing_checks')
        print('R9 confirmed full manager hide+restore with real Magisk service')
        PY_R9_RESULT

    - name: R11 - BLOCK phone-beta unless original package is truly invisible during Hide
      run: |
        set -euo pipefail
        python3 - <<'PY_R11_STRICT'
        import json
        from pathlib import Path
        p=Path('reports/r9_emulator/R9_RESULT.json')
        if not p.is_file(): raise SystemExit('R11: actual root E2E outcome missing')
        r=json.loads(p.read_text())
        required=('AVD_ONLY','MAGISK_DAEMON_31100','MAGISK_SU',
                  'R11_MODULE_UI_VISIBLE','R11_MODULE_GUI_DISABLED','R11_MODULE_GUI_ENABLED',
                  'R11_MODULE_CLI_INSTALL_STAGED','R114_CONCEALMENT_APP_CONFIRMED',
          'R114_ORIGINAL_REINSTALLED','REQUESTER_BOUND','REQUESTER_CLEARED',
                  'ORIGINAL_FOREGROUND','MAGISK_SU_AFTER_RESTORE')
        missing=[x for x in required if not r.get('checks',{}).get(x)]
        report={'source_run':'R11 rooted emulator','result':r.get('result'),
                'missing':missing,'original_visible_while_hidden':r.get('original_visible_while_hidden'),
                'package_concealment_proven':r.get('actual_package_concealment_proven') is True,
                'restore_verified':r.get('checks',{}).get('REQUESTER_CLEARED') is True,
                'phone_root_alpha_verified':False,'boot_partition_flashing_permitted':False}
        Path('reports/R11_E2E_CONCEALMENT_GATE.json').write_text(json.dumps(report,indent=2)+'\n')
        if missing: raise SystemExit('R11 HOLD: required functional checks missing: '+repr(missing))
        if report['result']!='ROOT_HIDE_RESTORE_PASS': raise SystemExit('R11 HOLD: original Root Hide/Restore failed')
        if report['original_visible_while_hidden'] is not False: 
            raise SystemExit('R11 HOLD: ORIGINAL MAGISK PACKAGE VISIBLE AFTER HIDE. This is NOT an actual concealment beta.')
        print('R11 E2E concealment+restore+module gate PASS on Android-13 QEMU')
        PY_R11_STRICT
    - name: R9.2 - Summarize primary failure instead of duplicating it
      if: always()
      env:
        R92_BUILD_OUTCOME: ${{ steps.r92_compile.outcome }}
        R92_EMULATOR_OUTCOME: ${{ steps.r92_emulator.outcome }}
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY_PHASES'
        import json, os
        from pathlib import Path
        build=os.environ['R92_BUILD_OUTCOME']
        emulator=os.environ['R92_EMULATOR_OUTCOME']
        if build=='failure':
            result='BUILD_FAILED_EMULATOR_NOT_RUN'
        elif build!='success':
            result='PREBUILD_FAILED_OR_SKIPPED'
        elif emulator!='success':
            result='EMULATOR_FAILED_OR_NOT_EXECUTED'
        else:
            report=Path('reports/r9_emulator/R9_RESULT.json')
            if report.exists():
                outcome=json.loads(report.read_text())
                result=outcome.get('result','R9_RESULT_UNKNOWN')
            else:
                result='MISSING_R9_RESULT'
        out={'compile':build,'emulator':emulator,'overall':result,
             'physical_device_modified':False,
             'scope':'research-only official Android 13 x86_64 emulator'}
        Path('reports/R92_PRIMARY_STATUS.json').write_text(json.dumps(out,indent=2)+'\n')
        print('R9.2 primary status:',result)
        with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write('### R9.2 build & emulator result\n')
            f.write(f"- Build: `{build}`\n- Emulator: `{emulator}`\n- Primary status: `{result}`\n")
            f.write('- No APK/signing key distributed; no physical device modified.\n')
        PY_PHASES

    - name: R9.7 - Report build, GUI, Root, Hide and Restore independently
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p reports
