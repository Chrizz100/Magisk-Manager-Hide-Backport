            elif len(sys.argv) == 1:
                if not os.environ.get('GITHUB_WORKSPACE'):
                    sys.exit('R9 only supports the isolated GitHub Actions emulator runner')
                sys.exit(R9().run())
            else:
                sys.exit('Usage: r9_root_emulator.py [--selftest]')
