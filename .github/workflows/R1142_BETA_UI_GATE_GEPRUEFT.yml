        key: magisk-r81-ubuntu24-ondk-r30.1-a05e40a2-gradle9.7.1-acd53f1e-v1

    - name: R9.1 - Restore cached SHA-verified BusyBox and bootctl archives
      id: r91_cache
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/magisk-r91-runtime-assets
