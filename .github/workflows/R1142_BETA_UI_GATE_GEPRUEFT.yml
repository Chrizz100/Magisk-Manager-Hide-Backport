        #!/usr/bin/env python3
        """R6: recover historical Magisk app migration and bridge it with v31.1 Compose UI.

        Source-only research. Applies to Magisk 31.1 after the R3/R4/R5 restore.
        No device operations are executed by this script; they are in Android source only.
        """
        from pathlib import Path
        import subprocess
        import sys
        import re

        BASE='0972f67d97f9b6302b67c5171283330c74114b4a'
        OLD='ea16c8141eb64dc28b56a0e7fb536689ef465429'


        def git(root,*args):
            return subprocess.run(['git','-C',str(root),*args],check=True,text=True,capture_output=True).stdout


        def replace_once(path,before,after):
            content=path.read_text()
            count=content.count(before)
            if count != 1:
                raise AssertionError(f'R6 {path} anchor expected once, got {count}: {before[:110]!r}')
            path.write_text(content.replace(before,after,1))


        def section_replace(path,start_marker,end_marker,text):
            data=path.read_text()
            assert data.count(start_marker)==1, (path,start_marker)
            assert data.count(end_marker)==1, (path,end_marker)
            first=data.index(start_marker)
            last=data.index(end_marker,first)
            path.write_text(data[:first]+text+data[last:])


        def apply(repo):
            repo=Path(repo).resolve()
            assert git(repo,'rev-parse','HEAD').strip()==BASE
            assert (repo/'app/stub/src/main/java/com/topjohnwu/magisk/DynLoad.java').is_file(), 'R5 required'
            assert 'get_repackaged_manager_pkg' in (repo/'native/src/core/db.rs').read_text(), 'R3 required'
            assert 'fun putHideText(' in (repo/'app/core/src/main/java/com/topjohnwu/magisk/core/data/magiskdb/SettingsDao.kt').read_text(), 'R4 required'
            assert 'from(stubTask)' in (repo/'app/build-logic/src/main/java/Setup.kt').read_text(), 'R5 asset required'

            # The v31.0 migration implementation is restored from an exact Git object,
            # not an unverified download.  Adjust only changed v31.1 contracts.
            migration_path='app/core/src/main/java/com/topjohnwu/magisk/core/tasks/AppMigration.kt'
            migration=repo/migration_path
            assert not migration.exists(), 'R6 already applied'
            migration.parent.mkdir(parents=True,exist_ok=True)
            migration.write_text(git(repo,'show',f'{OLD}:{migration_path}'))
            replace_once(migration, 'import com.topjohnwu.magisk.core.Const\n','import com.topjohnwu.magisk.core.Info\nimport com.topjohnwu.magisk.core.isRunningAsStub\nimport com.topjohnwu.magisk.core.data.magiskdb.ManagerPackageNames\n')
            replace_once(migration, 'import android.widget.Toast\n','')
            replace_once(migration, 'import com.topjohnwu.magisk.core.R\n','')
            replace_once(migration, 'import com.topjohnwu.magisk.core.ktx.toast\n','')
            replace_once(migration, 'import java.io.IOException\n','import java.io.IOException\n')

            # Generate only valid ASCII package identifiers allowed by native R3 and R4.
            section_replace(migration,'    private fun genPackageName(): String {','    private fun classNameGenerator() = sequence {', '''    private fun genPackageName(): String {
                val random = SecureRandom()
                val count = 2 + random.nextInt(2)
                return (0 until count).joinToString(".") {
                    val n = 4 + random.nextInt(5)
                    buildString {
                        append(ALPHA[random.nextInt(ALPHA.length)])
                        repeat(n - 1) { append(ALPHA[random.nextInt(ALPHA.length)]) }
                    }
                }
            }

        ''')
            replace_once(migration, '    private const val ALPHADOTS = "$ALPHA....."\n','')

            # Stop passing the pre-31.1 Config Parcelable; the new Config has no
            # toBundle()/PREV_CONFIG.  Settings are already persisted to Magisk DB.
            section_replace(migration, '    private fun launchApp(context: Context, pkg: String) {','    suspend fun patchAndHide(context: Context, label: String, pkg: String? = null): Boolean {', '''    private fun launchApp(context: Context, pkg: String): Boolean {
                return try {
                    val intent = context.packageManager.getLaunchIntentForPackage(pkg) ?: return false
                    if (context !is Activity) intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                    val options = ActivityOptions.makeBasic()
                    if (Build.VERSION.SDK_INT >= 34) options.setShareIdentityEnabled(true)
                    context.startActivity(intent, options.toBundle())
                    if (context is Activity) context.finish()
                    true
                } catch (e: Exception) {
                    Timber.e(e, "Failed to launch migrated manager")
                    false
                }
            }

        ''')

            # The old flow could update requester before verifying install, and mixed
            # blocking root calls into main thread.  R6 runs mutation off main, then
            # launches only on the main dispatcher. The original app remains installed
            # as fallback (no uninstall on failure).
            section_replace(migration,'    suspend fun patchAndHide(context: Context, label: String, pkg: String? = null): Boolean {','    suspend fun restoreApp(context: Context): Boolean {', '''    suspend fun patchAndHide(context: Context, label: String, pkg: String? = null): Boolean {
                if (context.packageName != APP_PACKAGE_NAME || isRunningAsStub || !Info.env.isActive) return false
                if (label.isBlank() || label.length > MAX_LABEL_LENGTH || label.any(Char::isISOControl)) return false
                val target = pkg ?: genPackageName()
                if (!ManagerPackageNames.isCandidate(target)) return false

                val installed = withContext(Dispatchers.IO) {
                    try {
                        val stub = File(context.cacheDir, "stub.apk")
                        context.assets.open("stub.apk").writeTo(stub)

                        // If a package name is already taken, do not overwrite its APK.
                        val alreadyPresent = try {
                            context.packageManager.getApplicationInfo(target, 0)
                            true
                        } catch (_: PackageManager.NameNotFoundException) {
                            false
                        }
                        if (alreadyPresent) return@withContext false

                        Config.keyStoreRaw = "" // Fresh per-migration signing key.
                        val repack = File(context.cacheDir, "patched-$target.apk")
                        val signed = repack.outputStream().use { patch(context, stub, it, target, label) }
                        if (!signed) return@withContext false
                        if (!Shell.cmd("adb_pm_install $repack $target").await().isSuccess) return@withContext false
                        try {
                            context.packageManager.getApplicationInfo(target, 0)
                        } catch (_: PackageManager.NameNotFoundException) {
                            return@withContext false
                        }

                        // Commit the manager switch only after installation succeeds.
                        // Native R3 still validates both package UID and signed dynamic APK.
                        Config.suManager = target
                        Shell.cmd("touch $AppApkPath").await()
                        true
                    } catch (e: Exception) {
                        Timber.e(e, "Failed to prepare or install repackaged manager")
                        false
                    }
                }
                if (!installed) return false
                if (launchApp(context, target)) return true
                // A failed launch must not strand root permissions on an unusable manager.
                withContext(Dispatchers.IO) {
                    runCatching { Config.suManager = "" }.onFailure { Timber.e(it, "Manager switch rollback failed") }
                }
                return false
            }

        ''')
            section_replace(migration,'    suspend fun restoreApp(context: Context): Boolean {','    suspend fun upgradeStub(context: Context, apk: File): Intent? {','''    suspend fun restoreApp(context: Context): Boolean {
                if (!isRunningAsStub || context.packageName == APP_PACKAGE_NAME || !Info.env.isActive) return false
                val installed = withContext(Dispatchers.IO) {
                    try {
                        val apk = StubApk.current(context)
                        if (!apk.isFile || apk.length() == 0L) return@withContext false
                        if (!Shell.cmd("adb_pm_install $apk $APP_PACKAGE_NAME").await().isSuccess) return@withContext false
                        Config.suManager = ""
                        Shell.cmd("touch $AppApkPath").await()
                        true
                    } catch (e: Exception) {
                        Timber.e(e, "Failed to restore original manager")
                        false
                    }
                }
                return installed && launchApp(context, APP_PACKAGE_NAME)
