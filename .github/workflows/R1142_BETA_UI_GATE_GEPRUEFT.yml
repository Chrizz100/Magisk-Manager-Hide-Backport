    - name: Compile signed research Magisk 31.1 with R6 migration and stub.apk
      id: r92_compile
      shell: bash
      run: |
        set -euo pipefail
        # Existing R9.1 Magisk source and build logic are unchanged. Retry ONLY
        # for temporary HTTP/network failures while keeping Gradle's downloads.
        # Do not turn compiler errors into retries or report a false success.
        for attempt in 1 2 3; do
          echo "R9.2 complete Magisk build attempt ${attempt}/3"
          log="reports/full_build_attempt_${attempt}.log"
          if (cd magisk && python3 build.py -vr -c ../r6-build.prop all) 2>&1 | tee "$log"; then
            cp "$log" reports/full_build.log
            printf 'BUILD_PASS_ON_ATTEMPT=%s\n' "$attempt" > reports/R92_BUILD_RETRY_STATUS.txt
            break
          fi
          cp "$log" reports/full_build.log
          if ! grep -Eiq 'HTTP[^0-9]*5[0-9][0-9]|status code[^0-9]*5[0-9][0-9]|Received status code 5[0-9][0-9]|Gateway Time-out|Gateway Timeout|Service Unavailable|Connection reset|Connection timed out|Read timed out|Remote host terminated|Temporary failure in name resolution|UnknownHostException|TLS handshake' "$log"; then
            printf 'NON_TRANSIENT_BUILD_FAILURE_AT_ATTEMPT=%s\n' "$attempt" > reports/R92_BUILD_RETRY_STATUS.txt
            echo 'R9.2: compiler / non-transient failure: refusing blind retries' >&2
            exit 1
          fi
          if [ "$attempt" -ge 3 ]; then
            printf 'TRANSIENT_DOWNLOAD_FAILURE_AFTER_THREE_ATTEMPTS\n' > reports/R92_BUILD_RETRY_STATUS.txt
            echo 'R9.2: dependency download still failing after three attempts' >&2
            exit 1
          fi
          echo "R9.2: transient download problem; retain verified Gradle cache and retry."
          sleep "$((attempt * 12))"
        done
        test -s magisk/out/app-release.apk
        python3 - <<'PY_VERIFY'
        import hashlib, pathlib, zipfile
        root=pathlib.Path('magisk/out')
        apk=root/'app-release.apk'
        assert apk.is_file() and apk.stat().st_size>1_000_000
        with zipfile.ZipFile(apk) as z:
          assert z.testzip() is None
          dex=[n for n in z.namelist() if n.startswith('classes') and n.endswith('.dex')]
          assert dex
        with zipfile.ZipFile(apk) as z:
          names=z.namelist()
          assert 'assets/stub.apk' in names, 'Stub APK was not packaged in Magisk manager'
          from io import BytesIO
          with zipfile.ZipFile(BytesIO(z.read('assets/stub.apk'))) as stub:
            assert stub.testzip() is None
            assert 'AndroidManifest.xml' in stub.namelist()
            assert 'classes.dex' in stub.namelist()
        flags=(pathlib.Path('magisk/native/out/generated/flags.rs')).read_text()
        assert 'TRUSTED_CERT' in flags
        import re
        cert=re.search(r'TRUSTED_CERT:.*?= &\[(.*?)\];',flags,re.S)
        assert cert and len(re.findall('0x[0-9a-f]{2}', cert.group(1)))>100, 'Trusted cert missing in native build'
        sha=hashlib.sha256(apk.read_bytes()).hexdigest()
        pathlib.Path('reports/app-release-sha256.txt').write_text(f'{sha}  app-release.apk\n')
        pathlib.Path('reports/BUILD_STATUS.txt').write_text(
          'R6 native ARM64/ARM32, Android APK and nested stub.apk built.\n'
          'R6 AppMigration and Compose UI compiled, but runtime migration still UNTESTED.\n'
          'DO NOT INSTALL OR FLASH THIS EXPERIMENTAL RESEARCH FORK.\n'
        )
        print('R6 stub.apk, app migration UI and native trusted certificate compiled PASS; research-only')
        PY_VERIFY

