        internal object BetaRootBridge {
            private val moduleId = Regex("[A-Za-z0-9_][A-Za-z0-9_.-]{0,79}")
            private const val MODULES = "/data/adb/modules"
            private const val MODULES_UPDATE = "/data/adb/modules_update"

            internal fun validModuleId(id: String): Boolean = moduleId.matches(id) && id != "." && id != ".." && ".." !in id

            /** Only fixed, owner-triggered commands. Returns stdout/stderr for in-app diagnosis. */
            private fun rooted(script: String, timeoutSeconds: Long = 20): String {
                val process = ProcessBuilder("su", "-c", script).redirectErrorStream(true).start()
                if (!process.waitFor(timeoutSeconds, TimeUnit.SECONDS)) {
                    process.destroyForcibly()
                    return "ERROR: ROOT_TIMEOUT"
                }
                val output = process.inputStream.bufferedReader().use { it.readText().take(12000) }
                return if (process.exitValue() == 0) output.ifBlank { "OK" }
                       else "ERROR: SU_EXIT_${process.exitValue()}\n" + output.take(1000)
            }

            fun status(): String = rooted("printf 'UID='; id -u; printf 'MAGISK='; magisk -v; printf 'CODE='; magisk -V; printf 'ANDROID='; getprop ro.build.version.release; printf 'DEVICE='; getprop ro.product.device")

            fun modules(): String = rooted("for d in $MODULES/*; do " +
                "[ -d \"\$d\" ] || continue; " +
                "n=\${d##*/}; [ -f \"\$d/module.prop\" ] || continue; " +
                "if [ -e \"\$d/remove\" ]; then s=REMOVE; " +
                "elif [ -e \"\$d/disable\" ]; then s=DISABLED; else s=ENABLED; fi; " +
                "printf '%s | %s\\n' \"\$n\" \"\$s\"; done")

            fun policies(): String = rooted("magisk --sqlite 'SELECT uid,policy FROM policies LIMIT 60;'", 15)

            /** Changes only the matching module's disable marker. UI must obtain explicit confirmation. */
            fun setEnabled(id: String, enabled: Boolean): String {
                if (!validModuleId(id)) return "ERROR: INVALID_MODULE_ID"
                val directory = "$MODULES/$id"
                val operation = if (enabled) "rm -f '$directory/disable'" else "touch '$directory/disable'"
                return rooted("[ -f '$directory/module.prop' ] || exit 21; $operation; " +
                    (if (enabled) "[ ! -e '$directory/disable' ]" else "[ -f '$directory/disable' ]"))
            }

            /** Only schedule removal for the next reboot, do not recursively delete files. */
            fun scheduleRemoval(id: String): String {
                if (!validModuleId(id)) return "ERROR: INVALID_MODULE_ID"
                val directory = "$MODULES/$id"
                return rooted("[ -f '$directory/module.prop' ] || exit 21; touch '$directory/remove'; [ -f '$directory/remove' ]")
            }

            /** Install a caller-supplied, locally verified module archive. Uses Magisk's installer. */
            fun installModuleZip(appPrivateAbsolutePath: String): String {
                val validPath = Regex("/data/(?:user/0|data)/[A-Za-z0-9_.-]+/cache/r11_module_[A-Za-z0-9_-]+\\.zip")
                if (!validPath.matches(appPrivateAbsolutePath)) return "ERROR: INVALID_LOCAL_ZIP_PATH"
                return rooted("[ -f '$appPrivateAbsolutePath' ] && [ -s '$appPrivateAbsolutePath' ] || exit 22; " +
                    "magisk --install-module '$appPrivateAbsolutePath'", 90)
            }
        }

