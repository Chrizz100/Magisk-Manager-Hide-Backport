                    val digest = MessageDigest.getInstance("SHA-256")
                    file.inputStream().buffered().use { stream ->
                        val buffer = ByteArray(65536)
                        while (true) {
                            val count = stream.read(buffer)
                            if (count < 0) break
                            if (count > 0) digest.update(buffer, 0, count)
                        }
                    }
                    return digest.digest()
                }

                val switched = withContext(Dispatchers.IO) {
                    try {
                        val preserved = StubApk.current(context)
                        val info = context.packageManager.getApplicationInfo(APP_PACKAGE_NAME, 0)
                        val installedOriginal = File(info.sourceDir)
                        if (!preserved.isFile || !installedOriginal.isFile ||
                            preserved.length() <= 0 || preserved.length() != installedOriginal.length()) {
                            android.util.Log.e("R97Restore", "ORIGINAL_APK_MISSING_OR_LENGTH_MISMATCH")
                            return@withContext false
                        }
                        if (!MessageDigest.isEqual(sha256Of(preserved), sha256Of(installedOriginal))) {
                            android.util.Log.e("R97Restore", "ORIGINAL_APK_SHA256_MISMATCH")
                            return@withContext false
                        }
                        android.util.Log.i("R97Restore", "ORIGINAL_APK_SHA256_VERIFIED")
                        // Only commit the manager selection after identity validation.
                        // SettingsDao.putHideText() already checks the SQL result and reads
                        // it back. Do not re-open another root shell after changing the
                        // requester: the hidden manager may immediately lose SU access.
                        // The isolated test also verifies the DB independently via ADB root.
                        Config.suManager = ""
                        android.util.Log.i("R97Restore", "REQUESTER_CLEAR_SETTER_COMPLETED")
                        true
                    } catch (e: Exception) {
                        android.util.Log.e("R97Restore", "RESTORE_TRANSACTION_EXCEPTION", e)
                        false
                    }
                }
                if (!switched) return false
                val launched = launchApp(context, APP_PACKAGE_NAME)
                android.util.Log.i("R97Restore", if (launched) "ORIGINAL_LAUNCH_SUBMITTED" else "ORIGINAL_LAUNCH_FAILED")
                return launched
            }

        '''


        def apply(repo_path: Path) -> dict:
            repo_path = repo_path.resolve()
            src = repo_path / 'app/core/src/main/java/com/topjohnwu/magisk/core/tasks/AppMigration.kt'
            assert src.is_file(), 'Expected reconstructed R6 AppMigration.kt'
            old = src.read_text(encoding='utf-8')
            assert old.count(START) == 1 and old.count(END) == 1, 'Original R6 restore markers mismatch'
            begin, finish = old.index(START), old.index(END)
            assert begin < finish
            body = old[begin:finish]
            for guard in OLD_REQUIRED:
                assert guard in body, f'R6 restore baseline changed: {guard}'
            assert 'import java.security.MessageDigest\n' not in old, 'Unexpected existing digest import'
            assert old.count('import java.security.SecureRandom\n') == 1, 'SecureRandom import anchor changed'
            new = old[:begin] + NEW_FUNC + old[finish:]
            new = new.replace('import java.security.SecureRandom\n',
                              'import java.security.SecureRandom\nimport java.security.MessageDigest\n', 1)
            assert new.count('suspend fun restoreApp(context: Context): Boolean') == 1
            assert new.count('adb_pm_install $apk $APP_PACKAGE_NAME') == 0, 'Old unsafe restore install persists'
            assert new.count('MessageDigest.isEqual(sha256Of(preserved), sha256Of(installedOriginal))') == 1
            assert new.count('Config.suManager = ""') >= 1
            src.write_text(new, encoding='utf-8')
            summary = {
                'revision': 'R9.7',
                'scope': 'R6 restoreApp only plus one import',
                'old_sha256': hashlib.sha256(old.encode()).hexdigest(),
                'new_sha256': hashlib.sha256(new.encode()).hexdigest(),
                'reinstall_original': False,
                'requires_original_installed': True,
                'requires_byte_exact_original_apk': True,
                'db_write_verified_by_existing_SettingsDao': True,
                'independent_adb_root_db_check': True,
                'core_risk': 'Research-mode original package remains installed; not proof of concealment',
                'android_runtime_tested': False,
            }
            report = repo_path.parent / 'reports' / 'R97_RESTORE_PATCH_STATUS.json'
            report.parent.mkdir(parents=True, exist_ok=True)
            report.write_text(json.dumps(summary, indent=2) + '\n', encoding='utf-8')
            return summary


        if __name__ == '__main__':
            if len(sys.argv) != 2:
                sys.exit('usage: python3 r97_restore_patch.py <reconstructed Magisk source directory>')
            print(json.dumps(apply(Path(sys.argv[1])), indent=2))
        PY_R97_PATCH
        python3 -m py_compile r97_restore_patch.py
        python3 r97_restore_patch.py magisk
        git -C magisk diff --check
        git -C magisk diff -- app/core/src/main/java/com/topjohnwu/magisk/core/tasks/AppMigration.kt > reports/R97_RESTORE_CODE_CHANGE.diff
        test -s reports/R97_RESTORE_PATCH_STATUS.json

    - name: R6.4 - Eliminate verified duplicate legacy Java classes before R8
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY_R64_CLASS_OWNERSHIP'
        from pathlib import Path
        from collections import defaultdict
        import hashlib, json
        root = Path('magisk/app')
        source = root/'core/src/main/java'
        shared = root/'shared/src/main/java'
        # These byte-identical classes were retained in official v31.1 core but
        # also restored into the historic :shared library in R5. This duplicates
        # their fully-qualified class definitions when :core depends on :shared.
        # Leave :shared as the single owner because :stub also depends on it.
        expected = {
            'com/topjohnwu/magisk/ProviderInstaller.java':
                '63c9731edf58aaceecfb9a31c2dae1129871d1fca6948a445ab803bb10645b65',
            'com/topjohnwu/magisk/utils/APKInstall.java':
                'bec3e8844ed6a307c46ce4b991fbb1de3110e846acd62454cb863b9466ef9dc4',
        }
        settings=(root/'settings.gradle.kts').read_text()
        gradle=(root/'core/build.gradle.kts').read_text()
        assert 'api(project(":shared"))' in gradle, 'R6.1 shared dependency missing'
        assert 'include(":apk", ":core", ":shared", ":stub", ":stub-res", ":test")' in settings
        assert len(expected)==2

        def index_classes():
            indexed=defaultdict(dict)
            for module in ('core','shared','apk','stub'):
                java=root/module/'src/main/java'
                assert java.is_dir(), f'Missing Java/Kotlin source root {java}'
                for path in java.rglob('*'):
                    if path.is_file() and path.suffix in ('.java','.kt'):
                        rel=path.relative_to(java).as_posix()
                        indexed[rel][module]=path
            return {key: modules for key,modules in indexed.items() if len(modules)>1}

        collisions=index_classes()
        assert set(collisions)==set(expected), f'Unexpected duplicate class-paths: {collisions.keys()}'
        for rel, modules in collisions.items():
            assert set(modules)=={'core','shared'}, f'Unexpected class owners: {rel}: {modules.keys()}'
            a,b=modules['core'],modules['shared']
            assert a.read_bytes()==b.read_bytes(), f'Classes differ: {rel}'
            digest=hashlib.sha256(a.read_bytes()).hexdigest()
            assert digest==expected[rel], f'Unexpected source hash: {rel}: {digest}'
            assert ('class '+a.stem) in a.read_text(), f'Not a named Java class: {rel}'
            a.unlink()
            assert not a.exists() and b.is_file(), f'Failed safe deduplication: {rel}'

        assert not index_classes(), 'Duplicate Java/Kotlin source paths remain'
        for rel in expected:
            assert (shared/rel).is_file(), f'Required shared implementation missing: {rel}'
        # Both legacy callers and the current v31.1 networking layer still use
        # these classes. They now resolve through :core -> :shared API linkage.
        assert 'ProviderInstaller.install(context)' in (source/'com/topjohnwu/magisk/core/di/Networking.kt').read_text()
        assert 'APKInstall.startSession' in (source/'com/topjohnwu/magisk/core/tasks/AppMigration.kt').read_text()
        assert 'APKInstall.startSession' in (root/'stub/src/main/java/com/topjohnwu/magisk/DownloadActivity.java').read_text()

        out=Path('reports/R6_4_verified_java_class_ownership.json')
        out.parent.mkdir(exist_ok=True)
        out.write_text(json.dumps({
           'base':'Magisk v31.1 0972f67d97f9b6302b67c5171283330c74114b4a',
           'resolution':'Removed only the identical core copies; shared retains sole class ownership',
           'removed_from_core':expected,
           'remaining_duplicates':[],
           'native_build':'NOT_VERIFIED_IN_THIS_STEP',
           'android_build':'NOT_VERIFIED_IN_THIS_STEP',
        },indent=2,sort_keys=True)+'\n')
        print('R6.4 legacy shared/core Java duplicate-class reconciliation: PASS')
        PY_R64_CLASS_OWNERSHIP
        git -C magisk diff --check
        git -C magisk diff --binary > reports/R6_4_final_tracked_source.diff
        git -C magisk status --short > reports/R6_4_final_source_status.txt
        test -s reports/R6_4_verified_java_class_ownership.json

