            out=Path(sys.argv[2]);out.parent.mkdir(parents=True,exist_ok=True);out.write_text(json.dumps(policy,indent=2,sort_keys=True)+'\n')
            print('R11.4 AVD-only source patch:',json.dumps({k:policy[k] for k in ('revision','scope','original_uninstall_requires_explicit_ui_tap','phone_beta_release_authorized')}))
        PY_R114_SOURCE
        python3 -m py_compile r114_patch_concealment.py
        python3 r114_patch_concealment.py magisk reports/R114_EXPERIMENTAL_POLICY.json
        git -C magisk diff --check
        test -s reports/R114_EXPERIMENTAL_POLICY.json

    - name: R9.9 - Guard official on-device Direct Install (never replace Alpha by accident)
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p reports
        cat > DirectInstallPolicy.kt <<'R99_EOF_DIRECTINSTALLPOLICY'
        package com.topjohnwu.magisk.core.tasks

        /**
         * Prevent accidental replacement of a different Magisk implementation.
         * No writes occur in this policy. The actual patch + write remains the
         * already existing MagiskInstaller.direct() / boot_patch.sh / direct_install.
         *
         * This is deliberately strict. Unknown backend flavours fail closed.
         */
        internal object DirectInstallPolicy {
            data class Environment(
                val rooted: Boolean,
                val rootShellGranted: Boolean,
                val daemonActive: Boolean,
                val actualVersionCode: Int,
                val expectedVersionCode: Int,
                val actualVersionName: String,
                val expectedVersionName: String,
                val managerPackage: String,
                val emulator: Boolean,
            )

            fun reasons(env: Environment): List<String> = buildList {
                if (env.emulator) add("Direct installation on an emulator is disabled")
                if (!env.rooted || !env.rootShellGranted || !env.daemonActive) {
                    add("No confirmed matching Magisk root backend")
                }
                if (env.actualVersionCode <= 0 || env.actualVersionCode != env.expectedVersionCode) {
                    add("Magisk version code differs")
                }
                if (env.actualVersionName.isBlank() || env.expectedVersionName.isBlank() ||
                    env.actualVersionName != env.expectedVersionName) {
                    add("Magisk native flavour/build differs (Alpha is NOT an official build)")
                }
                if (env.managerPackage != "com.topjohnwu.magisk") {
                    add("Not the original Magisk manager package")
                }
            }
        }
        R99_EOF_DIRECTINSTALLPOLICY
        cat > r99_apply.py <<'R99_EOF_R99_APPLY'
        #!/usr/bin/env python3
        """Add an explicit fail-closed guard to the existing Magisk Direct Installer.

        For use after the already tested R9.7 source reconstruction, before compilation.
        No replacement installer, partition-writing command or auto-start action is added.
        """
        from pathlib import Path
        import hashlib
        import json
        import sys

        POLICY = Path(__file__).with_name('DirectInstallPolicy.kt').read_text(encoding='utf-8')
        ANCHOR = '    protected suspend fun direct() = findImage() && extractFiles() && patchBoot() && flashBoot()'
        REPLACEMENT = '''    protected suspend fun direct(): Boolean {
                // Do not flash an Alpha-patched phone using a different official build.
                // In particular, matching numeric versionCode=31100 is NOT enough.
                val blockers = DirectInstallPolicy.reasons(
                    DirectInstallPolicy.Environment(
                        rooted = Info.isRooted,
                        rootShellGranted = shell.isRoot,
                        daemonActive = Info.env.isActive,
                        actualVersionCode = Info.env.versionCode,
                        expectedVersionCode = BuildConfig.APP_VERSION_CODE,
                        actualVersionName = Info.env.versionString,
                        expectedVersionName = BuildConfig.APP_VERSION_NAME,
                        managerPackage = context.packageName,
                        emulator = Info.isEmulator,
                    )
                )
                if (blockers.isNotEmpty()) {
                    console.add("! PC-free direct installation refused: ${blockers.joinToString("; ")}")
                    return false
                }
                // Reuse the reviewed official boot_image patch + direct_install pipeline.
                if (!findImage()) return false
                val imagePath = targetImage.path
                if (!imagePath.startsWith("/dev/block/") ||
                    !shell.newJob().add("[ -b '$imagePath' ]").exec().isSuccess
                ) {
                    console.add("! Boot target is not a verified /dev/block device; refusing flash")
                    return false
                }
                return extractFiles() && patchBoot() && flashBoot()
            }'''

        def apply(root: Path) -> dict:
            source = root/'app/core/src/main/java/com/topjohnwu/magisk/core/tasks/MagiskInstaller.kt'
            policy = source.with_name('DirectInstallPolicy.kt')
            original = source.read_text(encoding='utf-8')
            if original.count(ANCHOR) != 1:
                raise RuntimeError(f'Direct installer anchor missing or modified: {original.count(ANCHOR)}')
            if policy.exists():
                raise RuntimeError('Refusing to overwrite existing DirectInstallPolicy.kt')
            if original.count('protected suspend fun direct() =') != 1:
                raise RuntimeError('Unexpected original direct() implementation')
            new = original.replace(ANCHOR, REPLACEMENT)
            assert new.replace(REPLACEMENT, ANCHOR) == original
            assert 'protected suspend fun secondSlot()' in original
            assert 'protected suspend fun patchFile(' in original
            assert 'class Direct(' in original
            assert 'flashBoot() = "direct_install $installDir $targetImage".sh().isSuccess' in original
            policy.write_text(POLICY, encoding='utf-8')
            source.write_text(new, encoding='utf-8')
            result = {
                'mode': 'original Magisk Direct + fail-closed flavour/partition gate',
                'original_sha256': hashlib.sha256(original.encode()).hexdigest(),
                'new_sha256': hashlib.sha256(new.encode()).hexdigest(),
                'policy_sha256': hashlib.sha256(POLICY.encode()).hexdigest(),
                'does_not_modify_original_native_flash_scripts': True,
                'does_not_auto_flash_at_app_start': True,
                'alpha_31100_enabled': False,
            }
            return result

        if __name__=='__main__':
            if len(sys.argv)!=2:
                raise SystemExit('usage: apply_r99.py <magisk-repo-root>')
            print(json.dumps(apply(Path(sys.argv[1])), indent=2))
        R99_EOF_R99_APPLY
        python3 r99_apply.py magisk > reports/R99_DIRECT_INSTALL_GATE.json
        python3 - <<'PY_R99_VERIFY'
        import json
        from pathlib import Path
        record=json.loads(Path('reports/R99_DIRECT_INSTALL_GATE.json').read_text())
        assert record['alpha_31100_enabled'] is False
        assert record['does_not_modify_original_native_flash_scripts'] is True
        assert record['does_not_auto_flash_at_app_start'] is True
        p=Path('magisk/app/core/src/main/java/com/topjohnwu/magisk/core/tasks')
        policy=(p/'DirectInstallPolicy.kt').read_text()
        installer=(p/'MagiskInstaller.kt').read_text()
        assert 'actualVersionName != env.expectedVersionName' in policy
        assert 'env.managerPackage != "com.topjohnwu.magisk"' in policy
        assert 'env.emulator' in policy
        assert 'shell.isRoot' in installer
        assert 'findImage()' in installer and 'patchBoot() && flashBoot()' in installer
        assert 'imagePath.startsWith("/dev/block/")' in installer
        print('R9.9 original on-device Direct Install gated; no auto flash; Alpha blocked: PASS')
        PY_R99_VERIFY

    - name: R6.4 - Eliminate verified duplicate legacy Java classes before R8
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY_R64_CLASS_OWNERSHIP'
        from pathlib import Path
        from collections import defaultdict
        import hashlib, json
        root = Path('magisk/app')
        source = root/'core/src/main/java'
        shared = root/'shared/src/main/java'
        # These byte-identical classes were retained in official v31.1 core but
        # also restored into the historic :shared library in R5. This duplicates
        # their fully-qualified class definitions when :core depends on :shared.
        # Leave :shared as the single owner because :stub also depends on it.
        expected = {
            'com/topjohnwu/magisk/ProviderInstaller.java':
                '63c9731edf58aaceecfb9a31c2dae1129871d1fca6948a445ab803bb10645b65',
            'com/topjohnwu/magisk/utils/APKInstall.java':
                'bec3e8844ed6a307c46ce4b991fbb1de3110e846acd62454cb863b9466ef9dc4',
        }
        settings=(root/'settings.gradle.kts').read_text()
        gradle=(root/'core/build.gradle.kts').read_text()
        assert 'api(project(":shared"))' in gradle, 'R6.1 shared dependency missing'
        assert 'include(":apk", ":core", ":shared", ":stub", ":stub-res", ":test")' in settings
        assert len(expected)==2

        def index_classes():
            indexed=defaultdict(dict)
            for module in ('core','shared','apk','stub'):
                java=root/module/'src/main/java'
                assert java.is_dir(), f'Missing Java/Kotlin source root {java}'
                for path in java.rglob('*'):
                    if path.is_file() and path.suffix in ('.java','.kt'):
                        rel=path.relative_to(java).as_posix()
                        indexed[rel][module]=path
            return {key: modules for key,modules in indexed.items() if len(modules)>1}

        collisions=index_classes()
        assert set(collisions)==set(expected), f'Unexpected duplicate class-paths: {collisions.keys()}'
        for rel, modules in collisions.items():
            assert set(modules)=={'core','shared'}, f'Unexpected class owners: {rel}: {modules.keys()}'
            a,b=modules['core'],modules['shared']
            assert a.read_bytes()==b.read_bytes(), f'Classes differ: {rel}'
            digest=hashlib.sha256(a.read_bytes()).hexdigest()
            assert digest==expected[rel], f'Unexpected source hash: {rel}: {digest}'
            assert ('class '+a.stem) in a.read_text(), f'Not a named Java class: {rel}'
            a.unlink()
            assert not a.exists() and b.is_file(), f'Failed safe deduplication: {rel}'

        assert not index_classes(), 'Duplicate Java/Kotlin source paths remain'
        for rel in expected:
            assert (shared/rel).is_file(), f'Required shared implementation missing: {rel}'
        # Both legacy callers and the current v31.1 networking layer still use
        # these classes. They now resolve through :core -> :shared API linkage.
        assert 'ProviderInstaller.install(context)' in (source/'com/topjohnwu/magisk/core/di/Networking.kt').read_text()
        assert 'APKInstall.startSession' in (source/'com/topjohnwu/magisk/core/tasks/AppMigration.kt').read_text()
        assert 'APKInstall.startSession' in (root/'stub/src/main/java/com/topjohnwu/magisk/DownloadActivity.java').read_text()

        out=Path('reports/R6_4_verified_java_class_ownership.json')
        out.parent.mkdir(exist_ok=True)
        out.write_text(json.dumps({
           'base':'Magisk v31.1 0972f67d97f9b6302b67c5171283330c74114b4a',
           'resolution':'Removed only the identical core copies; shared retains sole class ownership',
           'removed_from_core':expected,
           'remaining_duplicates':[],
           'native_build':'NOT_VERIFIED_IN_THIS_STEP',
           'android_build':'NOT_VERIFIED_IN_THIS_STEP',
        },indent=2,sort_keys=True)+'\n')
        print('R6.4 legacy shared/core Java duplicate-class reconciliation: PASS')
        PY_R64_CLASS_OWNERSHIP
        git -C magisk diff --check
        git -C magisk diff --binary > reports/R6_4_final_tracked_source.diff
        git -C magisk status --short > reports/R6_4_final_source_status.txt
        test -s reports/R6_4_verified_java_class_ownership.json

