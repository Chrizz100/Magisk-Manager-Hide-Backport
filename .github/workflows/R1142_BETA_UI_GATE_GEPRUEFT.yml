         if check and p.returncode:raise RuntimeError(f'{argv[:3]} failed: {p.stdout[-700:]}')
         return p.stdout.strip()
        def adb(cmd,timeout=50,check=True):return run(['adb','shell',cmd],timeout=timeout,check=check)
        assert adb('getprop ro.kernel.qemu')=='1' and adb('getprop ro.build.version.sdk')=='33', 'No physical device permitted'
        assert adb('getprop ro.product.cpu.abi')=='x86_64','Wrong AVD ABI'
        original=W/'dist/R11_RESEARCH_ONLY_DO_NOT_DISTRIBUTE.apk'
        assert original.is_file() and original.stat().st_size>1000000
