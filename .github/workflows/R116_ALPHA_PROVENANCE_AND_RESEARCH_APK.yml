      if: ${{ steps.r92_emulator.outcome == 'success' }}
      shell: bash
      run: "set -euo pipefail\nmkdir -p reports/r9_emulator\nif [ ! -f reports/r9_emulator/R9_RESULT.json ]; then\n \
        \ echo 'R9_NOT_EXECUTED: root or emulator setup never finished' > reports/r9_emulator/R9_NOT_EXECUTED.txt\nfi\n\
        python3 - <<'PY_R9_RESULT'\nimport json\nfrom pathlib import Path\np=Path('reports/r9_emulator/R9_RESULT.json')\n\
        if not p.is_file():\n    raise SystemExit('R9 root/hide/restore test was not executed')\nresult=json.loads(p.read_text())\n\
        assert result['physical_device_modified'] is False\nassert result['root_permissions_tested'] is True\nassert\
        \ result['hide_and_restore_tested'] is True\nassert result['result']=='ROOT_HIDE_RESTORE_PASS', result.get('error')\
        \ or result.get('missing_checks')\nprint('R9 confirmed full manager hide+restore with real Magisk service')\n\
        PY_R9_RESULT\n"
    - name: R11 - BLOCK phone-beta unless original package is truly invisible during Hide
      run: "set -euo pipefail\npython3 - <<'PY_R11_STRICT'\nimport json\nfrom pathlib import Path\np=Path('reports/r9_emulator/R9_RESULT.json')\n\
        if not p.is_file(): raise SystemExit('R11: actual root E2E outcome missing')\nr=json.loads(p.read_text())\nrequired=('AVD_ONLY','MAGISK_DAEMON_31100','MAGISK_SU',\n\
        \          'R11_MODULE_UI_VISIBLE','R11_MODULE_GUI_DISABLED','R11_MODULE_GUI_ENABLED',\n          'R11_MODULE_CLI_INSTALL_STAGED','R114_CONCEALMENT_APP_CONFIRMED',\n\
        \  'R114_ORIGINAL_REINSTALLED','REQUESTER_BOUND','REQUESTER_CLEARED',\n          'ORIGINAL_FOREGROUND','MAGISK_SU_AFTER_RESTORE')\n\
        missing=[x for x in required if not r.get('checks',{}).get(x)]\nreport={'source_run':'R11 rooted emulator','result':r.get('result'),\n\
        \        'missing':missing,'original_visible_while_hidden':r.get('original_visible_while_hidden'),\n        'package_concealment_proven':r.get('actual_package_concealment_proven')\
        \ is True,\n        'restore_verified':r.get('checks',{}).get('REQUESTER_CLEARED') is True,\n        'phone_root_alpha_verified':False,'boot_partition_flashing_permitted':False}\n\
        Path('reports/R11_E2E_CONCEALMENT_GATE.json').write_text(json.dumps(report,indent=2)+'\\n')\nif missing: raise\
        \ SystemExit('R11 HOLD: required functional checks missing: '+repr(missing))\nif report['result']!='ROOT_HIDE_RESTORE_PASS':\
        \ raise SystemExit('R11 HOLD: original Root Hide/Restore failed')\nif report['original_visible_while_hidden']\
        \ is not False: \n    raise SystemExit('R11 HOLD: ORIGINAL MAGISK PACKAGE VISIBLE AFTER HIDE. This is NOT an\
        \ actual concealment beta.')\nprint('R11 E2E concealment+restore+module gate PASS on Android-13 QEMU')\nPY_R11_STRICT\n"
    - name: R11.5 - Strict integrated beta function matrix, no device APK release
      run: "set -euo pipefail\npython3 - <<'PY_R115_MATRIX'\nimport json\nfrom pathlib import Path\nreport=Path('reports/r9_emulator/R115_INTEGRATED_BETA_UI.json')\n\
        assert report.exists(),'R115 combined UI report absent'\na=json.loads(report.read_text())\nrequired={'ROOT_FROM_INTEGRATED_UI','MODULE_LIST_FROM_INTEGRATED_UI',\n\
        \          'SUPERUSER_LIST_FROM_INTEGRATED_UI','MODULE_DISABLE_FROM_INTEGRATED_UI',\n          'MODULE_ENABLE_FROM_INTEGRATED_UI','MODULE_REMOVE_MARKED_BY_INTEGRATED_UI'}\n\
        missing=[x for x in required if a.get('actions',{}).get(x)!='PASS']\nif missing:raise SystemExit('R115 combined\
        \ beta controls not yet proven: '+str(missing))\nr9=json.loads(Path('reports/r9_emulator/R9_RESULT.json').read_text())\n\
        assert r9['result']=='ROOT_HIDE_RESTORE_PASS' and r9['actual_package_concealment_proven'] is True\nassert r9['hide_and_restore_tested']\
        \ is True\nmatrix={'revision':'R11.5','result':'INTEGRATED_AVD_CORE_PASS',\n        'app_package':'com.topjohnwu.magisk','all_core_actions_same_apk':True,\n\
        \        'root_and_modules':{k:a['actions'][k] for k in sorted(required)},\n        'hide_restore':'PASS','original_pkg_concealment':'PASS',\n\
        \        'module_zip_install_from_same_app':'NOT_TESTED',\n        'boot_image_file_patching':'NOT_TESTED',\n\
        \        'direct_boot_flash':'BLOCKED',\n        'magisk_alpha_31100_device_compatibility':'NOT_TESTED',\n  \
        \      'separately_signed_phone_beta':'NOT_BUILT',\n        'phone_release_allowed':False}\nPath('reports/R115_FUNCTION_MATRIX.json').write_text(json.dumps(matrix,indent=2)+'\\\
        n')\nprint('R115: INTEGRATED_AVD_CORE_PASS, phone release remains NOT allowed')\nPY_R115_MATRIX\n"
    - name: 'R11.6 - Pin actual Alpha 31100 release and audit isolated integrated APK'
      shell: bash
      run: |
        set -euo pipefail
        # Preserve the successful, pinned official v31.1 + historical v30 port.
        # Do not install on a phone: this APK uses ephemeral CI test signing.
        python3 - <<'PY_R116_BASE'
        import json, pathlib
        src=json.loads(pathlib.Path('reports/R115_SOURCE_INTEGRATION.json').read_text())
        matrix=json.loads(pathlib.Path('reports/R115_FUNCTION_MATRIX.json').read_text())
        assert src['branch']=='AVD-INTEGRATED-ONLY' and src['app_id']=='com.topjohnwu.magisk'
        assert src['real_phone_flash_allowed'] is False and src['alpha_compatibility_confirmed'] is False
        assert matrix['result']=='INTEGRATED_AVD_CORE_PASS'
        assert matrix['all_core_actions_same_apk'] is True
        assert matrix['hide_restore']=='PASS' and matrix['original_pkg_concealment']=='PASS'
        assert matrix['phone_release_allowed'] is False
        assert matrix['magisk_alpha_31100_device_compatibility']=='NOT_TESTED'
        print('R11.6: green integrated research source and strict no-phone gates preserved')
        PY_R116_BASE
        mkdir -p reports/r116 /tmp/r116_alpha
        curl -fL --retry 5 --retry-delay 3 --retry-all-errors \
          --connect-timeout 20 --max-time 300 \
          'https://github.com/vvb2060/Magisk/releases/download/31100/app-release.apk' \
          -o /tmp/r116_alpha/app-release.apk
        echo 'fb613e30f4889d03a88c7352a23a520f94753ed75c3e2b36498e074424691a24  /tmp/r116_alpha/app-release.apk' \
          | sha256sum -c -
        python3 - <<'PY_R116_APKS'
        import hashlib, json, pathlib, zipfile, subprocess, shutil
        research=pathlib.Path('magisk/out/app-release.apk')
        alpha=pathlib.Path('/tmp/r116_alpha/app-release.apk')
        assert research.is_file() and research.stat().st_size>5_000_000
        assert alpha.is_file() and alpha.stat().st_size==10683186
        def digest(p):
            h=hashlib.sha256()
            with p.open('rb') as f:
                for b in iter(lambda:f.read(1<<20),b''):h.update(b)
            return h.hexdigest()
        assert digest(alpha)=='fb613e30f4889d03a88c7352a23a520f94753ed75c3e2b36498e074424691a24'
        old_digest=pathlib.Path('reports/app-release-sha256.txt').read_text().split()[0]
        assert digest(research)==old_digest, 'Research app differs from its original successful compiler digest'
        def inspect(p):
            with zipfile.ZipFile(p) as z:
                assert z.testzip() is None
                assert 'AndroidManifest.xml' in z.namelist() and 'classes.dex' in z.namelist()
                return {'size_bytes':p.stat().st_size,'sha256':digest(p),'entries':len(z.namelist()),
                        'has_manifest':True,'has_dex':True}
        out={
          'revision':'R11.6',
          'base_green_workflow':'R11.5.1',
          'integration_outcome':'INTEGRATED_AVD_CORE_PASS',
          'alpha_release_repo':'vvb2060/Magisk',
          'alpha_release_tag':'31100',
          'alpha_release_binary':inspect(alpha),
          'research_application':inspect(research),
          'alpha_runtime_compatibility':'NOT_TESTED',
          'current_phone_magisk_alpha_remains_untouched':True,
          'apk_signing_type':'EPHEMERAL_CI_TEST_CERTIFICATE',
          'package_conflict_risk':'com.topjohnwu.magisk may collide with installed Magisk managers',
          'phone_installation_authorized':False,
          'flash_authorized':False,
          'module_zip_UI_test':'NOT_TESTED',
          'output_scope':'ISOLATED_ANDROID_13_AVD_ONLY',
        }
        pathlib.Path('reports/r116/ALPHA_RESEARCH_APK_PROVENANCE.json').write_text(json.dumps(out,indent=2)+'\n')
        print('R11.6: Alpha 31100 and research APK bytes verified, but compatibility NOT established')
        PY_R116_APKS
        SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
        signer="$(find "$SDK/build-tools" -mindepth 2 -maxdepth 2 -name apksigner -type f | sort -V | tail -1)"
        aapt="$(find "$SDK/build-tools" -mindepth 2 -maxdepth 2 -name aapt -type f | sort -V | tail -1)"
        test -x "$signer" && test -x "$aapt"
        "$signer" verify --verbose --print-certs magisk/out/app-release.apk \
          > reports/r116/research_signature.txt
        "$signer" verify --verbose --print-certs /tmp/r116_alpha/app-release.apk \
          > reports/r116/alpha_signature.txt
        "$aapt" dump badging magisk/out/app-release.apk \
          > reports/r116/research_manifest_badging.txt
        "$aapt" dump badging /tmp/r116_alpha/app-release.apk \
          > reports/r116/alpha_manifest_badging.txt
        grep -E "^package: name='com.topjohnwu.magisk'" reports/r116/research_manifest_badging.txt
        grep -E "^package: name='com.topjohnwu.magisk'" reports/r116/alpha_manifest_badging.txt
        printf '%s\n' 'RESEARCH_ONLY: DO NOT INSTALL on phone or replace Magisk Alpha.' \
          'No compatibility check against a running Magisk Alpha daemon was performed.' \
          'No direct flash, boot.img patch, module ZIP UI or recovery path was tested.' \
          > reports/r116/NO_PHONE_INSTALL.txt
        # Never retain the upstream Alpha binary as an artifact.
        rm -f /tmp/r116_alpha/app-release.apk
        test -s reports/r116/ALPHA_RESEARCH_APK_PROVENANCE.json

    - name: 'R11.6 - Retain tested APK for isolated AVD analysis, NOT phone beta'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p dist/r116
        cp magisk/out/app-release.apk dist/r116/R116_RESEARCH_AVD_ONLY_NOT_FOR_PHONE.apk
        cp reports/r116/ALPHA_RESEARCH_APK_PROVENANCE.json dist/r116/
        cp reports/r116/NO_PHONE_INSTALL.txt dist/r116/
        python3 - <<'PY_R116_QUARANTINE'
        import pathlib,hashlib,json
        d=pathlib.Path('dist/r116'); apk=d/'R116_RESEARCH_AVD_ONLY_NOT_FOR_PHONE.apk'
        data=json.loads((d/'ALPHA_RESEARCH_APK_PROVENANCE.json').read_text())
        assert apk.is_file() and hashlib.sha256(apk.read_bytes()).hexdigest()==data['research_application']['sha256']
        assert data['phone_installation_authorized'] is False
        assert data['alpha_runtime_compatibility']=='NOT_TESTED'
        print('AVD-only research APK retained with exact checksum and explicit phone prohibition')
        PY_R116_QUARANTINE

    - name: 'R11.6 - Upload quarantined AVD research APK (not phone-installable beta)'
      uses: actions/upload-artifact@v7
      with:
        name: R116_AVD_RESEARCH_ONLY_NO_PHONE
        path: dist/r116/
        if-no-files-found: error
        retention-days: 7

    - name: R9.2 - Summarize primary failure instead of duplicating it
      if: always()
      env:
        R92_BUILD_OUTCOME: ${{ steps.r92_compile.outcome }}
        R92_EMULATOR_OUTCOME: ${{ steps.r92_emulator.outcome }}
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY_PHASES'\nimport json, os\nfrom pathlib import Path\nbuild=os.environ['R92_BUILD_OUTCOME']\n\
        emulator=os.environ['R92_EMULATOR_OUTCOME']\nif build=='failure':\n    result='BUILD_FAILED_EMULATOR_NOT_RUN'\n\
        elif build!='success':\n    result='PREBUILD_FAILED_OR_SKIPPED'\nelif emulator!='success':\n    result='EMULATOR_FAILED_OR_NOT_EXECUTED'\n\
        else:\n    report=Path('reports/r9_emulator/R9_RESULT.json')\n    if report.exists():\n        outcome=json.loads(report.read_text())\n\
        \        result=outcome.get('result','R9_RESULT_UNKNOWN')\n    else:\n        result='MISSING_R9_RESULT'\nout={'compile':build,'emulator':emulator,'overall':result,\n\
        \     'physical_device_modified':False,\n     'scope':'research-only official Android 13 x86_64 emulator'}\n\
        Path('reports/R92_PRIMARY_STATUS.json').write_text(json.dumps(out,indent=2)+'\\n')\nprint('R9.2 primary status:',result)\n\
        with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:\n    f.write('### R9.2 build & emulator result\\n')\n\
        \    f.write(f\"- Build: `{build}`\\n- Emulator: `{emulator}`\\n- Primary status: `{result}`\\n\")\n    f.write('-\
        \ No APK/signing key distributed; no physical device modified.\\n')\nPY_PHASES\n"
    - name: R9.7 - Report build, GUI, Root, Hide and Restore independently
      if: always()
      shell: bash
      run: "set -euo pipefail\nmkdir -p reports\npython3 - <<'PY_R97_STATUS'\nimport json, os\nfrom pathlib import Path\n\
        def read(path):\n    try:return json.loads(Path(path).read_text())\n    except (OSError, ValueError):return {}\n\
        build=read('reports/R92_PRIMARY_STATUS.json')\ngui=read('reports/r8_emulator/R8_RESULT.json')\nroot=read('reports/r9_emulator/R9_RESULT.json')\n\
        flags=root.get('checks') or {}\nphases={\n    'build': build.get('compile','NOT_EXECUTED'),\n    'r8_gui': gui.get('result','NOT_EXECUTED'),\n\
        \    'magisk_daemon': 'PASS' if flags.get('MAGISK_DAEMON_31100') else 'NOT_CONFIRMED',\n    'root_su': 'PASS'\
        \ if flags.get('MAGISK_SU') else 'NOT_CONFIRMED',\n    'manager_hide_dialog': 'PASS' if flags.get('HIDE_DIALOG')\
        \ else 'NOT_CONFIRMED',\n    'hidden_manager_gui': 'PASS' if flags.get('STUB_RESTORE_BUTTON') else 'NOT_CONFIRMED',\n\
        \    'restore_dialog': 'PASS' if flags.get('RESTORE_DIALOG') else 'NOT_CONFIRMED',\n    'requester_cleared_by_app':\
        \ 'PASS' if flags.get('REQUESTER_CLEARED') else 'NOT_CONFIRMED',\n    'original_manager_foreground': 'PASS' if\
        \ flags.get('ORIGINAL_FOREGROUND') else 'NOT_CONFIRMED',\n    'root_su_after_restore': 'PASS' if flags.get('MAGISK_SU_AFTER_RESTORE')\
        \ else 'NOT_CONFIRMED',\n    'original_package_visible_during_hide': root.get('original_visible_while_hidden'),\n\
        \    'package_concealment_proven': root.get('actual_package_concealment_proven') is True,\n    'real_device_ready':\
        \ False,\n    'overall': root.get('result','NOT_EXECUTED'),\n}\nPath('reports/R97_PHASE_STATUS.json').write_text(json.dumps(phases,indent=2)+'\\\
        n')\nprint('R9.7 individually verified phases:',json.dumps(phases,sort_keys=True))\nsummary=os.environ.get('GITHUB_STEP_SUMMARY')\n\
        if summary:\n    with open(summary,'a') as stream:\n        stream.write('### R9.7 measured stage results\\n')\n\
        \        for name,value in phases.items():\n            stream.write(f'- {name}: `{value}`\\n')\n        stream.write('\\\
        nA successful migration does not prove concealment while the original package remains installed.\\n')\nPY_R97_STATUS\n"
    - name: Upload compiler and source evidence only (no APK, no signing key)
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: R11_RESEARCH_E2E_EVIDENCE_NO_PHONE_APK
        path: reports/
        if-no-files-found: error
        retention-days: 14
'on':
  workflow_dispatch: {}
