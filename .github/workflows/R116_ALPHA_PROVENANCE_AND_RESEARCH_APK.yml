    - name: R9.9 - Guard official on-device Direct Install (never replace Alpha by accident)
      shell: bash
      run: "set -euo pipefail\nmkdir -p reports\ncat > DirectInstallPolicy.kt <<'R99_EOF_DIRECTINSTALLPOLICY'\npackage\
        \ com.topjohnwu.magisk.core.tasks\n\n/**\n * Prevent accidental replacement of a different Magisk implementation.\n\
        \ * No writes occur in this policy. The actual patch + write remains the\n * already existing MagiskInstaller.direct()\
        \ / boot_patch.sh / direct_install.\n *\n * This is deliberately strict. Unknown backend flavours fail closed.\n\
        \ */\ninternal object DirectInstallPolicy {\n    data class Environment(\n        val rooted: Boolean,\n    \
        \    val rootShellGranted: Boolean,\n        val daemonActive: Boolean,\n        val actualVersionCode: Int,\n\
        \        val expectedVersionCode: Int,\n        val actualVersionName: String,\n        val expectedVersionName:\
        \ String,\n        val managerPackage: String,\n        val emulator: Boolean,\n    )\n\n    fun reasons(env:\
        \ Environment): List<String> = buildList {\n        if (env.emulator) add(\"Direct installation on an emulator\
        \ is disabled\")\n        if (!env.rooted || !env.rootShellGranted || !env.daemonActive) {\n            add(\"\
        No confirmed matching Magisk root backend\")\n        }\n        if (env.actualVersionCode <= 0 || env.actualVersionCode\
        \ != env.expectedVersionCode) {\n            add(\"Magisk version code differs\")\n        }\n        if (env.actualVersionName.isBlank()\
        \ || env.expectedVersionName.isBlank() ||\n            env.actualVersionName != env.expectedVersionName) {\n\
        \            add(\"Magisk native flavour/build differs (Alpha is NOT an official build)\")\n        }\n     \
        \   if (env.managerPackage != \"com.topjohnwu.magisk\") {\n            add(\"Not the original Magisk manager\
        \ package\")\n        }\n    }\n}\nR99_EOF_DIRECTINSTALLPOLICY\ncat > r99_apply.py <<'R99_EOF_R99_APPLY'\n#!/usr/bin/env\
        \ python3\n\"\"\"Add an explicit fail-closed guard to the existing Magisk Direct Installer.\n\nFor use after\
        \ the already tested R9.7 source reconstruction, before compilation.\nNo replacement installer, partition-writing\
        \ command or auto-start action is added.\n\"\"\"\nfrom pathlib import Path\nimport hashlib\nimport json\nimport\
        \ sys\n\nPOLICY = Path(__file__).with_name('DirectInstallPolicy.kt').read_text(encoding='utf-8')\nANCHOR = '\
        \    protected suspend fun direct() = findImage() && extractFiles() && patchBoot() && flashBoot()'\nREPLACEMENT\
        \ = '''    protected suspend fun direct(): Boolean {\n        // Do not flash an Alpha-patched phone using a\
        \ different official build.\n        // In particular, matching numeric versionCode=31100 is NOT enough.\n  \
        \      val blockers = DirectInstallPolicy.reasons(\n            DirectInstallPolicy.Environment(\n          \
        \      rooted = Info.isRooted,\n                rootShellGranted = shell.isRoot,\n                daemonActive\
        \ = Info.env.isActive,\n                actualVersionCode = Info.env.versionCode,\n                expectedVersionCode\
        \ = BuildConfig.APP_VERSION_CODE,\n                actualVersionName = Info.env.versionString,\n            \
        \    expectedVersionName = BuildConfig.APP_VERSION_NAME,\n                managerPackage = context.packageName,\n\
        \                emulator = Info.isEmulator,\n            )\n        )\n        if (blockers.isNotEmpty()) {\n\
        \            console.add(\"! PC-free direct installation refused: ${blockers.joinToString(\"; \")}\")\n     \
        \       return false\n        }\n        // Reuse the reviewed official boot_image patch + direct_install pipeline.\n\
        \        if (!findImage()) return false\n        val imagePath = targetImage.path\n        if (!imagePath.startsWith(\"\
        /dev/block/\") ||\n            !shell.newJob().add(\"[ -b '$imagePath' ]\").exec().isSuccess\n        ) {\n \
        \           console.add(\"! Boot target is not a verified /dev/block device; refusing flash\")\n            return\
        \ false\n        }\n        return extractFiles() && patchBoot() && flashBoot()\n    }'''\n\ndef apply(root:\
        \ Path) -> dict:\n    source = root/'app/core/src/main/java/com/topjohnwu/magisk/core/tasks/MagiskInstaller.kt'\n\
        \    policy = source.with_name('DirectInstallPolicy.kt')\n    original = source.read_text(encoding='utf-8')\n\
        \    if original.count(ANCHOR) != 1:\n        raise RuntimeError(f'Direct installer anchor missing or modified:\
        \ {original.count(ANCHOR)}')\n    if policy.exists():\n        raise RuntimeError('Refusing to overwrite existing\
        \ DirectInstallPolicy.kt')\n    if original.count('protected suspend fun direct() =') != 1:\n        raise RuntimeError('Unexpected\
        \ original direct() implementation')\n    new = original.replace(ANCHOR, REPLACEMENT)\n    assert new.replace(REPLACEMENT,\
        \ ANCHOR) == original\n    assert 'protected suspend fun secondSlot()' in original\n    assert 'protected suspend\
        \ fun patchFile(' in original\n    assert 'class Direct(' in original\n    assert 'flashBoot() = \"direct_install\
        \ $installDir $targetImage\".sh().isSuccess' in original\n    policy.write_text(POLICY, encoding='utf-8')\n \
        \   source.write_text(new, encoding='utf-8')\n    result = {\n        'mode': 'original Magisk Direct + fail-closed\
        \ flavour/partition gate',\n        'original_sha256': hashlib.sha256(original.encode()).hexdigest(),\n     \
        \   'new_sha256': hashlib.sha256(new.encode()).hexdigest(),\n        'policy_sha256': hashlib.sha256(POLICY.encode()).hexdigest(),\n\
        \        'does_not_modify_original_native_flash_scripts': True,\n        'does_not_auto_flash_at_app_start':\
        \ True,\n        'alpha_31100_enabled': False,\n    }\n    return result\n\nif __name__=='__main__':\n    if\
        \ len(sys.argv)!=2:\n        raise SystemExit('usage: apply_r99.py <magisk-repo-root>')\n    print(json.dumps(apply(Path(sys.argv[1])),\
        \ indent=2))\nR99_EOF_R99_APPLY\npython3 r99_apply.py magisk > reports/R99_DIRECT_INSTALL_GATE.json\npython3\
        \ - <<'PY_R99_VERIFY'\nimport json\nfrom pathlib import Path\nrecord=json.loads(Path('reports/R99_DIRECT_INSTALL_GATE.json').read_text())\n\
        assert record['alpha_31100_enabled'] is False\nassert record['does_not_modify_original_native_flash_scripts']\
        \ is True\nassert record['does_not_auto_flash_at_app_start'] is True\np=Path('magisk/app/core/src/main/java/com/topjohnwu/magisk/core/tasks')\n\
        policy=(p/'DirectInstallPolicy.kt').read_text()\ninstaller=(p/'MagiskInstaller.kt').read_text()\nassert 'actualVersionName\
        \ != env.expectedVersionName' in policy\nassert 'env.managerPackage != \"com.topjohnwu.magisk\"' in policy\n\
        assert 'env.emulator' in policy\nassert 'shell.isRoot' in installer\nassert 'findImage()' in installer and 'patchBoot()\
        \ && flashBoot()' in installer\nassert 'imagePath.startsWith(\"/dev/block/\")' in installer\nprint('R9.9 original\
        \ on-device Direct Install gated; no auto flash; Alpha blocked: PASS')\nPY_R99_VERIFY\n"
