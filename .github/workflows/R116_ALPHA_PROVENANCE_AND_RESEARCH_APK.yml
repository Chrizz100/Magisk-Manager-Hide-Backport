ies_output\',timeout=60)\n        if \'ERROR:\' in xml:raise RuntimeError(\'R115: beta UI Superuser list reported error\')\n        report[\'actions\'][\'SUPERUSER_LIST_FROM_INTEGRATED_UI\']=\'PASS\';save()\n        # Enter fixture module ID into Beta card\'s own edit field.\n        for k in range(8):\n            _,tree=nodes(\'module_edit\',k)\n            items=[n for n in tree.iter(\'node\') if n.get(\'class\')==\'android.widget.EditText\']\n            pos=None\n            for n in items:\n                m=re.fullmatch(r\'\\[(\\d+),(\\d+)\\]\\[(\\d+),(\\d+)\\]\',n.get(\'bounds\',\'\'))\n                if m:\n                    x0,y0,x1,y1=map(int,m.groups())\n                    if y0>=260 and y1<=2080:pos=((x0+x1)//2,(y0+y1)//2);break\n            if pos:break\n            self.adb(\'input swipe 525 790 525 1790 410\')\n            time.sleep(0.6)\n        else:save();raise RuntimeError(\'R115: module ID field not visible\')\n        self.adb(f\'input tap {pos[0]} {pos[1]}\')\n        self.adb(\'input text \'+module)\n        self.adb(\'input keyevent KEYCODE_BACK\') # hide keyboard\n        time.sleep(0.7)\n        def perform(label,stage,marker,exists):\n            click(label,stage)\n            click(\'Ausführen\',stage+\'_confirm\')\n            check=\'test \'+(\' -f \' if exists else \' ! -e \')+rootdir+\'/\'+marker+\' && echo PASS || true\'\n            for k in range(25):\n                if self.adb(check)==\'PASS\':return\n                time.sleep(2)\n            save();raise RuntimeError(\'R115: beta action not reflected in real Magisk module file: \'+label)\n        perform(\'Modul deaktivieren\',\'disable\',\'disable\',True)\n        report[\'actions\'][\'MODULE_DISABLE_FROM_INTEGRATED_UI\']=\'PASS\';save()\n        perform(\'Modul aktivieren\',\'enable\',\'disable\',False)\n        report[\'actions\'][\'MODULE_ENABLE_FROM_INTEGRATED_UI\']=\'PASS\';save()\n        perform(\'Entfernung vormerken\',\'remove\',\'remove\',True)\n        repor