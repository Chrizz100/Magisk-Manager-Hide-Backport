        )\n\n    fun modules(): String = rooted(\"for d in $MODULES/*; do \" +\n        \"[ -d \\\"\\$d\\\" ] || continue;\
        \ \" +\n        \"n=\\${d##*/}; [ -f \\\"\\$d/module.prop\\\" ] || continue; \" +\n        \"if [ -e \\\"\\$d/remove\\\
        \" ]; then s=REMOVE; \" +\n        \"elif [ -e \\\"\\$d/disable\\\" ]; then s=DISABLED; else s=ENABLED; fi; \"\
        \ +\n        \"printf '%s | %s\\\\n' \\\"\\$n\\\" \\\"\\$s\\\"; done\")\n\n    fun policies(): String = rooted(\"\
