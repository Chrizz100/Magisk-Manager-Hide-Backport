        \    props = props.rstrip('\\n') + '\\n' + 'distributionSha256Sum=' + GRADLE.sha256 + '\\n'\n    wrapper_properties.write_text(props)\n\
        \    assert ('distributionUrl=' + escaped) in props\n    print('Gradle 9.7.1 wrapper now uses verified local\
