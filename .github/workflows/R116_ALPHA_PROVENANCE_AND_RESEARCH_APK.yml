        \ r30.1 and Gradle 9.7.1 integrity/installation: PASS', flush=True)\n    finally:\n        (out / 'R8_1_TOOLCHAIN_STATUS.json').write_text(json.dumps(info,\
        \ indent=2, sort_keys=True) + '\\n')\n\n\nif __name__ == '__main__':\n    run()\nR81_PINNED_TOOLCHAIN_PY\npython3\
