        \ out = Path('reports')\n    out.mkdir(parents=True, exist_ok=True)\n    info = {\n        'base': 'Official\
        \ Magisk 31.1 pinned 0972f67d97f9b6302b67c5171283330c74114b4a',\n        'note': 'Only CI tool archives and Gradle\
