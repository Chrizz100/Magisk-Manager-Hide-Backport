        file: '+label)\n        perform('Modul deaktivieren','disable','disable',True)\n        report['actions']['MODULE_DISABLE_FROM_INTEGRATED_UI']='PASS';save()\n\
        \        perform('Modul aktivieren','enable','disable',False)\n        report['actions']['MODULE_ENABLE_FROM_INTEGRATED_UI']='PASS';save()\n\
        \        perform('Entfernung vormerken','remove','remove',True)\n        report['actions']['MODULE_REMOVE_MARKED_BY_INTEGRATED_UI']='PASS';save()\n\
        \        self.adb('rm -f '+rootdir+'/remove') # controlled cleanup on throwaway fixture\n        # ZIP selector and
        import are a separate strict gate; never claim ZIP UI was tested.\n        report['actions']['MODULE_ZIP_INSTALL_FROM_INTEGRATED_UI']='NOT_TESTED'\n\
        \        report['result']='R115_INTEGRATED_BETA_UI_PARTIAL_PASS'\n        save()\n        self.mark('R115_BETA_ROOT_UI')\n\
        \        self.mark('R115_BETA_MODULE_UI')\n        # Restore initial navigation so the pinned R9 Hide/Restore harness
        continues.\n        self.adb('am force-stop '+ORIGINAL)\n        self.adb('am start -W -n '+ACTIVITY,timeout=60)\n\
        \    def run(self):\n        try:\n            self.root_setup()\n            self.authorize_research_alpha_avd_only()\n\
        \            self.r11_module_roundtrip()\n            self.r115_integrated_beta_ui()\n            self.enable_gui()\n\
        \            self.hide_verify()\n            self.restore_verify()\n        except Exception as e:\n            self.error
        = str(e)\n            if self.stages.get('RESTORE_DIALOG'):\n                self.capture_restore_state('before_cleanup')\n\
        \        finally:\n            self.cleanup()\n            return self.finish()\n\n\nif __name__ == '__main__':\n\
        \    if len(sys.argv) == 2 and sys.argv[1] == '--selftest':\n        test_pure()\n    elif len(sys.argv) == 1:\n \
        \       if not os.environ.get('GITHUB_WORKSPACE'):\n            sys.exit('R9 only supports the isolated GitHub Actions
        emulator runner')\n        sys.exit(R9().run())\n    else:\n        sys.exit('Usage: r9_root_emulator.py [--selftest]')\n\
        \nPY_R118_STRICT_ALPHA\npython3 -m py_compile r118_alpha31100.py\npython3 r118_alpha31100.py --selftest\n"
    - name: Allow KVM on isolated GitHub emulator only
      shell: bash
      run: 'set -euo pipefail

        if [ ! -e /dev/kvm ]; then echo ''KVM_UNAVAILABLE'' >&2; exit 1; fi

        sudo chmod 0666 /dev/kvm

        test -w /dev/kvm'
    - name: R11.8.1 - Real Alpha 31100 + authorized research app full E2E in isolated emulator
      id: alpha_e2e
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
      with:
        api-level: 33
        target: google_apis
        arch: x86_64
        profile: pixel_5
        cores: 2
        ram-size: 3072M
        emulator-boot-timeout: 900
        emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -camera-back none
        script: adb install -r magisk/out/app-release.apk && python3 r118_alpha31100.py
    - name: R11.8.1 - Strict Alpha 31100 compatibility summary
      shell: bash
      if: always()
      env:
        E2E_RESULT: ${{ steps.alpha_e2e.outcome }}
      run: "set -euo pipefail\nmkdir -p reports/r118\npython3 - <<'PY_R118_REPORT'\nimport json,os,pathlib\np=pathlib.Path('reports/r9_emulator/R9_RESULT.json')\n\
        r=json.loads(p.read_text()) if p.exists() else {}\nchecks=r.get('checks') or {}\nexpected={'ALPHA_DAEMON_31100','ALPHA_RESEARCH_COEXISTENCE','ALPHA_RESEARCH_APP_SU_POLICY','R115_BETA_ROOT_UI',\n\
        \          'R115_BETA_MODULE_UI','R114_CONCEALMENT_APP_CONFIRMED','ALPHA_HIDDEN_ROOT_UID0','MAGISK_SU_AFTER_RESTORE'}\n\
        ok=os.environ['E2E_RESULT']=='success' and r.get('result')=='ROOT_HIDE_RESTORE_PASS' and all(checks.get(x) is True
        for x in expected)\nreport={'revision':'R11.8.1',\n        'actual_alpha_31100_backend_verified':checks.get('ALPHA_DAEMON_31100',False),\n\
        \        'research_root_module_ui_pass':all(checks.get(x,False) for x in ('R115_BETA_ROOT_UI','R115_BETA_MODULE_UI')),\n\
        \        'manager_hide_and_restore_with_alpha_pass':ok,\n        'original_hide_concealment_pass':checks.get('R114_CONCEALMENT_APP_CONFIRMED',False),\n\
        \        'raw_e2e_result':r.get('result','NOT_EXECUTED'),\n        'android_avd_job_outcome':os.environ['E2E_RESULT'],\n\
        \        'errors':r.get('error'),\n        'real_phone_compatibility':'NOT_PROVEN',\n        'boot_partition_written':False,\n\
        \        'phone_installation_authorized':False,\n        'result':'ALPHA31100_AVD_FULL_PASS' if ok else 'ALPHA31100_AVD_NOT_PROVEN'}\n\
        pathlib.Path('reports/r118/R118_FINAL.json').write_text(json.dumps(report,indent=2)+'\\n')\nprint('R11.8 evaluated
        Alpha runtime outcome:',report['result'])\nPY_R118_REPORT\n"
    - name: Upload diagnostic evidence (never release unproven phone APK)
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: R1181_ALPHA_AVD_AUTHORIZED_E2E_DIAG
        path: reports/
        if-no-files-found: error
        retention-days: 14
    - name: R11.8.1 - Require real Alpha Root/Modules/Hide/Restore before any phone beta
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY_R118_STRICT_END'\nimport json\nr=json.load(open('reports/r118/R118_FINAL.json'))\n\
        if r['result'] != 'ALPHA31100_AVD_FULL_PASS':\n raise SystemExit('R118 HOLD: true Alpha 31100 Hide/Restore not proven;
        see diagnostic artifact')\nprint('R118 green: exact research APK works in Alpha 31100 AVD. PHONE STILL NOT AUTHORIZED.')\n\
        PY_R118_STRICT_END"
    - name: Retain same tested research APK only for isolated AVD (not phone beta)
      uses: actions/upload-artifact@v7
      with:
