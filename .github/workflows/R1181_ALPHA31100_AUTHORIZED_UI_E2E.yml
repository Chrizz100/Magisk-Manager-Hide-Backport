name: Magisk R11.8.1 - Alpha 31100 AVD-only actual research SU authorization and E2E
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  alpha31100-compatibility:
    name: R11.8.1 isolated Alpha SU permission + actual Root/Modules/Hide/Restore
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
    - name: Fetch exact upstream source for official Android emulator helper
      uses: actions/checkout@v6
      with:
        repository: topjohnwu/Magisk
        ref: 0972f67d97f9b6302b67c5171283330c74114b4a
        path: magisk
        persist-credentials: false
        fetch-depth: 1
    - name: Restore actual green R11.6.1 research APK without recompiling or re-signing
      uses: actions/download-artifact@v8
      with:
        artifact-ids: '13757443773'
        run-id: 42803784395
        github-token: ${{ github.token }}
        repository: Chrizz100/Magisk-Manager-Hide-Backport
        path: alpha
    - name: Pin both original APKs (SHA-256, contents and ABI) - no flashing
      shell: bash
      run: "set -euo pipefail\nmkdir -p alpha reports/r118 magisk/out\nAPK='alpha/R116_RESEARCH_AVD_ONLY_NOT_FOR_PHONE.apk'\n\
        test -s \"$APK\"\necho '6dc479f4cb954ccaef2930b855338ebd76d4e37346c85f26a8c91e3d8160e5b0  '\"$APK\" | sha256sum -c
        -\ncp \"$APK\" magisk/out/app-release.apk\ncurl -fL --retry 5 --retry-delay 4 --retry-all-errors --connect-timeout
        25 --max-time 300 \\\n    https://github.com/vvb2060/Magisk/releases/download/31100/app-release.apk \\\n    -o alpha_31100.apk\n\
        echo 'fb613e30f4889d03a88c7352a23a520f94753ed75c3e2b36498e074424691a24  alpha_31100.apk' | sha256sum -c -\npython3
        - <<'PY_CHECK_APKS'\nfrom zipfile import ZipFile\nfrom pathlib import Path\nfor file in ('magisk/out/app-release.apk','alpha_31100.apk'):\n\
        \ with ZipFile(file) as z:\n  assert z.testzip() is None, (file,'invalid ZIP')\n  for name in ('AndroidManifest.xml','classes.dex','lib/x86_64/libmagisk.so','assets/boot_patch.sh'):\n\
        \   assert name in z.namelist(),(file,'missing',name)\n print(file,'actual signed Android APK and native x86_64 Magisk
        verified')\nPY_CHECK_APKS\n"
    - name: R11.8.1 - Pin original Alpha harness and provision research app SU only on verified QEMU
      shell: bash
      run: "set -euo pipefail\nmkdir -p reports/r9_emulator\ncat > r118_alpha31100.py <<'PY_R118_STRICT_ALPHA'\n#!/usr/bin/env
        python3\n\"\"\"R9: strict API-33 AVD-only Magisk daemon + manager hide/restore smoke.\n\nResearch-only. Never run
        on a physical device. All changes take place on a\nthrowaway emulator using a freshly built research APK and temporary
        CI key.\n\"\"\"\nimport json\nimport os\nimport re\nimport shlex\nimport subprocess\nimport sys\nimport time\nimport
        xml.etree.ElementTree as ET\nfrom pathlib import Path\n\nORIGINAL = 'com.topjohnwu.magisk'\nACTIVITY = ORIGINAL +
        '/.ui.MainActivity'\nEXPECTED = {'ro.kernel.qemu': '1', 'ro.build.version.sdk': '33', 'ro.product.cpu.abi': 'x86_64'}\n\
        PACKAGE_RE = re.compile(r'[a-z][a-z0-9_]*(?:\\.[a-z][a-z0-9_]*)+')\nREQUIRED_STAGES = ('AVD_ONLY', 'ADB_ROOT', 'ALPHA_DAEMON_31100',
        'ALPHA_RESEARCH_COEXISTENCE',\n                   'MAGISK_DAEMON_31100', 'MAGISK_SU', 'ALPHA_RESEARCH_APP_SU_POLICY',
        'R115_BETA_ROOT_UI', 'R115_BETA_MODULE_UI',\n                   'R114_CONCEALMENT_APP_CONFIRMED', 'ALPHA_HIDDEN_ROOT_UID0',\n\
        \                   'ANDROID_FRAMEWORK_RESTORED',\n                   'HIDE_BUTTON', 'HIDE_DIALOG', 'STUB_INSTALLED',
        'REQUESTER_BOUND',\n                   'STUB_FOREGROUND', 'STUB_RESTORE_BUTTON', 'RESTORE_DIALOG',\n             \
        \      'REQUESTER_CLEARED', 'ORIGINAL_FOREGROUND', 'MAGISK_SU_AFTER_RESTORE')\n\n\ndef extract_requester(output):\n\
        \    lines = [line.strip() for line in output.splitlines() if line.startswith('value=')]\n    if not lines:\n    \
        \    return ''\n    if len(lines) != 1:\n        raise RuntimeError('Unexpected multiple requester DB values')\n \
        \   value = lines[0][6:]\n    if value and (not PACKAGE_RE.fullmatch(value) or value == ORIGINAL):\n        raise
        RuntimeError('Malformed requester DB value')\n    return value\n\n\ndef find_node(xml_text, label):\n    root = ET.fromstring(xml_text)\n\
        \    for node in root.iter('node'):\n        if label not in (node.get('text', ''), node.get('content-desc', '')):\n\
        \            continue\n        match = re.fullmatch(r'\\[(\\d+),(\\d+)\\]\\[(\\d+),(\\d+)\\]', node.get('bounds',
        ''))\n        if not match:\n            continue\n        x0, y0, x1, y1 = map(int, match.groups())\n        if x1
        > x0 and y1 > y0:\n            return ((x0 + x1) // 2, (y0 + y1) // 2)\n    raise RuntimeError('UI element not found:
        ' + label)\n\n\ndef test_pure():\n    x = '<hierarchy><node text=\"Hide the Magisk app\" bounds=\"[12,20][52,80]\"\
        \ /></hierarchy>'\n    assert find_node(x, 'Hide the Magisk app') == (32, 50)\n    for bad in ('random', 'com.topjohnwu.magisk',
        'foo.bar;rm', 'UPPER.pkg'):\n        try:\n            extract_requester('value=' + bad)\n        except RuntimeError:\n\
        \            pass\n        else:\n            raise AssertionError('Invalid requester accepted: ' + bad)\n    assert
        extract_requester('') == ''\n    assert extract_requester('value=abc.def\\n') == 'abc.def'\n    assert len(REQUIRED_STAGES)
        == len(set(REQUIRED_STAGES))\n    print('R9_SELFTEST_PASS: XML bounds, DB validation, unique strict gates')\n\n\n\
        class R9:\n    def __init__(self):\n        self.workspace = Path(os.environ['GITHUB_WORKSPACE']).resolve()\n    \
        \    self.report = self.workspace / 'reports' / 'r9_emulator'\n        self.report.mkdir(parents=True, exist_ok=True)\n\
        \        self.apk = self.workspace / 'magisk' / 'out' / 'app-release.apk'\n        self.stages = {}\n        self.target
        = None\n        self.original_present = False\n        self.error = None\n        self.root_setup_started = False\n\
        \        self.restored_by_ui = False\n        self.original_visible_while_hidden = None\n\n    def cmd(self, argv,
        *, timeout=45, check=True, output=None, cwd=None):\n        try:\n            p = subprocess.run(argv, cwd=cwd, text=True,
        errors='replace',\n                               stdout=subprocess.PIPE, stderr=subprocess.STDOUT,\n            \
        \                   timeout=timeout)\n            if output:\n                (self.report / output).write_text(p.stdout)\n\
        \            if check and p.returncode:\n                raise RuntimeError(f'Command failed ({p.returncode}): {argv[:3]}:
        {p.stdout[-700:]}')\n            return p.stdout.strip()\n        except subprocess.TimeoutExpired as e:\n       \
        \     raise RuntimeError('Timed out: ' + str(argv[:3])) from e\n\n    def adb(self, remote, *, timeout=45, check=True,
        output=None):\n        return self.cmd(['adb', 'shell', remote], timeout=timeout, check=check, output=output)\n\n\
        \    def mark(self, stage):\n        self.stages[stage] = True\n        print('R9_PASS:', stage, flush=True)\n\n \
        \   def identity(self):\n        devices = [line.split()[0] for line in self.cmd(['adb', 'devices']).splitlines()[1:]\n\
        \                   if line.strip() and line.split()[-1] == 'device']\n        if len(devices) != 1 or not devices[0].startswith('emulator-'):\n\
        \            raise RuntimeError('Strict R9 gate: exactly one AVD emulator required')\n        info = {key: self.adb('getprop
        ' + key).strip() for key in EXPECTED}\n        info['adb_serial'] = devices[0]\n        (self.report / 'device.json').write_text(json.dumps(info,
        indent=2) + '\\n')\n        if any(info.get(key) != expected for key, expected in EXPECTED.items()):\n           \
        \ raise RuntimeError('Strict R9 gate: wrong device: ' + str(info))\n        self.mark('AVD_ONLY')\n\n    def requester(self):\n\
        \        sql = 'SELECT value FROM settings WHERE key=\"requester\" LIMIT 1'\n        remote = '/data/adb/magisk/magisk
        --sqlite ' + shlex.quote(sql)\n        return extract_requester(self.adb(remote))\n\n    def sqlite_clear_requester(self):\n\
        \        sql = 'DELETE FROM settings WHERE key=\"requester\"'\n        return self.adb('/data/adb/magisk/magisk --sqlite
        ' + shlex.quote(sql), check=False)\n\n    def ui_dump(self, label):\n        dest = self.report / (label + '.xml')\n\
        \        remote = '/sdcard/r9_' + label + '.xml'\n        for attempt in range(1, 4):\n            try:\n        \
        \        self.adb('uiautomator dump ' + shlex.quote(remote), timeout=55)\n                self.cmd(['adb', 'pull',
        remote, str(dest)], timeout=25)\n                root = ET.parse(dest).getroot()\n                assert root.tag
        == 'hierarchy' and len(list(root.iter('node'))) > 0\n                return dest.read_text()\n            except (RuntimeError,
        ET.ParseError, AssertionError):\n                if attempt == 3:\n                    raise\n                time.sleep(2)\n\
        \        raise RuntimeError('unreachable')\n\n    def tap(self, xml, text):\n        x, y = find_node(xml, text)\n\
        \        self.adb(f'input tap {x} {y}')\n        time.sleep(2)\n\n    def focus(self, expected):\n        data = self.adb('dumpsys
        activity activities', output='activity_' + expected.replace('.', '_') + '.txt')\n        matches = re.findall(r'topResumedActivity\\\
        s*=\\s*ActivityRecord\\{[^\\n]*', data)\n        if not matches or not any((expected + '/') in s for s in matches):\n\
        \            raise RuntimeError('Expected top-resumed package is absent: ' + expected)\n\n    def wait(self, action,
        description, seconds=75):\n        deadline = time.monotonic() + seconds\n        last = None\n        while time.monotonic()
        < deadline:\n            try:\n                value = action()\n                if value:\n                    return
        value\n            except RuntimeError as e:\n                last = e\n            time.sleep(3)\n        raise RuntimeError('Timed
        out waiting for ' + description + (' (' + str(last) + ')' if last else ''))\n\n    def root_setup(self):\n       \
        \ self.identity()  # BEFORE any privilege escalation or installation\n        if not self.apk.is_file() or self.apk.stat().st_size
        < 1_000_000:\n            raise RuntimeError('Pinned research APK is missing')\n        if self.requester_or_unavailable():\n\
        \            raise RuntimeError('Emulator already has an unexpected Magisk manager binding')\n        self.original_present
        = 'package:' in self.adb('pm path ' + ORIGINAL)\n        if not self.original_present:\n            raise RuntimeError('R8
        research manager is not installed')\n        self.cmd(['adb', 'root'], timeout=35, output='adb_root.txt')\n      \
        \  self.cmd(['adb', 'wait-for-device'], timeout=60)\n        if self.adb('id -u') != '0':\n            raise RuntimeError('ADB
        root did not activate on this official AVD')\n        self.mark('ADB_ROOT')\n        # Official pinned Magisk script
        (no third-party emulation root helper).\n        self.root_setup_started = True\n        self.cmd(['python3', 'build.py',
        'emulator', str(self.workspace / 'alpha_31100.apk')], timeout=240,\n                 cwd=self.workspace / 'magisk',
        output='alpha_31100_avd_setup.txt')\n        self.cmd(['adb', 'wait-for-device'], timeout=60)\n        version = self.adb('/data/adb/magisk/magisk
        -V')\n        signature = self.adb('/data/adb/magisk/magisk -v')\n        if version != '31100' or 'alpha' not in
        signature.lower():\n            raise RuntimeError('Actual Alpha 31100 daemon NOT running: '+repr((version,signature)))\n\
        \        self.mark('ALPHA_DAEMON_31100')\n        self.mark('MAGISK_DAEMON_31100')\n        (self.report / 'alpha_runtime_identity.json').write_text(json.dumps({'version_code':version,\n\
        \            'version':signature, 'backend':'actual vvb2060 Alpha 31100 APK native binaries',\n            'research_package':ORIGINAL,
        'phone_modified':False},indent=2)+'\\n')\n        self.ensure_su('MAGISK_SU')\n        self.wait_for_framework() \
        \ # Alpha APK bootstraps its actual native binaries in the emulator\n        if 'package:' not in self.adb('pm path
        io.github.vvb2060.magisk',check=False):\n            raise RuntimeError('Actual Alpha 31100 manager package missing
        after bootstrap')\n        if 'package:' not in self.adb('pm path '+ORIGINAL,check=False):\n            raise RuntimeError('Research
        APK was replaced by Alpha installer')\n        self.mark('ALPHA_RESEARCH_COEXISTENCE')\n\n    def authorize_research_alpha_avd_only(self):\n\
        \        \"\"\"Grant the already installed research app SU on the disposable Alpha AVD.\n\n        Alpha 31.1 no longer
        opens an interactive SU popup. Prior R11.8 logcat showed\n        `su: request rejected (10174)` and the app showed
        Magisk Not Installed.\n        This test explicitly provisions the app UID on an isolated QEMU instance.\n       \
        \ It never changes the Alpha release binary, the research APK, or a phone.\n        \"\"\"\n        required=('AVD_ONLY','ADB_ROOT','ALPHA_DAEMON_31100','MAGISK_SU',\n\
        \                  'ANDROID_FRAMEWORK_RESTORED','ALPHA_RESEARCH_COEXISTENCE')\n        if not all(self.stages.get(x)
        for x in required):\n            raise RuntimeError('R118.1: Alpha AVD and backend prerequisites missing')\n     \
        \   device={key:self.adb('getprop '+key) for key in EXPECTED}\n        if any(device.get(key)!=expected for key,expected
        in EXPECTED.items()):\n            raise RuntimeError('R118.1: refusing SU provisioning outside API33 x86_64 QEMU')\n\
        \        if self.adb('id -u') != '0':\n            raise RuntimeError('R118.1: ADB root not actually active in QEMU')\n\
        \        if 'package:' not in self.adb('pm path '+ORIGINAL):\n            raise RuntimeError('R118.1: research APK
        not installed, refusing change')\n        if 'package:' not in self.adb('pm path io.github.vvb2060.magisk'):\n   \
        \         raise RuntimeError('R118.1: actual Alpha Manager not present')\n        props=self.adb('dumpsys package
        '+ORIGINAL, output='r1181_research_pkg_before.txt')\n        uid_match=re.search(r'\\buserId=(\\d+)',props)\n    \
        \    if not uid_match:\n            raise RuntimeError('R118.1: cannot establish actual research-app UID')\n     \
        \   uid=int(uid_match.group(1))\n        if not 10000<=uid<=99999:\n            raise RuntimeError('R118.1: app UID
        outside verified single-user range')\n        magisk='/data/adb/magisk/magisk'\n        alpha_version=self.adb(magisk+'
        -v')\n        if 'alpha' not in alpha_version.lower() or self.adb(magisk+' -V')!='31100':\n            raise RuntimeError('R118.1:
        installed daemon is not the pinned Alpha 31100')\n        sql=f'REPLACE INTO policies (uid,policy,until,logging,notification)
        VALUES ({uid},2,0,1,1);'\n        self.adb(magisk+' --sqlite '+shlex.quote(sql), output='r1181_su_policy_write.txt')\n\
        \        policy=self.adb(magisk+' --sqlite '+shlex.quote(f'SELECT policy FROM policies WHERE uid={uid};'),\n     \
        \                   output='r1181_su_policy_read.txt')\n        if 'policy=2' not in policy and policy.strip()!='2':\n\
        \            raise RuntimeError('R118.1: Alpha did not persist the app-specific SU grant')\n        (self.report/'R1181_AVD_SU_GRANT.json').write_text(json.dumps({\n\
        \            'scope':'ANDROID_13_X86_64_QEMU_ONLY','research_package':ORIGINAL,\n            'package_uid':uid,'alpha_daemon_version':alpha_version,'authorized_policy':2,\n\
        \            'ui_root_not_yet_proven':True,'boot_writes':False,\n            'physical_device_modified':False},indent=2)+'\\\
        n')\n        self.mark('ALPHA_RESEARCH_APP_SU_POLICY')\n        self.adb('am force-stop '+ORIGINAL)\n        self.adb('am
        start -W -n '+ACTIVITY,timeout=60)\n        self.focus(ORIGINAL)\n        # This is diagnostic, NOT a substitute for
        the original module/root UI tests.\n        self.ui_dump('r1181_after_authorization_home')\n\n    def wait_for_framework(self,
        *, timeout_seconds=180, poll_seconds=3):\n        \"\"\"After official avd_setup.sh stop/start, wait for system_server
        services.\n\n        'adb wait-for-device' only proves adbd is responding, NOT that Android's\n        ActivityManager/PackageManager
        have finished restarting. Never issue\n        UI interactions before both service binders and boot have recovered.\n\
        \        \"\"\"\n        if not self.stages.get('AVD_ONLY') or not self.stages.get('ADB_ROOT'):\n            raise
        RuntimeError('Framework wait requires verified AVD and ADB root')\n        deadline = time.monotonic() + timeout_seconds\n\
        \        log = self.report / 'framework_wait.jsonl'\n        consecutive = 0\n        attempts = 0\n        probes
        = (\n            ('zygote', 'getprop init.svc.zygote'),\n            ('boot', 'getprop sys.boot_completed'),\n   \
        \         ('activity', 'service check activity'),\n            ('package', 'service check package'),\n           \
        \ ('manager', 'pm path ' + ORIGINAL),\n        )\n        last = {}\n        while time.monotonic() < deadline:\n\
        \            attempts += 1\n            status = {}\n            for name, remote in probes:\n                try:\n\
        \                    status[name] = self.adb(remote, check=False, timeout=12)\n                except RuntimeError
        as exc:\n                    status[name] = 'ADB_ERROR: ' + str(exc)[:220]\n            ready = (\n              \
        \  status['zygote'] == 'running'\n                and status['boot'] == '1'\n                and 'Service activity:
        found' in status['activity']\n                and 'Service package: found' in status['package']\n                and
        'package:' in status['manager']\n            )\n            consecutive = consecutive + 1 if ready else 0\n      \
        \      last = status\n            with log.open('a') as f:\n                f.write(json.dumps({'attempt': attempts,
        'ready': ready,\n                                    'stable_passes': consecutive, 'services': status}) + '\\n')\n\
        \            if consecutive >= 2:\n                self.mark('ANDROID_FRAMEWORK_RESTORED')\n                return\n\
        \            time.sleep(poll_seconds)\n        try:\n            self.adb('logcat -d -t 400', timeout=35, check=False,\n\
        \                     output='framework_recovery_logcat.txt')\n        except RuntimeError:\n            pass\n  \
        \      raise RuntimeError('Android services not recovered after official Magisk AVD stop/start'\n                \
        \           ' (activity, package, boot); see framework_wait.jsonl. '\n                           + json.dumps(last))\n\
        \n    def requester_or_unavailable(self):\n        # Before activating the daemon its database might not exist.\n\
        \        return self.adb('test -f /data/adb/magisk.db && echo present || true') == 'present'\n\n    def ensure_su(self,
        stage):\n        result = self.adb('/debug_ramdisk/su -c id', timeout=40)\n        if 'uid=0(' not in result:\n  \
        \          raise RuntimeError('Magisk SU did not grant uid=0: ' + result)\n        self.mark(stage)\n\n    def enable_gui(self):\n\
        \        # The official Magisk AVD setup reinstalls the research APK and restarts\n        # Android. R8's earlier
        POST_NOTIFICATIONS grant is not necessarily\n        # retained; in R9.3 the real permission-controller dialog blocked
        focus.\n        # Never grant anything until the isolated rooted emulator is verified.\n        required = ('AVD_ONLY',
        'ADB_ROOT', 'MAGISK_DAEMON_31100',\n                    'ANDROID_FRAMEWORK_RESTORED')\n        if not all(self.stages.get(stage)
        for stage in required):\n            raise RuntimeError('R9 notification regrant requires verified rooted AVD and
        framework')\n        self.adb('pm grant ' + ORIGINAL + ' android.permission.POST_NOTIFICATIONS',\n               \
        \  output='r94_notification_grant.txt')\n        self.adb('am force-stop ' + ORIGINAL)\n        self.adb('am start
        -W -n ' + ACTIVITY, timeout=50)\n        try:\n            self.wait(lambda: self._focus_is(ORIGINAL),\n         \
        \             'Magisk foreground after Android 13 notification permission grant', seconds=60)\n        except RuntimeError:\n\
        \            # Preserve what is actually covering the app, never fake a GUI_PASS.\n            self.adb('dumpsys activity
        activities', check=False,\n                     output='r94_focus_failure_activities.txt')\n            raise\n  \
        \      self.focus(ORIGINAL)\n        xml = self.ui_dump('root_home')\n        if 'Hide the Magisk app' not in xml:\n\
        \            raise RuntimeError('Root manager-hiding button is not displayed in active Magisk UI')\n        self.mark('HIDE_BUTTON')\n\
        \        self.tap(xml, 'Hide the Magisk app')\n        dialog = self.ui_dump('hide_dialog')\n        find_node(dialog,
        'New name')\n        find_node(dialog, 'OK')\n        self.mark('HIDE_DIALOG')\n        self.tap(dialog, 'OK')\n\n\
        \    def wait_stub_restore_ui(self):\n        \"\"\"Do not mistake a blank first Compose frame for a working hidden
        manager.\n\n        Capture repeated real UI hierarchy snapshots; never synthesize the button.\n        The title
        only counts if Android actually exposes a tappable node.\n        \"\"\"\n        label = 'Restore the Magisk app'\n\
        \        attempts=[]\n        for index in range(1, 7):\n            xml = self.ui_dump(f'stub_probe_{index:02d}')\n\
        \            (self.report / 'stub_home.xml').write_text(xml)\n            root = ET.fromstring(xml)\n            labels
        = sorted(set(t for node in root.iter('node')\n                                for t in (node.get('text', ''),node.get('content-desc',
        ''))\n                                if t))\n            probe={'index':index, 'total_nodes':len(list(root.iter('node'))),\n\
        \                   'visible_labels':labels[:35], 'has_restore_button':False}\n            try:\n                find_node(xml,
        label)\n                probe['has_restore_button']=True\n                attempts.append(probe)\n               \
        \ (self.report/'R96_STUB_UI_READINESS.json').write_text(json.dumps(attempts,indent=2)+'\\n')\n                return
        xml\n            except RuntimeError:\n                attempts.append(probe)\n                (self.report/'R96_STUB_UI_READINESS.json').write_text(json.dumps(attempts,indent=2)+'\\\
        n')\n                if index < 6:\n                    time.sleep(5)\n        # Preserve diagnostics before the unconditional
        emulator cleanup.\n        self.adb('dumpsys activity activities',output='r96_blank_ui_activities.txt',check=False)\n\
        \        self.adb('logcat -d -v threadtime',timeout=95,output='r96_blank_ui_logcat.txt',check=False)\n        self.adb('screencap
        -p /sdcard/r96_blank_ui.png',check=False)\n        self.cmd(['adb','pull','/sdcard/r96_blank_ui.png',str(self.report/'r96_blank_ui.png')],check=False)\n\
        \        raise RuntimeError('R9.6: hidden manager has no Restore UI after six real snapshots; see R96_STUB_UI_READINESS.json
        and Android diagnostics')\n\n    def capture_restore_state(self, phase):\n        \"\"\"Preserve the real post-confirm
        state BEFORE the safety rollback.\n\n        Never mutate manager packages or database here. This method is\n    \
        \    diagnostic only and must not convert a failed transaction into PASS.\n        \"\"\"\n        if not self.stages.get('AVD_ONLY')
        or not self.stages.get('RESTORE_DIALOG'):\n            return\n        probes = (\n            ('original_package',
        'pm path ' + ORIGINAL),\n            ('hidden_package', 'pm path ' + (self.target or 'invalid.package')),\n      \
        \      ('activities', 'dumpsys activity activities'),\n            ('app_restore_trace', \"logcat -d -v brief -s 'R97Restore:*'\"\
        ),\n        )\n        for name, command in probes:\n            try:\n                self.adb(command, timeout=35,
        check=False,\n                         output=f'r97_{phase}_{name}.txt')\n            except Exception as e:\n   \
        \             (self.report / f'r97_{phase}_{name}_error.txt').write_text(str(e) + '\\n')\n        try:\n         \
        \   value = self.requester()\n            (self.report / f'r97_{phase}_requester.json').write_text(\n            \
        \    json.dumps({'still_bound': bool(value), 'matches_hidden_package': value == self.target},\n                  \
