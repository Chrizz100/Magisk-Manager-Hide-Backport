                 '        gradlePluginPortal()\n'
                 '        google()\n'
                 '        mavenCentral()\n'
                 '    }\n'
                 '}\n\n')
        new_data=(prelude+text).encode("utf-8")
        staged[p]=new_data
        changes.append({"path":rel,"insertions":1,"original_sha256":hashlib.sha256(data).hexdigest(),"new_sha256":hashlib.sha256(new_data).hexdigest()})
        assert len(staged)==3
        for p, data in staged.items():
            p.write_bytes(data)
        status=subprocess.check_output(["git","-C",str(repo),"diff","--name-only"],text=True).splitlines()
        # app/settings.gradle.kts was ALREADY tracked as modified in R5.
        # Enforce the complete expected tracked-change set, including existing paths.
        expected_status = pre_modified | {x["path"] for x in changes}
        if set(status) != expected_status:
            raise SystemExit("R1355_UNEXPECTED_MODIFIED_FILE: "+repr(status))
        subprocess.run(["git","-C",str(repo),"diff","--check"],check=True)
        report=Path("reports/R1355_GRADLE_CENTRAL_MIRROR.json")
        report.parent.mkdir(parents=True,exist_ok=True)
        report.write_text(json.dumps({"purpose":"Maven Central 429 mitigation only","upstream_git_head":subprocess.check_output(["git","-C",str(repo),"rev-parse","HEAD"],text=True).strip(),"mirror":mirror,"preserved_fallback":["mavenCentral()","gradlePluginPortal()","google()"],"changes":changes,"apk_source_modified":False,"native_source_modified":False},indent=2)+"\n")
        print("R13.5.5 Gradle mirror priority; real R5 source already modified: PASS")
        PY_R1355_MIRROR
        # Android and native sources remain untouched; only CI repository endpoints have been prioritized.
        # Retry only verified temporary HTTP/network failures while keeping Gradle's downloads.
        # Do not turn compiler errors into retries or report a false success.
