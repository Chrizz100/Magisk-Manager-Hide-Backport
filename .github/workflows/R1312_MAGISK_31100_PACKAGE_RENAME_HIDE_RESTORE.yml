        def replace_between(s: str, start: str, end: str, replacement: str, name: str) -> str:
            if s.count(start) != 1 or s.count(end) != 1:
                raise ValueError(f"{name}: expected exactly one anchor pair (start={s.count(start)}, end={s.count(end)})")
            a=s.index(start)
            b=s.index(end)
            if b <= a:
                raise ValueError(f"{name}: reversed anchors")
            return s[:a]+replacement+s[b:]

        def patch(root: Path, report: Path) -> dict:
            root=root.resolve()
            migration=root/'app/core/src/main/java/com/topjohnwu/magisk/core/tasks/AppMigration.kt'
            vm=root/'app/apk/src/main/java/com/topjohnwu/magisk/ui/home/HomeViewModel.kt'
            orig={p:p.read_text(encoding='utf-8') for p in [migration,vm]}
            if 'r133MatchingBackend()' not in orig[migration] or 'ManagerPackageNames' not in orig[migration]:
                raise ValueError('R13.3 base not detected; refuse to modify unrelated Magisk source')
            if orig[migration].count(HIDE_END) != 1:
                raise ValueError('R13.3 backend guard DEFINITION not found exactly once')
            if orig[migration].count('    suspend fun finalizeConcealmentAvd(') != 1:
                raise ValueError('R13.3 final concealment missing')
            if orig[migration].count('    suspend fun restoreApp(') != 1:
                raise ValueError('R13.3 restore method missing')
            if not (orig[migration].index(HIDE_START) < orig[migration].index(HIDE_END) < orig[migration].index('    suspend fun finalizeConcealmentAvd(')):
                raise ValueError('Unexpected R13.3 method ordering: refuse wide method replacement')
            if 'fun hideManager(label: String)' not in orig[vm]:
                raise ValueError('Existing R13.4 hide UI missing')
            # R13.5.2 accidentally deleted this public UI method, breaking HomeScreen Kotlin compilation.
            # Require the exact method order and an unchanged suffix *before* any mutation.
            if orig[vm].count('    fun finalizeConcealmentAvd() {') != 1:
                raise ValueError('R13.4 HomeViewModel final-concealment method missing or duplicated')
            if orig[vm].count('    fun restoreManager() {') != 1:
                raise ValueError('R13.4 HomeViewModel restore method missing or duplicated')
            if orig[vm].count(VM_END) != 1 or orig[vm].count(VM_START) != 1:
                raise ValueError('R13.4 precise HomeViewModel boundary not found exactly once')
            if not (orig[vm].index(VM_START) < orig[vm].index(VM_END) < orig[vm].index('    fun finalizeConcealmentAvd() {') < orig[vm].index('    fun restoreManager() {')):
                raise ValueError('Unexpected real HomeViewModel method order')
            home=root/'app/apk/src/main/java/com/topjohnwu/magisk/ui/home/HomeScreen.kt'
            if home.is_file():
                ui=home.read_text(encoding='utf-8')
                if ui.count('viewModel::finalizeConcealmentAvd') != 1 or 'viewModel.hideManager(label)' not in ui or 'viewModel.restoreManager()' not in ui:
                    raise ValueError('HomeScreen/HomViewModel call-contract mismatch')
            if 'R135MagiskHide' in orig[migration] or 'R135MagiskHide' in orig[vm]:
                raise ValueError('R13.5 already applied')
            # All changes planned before writing either file.
            new_migration=replace_between(orig[migration],HIDE_START,HIDE_END,NEW_HIDE,'AppMigration.kt')
            new_vm=replace_between(orig[vm],VM_START,VM_END,NEW_VM,'HomeViewModel.kt')
            for invariant in ['r133MatchingBackend()', 'Config.suManager = target', 'Config.suManager = ""', 'STAGE1_DONE_ORIGINAL_RETAINED']:
                assert invariant in new_migration, invariant
            # The missing R13.3 helper caused the R13.5.1 Kotlin compilation failure.
            # Verify full helper suffix bytes are preserved (not merely its call sites).
            if new_migration.count(HIDE_END) != 1 or new_migration.split(HIDE_END, 1)[1] != orig[migration].split(HIDE_END, 1)[1]:
                raise ValueError('R13.3 backend guard and downstream methods altered')
            if new_migration.count('r133MatchingBackend()') != orig[migration].count('r133MatchingBackend()'):
                # NEW_HIDE replaces old patchAndHide, both must contain one call.
                raise ValueError('R13.3 guard call count unexpectedly changed')
            # The dangerous final concealment step remains the independently confirmed R13.4 code.
            for inv in ['suspend fun finalizeConcealmentAvd(', 'pm uninstall -k --user 0 $APP_PACKAGE_NAME', 'suspend fun restoreApp(']:
                assert inv in new_migration and new_migration.count(inv)==orig[migration].count(inv),inv
            assert orig[migration].split(HIDE_END,1)[1] == new_migration.split(HIDE_END,1)[1]
            # This exact preservation check covers the public ViewModel method that was lost in R13.5.2.
            if new_vm.split(VM_END,1)[1] != orig[vm].split(VM_END,1)[1]:
                raise ValueError('HomeViewModel final concealment/restore suffix changed')
            for method in ('    fun hideManager(label: String) {', '    fun finalizeConcealmentAvd() {', '    fun restoreManager() {'):
                if new_vm.count(method) != 1 or orig[vm].count(method) != 1:
                    raise ValueError('HomeViewModel method missing or duplicated: '+method.strip())
            if 'AppMigration.finalizeConcealmentAvd(context)' not in new_vm:
                raise ValueError('HomeViewModel final-concealment link lost')
            assert 'showToast(CoreR.string.failure)' not in new_vm.split('fun hideManager(',1)[1].split(VM_END,1)[0]
            out={
               'revision':'R13.5.3', 'base':'R13.4 (Magisk 31.1, 31100, exact R13.3 source) ',
               'purpose':'manager-hide stage-1 preflight and diagnostic repair',
               'not_changed':['native MagiskD signature trust', 'stub certificate checks', 'final concealment', 'original Magisk installer', 'boot image'],
               'device_tested':False,'signature_upgrade_possible_without_original_key':False,
               'files':{str(p.relative_to(root)):{'old_sha256':hashlib.sha256(orig[p].encode()).hexdigest(),'new_sha256':hashlib.sha256(new.encode()).hexdigest()} for p,new in [(migration,new_migration),(vm,new_vm)]},
            }
            for p,new in [(migration,new_migration),(vm,new_vm)]:p.write_text(new,encoding='utf-8')
            report.parent.mkdir(parents=True,exist_ok=True)
            report.write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
            return out

        if __name__=='__main__':
            if len(sys.argv)!=3:raise SystemExit('Usage: r135_patch.py MAGISK_DIR REPORT.json')
