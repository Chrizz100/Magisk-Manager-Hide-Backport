            restore=m.split('suspend fun restoreApp(context: Context): Boolean {',1)[1].split('    suspend fun upgradeStub(context: Context, apk: File): Intent? {',1)[0]
            ordered(stage2,'if (!r139SameDaemon(context))','val su = Shell.cmd("id -u")')
            ordered(stage2,'HIDDEN_MANAGER_SU_NOT_GRANTED','val original = File(')
            ordered(stage2,'ORIGINAL_AND_RETAINED_APK_NOT_IDENTICAL','val staged = File(')
            ordered(stage2,'ATOMIC_BACKUP_FAILED','val originalBefore = Shell.cmd(')
            ordered(stage2,'BACKUP_PIN_VERIFY_FAILED','val rootExisting = Shell.cmd(')
            ordered(stage2,'ROOT_RECOVERY_HASH_MISMATCH','val originalBefore = Shell.cmd(')
            ordered(stage2,'PM_PRECHECK_FAILED_OR_MANAGER_UNBOUND','val removal = Shell.cmd(')
            ordered(stage2,'"RECOVERABLE_BACKUP_AND_SU_VERIFIED"','val removal = Shell.cmd(')
            ordered(stage2,'val removal = Shell.cmd(','val oldAfter = Shell.cmd(')
