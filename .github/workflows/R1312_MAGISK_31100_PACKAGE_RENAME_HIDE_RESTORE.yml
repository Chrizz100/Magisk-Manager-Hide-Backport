    - name: R13.9 - Remove dangerous original-uninstall and enforce actual running native digest
      shell: bash
      run: |
        set -euo pipefail
        cat > R139_SAFE_SOURCE_PATCH.py <<'R139_SCRIPT_EOF'
        #!/usr/bin/env python3
        """R13.9: fail-closed native runtime gate and removal of destructive package removal.

        Applied to the exact reconstructed R13.8 Magisk 31100 source tree after R13.8
        source provenance audit, before *native* and Android compilation.  No device I/O.
        """
        from __future__ import annotations
        import hashlib
        import json
        import re
        import sys
        from pathlib import Path

        SOURCE_EXPECTED = '0972f67d97f9b6302b67c5171283330c74114b4a'
        ASSET = 'r139_expected_arm64_magisk.sha256'

        # Unlike a superficial Magisk numeric-version check, the file digest of the
        # actual root-process executable is tied to exactly this APK's corresponding
        # native binary.  The script generating this asset runs BETWEEN native compile
        # and app packaging.  The check is intentionally fail-closed on inaccessible
        # /proc, denied SU, zero/multiple inconsistent daemon IDs, or an unmatched SHA.
        PROBE = r'''    /** R13.9: require the exact running Magisk daemon, not just version 31100. */
            private suspend fun r139SameDaemon(context: Context): Boolean {
                return try {
                    val expected = context.assets.open("r139_expected_arm64_magisk.sha256")
                        .bufferedReader().use { it.readText().trim() }
                    if (!expected.matches(Regex("[0-9a-f]{64}"))) {
                        android.util.Log.e("R139MagiskHide", "MISSING_NATIVE_DIGEST_ASSET")
                        return false
                    }
                    val ids = Shell.cmd("pidof magiskd").await()
                    if (!ids.isSuccess) return false
                    val pids = ids.out.joinToString(" ").trim().split(Regex("\\s+"))
                        .filter { it.matches(Regex("[0-9]{1,9}")) }.distinct()
                    if (pids.isEmpty() || pids.size > 20) return false
                    for (pid in pids) {
                        val observed = Shell.cmd("sha256sum /proc/$pid/exe").await()
                        if (!observed.isSuccess || observed.out.isEmpty()) return false
                        val actual = observed.out.first().trim().substringBefore(' ').lowercase()
                        if (actual != expected) {
                            android.util.Log.e("R139MagiskHide", "RUNNING_DAEMON_DIGEST_MISMATCH")
                            return false
                        }
                    }
                    android.util.Log.i("R139MagiskHide", "RUNNING_DAEMON_DIGEST_VERIFIED")
                    true
                } catch (e: Exception) {
                    android.util.Log.e("R139MagiskHide", "DAEMON_PROBE_ERROR", e)
                    false
                }
            }

        '''

        SAFE_FINALIZE = '''    /**
             * R13.9: the old 11.4/13.3 implementation removed the user's original
             * manager.  No destructive package operation belongs in phone code.
             * Keep the entrypoint for preexisting ViewModel references but fail closed.
             * Full concealment cannot be claimed until a safely reversible on-device
             * path is validated independently.
             */
            suspend fun finalizeConcealmentAvd(context: Context): Boolean {
                android.util.Log.e("R139MagiskHide", "DESTRUCTIVE_CONCEALMENT_DISABLED_ORIGINAL_RETAINED")
                return false
            }

        '''

        ANCHOR_BEFORE_PROBE = '    /** R13.5: state is diagnostic only; never represents successful root. */\n'
        ANCHOR_STAGE1 = '        if (!r133MatchingBackend()) return r135HideFail("PRECHECK_DAEMON_OR_ROOT_MISMATCH")\n'
        FINALIZE_START = '    suspend fun finalizeConcealmentAvd(context: Context): Boolean {\n'
        FINALIZE_END = '    private fun r114Digest(file: File): ByteArray {\n'


        def sha(s: str) -> str:
            return hashlib.sha256(s.encode('utf-8')).hexdigest()


        def once(s: str, old: str, new: str, key: str) -> str:
            count = s.count(old)
            if count != 1:
                raise ValueError(f'{key}: expected exactly one source anchor, got {count}')
            return s.replace(old, new, 1)


        def fix(root: Path, report: Path):
            root = root.resolve()
            p = root/'app/core/src/main/java/com/topjohnwu/magisk/core/tasks/AppMigration.kt'
            ui = root/'app/apk/src/main/java/com/topjohnwu/magisk/ui/home/HomeScreen.kt'
            native = root/'native/src/core/package.rs'
            for f in (p, ui, native):
                if not f.is_file(): raise ValueError('R139 missing pinned source: '+str(f))
            old = p.read_text(encoding='utf-8')
            home = ui.read_text(encoding='utf-8')
            n = native.read_text(encoding='utf-8')
            if not all(marker in n for marker in ('check_repackaged_manager',
                                                  'get_repackaged_manager_pkg',
                                                  'dynamic manager signature mismatch')):
                raise ValueError('R139 expected R3 native fork not present')
            if old.count('    suspend fun patchAndHide(') != 1 or 'STAGE1_DONE_ORIGINAL_RETAINED' not in old:
                raise ValueError('R139 expected R13.5.3 source not present')
            if old.count(FINALIZE_START) != 1 or old.count(FINALIZE_END) != 1:
                raise ValueError('R139 legacy finalization method anchors missing')
            a = old.index(FINALIZE_START)
            b = old.index(FINALIZE_END)
            if not (0 < a < b): raise ValueError('R139 legacy method order invalid')
            destructive = old[a:b]
            if destructive.count('pm uninstall -k --user 0 $APP_PACKAGE_NAME') != 1:
                raise ValueError('R139 risk was not found exactly once; check actual source')
            if 'Info.isEmulator' in destructive:
                raise ValueError('R139 expects dangerous phone-enabled R13.3 path, not original AVD-only')
            new = old[:a] + SAFE_FINALIZE + old[b:]
            new = once(new, ANCHOR_BEFORE_PROBE, PROBE+ANCHOR_BEFORE_PROBE,
                       'exact original R13.5 placement')
            new = once(new, ANCHOR_STAGE1,
                       ANCHOR_STAGE1 +
                       '        if (!r139SameDaemon(context)) return r135HideFail("PRECHECK_NATIVE_DAEMON_NOT_ATTESTED")\n',
                       'exact stage 1 runtime gate placement')
            # R13.3 incorrectly trusted a matching version.  Keep the version
            # restriction, but never use it as proof of the native port.
            if new.count('!r139SameDaemon(context)') != 1:
                raise AssertionError('R139 native guard not installed exactly once')
            if 'pm uninstall' in new or 'cmd package uninstall' in new:
                raise AssertionError('R139 destructive app source remains')
            # Remove the second-stage UI control without removing Restore or first-stage Hide.
            pat = (r'(?m)^[ \t]*if \(isRunningAsStub\) \{\n'
                   r'[ \t]*Button\(onClick = viewModel::finalizeConcealmentAvd\) \{\n'
                   r'[ \t]*Text\(if \(Info\.isEmulator\) "Complete Hide \(AVD only\)" else "Complete Hide"\)\n'
                   r'[ \t]*\}\n[ \t]*\}\n')
            clean, count = re.subn(pat,
                                   '                // R13.9: unsafe original-package removal is disabled; Restore remains.\n',
                                   home)
            if count != 1:
                raise ValueError(f'R139 expected one final Hide UI control, found {count}')
            for marker in ('viewModel.hideManager(label)', 'viewModel.restoreManager()'):
                if marker not in clean: raise ValueError('R139 preserved UI control not found: '+marker)
            if 'viewModel::finalizeConcealmentAvd' in clean:
                raise ValueError('R139 unsafe UI action remains')
            # Failure before writing is intentional; no partial edits.
            staged={p:new, ui:clean}
            modified={}
            for file, value in staged.items():
                original = file.read_text(encoding='utf-8')
                modified[str(file.relative_to(root))]={'before_sha256':sha(original),'after_sha256':sha(value)}
            for file, value in staged.items(): file.write_text(value,encoding='utf-8')
            o = {
              'revision':'R13.9','base':SOURCE_EXPECTED,
              'native_guard':'ALL_RUNNING_MAGISKD_EXE_SHA256_EQ_APP_EMBEDDED_BUILD_SHA256',
              'upstream_version_string_alone_is_not_attestation':True,
              'original_package_uninstall_in_hide_source':False,
              'final_concealment_action_exposed':False,
              'original_manager_preserved':True,
              'root_requester_change_blocked_until_native_digest_confirmed':True,
              'phone_daemon_already_attested':False,
              'real_device_hide_restored':False,
              'phone_install_approved':False,
              'flash_approved':False,
              'files':modified,
            }
            report.parent.mkdir(parents=True,exist_ok=True)
            report.write_text(json.dumps(o,indent=2)+'\n')
            return o

        if __name__=='__main__':
            if len(sys.argv) != 3: raise SystemExit('Usage: R139_SAFE_SOURCE_PATCH.py MAGISK_SRC REPORT_JSON')
            o=fix(Path(sys.argv[1]),Path(sys.argv[2]))
            print('R13.9 SOURCE PASS: removed unsafe final concealment, added exact daemon gate; release HOLD')
        R139_SCRIPT_EOF
        python3 -m py_compile R139_SAFE_SOURCE_PATCH.py
        python3 R139_SAFE_SOURCE_PATCH.py magisk reports/R139_SOURCE_REPAIR.json
        git -C magisk diff --check
