            assert m.count('suspend fun restoreApp(context: Context)')==1
            assert m.count('suspend fun upgradeStub(context: Context, apk: File): Intent?')==1, 'R11.4 real restore exit missing'
            assert m.index('suspend fun restoreApp(context: Context)') < m.index('suspend fun upgradeStub(context: Context, apk: File): Intent?')
