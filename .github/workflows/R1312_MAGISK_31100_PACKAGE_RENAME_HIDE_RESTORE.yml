    - name: R13.12 - Original Magisk 30 random package Hide and native signature-safe restore
      shell: bash
      run: |
        set -euo pipefail
        cat > R1312_ORIGINAL_HIDE_SAFE_PORT.py <<'R1312_SOURCE_EOF'
        #!/usr/bin/env python3
        """R13.12: retain the original Magisk v30 package-repack/restore contract.
        
        Applied AFTER R13.10.1 source patches and BEFORE the native/app builds.
        
        The previous R13.10 implementation added an extra original-app removal
        operation absent from v30 AppMigration.patchAndHide(); the user explicitly
        requires retaining the working original/root as an independent fallback.
        This patch never changes the installed phone (it only edits CI source files).
        """
        from __future__ import annotations
        import hashlib, json, sys
        from pathlib import Path
        from R1310_RESTORE_TRANSACTIONAL_HIDE import FINALIZE_NEW, UI_ACTIVE
        
        MIGRATION = 'app/core/src/main/java/com/topjohnwu/magisk/core/tasks/AppMigration.kt'
        SCREEN = 'app/apk/src/main/java/com/topjohnwu/magisk/ui/home/HomeScreen.kt'
        NATIVE = 'native/src/core/package.rs'
        
        # A legacy UI method is retained because HomeViewModel references it, but it
        # DOES NOT delete, disable, hide the icon of, or replace the original app.
        # The package-name change happens in the v30 patchAndHide() first stage.
        SAFE_FINALIZER = '''    /**
             * R13.12: read-only second-stage proof. The original Magisk v30
             * package migration installs a new random-name stub and binds it in
             * magiskd; it does not need a second original-app uninstall action.
             * Preserve the existing app and its Root grant as a fallback.
             */
            suspend fun finalizeConcealmentAvd(context: Context): Boolean {
                if (!isRunningAsStub || context.packageName == APP_PACKAGE_NAME ||
                    Const.USER_ID != 0 || Config.suManager != context.packageName ||
                    !r133MatchingBackend()) {
                    android.util.Log.e("R1312Hide", "HIDDEN_MANAGER_NOT_AUTHENTICATED")
                    return false
                }
                if (!r139SameDaemon(context)) {
                    android.util.Log.e("R1312Hide", "RUNNING_DAEMON_NOT_ATTESTED")
                    return false
                }
                val root = Shell.cmd("id -u").await()
                if (!root.isSuccess || root.out.none { it.trim() == "0" }) {
                    android.util.Log.e("R1312Hide", "HIDDEN_MANAGER_ROOT_UNAVAILABLE")
                    return false
                }
                val original = Shell.cmd("pm path $APP_PACKAGE_NAME").await()
                val hidden = Shell.cmd("pm path ${context.packageName}").await()
                val valid = original.isSuccess && hidden.isSuccess &&
                    original.out.any { it.startsWith("package:") } &&
                    hidden.out.any { it.startsWith("package:") }
                android.util.Log.i("R1312Hide", if (valid)
                    "HIDDEN_PACKAGE_ACTIVE_ORIGINAL_PRESERVED" else "PM_OR_PACKAGE_STATE_UNCERTAIN")
                return valid
            }
        
        '''
        
        REMOVED_UI='''                // R13.12: Magisk v30 Hide is the first-stage repackaging action.
                        // Restore remains available from the hidden app. The original
                        // APK/package is not automatically uninstalled or disabled.
        '''
        
        # Magisk 31.1 package.rs normally uninstalls a mismatched manager. That is
        # hazardous during a signing migration; reject the mismatched certificate
        # without deleting the user's previously working manager. Certificate checks
        # remain fail-closed, never grant UID to a nonmatching APK.
        NATIVE_SIGNATURE_OLD='''    if cert.is_empty() || (!TRUSTED_CERT.is_empty() && cert != TRUSTED_CERT) {
                error!("pkg: APK signature mismatch: {}", apk);
                #[cfg(all(feature = "check-signature", not(debug_assertions)))]
                {
                    uninstall_pkg(cstr!(APP_PACKAGE_NAME));
                    return false;
                }
            }
        '''
        NATIVE_SIGNATURE_SAFE='''    if cert.is_empty() || (!TRUSTED_CERT.is_empty() && cert != TRUSTED_CERT) {
                error!("pkg: APK signature mismatch: {}", apk);
                // R13.12: reject and preserve the installed package; never remove it.
                return false;
            }
        '''
        NATIVE_USE='''#[cfg(all(feature = "check-signature", not(debug_assertions)))]
        use crate::ffi::uninstall_pkg;
        '''
        
        
        def sha(s: str) -> str: return hashlib.sha256(s.encode('utf-8')).hexdigest()
        
        def replace_exact(text: str, before: str, after: str, label: str) -> str:
            if text.count(before) != 1:
                raise ValueError(f'R1312_{label}_ANCHOR_COUNT_{text.count(before)}')
            return text.replace(before, after, 1)
        
        
        def apply(root: Path, report: Path) -> dict:
            files=[root/MIGRATION,root/SCREEN,root/NATIVE]
            if not all(p.is_file() for p in files):
                raise ValueError('R1312_SOURCE_TREE_INCOMPLETE')
            m,ui,n=(p.read_text(encoding='utf-8') for p in files)
            if m.count('suspend fun patchAndHide(')!=1 or m.count('suspend fun restoreApp(')!=1:
                raise ValueError('R1312_HIDE_RESTORE_NOT_UNIQUE')
            if 'genPackageName()' not in m or 'Config.suManager = target' not in m or 'adb_pm_install $repack $target' not in m:
                raise ValueError('R1312_ORIGINAL_RANDOM_PACKAGE_MIGRATION_MISSING')
            if 'r139SameDaemon(context)' not in m or 'PRECHECK_NATIVE_DAEMON_NOT_ATTESTED' not in m:
                raise ValueError('R1312_NATIVE_RUNTIME_GUARD_MISSING')
            if 'check_repackaged_manager' not in n or 'get_repackaged_manager_pkg' not in n or 'cert.as_slice() != TRUSTED_CERT' not in n:
                raise ValueError('R1312_DYNAMIC_CERT_AUTHORIZATION_MISSING')
            m2=replace_exact(m,FINALIZE_NEW,SAFE_FINALIZER,'FINALIZER')
            ui2=replace_exact(ui,UI_ACTIVE,REMOVED_UI,'SECOND_STAGE_UI')
            n2=replace_exact(n,NATIVE_SIGNATURE_OLD,NATIVE_SIGNATURE_SAFE,'ORIGINAL_SIG')
            n2=replace_exact(n2,NATIVE_USE,'','UNINSTALL_IMPORT')
            # Root/restore and backend guards are still required; package and boot
            # modification must be absent from THIS app migration code.
            if any(x in m2 for x in ('pm uninstall','cmd package uninstall','run_uninstaller','boot_patch.sh')):
                raise ValueError('R1312_DESTRUCTIVE_HIDE_SOURCE_REMAINS')
            if 'uninstall_pkg(' in n2 or 'uninstall_pkg;' in n2:
                raise ValueError('R1312_NATIVE_AUTO_UNINSTALL_REMAINS')
            if 'viewModel::finalizeConcealmentAvd' in ui2:
                raise ValueError('R1312_UNNECESSARY_SECOND_STAGE_UI_REMAINS')
            if 'viewModel.hideManager(label)' not in ui2 or 'viewModel.restoreManager()' not in ui2:
                raise ValueError('R1312_HIDE_OR_RESTORE_UI_MISSING')
            if 'r1310_original_backup.apk' not in m2 or 'Config.suManager = ""' not in m2:
                raise ValueError('R1312_RESTORE_FALLBACK_DAMAGED')
            out={p:text for p,text in zip(files,(m2,ui2,n2))}
            summary={str(p.relative_to(root)):{'before':sha(p.read_text(encoding='utf-8')),'after':sha(text)} for p,text in out.items()}
            for p,text in out.items():p.write_text(text,encoding='utf-8')
            data={
                'revision':'R13.12', 'origin':'verified original Magisk 30.0 AppMigration.patchAndHide + v31.1 native pairing',
                'random_package_install_source_retained':True,
                'stub_signed_with_distinct_random_cert':True,
                'user_original_package_uninstall_disabled':True,
                'native_mismatched_signer_rejected_without_auto_uninstall':True,
                'running_daemon_must_match_built_native_for_hide':True,
                'restore_source_retained':True,
                'original_manager_kept_installed':True,
                'physical_device_root_hide_restore_test':'NOT_EXECUTED',
                'phone_release':'HOLD',
                'files':summary
            }
            report.parent.mkdir(parents=True,exist_ok=True)
            report.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
            print('R13.12 native + random-package Hide + Restore source repair PASS (phone device HOLD)')
            return data
        
        if __name__=='__main__':
            if len(sys.argv)!=3:raise SystemExit('Usage: python3 R1312_ORIGINAL_HIDE_SAFE_PORT.py MAGISK_ROOT REPORT_JSON')
            apply(Path(sys.argv[1]),Path(sys.argv[2]))
        R1312_SOURCE_EOF
        python3 -m py_compile R1312_ORIGINAL_HIDE_SAFE_PORT.py
        python3 R1312_ORIGINAL_HIDE_SAFE_PORT.py magisk reports/R1312_SOURCE_REPAIR.json
        git -C magisk diff --check
    - name: R13.12 - Strict source audit of repackaging, restore and no original auto-uninstall
      shell: bash
