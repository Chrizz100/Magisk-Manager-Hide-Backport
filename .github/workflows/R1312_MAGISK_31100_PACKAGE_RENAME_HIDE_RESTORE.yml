        dest.write_text(json.dumps(report,indent=2)+'\n')
        Path('reports/R136_APK_SHA256.txt').write_text(report['apk_sha256']+'  app-release.apk\n')
        print('R136: BUILD_ONLY_PASS, PHONE_DEVICE_TEST=NOT_EXECUTED, RELEASE=HOLD')
        print('R136 APK SHA256:',report['apk_sha256'])
        PY_R136
    - name: R13.8 - Prepare real-phone read-only daemon fingerprint probe, no emulator or device connection
      shell: bash
      run: |
        set -euo pipefail
        cat > R138_PHONE_NATIVE_IDENTITY_READONLY.sh <<'R138_EOF'
        #!/data/data/com.termux/files/usr/bin/bash
        # Only read existing device/root state. No installation, no settings writes, no flashing.
        # Install by saving this file to /sdcard/Download and run with bash.
        set -u
        # Optional: use the SHA256 from R138_SIGNING_NATIVE_PAIR.json as the first argument,
        # or place the JSON in /sdcard/Download. This is only an observation, never a flash/install.
        EXPECTED="${1:-}"
        if [ -z "$EXPECTED" ] && [ -r /sdcard/Download/R138_SIGNING_NATIVE_PAIR.json ]; then
          EXPECTED="$(grep -E '"native_arm64_magisk_so_sha256"' /sdcard/Download/R138_SIGNING_NATIVE_PAIR.json | head -n1 | sed -nE 's/.*"([0-9a-f]{64})".*/\1/p')"
        fi
        OUT="${HOME}/storage/downloads/R138_PHONE_NATIVE_IDENTITY_$(date +%Y%m%d_%H%M%S).txt"
        if [ ! -d "${HOME}/storage/downloads" ]; then OUT="${HOME}/R138_PHONE_NATIVE_IDENTITY_$(date +%Y%m%d_%H%M%S).txt"; fi
        {
          echo 'R13.8 MAGISK NATIVE MANAGER IDENTITY (read-only)'
          date -Iseconds
          echo '--- DEVICE ---'
          getprop ro.product.device
          getprop ro.build.version.sdk
          getprop ro.build.version.incremental
          echo '--- MAGISK AND ROOT ---'
          su -c 'id -u; magisk -v; magisk -V' 2>&1
          echo '--- MAGISK DAEMON PROCESS ID / EXECUTABLE FINGERPRINT ---'
          echo "EXPECTED_NATIVE_SHA256=${EXPECTED:-NOT_PROVIDED}"
          su -c '
            for name in magiskd magisk; do
              for pid in $(pidof "$name" 2>/dev/null); do
                if [ -r "/proc/$pid/exe" ]; then
                  echo "process=$name pid=$pid"
                  readlink "/proc/$pid/exe" 2>/dev/null || true
                  sha256sum "/proc/$pid/exe" 2>/dev/null || true
                fi
              done
            done
          ' 2>&1
          echo '--- OBSERVATION AGAINST EXPECTED CI NATIVE FINGERPRINT ---'
          if [ -n "$EXPECTED" ]; then
            case "$EXPECTED" in
              *[!0-9a-f]* ) echo 'R138_SHA_FORMAT=INVALID';;
              * ) if [ "${#EXPECTED}" -eq 64 ]; then
                echo 'R138_EXPECTED_FORMAT=OK'
                echo 'Compare process fingerprint above with this expected digest.'
                echo 'Matching digest alone does NOT constitute Hide/Restore runtime validation.'
              else echo 'R138_SHA_FORMAT=INVALID'; fi;;
            esac
          else
            echo 'R138_STATUS=NO_EXPECTED_HASH; no device-pair attestation possible'
          fi
          echo '--- APK/DAEMON SIGNATURE REJECTION EVENTS ---' 
          su -c '/system/bin/logcat -d -b all -v time 2>/dev/null | /system/bin/grep -Ei "pkg: APK signature mismatch|pkg: dynamic manager signature mismatch|pkg: dyn APK signature mismatch|pkg: repackaged APK signature invalid|su: request rejected|R135MagiskHide|R114Conceal" | /system/bin/tail -n 75' 2>&1
          echo '--- APP STATUS (may be hidden by MIUI / hooks) ---'
          su -c '
            for name in com.topjohnwu.magisk rqpbp.zosemtnw.opyszqss zrpvg.mbjx; do
              echo "PKG=$name"
              /system/bin/pm path "$name" 2>&1 | head -n 2
            done
          ' 2>&1
          echo 'END READ ONLY: NO INSTALL/UNINSTALL/BOOT/SQLITE WRITES'
        } > "$OUT"
        echo "Read-only report: $OUT"
        R138_EOF
        bash -n R138_PHONE_NATIVE_IDENTITY_READONLY.sh
        python3 - <<'PY'
        import json
        from pathlib import Path
        r={"schema":"R138.device-only-v1","build":"PASS","daemon_binary_on_phone":"NOT_ATTESTED","signing_cert_on_phone":"NOT_ATTESTED","existing_sweet_root":"DO_NOT_MODIFY","hide_restore_phone":"NOT_EXECUTED","release":"HOLD","emulator":"NOT_EXECUTED","flash":"NOT_AUTHORIZED","apk_install":"NOT_AUTHORIZED"}
        Path("reports/R138_DEVICE_ONLY_RELEASE_HOLD.json").write_text(json.dumps(r,indent=2)+"\n")
        print("R13.8 verified build pair only. DEVICE PASS unavailable without real, matching daemon fingerprint.")
        PY
    - name: R13.10 - Attach read-only Termux recovery inspection script
      shell: bash
      run: |
        set -euo pipefail
        cat > R1310_PHONE_RECOVERY_READONLY.sh <<'R1310_PHONE_EOF'
        #!/system/bin/sh
        # R13.10 - Read-only inspection. No package changes, no flash, no root changes.
        OUT="/sdcard/Download/R1310_PHONE_RECOVERY_STATUS_$(date +%Y%m%d_%H%M%S).txt"
        {
          echo 'R13.10 RECOVERY STATUS READ ONLY'
          date -Iseconds 2>/dev/null || date
          echo '--- ROOT ---'
          su -c 'id -u' 2>&1
          echo '--- MAGISK ---'
          su -c 'magisk -V; magisk -v' 2>&1
          echo '--- INDEPENDENT ORIGINAL APK BACKUP ---'
          su -c 'test -r /data/adb/magisk_manager_hide_recovery/original-manager-31100.apk && sha256sum /data/adb/magisk_manager_hide_recovery/original-manager-31100.apk || echo BACKUP_NOT_PRESENT' 2>&1
          echo '--- DAEMON FINGERPRINT ---'
          su -c 'pidof magiskd' 2>&1
          echo '--- PACKAGE SERVICE (DIAGNOSTIC ONLY) ---'
          su -c 'pm path com.topjohnwu.magisk' 2>&1
          echo '--- RECENT TRANSACTION LOGS ---'
          su -c '/system/bin/logcat -d -b all -v time | /system/bin/grep -E "R1310Hide|R1310Restore|R139MagiskHide|pkg: APK signature mismatch|su: request rejected" | /system/bin/tail -n 80' 2>&1
          echo 'NO WRITES TO ROOT/BOOT/APPS WERE PERFORMED'
        } > "$OUT" 2>&1
        printf '%s\n' "$OUT"
        R1310_PHONE_EOF
        bash -n R1310_PHONE_RECOVERY_READONLY.sh
