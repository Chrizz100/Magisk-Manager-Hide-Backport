            if 'AppMigration' not in v or 'AppContext' not in v:raise AssertionError('R6 ViewModel root context imports changed')
            vm.write_text(v.replace(v_anchor,VIEWMODEL+v_anchor,1))
            after={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in (src,ui,vm)}
            policy={'revision':'R11.4','scope':'EXPERIMENTAL_ANDROID_13_AVD_ONLY','original_manager_package':'com.topjohnwu.magisk','original_uninstall_requires_explicit_ui_tap':True,'original_apk_sha256_checked_before_remove':True,'original_apk_sha256_checked_after_restore':True,'original_data_kept_during_package_remove':True,'device_alpha_compatibility_tested':False,'phone_beta_release_authorized':False,'before_sha256':before,'after_sha256':after}
            return policy

        if __name__=='__main__':
            if len(sys.argv)!=3:raise SystemExit('usage: r114_patch_concealment.py MAGISK_ROOT JSON_REPORT')
