    - name: R13.9 - Generate read-only phone native comparison helper
      shell: bash
      run: |
        set -euo pipefail
        cat > R139_PHONE_PREFLIGHT_READONLY.sh <<'R139_PREFLIGHT_EOF'
        #!/data/data/com.termux/files/usr/bin/bash
        # SAFE: compare a candidate Magisk R13.9 APK against the ACTUAL phone daemon.
        # No installation/uninstall, no SQLite changes, no remount or boot write.
        set -uo pipefail
        APK="${1:-/sdcard/Download/app-release.apk}"
        OUT="${HOME}/R139_DEVICE_PREFLIGHT_$(date +%Y%m%d_%H%M%S).txt"
        if [ -d "${HOME}/storage/downloads" ]; then
          OUT="${HOME}/storage/downloads/R139_DEVICE_PREFLIGHT_$(date +%Y%m%d_%H%M%S).txt"
        fi
        {
          echo 'R13.9 READ-ONLY PHONE PREFLIGHT'
          date -Iseconds
          echo "CANDIDATE_APK=$APK"
          echo "MODEL=$(getprop ro.product.device) SDK=$(getprop ro.build.version.sdk)"
          echo '--- ROOT SERVICE ---'
          su -c 'id -u; magisk -v; magisk -V' 2>&1
          if ! command -v unzip >/dev/null 2>&1; then
            echo 'RESULT=BLOCKED_NO_UNZIP'
            echo 'Termux only: pkg install unzip (if you want to inspect APK later)'
            exit 0
          fi
          if [ ! -r "$APK" ]; then
            echo 'RESULT=BLOCKED_NO_APK'
            exit 0
          fi
          exp="$(unzip -p "$APK" assets/r139_expected_arm64_magisk.sha256 2>/dev/null | tr -d '\r\n')"
          echo "APK_NATIVE_SHA256=$exp"
          if [[ ! "$exp" =~ ^[0-9a-f]{64}$ ]]; then
            echo 'RESULT=BLOCKED_NO_VALID_NATIVE_DIGEST'
            exit 0
          fi
          pids="$(su -c 'pidof magiskd' 2>/dev/null)"
          echo "DAEMON_PIDS=$pids"
          if [ -z "$pids" ]; then
            echo 'RESULT=BLOCKED_NO_DAEMON_PIDS'
            exit 0
          fi
          ok=1
          n=0
          for pid in $pids; do
            case "$pid" in *[!0-9]*|'') ok=0;continue;; esac
            n=$((n+1))
            digest="$(su -c "sha256sum /proc/$pid/exe" 2>/dev/null | awk '{print $1}')"
            echo "DAEMON_PID_$pid=$digest"
            [ "$digest" = "$exp" ] || ok=0
          done
          if [ "$n" -lt 1 ] || [ "$n" -gt 20 ]; then ok=0; fi
          if [ "$ok" -eq 1 ]; then
            echo 'RESULT=DAEMON_DIGEST_MATCH_ONLY_NOT_INSTALL_APPROVAL'
          else
            echo 'RESULT=BLOCKED_MISMATCH_OR_INACCESSIBLE_DAEMON'
          fi
          echo 'No install or flash performed. A digest match is necessary, not sufficient.'
        } > "$OUT" 2>&1
        printf 'Read-only report: %s\n' "$OUT"
        R139_PREFLIGHT_EOF
        bash -n R139_PHONE_PREFLIGHT_READONLY.sh
