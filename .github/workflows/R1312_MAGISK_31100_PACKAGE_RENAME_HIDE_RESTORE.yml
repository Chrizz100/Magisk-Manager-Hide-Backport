        #!/usr/bin/env python3
        """R13.12 static build-only proof; intentionally never claims phone compatibility."""
        from __future__ import annotations
        import hashlib,json,re,sys,zipfile
        from pathlib import Path
        MIGRATION='app/core/src/main/java/com/topjohnwu/magisk/core/tasks/AppMigration.kt'
        SCREEN='app/apk/src/main/java/com/topjohnwu/magisk/ui/home/HomeScreen.kt'
        NATIVE='native/src/core/package.rs'
        
        def sha(raw:bytes)->str:return hashlib.sha256(raw).hexdigest()
        
        def verify(root:Path,reports:Path,mode:str)->dict:
            if mode not in ('source','apk'):raise ValueError('INVALID_GATE_MODE')
            m=(root/MIGRATION).read_text(encoding='utf-8')
            ui=(root/SCREEN).read_text(encoding='utf-8')
            n=(root/NATIVE).read_text(encoding='utf-8')
            rep=json.loads((reports/'R1312_SOURCE_REPAIR.json').read_text())
            assert rep['phone_release']=='HOLD'
            for path,summary in rep['files'].items():
                assert sha((root/path).read_bytes())==summary['after'], f'R1312_SOURCE_CHANGED_AFTER_PATCH: {path}'
            for code in ('suspend fun patchAndHide(context: Context','genPackageName()',
                         'if (!r139SameDaemon(context)) return r135HideFail("PRECHECK_NATIVE_DAEMON_NOT_ATTESTED")',
                         'adb_pm_install $repack $target','Config.suManager = target',
                         'suspend fun restoreApp(context: Context)',
                         'Config.suManager = ""','BACKUP_REINSTALL_FAILED'):
                assert code in m, f'R1312_MIGRATION_MISSING {code}'
            stage1=m.split('suspend fun patchAndHide(context: Context',1)[1].split('suspend fun finalizeConcealmentAvd(context: Context)',1)[0]
            assert stage1.index('r139SameDaemon(context)') < stage1.index('adb_pm_install $repack $target') < stage1.index('Config.suManager = target'), 'R1312_MIGRATION_WRONG_ORDER'
            assert stage1.index('Config.suManager = target') < stage1.index('launchApp(context, target)'), 'R1312_LAUNCH_BEFORE_BIND'
            restore=m.split('suspend fun restoreApp(context: Context)',1)[1].split('suspend fun upgradeStub(context: Context, apk: File)',1)[0]
            assert restore.index('MessageDigest.isEqual') < restore.index('Config.suManager = ""'), 'R1312_RESTORE_CLEAR_TOO_EARLY'
            assert 'viewModel.hideManager(label)' in ui and 'viewModel.restoreManager()' in ui, 'R1312_HIDE_RESTORE_UI_MISSING'
            assert 'viewModel::finalizeConcealmentAvd' not in ui, 'R1312_UNSAFE_SECOND_UI'
            assert all(t not in m for t in ('pm uninstall','cmd package uninstall','run_uninstaller','boot_patch.sh')), 'R1312_DESTRUCTIVE_HIDE'
            assert 'uninstall_pkg' not in n, 'R1312_NATIVE_AUTO_UNINSTALL_REMAINS'
            # Critical: no signature bypass; a mismatch must reject UID and preserve the package.
            check=n.split('fn check_apk(tracked: &mut TrackedFile) -> bool {',1)[1].split('\nimpl MagiskD',1)[0]
            assert 'if cert.is_empty() || (!TRUSTED_CERT.is_empty() && cert != TRUSTED_CERT)' in check
            assert 'error!("pkg: APK signature mismatch: {}", apk);' in check
            assert re.search(r'error!\("pkg: APK signature mismatch: \{\}", apk\);\s*// R13\.12:.*?\s*return false;',check,re.S), 'R1312_CERT_MISMATCH_NOT_REJECTED'
            assert 'check_repackaged_manager' in n and 'get_repackaged_manager_pkg' in n
            assert 'cert.as_slice() != TRUSTED_CERT' in n and 'dyn_owner != uid' in n
            # The second-stage retained method is never exposed as a user action and is read-only.
            finalizer=m.split('suspend fun finalizeConcealmentAvd(context: Context): Boolean {',1)[1].split('private fun r114Digest(',1)[0]
            assert 'HIDDEN_PACKAGE_ACTIVE_ORIGINAL_PRESERVED' in finalizer
            assert 'RUNNING_DAEMON_NOT_ATTESTED' in finalizer
            assert 'pm path $APP_PACKAGE_NAME' in finalizer and 'pm path ${context.packageName}' in finalizer
            assert 'pm uninstall' not in finalizer and 'adb_pm_install' not in finalizer
            o={'revision':'R13.12','mode':mode,'source_gate':'PASS','original_30_random_package_flow_preserved':True,
               'native_cert_verification_fail_closed':True,'no_implicit_original_manager_uninstall':True,
               'original_manager_fallback_preserved':True,'phone_root_test':'NOT_EXECUTED',
               'phone_hide_restore_test':'NOT_EXECUTED','phone_release':'HOLD','flash':'NOT_AUTHORIZED'}
