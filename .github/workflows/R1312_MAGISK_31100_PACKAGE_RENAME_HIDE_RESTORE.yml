            if rel == "app/settings.gradle.kts":
                # R5 has already added historic :shared, :stub, and :stub-res modules.
                # Compare EXACTLY against the pinned upstream plus that single,
                # previously verified R5 change; no unrelated drift is accepted.
                original_modules = b'include(":apk", ":core", ":test")'
                restored_modules = b'include(":apk", ":core", ":shared", ":stub", ":stub-res", ":test")'
                if pinned.count(original_modules) != 1:
                    raise SystemExit("R1355_PINNED_MODULE_ANCHOR_MISSING")
                expected_input = pinned.replace(original_modules, restored_modules, 1)
            else:
                expected_input = pinned
            if data != expected_input:
                raise SystemExit("R1355_UNEXPECTED_SOURCE_DRIFT: " + rel)
            text = data.decode("utf-8")
            if text.count(old) != expected_count or mirror in text:
                raise SystemExit("R1355_REPOSITORY_ANCHOR_MISMATCH: " + rel)
            new_data = text.replace(old,new).encode("utf-8")
            staged[p] = new_data
            changes.append({"path": rel, "insertions":expected_count,"original_sha256":hashlib.sha256(data).hexdigest(),"new_sha256":hashlib.sha256(new_data).hexdigest()})
        rel="app/build-logic/settings.gradle.kts"
