            report.parent.mkdir(parents=True,exist_ok=True)
            report.write_text(json.dumps(report_data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
            print('R13.10 TRANSACTIONAL ORIGINAL HIDE SOURCE INTEGRATION: PASS; ROOT/DEVICE TEST HOLD')
            return report_data

        if __name__=='__main__':
            if len(sys.argv)!=3:raise SystemExit('Usage: python R1310_RESTORE_TRANSACTIONAL_HIDE.py MAGISK_ROOT REPORT_JSON')
