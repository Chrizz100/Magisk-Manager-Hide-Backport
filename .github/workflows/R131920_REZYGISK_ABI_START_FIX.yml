    - name: Fetch exact previous APK and synthetic update fixture
      env:
        GH_TOKEN: ${{ github.token }}
        REFERENCE_RUN_ID: ${{ inputs.reference_run_id || '44570919505' }}
      run: |
        python3 ci_tools/fetch_inputs.py --out prepared/reference
        cp -a ci_tools prepared/ci_tools
    - name: Save R131918_REFERENCE_INPUTS_HASH_VERIFIED
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: R131918_REFERENCE_INPUTS_HASH_VERIFIED
        path: prepared/
        if-no-files-found: error
        retention-days: 90
  native:
    name: ReZygisk bauen (${{ matrix.variant }})
    needs: inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        variant:
        - upstream
        - fixed
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: R131918_REFERENCE_INPUTS_HASH_VERIFIED
        path: inputs
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: PerformanC/ReZygisk
        ref: 4aff785a1b82250ab0be7b5e4cae5cdb2f4d988b
        submodules: recursive
        path: upstream
        persist-credentials: false
    - name: Check host build dependencies
      run: |
        if ! python3 -c 'import yaml, cryptography'; then
          sudo apt-get update -qq
          sudo apt-get install -y python3-yaml python3-cryptography
        fi
        command -v clang
        command -v make
    - name: Test actual C lookup, phone snapshot, and observed UI failure
      run: |
        mkdir -p candidate/reports
        python3 inputs/ci_tools/patch/test_manager_lookup.py --source-root upstream --cc clang --report candidate/reports/HOST_MANAGER_REGRESSION.json
        python3 inputs/ci_tools/phone/test_phone_check.py > candidate/reports/PHONE_CHECK_TESTS.log 2>&1
        python3 inputs/ci_tools/ui/test_home_zygisk.py --fixtures inputs/ci_tools/ui/fixtures --out candidate/reports/UI_STATUS_REGRESSION.json
        python3 inputs/ci_tools/startup_patch/test_startup_abi.py --apk inputs/reference/Magisk_R13198.apk --report candidate/reports/R131920_ACTUAL_BUSYBOX_ABI_REGRESSION.json
        python3 -m unittest discover -s inputs/ci_tools -p 'test_*.py' -v > candidate/reports/R131920_STARTUP_EVIDENCE_TESTS.log 2>&1
    - name: Use the exact stable Android NDK
      run: |
        R131918_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
        if [[ ! -d "$R131918_SDK_ROOT/ndk/29.0.14206865" ]]; then
          "$R131918_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865"
        fi
        printf 'R131918_NDK=%s\n' "$R131918_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"
    - name: Build and verify all four packaged ABIs
      env:
        VARIANT: ${{ matrix.variant }}
      run: |
        python3 inputs/ci_tools/build_module.py --source upstream --tools inputs/ci_tools --ndk "$R131918_NDK" --variant "$VARIANT" --out candidate
        cp -a inputs/ci_tools candidate/ci_tools
        cp upstream/LICENSE candidate/LICENSE_REZYGISK.txt
    - name: Save R131920_CANDIDATE_${{ matrix.variant }}_BUILD_ONLY
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: R131920_CANDIDATE_${{ matrix.variant }}_BUILD_ONLY
        path: candidate/
        if-no-files-found: error
        retention-days: 90
    - name: Save R131920_NATIVE_LOGS_${{ matrix.variant }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: R131920_NATIVE_LOGS_${{ matrix.variant }}
        path: |-
          candidate/*.log
          candidate/reports/
          candidate/PATCH_SOURCE.json
          candidate/STARTUP_PATCH_SOURCE.json
        if-no-files-found: warn
        retention-days: 90
      if: always()
  avd:
    name: Realer Hide/Restore-Vergleich (${{ matrix.variant }})
    needs:
    - inputs
    - native
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        variant:
        - upstream
        - fixed
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: R131918_REFERENCE_INPUTS_HASH_VERIFIED
        path: inputs
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: R131920_CANDIDATE_${{ matrix.variant }}_BUILD_ONLY
        path: candidate
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: topjohnwu/Magisk
        ref: 0972f67d97f9b6302b67c5171283330c74114b4a
        path: magisk-source
        persist-credentials: false
    - name: Extend the exact previously tested Hide/Restore flow
      env:
        VARIANT: ${{ matrix.variant }}
      run: |
        if ! python3 -c 'import yaml'; then
          sudo apt-get update -qq
          sudo apt-get install -y python3-yaml
        fi
        python3 candidate/ci_tools/prepare_avd.py inputs/reference/REFERENCE_WORKFLOW.yml
        python3 - <<'PY'
        import json, os
        from pathlib import Path
        root=Path.cwd()
        manifest=json.loads((root/'candidate/BUILD_MANIFEST.json').read_text())
        assert manifest['variant']==os.environ['VARIANT']
        with open(os.environ['GITHUB_ENV'],'a') as out:
            for key,value in {'R131918_TOOLS':root/'candidate/ci_tools', 'R131918_MODULE':root/'candidate'/manifest['module_file'],
                              'R131918_MANIFEST':root/'candidate/BUILD_MANIFEST.json', 'R131918_VARIANT':manifest['variant']}.items():
                out.write(key+'='+str(value)+'\n')
        PY
    - name: Enable emulator KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Observe actual external ReZygisk before Hide, hidden, and restored
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
      with:
        api-level: 33
        system-image-api-level: 33
        target: google_apis
        arch: x86_64
        profile: pixel_5
        emulator-boot-timeout: 950
        ram-size: 3072M
        cores: 2
        emulator-options: -no-window -noaudio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -camera-back
          none
        script: bash R131918_RUN_AVD.sh "$GITHUB_WORKSPACE/inputs/reference/Magisk_R13198.apk" "$GITHUB_WORKSPACE/magisk-source"
          "$GITHUB_WORKSPACE/avd-evidence" "$GITHUB_WORKSPACE/inputs/reference/R13198_INSTALL_UPDATE_FIXTURE.apk"
          "$GITHUB_WORKSPACE/inputs/reference/R13198_INSTALL_UPDATE_FIXTURE.json"
    - name: Write the actual verification status
      if: always()
      run: |
        python3 candidate/ci_tools/summarize_avd.py avd-evidence
    - name: Save R131920_AVD_${{ matrix.variant }}_ACTUAL_EVIDENCE
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: R131920_AVD_${{ matrix.variant }}_ACTUAL_EVIDENCE
        path: avd-evidence/
        if-no-files-found: warn
        retention-days: 90
      if: always()
  verified-module:
    name: Geprueftes ReZygisk-Modul freigeben
    needs:
    - native
    - avd
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
