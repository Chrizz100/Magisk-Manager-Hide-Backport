        click_node 'Restore the Magisk app|Magisk.*wiederherstellen' before_restore || { echo 'RESTORE_CONTROL_NOT_FOUND' >&2;exit 65; }
        sleep 2
        # R13197_CANCEL_CHECK_BEGIN
        # Cancel must dismiss the actual fitted dialog without entering Restore.
        state=RESTORE_CANCEL
        click_node '^Cancel$|^Abbrechen$' cancel_restore || { echo 'R13197_RESTORE_CANCEL_MISSING' >&2; exit 89; }
        sleep 1
        adb shell uiautomator dump /sdcard/r13197_after_cancel.xml > "$OUT/after_restore_cancel_dump.log" 2>&1
        adb pull /sdcard/r13197_after_cancel.xml "$OUT/after_restore_cancel.xml" >/dev/null
        python3 - "$OUT/after_restore_cancel.xml" "$found" <<'R13197_CANCEL_XML'
        import sys
        import xml.etree.ElementTree as ET
        nodes=[n for n in ET.parse(sys.argv[1]).getroot().iter('node') if n.get('package')==sys.argv[2]]
        assert any(n.get('content-desc')=='Restore the Magisk app' for n in nodes), 'R13197_CANCEL_DID_NOT_RETURN_TO_HOME'
        assert not any(n.get('text') in ('OK','Cancel','Abbrechen') for n in nodes), 'R13197_CANCEL_DIALOG_STILL_VISIBLE'
        R13197_CANCEL_XML
        adb shell logcat -d -v brief -s R13196RestoreUI:I R13196RestoreVM:I R13196Restore:I '*:S' > "$OUT/r13197_cancel_trace.txt"
        if grep -Eq 'CONFIRM_CALLBACK_RECEIVED|REQUEST_RECEIVED|[[:space:]]ENTERED$' "$OUT/r13197_cancel_trace.txt"; then
          echo 'R13197_CANCEL_INCORRECTLY_STARTED_RESTORE' >&2; exit 90
        fi
        adb shell pm path "$found" > "$OUT/r13197_hidden_after_cancel.txt"
        grep -q '^package:' "$OUT/r13197_hidden_after_cancel.txt" || { echo 'R13197_CANCEL_REMOVED_HIDDEN_APP' >&2; exit 91; }
        click_node 'Restore the Magisk app|Magisk.*wiederherstellen' before_restore_confirm || { echo 'R13197_RESTORE_CONTROL_MISSING_AFTER_CANCEL' >&2; exit 92; }
        sleep 2
        state=RESTORE_CONFIRM
        # R13197_CANCEL_CHECK_END
        click_node '^OK$|^Restore$|^Wiederherstellen$|^Bestätigen$' confirm_restore || { echo 'RESTORE_CONFIRM_MISSING' >&2;exit 66; }
        state=RESTORE_TRANSACTION_COMPLETION
        # R13196_WAIT_RESTORE_BEGIN
        # Wait for completion reported by the app itself. Merely entering restoreApp
        # does not mean its hash checks, launcher activation or binding reset finished.
        wait_for_restore_completion() {
          local restore_ui_seen=false
          local restore_backend_seen=false
          local restore_complete=false
          local n
          for n in $(seq 1 45); do
            adb shell logcat -d -v brief -s R13196RestoreUI:I R13196RestoreVM:I R13196Restore:I R1310Restore:E R1319Restore:E '*:S' \
              > "$OUT/r13196_restore_trace.txt" 2>&1 || true
            grep -Fq 'CONFIRM_CALLBACK_RECEIVED' "$OUT/r13196_restore_trace.txt" && restore_ui_seen=true || true
            grep -Eq '[[:space:]]ENTERED$' "$OUT/r13196_restore_trace.txt" && restore_backend_seen=true || true
            if grep -Eq 'BACKEND_RESTORE_FAILED|BACKEND_EXCEPTION|BUSY_PREVIOUS_TRANSACTION_NOT_FINISHED|RESTORE_TRANSACTION_REJECTED_HIDDEN_RETAINED|RESTORE_TRANSACTION_EXCEPTION|MANAGER_BIND_RESET_FAILED|CLEANUP_SCHEDULING_FAILED_KEEP_HIDDEN' \
                "$OUT/r13196_restore_trace.txt"; then
              echo 'R13196_RESTORE_APP_REPORTED_FAILURE' >&2
              return 85
            fi
            if [[ "$restore_ui_seen" == true && "$restore_backend_seen" == true ]] && \
               grep -Fq 'ORIGINAL_EXPLICIT_START_OK' "$OUT/r13196_restore_trace.txt" && \
               grep -Fq 'MANAGER_BIND_RESET_VERIFIED' "$OUT/r13196_restore_trace.txt" && \
               grep -Fq 'ORIGINAL_START_CONFIRMED_CLEANUP_SCHEDULED' "$OUT/r13196_restore_trace.txt" && \
               grep -Fq 'BACKEND_RESTORE_CONFIRMED' "$OUT/r13196_restore_trace.txt"; then
              restore_complete=true
              break
            fi
            sleep 1
          done
          [[ "$restore_ui_seen" == true ]] || { echo 'R13196_RESTORE_CONFIRM_CALLBACK_NOT_INVOKED' >&2; return 81; }
          [[ "$restore_backend_seen" == true ]] || { echo 'R13196_RESTORE_BACKEND_NOT_ENTERED' >&2; return 82; }
          [[ "$restore_complete" == true ]] || { echo 'R13196_RESTORE_TRANSACTION_NOT_COMPLETED' >&2; return 86; }
          [[ $(grep -Fc 'CONFIRM_CALLBACK_RECEIVED' "$OUT/r13196_restore_trace.txt") == 1 &&
             $(grep -Ec '[[:space:]]ENTERED$' "$OUT/r13196_restore_trace.txt") == 1 ]] || {
            echo 'R13197_RESTORE_CONFIRM_OR_BACKEND_REPEATED' >&2; return 93;
          }
        }
        # R13196_WAIT_RESTORE_END
        wait_for_restore_completion
        # The retained package was installed throughout Hide. Its presence alone is
        # never a Restore completion signal. Verify it after the app-side barrier.
        adb shell pm path com.topjohnwu.magisk > "$OUT/original_restored.txt" 2>&1
        grep -q '^package:' "$OUT/original_restored.txt" || { echo 'RESTORE_ORIGINAL_MISSING' >&2; exit 67; }
        # Passive evidence: the app must have started the original itself. Do not
        # supply its process from adb before checking the app-owned cleanup.
        adb shell pidof com.topjohnwu.magisk > "$OUT/r13196_original_pid_after_app_restore.txt" 2>&1 || {
          echo 'R13196_ORIGINAL_PROCESS_MISSING_AFTER_APP_RESTORE' >&2; exit 87;
        }
        grep -Eq '^[[:space:]]*[0-9]+([[:space:]]+[0-9]+)*[[:space:]]*$' "$OUT/r13196_original_pid_after_app_restore.txt" || {
          echo 'R13196_ORIGINAL_PROCESS_NOT_CONFIRMED' >&2; exit 88;
        }
        # Restore must remove the random package, never the original.
        state=HIDDEN_PACKAGE_CLEANUP
        cleanup_done=false
        for attempt in $(seq 1 25); do
          adb shell pm list packages -3 > "$OUT/r1319_packages_cleanup_${attempt}.txt" 2>&1
          if ! grep -Fxq "package:$found" "$OUT/r1319_packages_cleanup_${attempt}.txt"; then
            cleanup_done=true; break
          fi
          sleep 2
        done
        [[ "$cleanup_done" == true ]] || {
          echo 'R1319_HIDDEN_STUB_REMAINS_INSTALLED_AFTER_RESTORE' >&2; exit 78;
        }
        adb shell pm path com.topjohnwu.magisk > "$OUT/r1319_original_after_cleanup.txt" 2>&1
        grep -q '^package:' "$OUT/r1319_original_after_cleanup.txt" || exit 79
        adb shell am start -W -n com.topjohnwu.magisk/.ui.MainActivity > "$OUT/r1319_original_launcher_restored.txt" 2>&1
        grep -q 'Status: ok' "$OUT/r1319_original_launcher_restored.txt" || {
          echo 'R1319_ORIGINAL_LAUNCHER_NOT_REENABLED' >&2; exit 80;
        }
        adb shell su -c id -u > "$OUT/su_after_restore.txt" 2>&1
        grep -Fxq 0 "$OUT/su_after_restore.txt" || exit 69
        state=COMPLETE
        echo 'R13.19.6 root, random Hide, original launcher hide, app-owned Restore and hidden cleanup PASS; phone HOLD'
        R1315_END_SCRIPT
        cat > R1316_UI_FIND.py <<'R1316_UI_SELECTOR_EOF'
        #!/usr/bin/env python3
        """R13.16: locate exact visible UI node without merging text and content-desc.
        The old selector concatenated 'OK' + ' ' + '' -> 'OK ', breaking ^OK$.
        Usage: R1316_UI_FIND.py DUMP_XML REGEX; stdout: two integer coordinates.
        """
        import re
        import sys
        import xml.etree.ElementTree as ET


        def find(path, pattern):
            target = re.compile(pattern, re.I)
            root = ET.parse(path).getroot()
            for node in root.iter('node'):
                attrs = node.attrib
                if attrs.get('enabled') == 'false':
                    continue
                text = attrs.get('text', '').strip()
                description = attrs.get('content-desc', '').strip()
                if not (target.search(text) or target.search(description)):
                    continue
                bounds = re.fullmatch(r'\[\s*(\d+)\s*,\s*(\d+)\s*\]\[\s*(\d+)\s*,\s*(\d+)\s*\]', attrs.get('bounds',''))
                if not bounds:
                    continue
                x1,y1,x2,y2 = map(int, bounds.groups())
                if x2 <= x1 or y2 <= y1:
                    continue
                return (x1+x2)//2, (y1+y2)//2
            return None


        if __name__ == '__main__':
            if len(sys.argv) != 3:
                sys.exit('Usage: python3 R1316_UI_FIND.py UI_XML REGEX')
            try:
                coordinates = find(sys.argv[1], sys.argv[2])
            except (OSError, ValueError, ET.ParseError, re.error) as error:
                print('R1316_UI_DUMP_OR_SELECTOR_ERROR: '+str(error),file=sys.stderr)
                sys.exit(1)
            if coordinates is None:
                sys.exit(1)
            print(*coordinates)
        R1316_UI_SELECTOR_EOF
        python3 -m py_compile R1316_UI_FIND.py
        python3 - <<'R1316_UI_SELECTOR_TESTS'
        import subprocess,tempfile,pathlib,xml.etree.ElementTree as ET
        # Captured R13.15 UI dialogue: text=OK, desc empty, bounds=[842,1323][894,1368].
        with tempfile.TemporaryDirectory() as td:
            path=pathlib.Path(td)/'actual-dialog.xml'
            path.write_text('<hierarchy><node text="OK" content-desc="" enabled="true" bounds="[842,1323][894,1368]"/></hierarchy>')
            def probe(pattern):
                return subprocess.run(['python3','R1316_UI_FIND.py',str(path),pattern],capture_output=True,text=True)
            p=probe('^OK$|^Hide$|^Verbergen$|^Bestätigen$')
            assert p.returncode==0 and p.stdout.strip()=='868 1345',p
            assert probe('^Grant$').returncode==1
            # Prove the exact historical root cause (the old algorithm cannot match).
            import re
            assert not re.search('^OK$', 'OK ')
            # Reject a malformed clickable target without valid bounds.
            path.write_text('<hierarchy><node text="OK" enabled="true" bounds="[0,0][0,0]"/></hierarchy>')
            assert probe('^OK$').returncode==1
        print('R13.16 UI selector confirmed: original OK+trailing-space regression fixed, fail-closed checks PASS')
        R1316_UI_SELECTOR_TESTS
        chmod 755 R1315_ROOT_HIDE_RESTORE_AVD.sh
        bash -n R1315_ROOT_HIDE_RESTORE_AVD.sh
    - name: Enable emulator KVM
      shell: bash
