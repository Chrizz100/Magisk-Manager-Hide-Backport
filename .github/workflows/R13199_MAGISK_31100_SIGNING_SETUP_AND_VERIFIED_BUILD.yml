        #!/usr/bin/env python3
        """R13.5: Fail-closed Magisk 31.1 manager-migration diagnostics.

        Apply AFTER R13.3 to the reconstructed v31.1 Magisk tree, BEFORE building.
        It neither weakens MagiskD's certificate verification nor modifies /boot.
        """
        from __future__ import annotations
        import hashlib
        import json
        import sys
        from pathlib import Path

        HIDE_START = "    suspend fun patchAndHide(context: Context, label: String, pkg: String? = null): Boolean {\n"
