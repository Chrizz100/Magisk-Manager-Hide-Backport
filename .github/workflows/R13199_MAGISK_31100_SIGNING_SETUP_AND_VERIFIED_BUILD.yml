        """Recognize only the confirmed Android AVD KeyChain process-crash dialog.

        This selector never dismisses Magisk crashes, security prompts, SU dialogs,
        or an arbitrary system popup. The bash caller enforces a one-time recovery.
        """
        from __future__ import annotations
        import re
        import sys
        import xml.etree.ElementTree as ET

        RECT = re.compile(r"^\[(\d+),(\d+)\]\[(\d+),(\d+)\]$")

        def coordinates(xml: str) -> tuple[int, int] | None:
            try:
                root = ET.fromstring(xml)
            except ET.ParseError:
                return None
            nodes = list(root.iter("node"))
            titles = [n for n in nodes if n.get("package") == "android"
                      and n.get("resource-id") == "android:id/alertTitle"
                      and n.get("text", "").strip() == "Key Chain keeps stopping"]
            closes = [n for n in nodes if n.get("package") == "android"
                      and n.get("resource-id") == "android:id/aerr_close"
                      and n.get("text", "").strip() == "Close app"
                      and n.get("clickable") == "true"
                      and n.get("enabled") == "true"]
            if len(titles) != 1 or len(closes) != 1:
                return None
            hit = RECT.fullmatch(closes[0].get("bounds", ""))
            if not hit:
                return None
            x1, y1, x2, y2 = map(int, hit.groups())
            if not (0 <= x1 < x2 <= 4000 and 0 <= y1 < y2 <= 4000):
                return None
            return ((x1+x2)//2, (y1+y2)//2)

        def selftest() -> None:
            sample = '<hierarchy><node package="android" resource-id="android:id/alertTitle" text="Key Chain keeps stopping"/><node package="android" resource-id="android:id/aerr_close" text="Close app" clickable="true" enabled="true" bounds="[71,1241][1009,1373]"/></hierarchy>'
            assert coordinates(sample) == (540,1307)
            assert coordinates(sample.replace('Key Chain keeps stopping','Magisk keeps stopping')) is None
            assert coordinates(sample.replace('package="android"','package="com.topjohnwu.magisk"')) is None
            assert coordinates(sample.replace('clickable="true"','clickable="false"')) is None
            assert coordinates(sample.replace('enabled="true"','enabled="false"')) is None
            assert coordinates(sample.replace('[71,1241][1009,1373]','invalid')) is None
            assert coordinates(sample.replace('Close app','Grant')) is None
            assert coordinates(sample+sample) is None
            assert coordinates('<node invalid') is None
            print('R13193_FOREIGN_SYSTEM_DIALOG_SELECTOR_SELFTEST_PASS')

        if __name__ == '__main__':
            if len(sys.argv) == 2 and sys.argv[1] == '--self-test':
                selftest();sys.exit(0)
            if len(sys.argv) != 2:
                sys.exit(2)
            try:
                result = coordinates(open(sys.argv[1], encoding='utf-8').read())
            except OSError:
                sys.exit(2)
            if result is None:
                sys.exit(1)
            print(result[0], result[1])
