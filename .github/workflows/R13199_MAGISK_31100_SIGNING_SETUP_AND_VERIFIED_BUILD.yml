        '''
        VM_NEW = '''    fun restoreManager() {
                android.util.Log.i("R13196RestoreVM", "REQUEST_RECEIVED")
                viewModelScope.launch {
                    // Never overlap a running Hide transaction. If a previous loading
                    // operation is finishing, wait for it instead of silently discarding
                    // the user's confirmed Restore action.
                    var pending = 0
                    while (_uiState.value.showLoading && pending < 40) {
                        kotlinx.coroutines.delay(125L)
                        pending++
                    }
                    if (_uiState.value.showLoading) {
                        android.util.Log.e("R13196RestoreVM", "BUSY_PREVIOUS_TRANSACTION_NOT_FINISHED")
                        showToast(CoreR.string.failure)
                        return@launch
                    }
                    android.util.Log.i("R13196RestoreVM", "BACKEND_CALL_STARTED")
                    val success = try {
                        withLoading {
                            val context = AppContext.foregroundActivity ?: AppContext
                            AppMigration.restoreApp(context)
                        }
                    } catch (e: Exception) {
                        android.util.Log.e("R13196RestoreVM", "BACKEND_EXCEPTION", e)
                        false
                    }
                    android.util.Log.i("R13196RestoreVM", if (success)
                        "BACKEND_RESTORE_CONFIRMED" else "BACKEND_RESTORE_FAILED")
                    if (!success) showToast(CoreR.string.failure)
                }
            }
        '''
        # This is the Kotlin block actually emitted by the R6 patch, after YAML
        # indentation has been removed. Match the complete dialog, exactly once.
        UI_OLD = '''    if (showRestoreDialog) {
                RestoreAppDialog(
                    onDismiss = { showRestoreDialog = false },
                    onConfirm = {
                        showRestoreDialog = false
