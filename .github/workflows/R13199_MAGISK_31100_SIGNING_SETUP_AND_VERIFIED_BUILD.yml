            verify(Path(sys.argv[1]),Path(sys.argv[2]),sys.argv[3])
        R1312_GATE_EOF
        python3 -m py_compile R1312_STRICT_GATE.py
        python3 R1312_STRICT_GATE.py magisk reports source
        git -C magisk diff --check
    - name: R13.19 - Patch reversible original launcher and verified hidden-manager cleanup
