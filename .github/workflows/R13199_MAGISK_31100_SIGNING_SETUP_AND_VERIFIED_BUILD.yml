# R13.19.9 fixes setup/dispatch handling of run44448376001.
# Default: explicitly setup inspection only, no APK or Android tests.
# build_release still requires the preserved signer and all R13.19.8 gates.
name: Magisk R13.19.9 - Einrichtung prüfen oder signierten APK-Build ausführen
permissions:
  contents: read
'on':
  workflow_dispatch:
    inputs:
      operation:
        description: check_signing_setup = nur Einrichtung prüfen; build_release = APK bauen und vollständig testen
        type: choice
        required: true
        default: check_signing_setup
        options:
        - check_signing_setup
        - build_release
jobs:
  r13199-signing-setup:
    name: R13.19.9 Signiereinrichtung prüfen – erzeugt keine APK
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build_permitted: ${{ steps.setup.outputs.build_permitted }}
      status: ${{ steps.setup.outputs.status }}
      operation: ${{ steps.setup.outputs.operation }}
    steps:
    - name: Read signing setup and distinguish preparation from a build request
      id: setup
      shell: bash
      env:
        R13199_OPERATION: ${{ inputs.operation }}
        R139_P12_B64: ${{ secrets.MAGISK_HIDE_P12_BASE64 }}
        R139_STOREPASS: ${{ secrets.MAGISK_HIDE_P12_PASSWORD }}
        R139_KEYPASS: ${{ secrets.MAGISK_HIDE_P12_KEY_PASSWORD }}
        R139_ALIAS: ${{ secrets.MAGISK_HIDE_P12_ALIAS }}
        R13198_EXPECTED_SIGNER_SHA256: ${{ vars.MAGISK_HIDE_SIGNER_SHA256 }}
      run: |
        set -euo pipefail
        cat > R13198_IMPORT_SIGNING.py <<'R13199_EXISTING_IMPORTER_PY'
        #!/usr/bin/env python3
        """Import one pinned, persistent signing identity. Never generate a release key.

        Secrets are read only from the four established R139_* environment variables.
        The project signer pin is public configuration in R13198_EXPECTED_SIGNER_SHA256.
        No passwords, aliases, keystore bytes or child-tool diagnostics are printed.
        """
        from __future__ import annotations

        import argparse
        import base64
        import binascii
        import hashlib
        import json
        import os
        from pathlib import Path
        import re
        import shutil
        import subprocess
        import tempfile


        SECRET_NAMES = ("R139_P12_B64", "R139_STOREPASS", "R139_KEYPASS", "R139_ALIAS")
        PIN_NAME = "R13198_EXPECTED_SIGNER_SHA256"
        ABI_LIST = "arm64-v8a,armeabi-v7a,x86_64,x86"
        PREFIX = "R13198_SIGNING_"


        class SigningError(Exception):
            def __init__(self, code: str):
                self.code = code
                super().__init__(PREFIX + code)


        JAVA_VALIDATOR = r'''import java.io.InputStream;
        import java.nio.file.Files;
        import java.nio.file.Path;
        import java.security.Key;
        import java.security.KeyStore;
        import java.security.MessageDigest;
        import java.security.PrivateKey;
        import java.security.SecureRandom;
        import java.security.Signature;
        import java.security.cert.X509Certificate;
        import java.util.Arrays;
        import java.util.HexFormat;
        import java.util.Properties;

        class R13198KeyStoreCheck {
            static final class Rejected extends Exception {
                final String code;
                Rejected(String value) { code = value; }
            }
            static String env(String name) throws Rejected {
                String value = System.getenv(name);
                if (value == null || value.isEmpty()) throw new Rejected("CONFIGURATION_MISSING");
                return value;
            }
            static void require(boolean value, String code) throws Rejected {
                if (!value) throw new Rejected(code);
            }
            static void run(String[] args) throws Exception {
                require(args.length == 3, "VALIDATOR_ARGUMENTS_INVALID");
                String alias = env("R139_ALIAS");
                char[] storePassword = env("R139_STOREPASS").toCharArray();
                char[] keyPassword = env("R139_KEYPASS").toCharArray();
                try {
                    // This is the same InputStream parser used by Magisk's Gradle plugin.
                    Properties props = new Properties();
                    try (InputStream in = Files.newInputStream(Path.of(args[1]))) { props.load(in); }
                    require(env("R139_STOREPASS").equals(props.getProperty("keyStorePass")), "JAVA_PROPERTIES_MISMATCH");
                    require(env("R139_KEYPASS").equals(props.getProperty("keyPass")), "JAVA_PROPERTIES_MISMATCH");
                    require(alias.equals(props.getProperty("keyAlias")), "JAVA_PROPERTIES_MISMATCH");
                    require(env("R13198_VALIDATION_KEYSTORE_PATH").equals(props.getProperty("keyStore")), "JAVA_PROPERTIES_MISMATCH");
                    require("arm64-v8a,armeabi-v7a,x86_64,x86".equals(props.getProperty("abiList")), "JAVA_PROPERTIES_MISMATCH");

                    KeyStore store = KeyStore.getInstance("PKCS12");
                    try (InputStream in = Files.newInputStream(Path.of(args[0]))) {
                        try { store.load(in, storePassword); }
                        catch (Exception ignored) { throw new Rejected("STORE_PASSWORD_OR_CONTAINER_INVALID"); }
                    }
                    require(store.containsAlias(alias) && store.isKeyEntry(alias), "ALIAS_NOT_PRIVATE_KEY");
                    Key key;
                    try { key = store.getKey(alias, keyPassword); }
                    catch (Exception ignored) { throw new Rejected("KEY_PASSWORD_INVALID"); }
                    require(key instanceof PrivateKey, "ALIAS_NOT_PRIVATE_KEY");
                    require(store.getCertificate(alias) instanceof X509Certificate, "CERTIFICATE_INVALID");
                    X509Certificate cert = (X509Certificate) store.getCertificate(alias);
                    try { cert.checkValidity(); }
                    catch (Exception ignored) { throw new Rejected("CERTIFICATE_NOT_CURRENTLY_VALID"); }
                    byte[] der = cert.getEncoded();
                    String digest = HexFormat.of().formatHex(MessageDigest.getInstance("SHA-256").digest(der));
                    require(digest.equals(env("R13198_EXPECTED_SIGNER_SHA256")), "SIGNER_PIN_MISMATCH");

                    String algorithm;
                    String keyKind;
                    switch (key.getAlgorithm()) {
                        case "RSA": algorithm = "SHA256withRSA"; keyKind = "RSA"; break;
                        case "EC": algorithm = "SHA256withECDSA"; keyKind = "EC"; break;
                        case "DSA": algorithm = "SHA256withDSA"; keyKind = "DSA"; break;
                        default: throw new Rejected("KEY_ALGORITHM_UNSUPPORTED");
                    }
                    // Prove the private key is usable and corresponds to the pinned public cert.
                    byte[] challenge = new byte[32];
                    new SecureRandom().nextBytes(challenge);
                    Signature proof = Signature.getInstance(algorithm);
                    proof.initSign((PrivateKey) key);
                    proof.update(challenge);
                    byte[] signature = proof.sign();
                    proof.initVerify(cert.getPublicKey());
                    proof.update(challenge);
                    require(proof.verify(signature), "PRIVATE_KEY_CERTIFICATE_MISMATCH");
                    Files.write(Path.of(args[2]), der);
                    System.out.println("{\"status\":\"PASS\",\"signer_sha256\":\"" + digest
                        + "\",\"key_algorithm\":\"" + keyKind
                        + "\",\"private_key_verified\":true,\"certificate_valid\":true,"
                        + "\"java_properties_roundtrip\":true}");
                } finally {
                    Arrays.fill(storePassword, '\0');
                    Arrays.fill(keyPassword, '\0');
                }
            }
            public static void main(String[] args) {
                try { run(args); }
                catch (Rejected failure) { System.err.println("R13198_SIGNING_" + failure.code); System.exit(2); }
                catch (Exception ignored) { System.err.println("R13198_SIGNING_VALIDATOR_FAILED"); System.exit(2); }
            }
        }
        '''


        def literal_property_value(value: str, code: str) -> str:
            # build.py keeps literal backslashes and UTF-8; Java Properties unescapes
            # backslashes and decodes ISO-8859-1. There is no lossless common encoding
            # for such values without changing an upstream parser. Reject, never alter.
            if (not value or value != value.strip(" \t\r\n") or "\\" in value
                    or any(ord(ch) < 32 or ord(ch) > 126 for ch in value)):
                raise SigningError(code)
            return value


        def configuration(env: dict[str, str]) -> tuple[dict[str, str], bytes]:
            present = sum(bool(env.get(name)) for name in SECRET_NAMES)
            if present == 0:
                raise SigningError("CONFIGURATION_MISSING")
            if present != len(SECRET_NAMES):
                raise SigningError("CONFIGURATION_INCOMPLETE")
            pin = env.get(PIN_NAME, "").strip()
            if not pin:
                raise SigningError("SIGNER_PIN_MISSING")
            if not re.fullmatch(r"[0-9A-Fa-f]{64}", pin):
                raise SigningError("SIGNER_PIN_INVALID")
            alias = env["R139_ALIAS"]
            if not re.fullmatch(r"[A-Za-z0-9_.-]{1,128}", alias):
                raise SigningError("ALIAS_INVALID")
            store_pass = literal_property_value(env["R139_STOREPASS"], "STORE_PASSWORD_NOT_REPRESENTABLE")
            key_pass = literal_property_value(env["R139_KEYPASS"], "KEY_PASSWORD_NOT_REPRESENTABLE")
            try:
                encoded = env["R139_P12_B64"]
                # GitHub's secret text may contain ordinary Base64 line wrapping.
                encoded = re.sub(r"[ \t\r\n]", "", encoded)
                if len(encoded) > 2 * 1024 * 1024:
                    raise SigningError("PKCS12_TOO_LARGE")
                data = base64.b64decode(encoded, validate=True)
            except (ValueError, binascii.Error):
                raise SigningError("BASE64_INVALID") from None
            if not 128 <= len(data) <= 1024 * 1024:
                raise SigningError("PKCS12_SIZE_INVALID")
            return {"pin": pin.lower(), "alias": alias, "store_pass": store_pass, "key_pass": key_pass}, data


        def atomic_write(path: Path, data: bytes, mode: int) -> None:
            path.parent.mkdir(parents=True, exist_ok=True)
            temporary = None
            try:
                with tempfile.NamedTemporaryFile(prefix=".r13198-", dir=path.parent, delete=False) as handle:
                    temporary = Path(handle.name)
                    os.chmod(temporary, mode)
                    handle.write(data)
                    handle.flush()
                    os.fsync(handle.fileno())
                os.replace(temporary, path)
            finally:
                if temporary is not None and temporary.exists():
                    temporary.unlink()


        def import_signing(workspace: Path, env: dict[str, str]) -> dict:
            values, keystore_bytes = configuration(env)
            workspace = workspace.resolve()
            if not workspace.is_dir():
                raise SigningError("WORKSPACE_MISSING")
            key_path = workspace / "magisk/r6-ci-only.p12"
            props_path = workspace / "r6-build.prop"
            report_path = workspace / "reports/R13198_SIGNING_IDENTITY.json"
            cert_path = workspace / "reports/R13198_SIGNER_CERT.der"
            key_path_value = literal_property_value(str(key_path), "KEYSTORE_PATH_NOT_REPRESENTABLE")
            java = shutil.which("java")
            if not java:
                raise SigningError("JAVA_UNAVAILABLE")
            props = {
                "abiList": ABI_LIST,
                "keyStore": key_path_value,
                "keyStorePass": values["store_pass"],
                "keyPass": values["key_pass"],
                "keyAlias": values["alias"],
            }
            properties_bytes = "".join(f"{key}={value}\n" for key, value in props.items()).encode("ascii")
            # Check the literal parser contract used by pinned Magisk build.py.
            decoded = {}
            for line in properties_bytes.decode("ascii").splitlines():
                key, sep, value = line.strip(" \t\r\n").partition("=")
                if sep and key.strip(" \t\r\n") and value.strip(" \t\r\n"):
                    decoded[key.strip(" \t\r\n")] = value.strip(" \t\r\n")
            if decoded != props:
                raise SigningError("PYTHON_PROPERTIES_MISMATCH")
            with tempfile.TemporaryDirectory(prefix=".r13198-signing-", dir=workspace) as temporary:
                stage = Path(temporary)
                stage_key = stage / "signer.p12"
                stage_props = stage / "build.prop"
                stage_cert = stage / "signer.der"
                source = stage / "R13198KeyStoreCheck.java"
                atomic_write(stage_key, keystore_bytes, 0o600)
                atomic_write(stage_props, properties_bytes, 0o600)
                source.write_text(JAVA_VALIDATOR, encoding="utf-8")
                child_env = dict(env)
                child_env[PIN_NAME] = values["pin"]
                child_env["R13198_VALIDATION_KEYSTORE_PATH"] = key_path_value
                try:
                    result = subprocess.run(
                        [java, str(source), str(stage_key), str(stage_props), str(stage_cert)],
                        env=child_env, text=True, capture_output=True, timeout=90, check=False,
                    )
                except (OSError, subprocess.SubprocessError):
                    raise SigningError("VALIDATOR_EXECUTION_FAILED") from None
                if result.returncode:
                    known = {
                        "CONFIGURATION_MISSING", "VALIDATOR_ARGUMENTS_INVALID", "JAVA_PROPERTIES_MISMATCH",
                        "STORE_PASSWORD_OR_CONTAINER_INVALID", "ALIAS_NOT_PRIVATE_KEY", "KEY_PASSWORD_INVALID",
                        "CERTIFICATE_INVALID", "CERTIFICATE_NOT_CURRENTLY_VALID", "SIGNER_PIN_MISMATCH",
                        "KEY_ALGORITHM_UNSUPPORTED", "PRIVATE_KEY_CERTIFICATE_MISMATCH", "VALIDATOR_FAILED",
                    }
                    codes = re.findall(r"(?m)^R13198_SIGNING_([A-Z0-9_]+)$", result.stderr)
                    code = codes[-1] if codes and codes[-1] in known else "VALIDATOR_EXECUTION_FAILED"
                    raise SigningError(code)
                try:
                    proof = json.loads(result.stdout)
                    der = stage_cert.read_bytes()
                except (OSError, ValueError):
                    raise SigningError("VALIDATOR_PROTOCOL_INVALID") from None
                if (proof.get("status") != "PASS" or proof.get("private_key_verified") is not True
                        or proof.get("java_properties_roundtrip") is not True
                        or proof.get("signer_sha256") != values["pin"]
                        or hashlib.sha256(der).hexdigest() != values["pin"]):
                    raise SigningError("VALIDATOR_PROOF_INVALID")
                # Nothing is published to the build until every credential/certificate check passes.
                atomic_write(key_path, keystore_bytes, 0o600)
                atomic_write(props_path, properties_bytes, 0o600)
                atomic_write(cert_path, der, 0o644)
                report = {
                    "schema": "r13198.persistent-signing-v1",
                    "status": "PASS",
                    "signing_mode": "STABLE_SECRET",
                    "expected_signer_sha256": values["pin"],
                    "signer_sha256": proof["signer_sha256"],
                    "key_algorithm": proof["key_algorithm"],
                    "private_key_verified": True,
                    "store_password_verified": True,
                    "key_password_verified": True,
                    "alias_is_private_key_entry": True,
                    "python_properties_roundtrip": True,
                    "java_properties_roundtrip": True,
                    "public_certificate": "reports/R13198_SIGNER_CERT.der",
                    "private_key_published": False,
                    "new_signing_key_generated": False,
                    "phone_update_compatibility": "NOT_ASSERTED_BY_SIGNING_IMPORT",
                }
                atomic_write(report_path, (json.dumps(report, indent=2) + "\n").encode(), 0o644)
                # Write the compatibility mode last; a successful process exit is still mandatory.
                atomic_write(workspace / "reports/R139_SIGNING_MODE.txt", b"STABLE_SECRET\n", 0o644)
                return report


        def main() -> int:
            parser = argparse.ArgumentParser(description=__doc__)
            parser.add_argument("--workspace", type=Path, default=Path.cwd())
            parser.add_argument("--check-config", action="store_true", help="Early presence/format check only; does not validate a private key or create outputs")
            args = parser.parse_args()
            try:
                if args.check_config:
                    values, _ = configuration(dict(os.environ))
                    print(json.dumps({"status": "CONFIG_PRESENT", "private_key_validated": False,
                                      "expected_signer_sha256": values["pin"]}))
                else:
                    print(json.dumps(import_signing(args.workspace, dict(os.environ)), sort_keys=True))
                return 0
            except SigningError as failure:
                if not args.check_config and args.workspace.is_dir():
                    # Do not erase an existing private key on failure. Invalidate only generated verdicts.
                    mode = args.workspace / "reports/R139_SIGNING_MODE.txt"
                    mode.unlink(missing_ok=True)
                    report = {"schema": "r13198.persistent-signing-v1", "status": "FAIL", "error": PREFIX + failure.code}
                    atomic_write(args.workspace / "reports/R13198_SIGNING_IDENTITY.json",
                                 (json.dumps(report, indent=2) + "\n").encode(), 0o644)
                print(PREFIX + failure.code)
                return 2
            except (OSError, ValueError):
                # Never print a subprocess exception or raw input; these can contain credentials.
                mode = args.workspace / "reports/R139_SIGNING_MODE.txt"
                try:
                    mode.unlink(missing_ok=True)
                except OSError:
                    pass
                print(PREFIX + "IO_OR_CONFIGURATION_FAILURE")
                return 2


        if __name__ == "__main__":
            raise SystemExit(main())
        R13199_EXISTING_IMPORTER_PY
        cat > R13199_SIGNING_SETUP_PREFLIGHT.py <<'R13199_SETUP_PREFLIGHT_PY'
        #!/usr/bin/env python3
        """Check signing setup without creating a key, building an APK or claiming PASS.

        check_signing_setup completes a diagnostic request even if setup is incomplete.
        build_release requires valid configuration before the unchanged private-key
        validator and build job may start. Presence/format never proves key ownership.
        """
        from __future__ import annotations

        import argparse
        import importlib.util
        import json
        import os
        from pathlib import Path
        import sys
        import tempfile


        SCHEMA = "r13199.signing-setup-preflight-v1"
        OPERATIONS = ("check_signing_setup", "build_release")
        SETTINGS = (
            ("R139_P12_B64", "MAGISK_HIDE_P12_BASE64", "secret"),
            ("R139_STOREPASS", "MAGISK_HIDE_P12_PASSWORD", "secret"),
            ("R139_KEYPASS", "MAGISK_HIDE_P12_KEY_PASSWORD", "secret"),
            ("R139_ALIAS", "MAGISK_HIDE_P12_ALIAS", "secret"),
            ("R13198_EXPECTED_SIGNER_SHA256", "MAGISK_HIDE_SIGNER_SHA256", "variable"),
        )
        KNOWN_ERRORS = frozenset({
            "CONFIGURATION_MISSING", "CONFIGURATION_INCOMPLETE", "SIGNER_PIN_MISSING",
            "SIGNER_PIN_INVALID", "ALIAS_INVALID", "STORE_PASSWORD_NOT_REPRESENTABLE",
            "KEY_PASSWORD_NOT_REPRESENTABLE", "PKCS12_TOO_LARGE", "BASE64_INVALID",
            "PKCS12_SIZE_INVALID",
        })
        MISSING_ERRORS = frozenset({"CONFIGURATION_MISSING", "CONFIGURATION_INCOMPLETE", "SIGNER_PIN_MISSING"})


        class QuietParser(argparse.ArgumentParser):
            def error(self, message):
                # argparse's normal error can echo an unknown user argument verbatim.
                print('{"status":"REQUEST_INVALID","error_code":"CLI_ARGUMENTS_INVALID","build_permitted":false}')
                raise SystemExit(2)


        def load_importer(path: Path):
            spec = importlib.util.spec_from_file_location("r13198_signing_import", path)
            if spec is None or spec.loader is None:
                raise ImportError("IMPORTER_UNAVAILABLE")
            module = importlib.util.module_from_spec(spec)
            spec.loader.exec_module(module)
            if not callable(getattr(module, "configuration", None)):
                raise ImportError("IMPORTER_CONFIGURATION_FUNCTION_MISSING")
            return module


        def inspect_setup(operation: str, env: dict[str, str], importer) -> tuple[dict, int]:
            """Return public names/statuses only. Never return any supplied value."""
            public_operation = operation if operation in OPERATIONS else "INVALID"
            present, missing = [], []
            for variable, public_name, kind in SETTINGS:
                value = env.get(variable, "")
                # The pin's surrounding whitespace is accepted by the unchanged importer.
                exists = bool(value.strip()) if kind == "variable" else bool(value)
                (present if exists else missing).append(public_name)
            report = {
                "schema": SCHEMA,
                "revision": "R13.19.9",
                "operation": public_operation,
                "status": "REQUEST_INVALID",
                "error_code": None,
                "provided_settings": present,
                "missing_settings": missing,
                "settings_types": {name: kind for _, name, kind in SETTINGS},
                "configuration_format_valid": False,
                "private_key_validated": False,
                "build_permitted": False,
                "apk_build": "NOT_REQUESTED" if public_operation == "check_signing_setup" else "NOT_STARTED",
                "signed_apk_produced": False,
                "android_runtime": "NOT_RUN",
                "release_status": "NOT_BUILT",
                "new_signing_key_generated": False,
                "secret_values_disclosed": False,
                "phone_installation_approval": "NOT_ESTABLISHED",
            }
            if public_operation == "INVALID":
                report["error_code"] = "OPERATION_INVALID"
                return report, 2
            try:
                # Reuse the exact release importer's configuration rules. Its returned
                # password/alias/key bytes stay local and are never added to the report.
                importer.configuration(dict(env))
            except importer.SigningError as failure:
                code = failure.code if failure.code in KNOWN_ERRORS else "CONFIGURATION_VALIDATION_FAILED"
                report["error_code"] = code
                report["status"] = "SETUP_REQUIRED" if code in MISSING_ERRORS else "CONFIGURATION_INVALID"
                return report, 0 if operation == "check_signing_setup" else 2
            except (ValueError, TypeError, UnicodeError):
                # Exceptions can contain invalid input bytes or secret values. Emit only
                # a fixed public code, never str(exception) or a traceback.
                report["error_code"] = "CONFIGURATION_VALIDATION_FAILED"
                report["status"] = "CONFIGURATION_INVALID"
                return report, 0 if operation == "check_signing_setup" else 2
            report["status"] = "CONFIG_PRESENT_NOT_KEY_VALIDATED"
            report["configuration_format_valid"] = True
            report["build_permitted"] = operation == "build_release"
            return report, 0


        def atomic_json(path: Path, report: dict) -> None:
            path.parent.mkdir(parents=True, exist_ok=True)
            temporary = None
            try:
                with tempfile.NamedTemporaryFile(prefix=".r13199-public-", dir=path.parent, delete=False) as stream:
                    temporary = Path(stream.name)
                    os.chmod(temporary, 0o644)
                    stream.write((json.dumps(report, indent=2, ensure_ascii=True) + "\n").encode("utf-8"))
                    stream.flush()
                    os.fsync(stream.fileno())
                os.replace(temporary, path)
            finally:
                if temporary is not None:
                    temporary.unlink(missing_ok=True)


        def publish_github(report: dict, env: dict[str, str]) -> None:
            output = env.get("GITHUB_OUTPUT")
            if output:
                with Path(output).open("a", encoding="utf-8") as stream:
                    stream.write("build_permitted=" + ("true" if report["build_permitted"] else "false") + "\n")
                    stream.write("status=" + report["status"] + "\n")
                    stream.write("operation=" + report["operation"] + "\n")
            summary = env.get("GITHUB_STEP_SUMMARY")
            if summary:
                lines = [
                    "## R13.19.9 – Signiereinrichtung", "",
                    "**Status:** `" + report["status"] + "`", "",
                    "**Auftrag:** `" + report["operation"] + "`", "",
                    "Dieser Schritt prüft ausschließlich Vorhandensein und Format der Konfiguration.",
                    "Es wurden keine APK gebaut, keine Android-Tests ausgeführt und kein privater Schlüssel validiert.",
                    "Eine erfolgreiche Einrichtungsprüfung ist keine Build- oder Installationsfreigabe.", "",
                ]
                if report["operation"] == "check_signing_setup":
                    lines += ["Der ausdrücklich gewählte Vorbereitungsmodus endet nach diesem Bericht. Alle Build- und Testjobs bleiben ausgelassen.", ""]
                elif report["build_permitted"]:
                    lines += ["Die formale Konfiguration ist vorhanden. Der nachfolgende Build muss den privaten Schlüssel unverändert vollständig prüfen.", ""]
                else:
                    lines += ["Der angeforderte signierte Build kann mit dieser Konfiguration nicht starten.", ""]
                if report["error_code"]:
                    lines += ["**Prüfcode:** `" + report["error_code"] + "`", ""]
                lines += ["| Einstellung | Typ | Im Job verfügbar |", "|---|---|---|"]
                for _, name, kind in SETTINGS:
                    state = "ja" if name in report["provided_settings"] else "fehlt"
                    lines.append("| `" + name + "` | " + kind + " | " + state + " |")
                lines += ["", "Die vorhandene Signieridentität erhalten und diese Werte unter Repository Settings → Secrets and variables → Actions hinterlegen.",
                          "Keine privaten Schlüssel oder Passwörter in den Bericht oder in den Chat übernehmen.", ""]
                with Path(summary).open("a", encoding="utf-8") as stream:
                    stream.write("\n".join(lines))


        def main(argv=None) -> int:
            parser = QuietParser(description=__doc__)
            parser.add_argument("--operation", required=True)
            parser.add_argument("--importer", type=Path, default=Path("R13198_IMPORT_SIGNING.py"))
            parser.add_argument("--report", type=Path, default=Path("reports/R13199_SIGNING_SETUP.json"))
            args = parser.parse_args(argv)
            try:
                importer = load_importer(args.importer)
                report, result = inspect_setup(args.operation, dict(os.environ), importer)
                atomic_json(args.report, report)
                publish_github(report, dict(os.environ))
                print(json.dumps(report, ensure_ascii=True, sort_keys=True))
                return result
            except (OSError, ImportError, SyntaxError, AttributeError, ValueError, TypeError, UnicodeError):
                # A broken script/read/write is an actual failure even in diagnostic mode.
                print('{"status":"PREFLIGHT_EXECUTION_FAILED","error_code":"PREFLIGHT_IO_OR_IMPORT_FAILURE","build_permitted":false}')
                return 2


        if __name__ == "__main__":
            raise SystemExit(main())
        R13199_SETUP_PREFLIGHT_PY
        python3 R13199_SIGNING_SETUP_PREFLIGHT.py --operation "$R13199_OPERATION" --importer R13198_IMPORT_SIGNING.py --report reports/R13199_SIGNING_SETUP.json
    - name: Publish public setup result only – no keys and no APK
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: R13199_SIGNING_SETUP_REPORT_NO_APK
        path: reports/R13199_SIGNING_SETUP.json
        if-no-files-found: warn
        retention-days: 14
  r139-hardened-pair-build:
    name: R13.19.8 full Magisk 31100 - persistent signer and strict APK/native identity
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    steps:
    - name: R13.19.8 - Require configured persistent signing identity before build setup
      shell: bash
      env:
        R139_P12_B64: ${{ secrets.MAGISK_HIDE_P12_BASE64 }}
        R139_STOREPASS: ${{ secrets.MAGISK_HIDE_P12_PASSWORD }}
        R139_KEYPASS: ${{ secrets.MAGISK_HIDE_P12_KEY_PASSWORD }}
        R139_ALIAS: ${{ secrets.MAGISK_HIDE_P12_ALIAS }}
        R13198_EXPECTED_SIGNER_SHA256: ${{ vars.MAGISK_HIDE_SIGNER_SHA256 }}
      run: |
        set -euo pipefail
        cat > R13198_IMPORT_SIGNING.py <<'R13198_SIGNING_IMPORT_PY'
        #!/usr/bin/env python3
        """Import one pinned, persistent signing identity. Never generate a release key.

        Secrets are read only from the four established R139_* environment variables.
        The project signer pin is public configuration in R13198_EXPECTED_SIGNER_SHA256.
        No passwords, aliases, keystore bytes or child-tool diagnostics are printed.
        """
        from __future__ import annotations

        import argparse
        import base64
        import binascii
        import hashlib
        import json
        import os
        from pathlib import Path
        import re
        import shutil
        import subprocess
        import tempfile


        SECRET_NAMES = ("R139_P12_B64", "R139_STOREPASS", "R139_KEYPASS", "R139_ALIAS")
        PIN_NAME = "R13198_EXPECTED_SIGNER_SHA256"
        ABI_LIST = "arm64-v8a,armeabi-v7a,x86_64,x86"
        PREFIX = "R13198_SIGNING_"


        class SigningError(Exception):
            def __init__(self, code: str):
                self.code = code
                super().__init__(PREFIX + code)


        JAVA_VALIDATOR = r'''import java.io.InputStream;
        import java.nio.file.Files;
        import java.nio.file.Path;
        import java.security.Key;
        import java.security.KeyStore;
        import java.security.MessageDigest;
        import java.security.PrivateKey;
        import java.security.SecureRandom;
        import java.security.Signature;
        import java.security.cert.X509Certificate;
        import java.util.Arrays;
        import java.util.HexFormat;
        import java.util.Properties;

        class R13198KeyStoreCheck {
            static final class Rejected extends Exception {
                final String code;
                Rejected(String value) { code = value; }
            }
            static String env(String name) throws Rejected {
                String value = System.getenv(name);
                if (value == null || value.isEmpty()) throw new Rejected("CONFIGURATION_MISSING");
                return value;
            }
            static void require(boolean value, String code) throws Rejected {
                if (!value) throw new Rejected(code);
            }
            static void run(String[] args) throws Exception {
                require(args.length == 3, "VALIDATOR_ARGUMENTS_INVALID");
                String alias = env("R139_ALIAS");
                char[] storePassword = env("R139_STOREPASS").toCharArray();
                char[] keyPassword = env("R139_KEYPASS").toCharArray();
                try {
                    // This is the same InputStream parser used by Magisk's Gradle plugin.
                    Properties props = new Properties();
                    try (InputStream in = Files.newInputStream(Path.of(args[1]))) { props.load(in); }
                    require(env("R139_STOREPASS").equals(props.getProperty("keyStorePass")), "JAVA_PROPERTIES_MISMATCH");
                    require(env("R139_KEYPASS").equals(props.getProperty("keyPass")), "JAVA_PROPERTIES_MISMATCH");
                    require(alias.equals(props.getProperty("keyAlias")), "JAVA_PROPERTIES_MISMATCH");
                    require(env("R13198_VALIDATION_KEYSTORE_PATH").equals(props.getProperty("keyStore")), "JAVA_PROPERTIES_MISMATCH");
                    require("arm64-v8a,armeabi-v7a,x86_64,x86".equals(props.getProperty("abiList")), "JAVA_PROPERTIES_MISMATCH");

                    KeyStore store = KeyStore.getInstance("PKCS12");
                    try (InputStream in = Files.newInputStream(Path.of(args[0]))) {
                        try { store.load(in, storePassword); }
                        catch (Exception ignored) { throw new Rejected("STORE_PASSWORD_OR_CONTAINER_INVALID"); }
                    }
                    require(store.containsAlias(alias) && store.isKeyEntry(alias), "ALIAS_NOT_PRIVATE_KEY");
                    Key key;
                    try { key = store.getKey(alias, keyPassword); }
                    catch (Exception ignored) { throw new Rejected("KEY_PASSWORD_INVALID"); }
                    require(key instanceof PrivateKey, "ALIAS_NOT_PRIVATE_KEY");
                    require(store.getCertificate(alias) instanceof X509Certificate, "CERTIFICATE_INVALID");
                    X509Certificate cert = (X509Certificate) store.getCertificate(alias);
                    try { cert.checkValidity(); }
                    catch (Exception ignored) { throw new Rejected("CERTIFICATE_NOT_CURRENTLY_VALID"); }
                    byte[] der = cert.getEncoded();
                    String digest = HexFormat.of().formatHex(MessageDigest.getInstance("SHA-256").digest(der));
                    require(digest.equals(env("R13198_EXPECTED_SIGNER_SHA256")), "SIGNER_PIN_MISMATCH");

                    String algorithm;
                    String keyKind;
                    switch (key.getAlgorithm()) {
                        case "RSA": algorithm = "SHA256withRSA"; keyKind = "RSA"; break;
                        case "EC": algorithm = "SHA256withECDSA"; keyKind = "EC"; break;
                        case "DSA": algorithm = "SHA256withDSA"; keyKind = "DSA"; break;
                        default: throw new Rejected("KEY_ALGORITHM_UNSUPPORTED");
                    }
                    // Prove the private key is usable and corresponds to the pinned public cert.
                    byte[] challenge = new byte[32];
                    new SecureRandom().nextBytes(challenge);
                    Signature proof = Signature.getInstance(algorithm);
                    proof.initSign((PrivateKey) key);
                    proof.update(challenge);
                    byte[] signature = proof.sign();
                    proof.initVerify(cert.getPublicKey());
                    proof.update(challenge);
                    require(proof.verify(signature), "PRIVATE_KEY_CERTIFICATE_MISMATCH");
                    Files.write(Path.of(args[2]), der);
                    System.out.println("{\"status\":\"PASS\",\"signer_sha256\":\"" + digest
                        + "\",\"key_algorithm\":\"" + keyKind
                        + "\",\"private_key_verified\":true,\"certificate_valid\":true,"
                        + "\"java_properties_roundtrip\":true}");
                } finally {
                    Arrays.fill(storePassword, '\0');
                    Arrays.fill(keyPassword, '\0');
                }
            }
            public static void main(String[] args) {
                try { run(args); }
                catch (Rejected failure) { System.err.println("R13198_SIGNING_" + failure.code); System.exit(2); }
                catch (Exception ignored) { System.err.println("R13198_SIGNING_VALIDATOR_FAILED"); System.exit(2); }
            }
        }
        '''


        def literal_property_value(value: str, code: str) -> str:
            # build.py keeps literal backslashes and UTF-8; Java Properties unescapes
            # backslashes and decodes ISO-8859-1. There is no lossless common encoding
            # for such values without changing an upstream parser. Reject, never alter.
            if (not value or value != value.strip(" \t\r\n") or "\\" in value
                    or any(ord(ch) < 32 or ord(ch) > 126 for ch in value)):
                raise SigningError(code)
            return value


        def configuration(env: dict[str, str]) -> tuple[dict[str, str], bytes]:
            present = sum(bool(env.get(name)) for name in SECRET_NAMES)
            if present == 0:
                raise SigningError("CONFIGURATION_MISSING")
            if present != len(SECRET_NAMES):
                raise SigningError("CONFIGURATION_INCOMPLETE")
            pin = env.get(PIN_NAME, "").strip()
            if not pin:
                raise SigningError("SIGNER_PIN_MISSING")
            if not re.fullmatch(r"[0-9A-Fa-f]{64}", pin):
                raise SigningError("SIGNER_PIN_INVALID")
            alias = env["R139_ALIAS"]
            if not re.fullmatch(r"[A-Za-z0-9_.-]{1,128}", alias):
                raise SigningError("ALIAS_INVALID")
            store_pass = literal_property_value(env["R139_STOREPASS"], "STORE_PASSWORD_NOT_REPRESENTABLE")
            key_pass = literal_property_value(env["R139_KEYPASS"], "KEY_PASSWORD_NOT_REPRESENTABLE")
            try:
                encoded = env["R139_P12_B64"]
                # GitHub's secret text may contain ordinary Base64 line wrapping.
                encoded = re.sub(r"[ \t\r\n]", "", encoded)
                if len(encoded) > 2 * 1024 * 1024:
                    raise SigningError("PKCS12_TOO_LARGE")
                data = base64.b64decode(encoded, validate=True)
            except (ValueError, binascii.Error):
                raise SigningError("BASE64_INVALID") from None
            if not 128 <= len(data) <= 1024 * 1024:
                raise SigningError("PKCS12_SIZE_INVALID")
            return {"pin": pin.lower(), "alias": alias, "store_pass": store_pass, "key_pass": key_pass}, data


        def atomic_write(path: Path, data: bytes, mode: int) -> None:
            path.parent.mkdir(parents=True, exist_ok=True)
            temporary = None
            try:
                with tempfile.NamedTemporaryFile(prefix=".r13198-", dir=path.parent, delete=False) as handle:
                    temporary = Path(handle.name)
                    os.chmod(temporary, mode)
                    handle.write(data)
                    handle.flush()
                    os.fsync(handle.fileno())
                os.replace(temporary, path)
            finally:
                if temporary is not None and temporary.exists():
                    temporary.unlink()


        def import_signing(workspace: Path, env: dict[str, str]) -> dict:
            values, keystore_bytes = configuration(env)
            workspace = workspace.resolve()
            if not workspace.is_dir():
                raise SigningError("WORKSPACE_MISSING")
            key_path = workspace / "magisk/r6-ci-only.p12"
            props_path = workspace / "r6-build.prop"
            report_path = workspace / "reports/R13198_SIGNING_IDENTITY.json"
            cert_path = workspace / "reports/R13198_SIGNER_CERT.der"
            key_path_value = literal_property_value(str(key_path), "KEYSTORE_PATH_NOT_REPRESENTABLE")
            java = shutil.which("java")
            if not java:
                raise SigningError("JAVA_UNAVAILABLE")
            props = {
                "abiList": ABI_LIST,
                "keyStore": key_path_value,
                "keyStorePass": values["store_pass"],
                "keyPass": values["key_pass"],
                "keyAlias": values["alias"],
            }
            properties_bytes = "".join(f"{key}={value}\n" for key, value in props.items()).encode("ascii")
            # Check the literal parser contract used by pinned Magisk build.py.
            decoded = {}
            for line in properties_bytes.decode("ascii").splitlines():
                key, sep, value = line.strip(" \t\r\n").partition("=")
                if sep and key.strip(" \t\r\n") and value.strip(" \t\r\n"):
                    decoded[key.strip(" \t\r\n")] = value.strip(" \t\r\n")
            if decoded != props:
                raise SigningError("PYTHON_PROPERTIES_MISMATCH")
            with tempfile.TemporaryDirectory(prefix=".r13198-signing-", dir=workspace) as temporary:
                stage = Path(temporary)
                stage_key = stage / "signer.p12"
                stage_props = stage / "build.prop"
                stage_cert = stage / "signer.der"
                source = stage / "R13198KeyStoreCheck.java"
                atomic_write(stage_key, keystore_bytes, 0o600)
                atomic_write(stage_props, properties_bytes, 0o600)
                source.write_text(JAVA_VALIDATOR, encoding="utf-8")
                child_env = dict(env)
                child_env[PIN_NAME] = values["pin"]
                child_env["R13198_VALIDATION_KEYSTORE_PATH"] = key_path_value
                try:
                    result = subprocess.run(
                        [java, str(source), str(stage_key), str(stage_props), str(stage_cert)],
                        env=child_env, text=True, capture_output=True, timeout=90, check=False,
                    )
                except (OSError, subprocess.SubprocessError):
                    raise SigningError("VALIDATOR_EXECUTION_FAILED") from None
                if result.returncode:
                    known = {
                        "CONFIGURATION_MISSING", "VALIDATOR_ARGUMENTS_INVALID", "JAVA_PROPERTIES_MISMATCH",
                        "STORE_PASSWORD_OR_CONTAINER_INVALID", "ALIAS_NOT_PRIVATE_KEY", "KEY_PASSWORD_INVALID",
                        "CERTIFICATE_INVALID", "CERTIFICATE_NOT_CURRENTLY_VALID", "SIGNER_PIN_MISMATCH",
                        "KEY_ALGORITHM_UNSUPPORTED", "PRIVATE_KEY_CERTIFICATE_MISMATCH", "VALIDATOR_FAILED",
                    }
                    codes = re.findall(r"(?m)^R13198_SIGNING_([A-Z0-9_]+)$", result.stderr)
                    code = codes[-1] if codes and codes[-1] in known else "VALIDATOR_EXECUTION_FAILED"
                    raise SigningError(code)
                try:
                    proof = json.loads(result.stdout)
                    der = stage_cert.read_bytes()
                except (OSError, ValueError):
                    raise SigningError("VALIDATOR_PROTOCOL_INVALID") from None
                if (proof.get("status") != "PASS" or proof.get("private_key_verified") is not True
                        or proof.get("java_properties_roundtrip") is not True
                        or proof.get("signer_sha256") != values["pin"]
                        or hashlib.sha256(der).hexdigest() != values["pin"]):
                    raise SigningError("VALIDATOR_PROOF_INVALID")
                # Nothing is published to the build until every credential/certificate check passes.
                atomic_write(key_path, keystore_bytes, 0o600)
                atomic_write(props_path, properties_bytes, 0o600)
                atomic_write(cert_path, der, 0o644)
                report = {
                    "schema": "r13198.persistent-signing-v1",
                    "status": "PASS",
                    "signing_mode": "STABLE_SECRET",
                    "expected_signer_sha256": values["pin"],
                    "signer_sha256": proof["signer_sha256"],
                    "key_algorithm": proof["key_algorithm"],
                    "private_key_verified": True,
                    "store_password_verified": True,
                    "key_password_verified": True,
                    "alias_is_private_key_entry": True,
                    "python_properties_roundtrip": True,
                    "java_properties_roundtrip": True,
                    "public_certificate": "reports/R13198_SIGNER_CERT.der",
                    "private_key_published": False,
                    "new_signing_key_generated": False,
                    "phone_update_compatibility": "NOT_ASSERTED_BY_SIGNING_IMPORT",
                }
                atomic_write(report_path, (json.dumps(report, indent=2) + "\n").encode(), 0o644)
                # Write the compatibility mode last; a successful process exit is still mandatory.
                atomic_write(workspace / "reports/R139_SIGNING_MODE.txt", b"STABLE_SECRET\n", 0o644)
                return report


        def main() -> int:
            parser = argparse.ArgumentParser(description=__doc__)
            parser.add_argument("--workspace", type=Path, default=Path.cwd())
            parser.add_argument("--check-config", action="store_true", help="Early presence/format check only; does not validate a private key or create outputs")
            args = parser.parse_args()
            try:
                if args.check_config:
                    values, _ = configuration(dict(os.environ))
                    print(json.dumps({"status": "CONFIG_PRESENT", "private_key_validated": False,
                                      "expected_signer_sha256": values["pin"]}))
                else:
                    print(json.dumps(import_signing(args.workspace, dict(os.environ)), sort_keys=True))
                return 0
            except SigningError as failure:
                if not args.check_config and args.workspace.is_dir():
                    # Do not erase an existing private key on failure. Invalidate only generated verdicts.
                    mode = args.workspace / "reports/R139_SIGNING_MODE.txt"
                    mode.unlink(missing_ok=True)
                    report = {"schema": "r13198.persistent-signing-v1", "status": "FAIL", "error": PREFIX + failure.code}
                    atomic_write(args.workspace / "reports/R13198_SIGNING_IDENTITY.json",
                                 (json.dumps(report, indent=2) + "\n").encode(), 0o644)
                print(PREFIX + failure.code)
                return 2
            except (OSError, ValueError):
                # Never print a subprocess exception or raw input; these can contain credentials.
                mode = args.workspace / "reports/R139_SIGNING_MODE.txt"
                try:
                    mode.unlink(missing_ok=True)
                except OSError:
                    pass
                print(PREFIX + "IO_OR_CONFIGURATION_FAILURE")
                return 2


        if __name__ == "__main__":
            raise SystemExit(main())
        R13198_SIGNING_IMPORT_PY
        python3 R13198_IMPORT_SIGNING.py --check-config
    - name: Fetch official pinned v31.1 and its historical sources
      uses: actions/checkout@v6
      with:
        repository: topjohnwu/Magisk
        ref: 0972f67d97f9b6302b67c5171283330c74114b4a
        path: magisk
        fetch-depth: 0
        submodules: recursive
        persist-credentials: false
    - name: Restore original signer, APK-XML and key generator files
      shell: bash
      run: |
        set -euo pipefail
        source_commit=0972f67d97f9b6302b67c5171283330c74114b4a
        legacy_commit=ea16c8141eb64dc28b56a0e7fb536689ef465429
        test "$(git -C magisk rev-parse HEAD)" = "$source_commit"
        git -C magisk merge-base --is-ancestor "$legacy_commit" "$source_commit"
        mkdir -p reports
        : > reports/restored_sha256.txt
        mkdir -p magisk/app/core/src/main/java/com/topjohnwu/magisk/core/signing
        mapfile -t signer_files < <(git -C magisk ls-tree -r --name-only "$legacy_commit" app/core/src/main/java/com/topjohnwu/magisk/core/signing/ | grep -E '\.java$')
        test "${#signer_files[@]}" -eq 5
        for path in "${signer_files[@]}" \
          app/core/src/main/java/com/topjohnwu/magisk/core/utils/AXML.kt \
          app/core/src/main/java/com/topjohnwu/magisk/core/utils/Keygen.kt; do
          git -C magisk cat-file -e "$legacy_commit:$path"
          mkdir -p "magisk/$(dirname "$path")"
          git -C magisk show "$legacy_commit:$path" > "magisk/$path"
          test -s "magisk/$path"
          sha256sum "magisk/$path" >> reports/restored_sha256.txt
        done
        test "$(wc -l < reports/restored_sha256.txt)" -eq 7
        printf 'Recovered %s historical signer/XML/keystore files\n' "$(wc -l < reports/restored_sha256.txt)"
