          'arm64-v8a': ('arm64', 2, 183),
          'armeabi-v7a': ('armeabi_v7a', 1, 40),
          'x86_64': ('x86_64', 2, 62),
          'x86': ('x86', 1, 3),
        }
        def digest(b: bytes) -> str: return hashlib.sha256(b).hexdigest()
        def gate(root: Path, report: Path):
          apkfile=root/'out/app-release.apk'
          source=(root/'app/core/src/main/java/com/topjohnwu/magisk/core/tasks/AppMigration.kt').read_text()
          if source.count('val abi = android.os.Build.SUPPORTED_ABIS.firstOrNull()') != 1:
            raise AssertionError('R1317_ARCH_SELECTED_FROM_RUNTIME_MISSING')
          if source.count('VERIFY_ARCHITECTURE=$abi') != 1:
            raise AssertionError('R1317_ARCH_LOG_MISSING')
          if 'RUNNING_DAEMON_DIGEST_MISMATCH' not in source:
            raise AssertionError('R1317_FAIL_CLOSED_COMPARISON_MISSING')
          checked={}
          with zipfile.ZipFile(apkfile) as z:
            assert z.testzip() is None, 'R1317_APK_CORRUPT'
            for abi,(suffix,expected_class,expected_machine) in ARCHES.items():
              native = root/'native/out'/abi/'magisk'
              assert native.is_file() and native.stat().st_size > 100_000, f'MISSING_NATIVE_BINARY_{abi}'
              raw=native.read_bytes()
              assert raw[:4] == b'\x7fELF' and raw[4] == expected_class, f'BAD_ELF_CLASS_{abi}'
              assert struct.unpack_from('<H',raw,18)[0] == expected_machine, f'BAD_ELF_MACHINE_{abi}'
              embedded=f'assets/r139_expected_{suffix}_magisk.sha256'
              packaged=f'lib/{abi}/libmagisk.so'
              assert embedded in z.namelist() and packaged in z.namelist(), f'ABI_OR_DIGEST_ASSET_MISSING_{abi}'
              h=digest(raw)
              assert z.read(embedded).decode('ascii').strip() == h, f'DIGEST_ASSET_WRONG_{abi}'
              assert digest(z.read(packaged)) == h, f'APK_NATIVE_MISMATCH_{abi}'
              assert source.count('"'+abi+'" -> "r139_expected_'+suffix+'_magisk.sha256"')==1, f'RUNTIME_MAPPING_MISSING_{abi}'
              checked[abi]=h
          out={'revision':'R13.17','status':'PASS','scope':'APK_NATIVE_ASSETS_ALL_4_ABIS_ONLY',
            'native_abis':checked,'runtime_architecture_gate':'PRESENT','unsafe_hash_bypass':False,
            'physical_device_test':'NOT_EXECUTED','hide_restore_phone':'NOT_ATTESTED','release':'HOLD'}
          report.parent.mkdir(parents=True,exist_ok=True)
          report.write_text(json.dumps(out,indent=2)+'\n')
          print('R13.17 4/4 ABI native executable = signed APK = runtime-selected asset: PASS; phone HOLD')
          return out
        if __name__=='__main__':
          gate(Path(sys.argv[1]),Path(sys.argv[2]))
