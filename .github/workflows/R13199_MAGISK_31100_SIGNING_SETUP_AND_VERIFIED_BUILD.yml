                if (!root.isSuccess || root.out.none { it.trim() == "0" }) {
                    android.util.Log.e("R1312Hide", "HIDDEN_MANAGER_ROOT_UNAVAILABLE")
                    return false
                }
                val original = Shell.cmd("pm path $APP_PACKAGE_NAME").await()
                val hidden = Shell.cmd("pm path ${context.packageName}").await()
                val valid = original.isSuccess && hidden.isSuccess &&
                    original.out.any { it.startsWith("package:") } &&
                    hidden.out.any { it.startsWith("package:") }
                android.util.Log.i("R1312Hide", if (valid)
                    "HIDDEN_PACKAGE_ACTIVE_ORIGINAL_PRESERVED" else "PM_OR_PACKAGE_STATE_UNCERTAIN")
