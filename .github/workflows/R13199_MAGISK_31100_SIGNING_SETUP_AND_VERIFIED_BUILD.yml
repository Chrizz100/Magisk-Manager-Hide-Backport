        #!/usr/bin/env python3
        """R13.19: strictly anchored source repair for R13.18 Magisk 31.1.

        No device actions. CI runs this after the already-working R13.12 source patch,
        and before compiling. Keep untouched patches and source dependencies intact.
        """
        from __future__ import annotations
        import hashlib, json, sys
        from pathlib import Path
        from R1312_ORIGINAL_HIDE_SAFE_PORT import SAFE_FINALIZER, REMOVED_UI
        from R1310_RESTORE_TRANSACTIONAL_HIDE import RESTORE_NEW

        MIGRATION='app/core/src/main/java/com/topjohnwu/magisk/core/tasks/AppMigration.kt'
        UI='app/apk/src/main/java/com/topjohnwu/magisk/ui/home/HomeScreen.kt'
        VM='app/apk/src/main/java/com/topjohnwu/magisk/ui/home/HomeViewModel.kt'

        # `pm disable` below applies ONLY to a single launch component; never to the
        # application package, system services, Magisk daemon, or root itself.
        LAUNCHER_COMPONENT='com.topjohnwu.magisk/.ui.MainActivity'

        NEW_FINALIZER='''    /**
             * R13.19: second, EXPLICIT user action performed inside an already running
             * random-package stub. Do not remove or disable the original application.
             * Disable only its MAIN/LAUNCHER component, reversibly, after proving root.
             */
            suspend fun finalizeConcealmentAvd(context: Context): Boolean {
                if (!isRunningAsStub || context.packageName == APP_PACKAGE_NAME ||
                    Const.USER_ID != 0 || Config.suManager != context.packageName ||
                    !r133MatchingBackend() || !r139SameDaemon(context) ||
                    !ManagerPackageNames.isCandidate(context.packageName)) {
                    android.util.Log.e("R1319Hide", "HIDDEN_MANAGER_NOT_AUTHENTICATED")
                    return false
                }
                return withContext(Dispatchers.IO) {
                    try {
                        val root = Shell.cmd("id -u").await()
                        if (!root.isSuccess || root.out.none { it.trim() == "0" }) {
                            android.util.Log.e("R1319Hide", "HIDDEN_MANAGER_ROOT_UNAVAILABLE")
                            return@withContext false
                        }
                        val original = Shell.cmd("pm path $APP_PACKAGE_NAME").await()
                        val hidden = Shell.cmd("pm path ${context.packageName}").await()
                        if (!original.isSuccess || !hidden.isSuccess ||
                            original.out.none { it.startsWith("package:") } ||
                            hidden.out.none { it.startsWith("package:") }) {
                            android.util.Log.e("R1319Hide", "ORIGINAL_OR_HIDDEN_PACKAGE_MISSING")
                            return@withContext false
                        }
                        val pm = context.packageManager
                        val component = android.content.ComponentName(
                            APP_PACKAGE_NAME, "$APP_PACKAGE_NAME.ui.MainActivity")
                        val before = pm.getComponentEnabledSetting(component)
                        if (before == PackageManager.COMPONENT_ENABLED_STATE_DISABLED) {
                            android.util.Log.i("R1319Hide", "ORIGINAL_LAUNCHER_ALREADY_HIDDEN")
                            return@withContext true
                        }
                        if (before != PackageManager.COMPONENT_ENABLED_STATE_DEFAULT &&
                            before != PackageManager.COMPONENT_ENABLED_STATE_ENABLED) {
                            android.util.Log.e("R1319Hide", "ORIGINAL_HAS_OTHER_DISABLED_STATE")
                            return@withContext false
                        }
                        // Only disable the *single* exported launcher activity.
                        val action = Shell.cmd("pm disable --user 0 $APP_PACKAGE_NAME/.ui.MainActivity").await()
                        val after = pm.getComponentEnabledSetting(component)
                        if (!action.isSuccess || after != PackageManager.COMPONENT_ENABLED_STATE_DISABLED) {
                            // Immediate recovery attempt; never leave original silently disabled.
                            val recover = Shell.cmd("pm enable --user 0 $APP_PACKAGE_NAME/.ui.MainActivity").await()
                            android.util.Log.e("R1319Hide", if (recover.isSuccess)
                                "ORIGINAL_LAUNCHER_DISABLE_ROLLED_BACK" else "ORIGINAL_LAUNCHER_RECOVERY_REQUIRED")
                            return@withContext false
