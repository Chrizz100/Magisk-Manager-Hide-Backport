        #!/usr/bin/env python3
        """R13.12: retain the original Magisk v30 package-repack/restore contract.

        Applied AFTER R13.10.1 source patches and BEFORE the native/app builds.

        The previous R13.10 implementation added an extra original-app removal
        operation absent from v30 AppMigration.patchAndHide(); the user explicitly
        requires retaining the working original/root as an independent fallback.
        This patch never changes the installed phone (it only edits CI source files).
        """
        from __future__ import annotations
        import hashlib, json, sys
        from pathlib import Path
        from R1310_RESTORE_TRANSACTIONAL_HIDE import FINALIZE_NEW, UI_ACTIVE

        MIGRATION = 'app/core/src/main/java/com/topjohnwu/magisk/core/tasks/AppMigration.kt'
        SCREEN = 'app/apk/src/main/java/com/topjohnwu/magisk/ui/home/HomeScreen.kt'
        NATIVE = 'native/src/core/package.rs'

        # A legacy UI method is retained because HomeViewModel references it, but it
        # DOES NOT delete, disable, hide the icon of, or replace the original app.
        # The package-name change happens in the v30 patchAndHide() first stage.
        SAFE_FINALIZER = '''    /**
             * R13.12: read-only second-stage proof. The original Magisk v30
             * package migration installs a new random-name stub and binds it in
             * magiskd; it does not need a second original-app uninstall action.
             * Preserve the existing app and its Root grant as a fallback.
             */
            suspend fun finalizeConcealmentAvd(context: Context): Boolean {
                if (!isRunningAsStub || context.packageName == APP_PACKAGE_NAME ||
                    Const.USER_ID != 0 || Config.suManager != context.packageName ||
                    !r133MatchingBackend()) {
                    android.util.Log.e("R1312Hide", "HIDDEN_MANAGER_NOT_AUTHENTICATED")
                    return false
                }
