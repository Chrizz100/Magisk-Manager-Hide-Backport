        HIDE_END = "    private fun r133MatchingBackend(): Boolean =\n"
        VM_START = "    fun hideManager(label: String) {\n"
        VM_END = "    /** R11.4 AVD-only explicitly requested final package-concealment step. */\n"

        NEW_HIDE = '''    /** R13.5: state is diagnostic only; never represents successful root. */
            @Volatile var lastHideError: String = "NOT_STARTED"
                private set

            private fun r135HideFail(reason: String): Boolean {
                lastHideError = reason
                android.util.Log.e("R135MagiskHide", reason)
                return false
            }

            suspend fun patchAndHide(context: Context, label: String, pkg: String? = null): Boolean {
                lastHideError = "STARTED"
                // No fallback to an unverified Alpha or unrelated daemon. Numeric version alone
                // cannot prove that a running daemon accepts repackaged manager certificates.
                if (context.packageName != APP_PACKAGE_NAME || isRunningAsStub) {
                    return r135HideFail("PRECHECK_NOT_ORIGINAL_MANAGER")
                }
                if (!r133MatchingBackend()) return r135HideFail("PRECHECK_DAEMON_OR_ROOT_MISMATCH")
                if (label.isBlank() || label.length > MAX_LABEL_LENGTH || label.any(Char::isISOControl)) {
                    return r135HideFail("PRECHECK_INVALID_LABEL")
                }
                val target = pkg ?: genPackageName()
                if (!ManagerPackageNames.isCandidate(target)) return r135HideFail("PRECHECK_INVALID_TARGET_NAME")

                val installed = withContext(Dispatchers.IO) {
                    try {
                        // Verify the already installed manager is capable of authenticated SU.
                        // A working magiskd process does not imply that this APK can request root.
                        val suCheck = Shell.cmd("id -u").await()
