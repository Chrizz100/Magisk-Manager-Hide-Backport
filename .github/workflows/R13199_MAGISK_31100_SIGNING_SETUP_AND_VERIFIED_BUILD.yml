                            return@withContext r135HideFail("PRECHECK_MANAGER_SU_UNAVAILABLE")
                        }

                        val stub = File(context.cacheDir, "stub.apk")
                        context.assets.open("stub.apk").writeTo(stub)
                        if (!stub.isFile || stub.length() < 1000) {
                            return@withContext r135HideFail("STUB_ASSET_MISSING_OR_EMPTY")
                        }
                        val alreadyPresent = try {
                            context.packageManager.getApplicationInfo(target, 0)
                            true
                        } catch (_: PackageManager.NameNotFoundException) {
                            false
                        }
                        if (alreadyPresent) return@withContext r135HideFail("TARGET_PACKAGE_ALREADY_EXISTS")

                        Config.keyStoreRaw = "" // Preserve historical per-migration stub signing.
                        val repack = File(context.cacheDir, "patched-$target.apk")
                        val signed = repack.outputStream().use { patch(context, stub, it, target, label) }
                        if (!signed || !repack.isFile || repack.length() < 1000) {
                            return@withContext r135HideFail("STUB_REPACK_OR_SIGN_FAILED")
                        }
                        android.util.Log.i("R135MagiskHide", "STUB_PATCHED")
                        val installResult = Shell.cmd("adb_pm_install $repack $target").await()
                        if (!installResult.isSuccess) {
                            android.util.Log.e("R135MagiskHide", "PM_INSTALL: " + installResult.err.joinToString(" ").take(400))
