        _CLEANUP_NEW = '''                // Only arm self-cleanup after the original has started AND the
                        // manager binding reset has been read back successfully.
                        Config.suManager = ""
                        if (Config.suManager != "") {
                            android.util.Log.e("R1310Restore", "MANAGER_BIND_RESET_FAILED")
                            return@withContext false
                        }
                        android.util.Log.i("R13196Restore", "MANAGER_BIND_RESET_VERIFIED")
                        // Reuse the existing authenticated root shell. The detached
                        // command can delete only this hidden package, and only while
                        // the retained original package and process are still present.
                        val cleanupCommand = "(sleep 12; pm path $APP_PACKAGE_NAME | grep -q '^package:' && " +
                            "pidof $APP_PACKAGE_NAME >/dev/null 2>&1 && " +
                            "pm uninstall --user 0 ${context.packageName}) </dev/null >/dev/null 2>&1 &"
                        val cleanup = Shell.cmd(cleanupCommand).await()
                        if (!cleanup.isSuccess) {
                            android.util.Log.e("R1319Restore", "CLEANUP_SCHEDULING_FAILED_KEEP_HIDDEN")
                            return@withContext false
                        }'''
        RESTORE_METHOD_V2 = replace_once(
            RESTORE_METHOD_V2, _CLEANUP_OLD, _CLEANUP_NEW, 'CLEANUP_AFTER_VERIFIED_UNBIND')

        VM_OLD = '''    fun restoreManager() {
                if (_uiState.value.showLoading) return
                viewModelScope.launch {
                    val success = try {
                        withLoading {
                            val context = AppContext.foregroundActivity ?: AppContext
