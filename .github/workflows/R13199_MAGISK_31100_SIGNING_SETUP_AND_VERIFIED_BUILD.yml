    - name: R13.13 - Require API24..37 baseline manifest and all four original Magisk native ABIs
      shell: bash
      run: |
        set -euo pipefail
        cat > R1313_APK_PLATFORM_GATE.py <<'R1313_PY'
        #!/usr/bin/env python3
        """Android 7/API24..Android 17/API37 APK contract verifier. No device writes."""
        from __future__ import annotations
        import argparse, hashlib, json, struct, zipfile
        from pathlib import Path

        ABI_MACHINE = {'arm64-v8a':183,'armeabi-v7a':40,'x86_64':62,'x86':3}
        PKG = 'com.topjohnwu.magisk'
        MAIN = 'com.topjohnwu.magisk.ui.MainActivity'
        R134_MANIFEST_SHA256='3a653f211d5f25e118d4c73d19aacf5d7a5ce2640fa15ef0c8fbcc1e9c4d937c'

        def u16(b,i): return struct.unpack_from('<H',b,i)[0]
        def u32(b,i): return struct.unpack_from('<I',b,i)[0]
        def s_utf8(b,i):
            def length(i):
                n=b[i];i+=1
                if n&128:n=((n&127)<<8)|b[i];i+=1
                return n,i
            _,i=length(i);length_v,i=length(i)
            return b[i:i+length_v].decode('utf-8')
        def s_utf16(b,i):
            n=u16(b,i);i+=2
            if n&32768: n=((n&32767)<<16)|u16(b,i);i+=2
            return b[i:i+2*n].decode('utf-16le')

        def elements(data:bytes):
            off=8;strings=[];result=[];stack=[]
            while off<len(data):
                typ,head,length=struct.unpack_from('<HHI',data,off)
                if length<8:raise AssertionError('Corrupt binary AndroidManifest.xml')
                if typ==1:
                    cnt,_,flags,start,_=struct.unpack_from('<IIIII',data,off+8)
                    offsets=[u32(data,off+head+4*j) for j in range(cnt)]
                    fun=s_utf8 if flags&0x100 else s_utf16
                    strings=[fun(data,off+start+j) for j in offsets]
                elif typ==0x102:
                    ns,name_idx=struct.unpack_from('<II',data,off+16)
                    astart,asize,acnt=struct.unpack_from('<HHH',data,off+24)
                    attrs={}
                    for j in range(acnt):
                        idx=off+16+astart+asize*j
                        ns,name,raw,_,_,dtype,val=struct.unpack_from('<IIIHBBI',data,idx)
                        key=strings[name]
                        if raw!=0xffffffff:out=strings[raw]
                        elif dtype==3:out=strings[val]
                        elif dtype==0x12:out=bool(val)
                        elif dtype in (0x10,0x11):out=val
                        else:out=val
                        attrs[key]=out
                    tag=strings[name_idx]
                    result.append((tag,attrs,tuple(stack)))
                    stack.append(tag)
                elif typ==0x103:
                    if stack:stack.pop()
                off+=length
            return result

        def manifest_contract(nodes):
            sdk=[x[1] for x in nodes if x[0]=='uses-sdk']
            assert len(sdk)==1,'APK must contain exactly one uses-sdk element'
            sdk=sdk[0]
            assert sdk.get('minSdkVersion')==24, f'Android 7 minSdk regression: {sdk}'
            assert sdk.get('targetSdkVersion')==37, f'Android 17 targetSdk regression: {sdk}'
            pkg=[x[1].get('package') for x in nodes if x[0]=='manifest']
            assert pkg==[PKG],f'Magisk package changed unexpectedly: {pkg}'
            act=[x for x in nodes if x[0]=='activity' and x[1].get('name')==MAIN]
            assert len(act)==1 and act[0][1].get('exported') is True, 'MainActivity missing or not exported'
            # Intent filters follow MainActivity in the binary manifest.
            activities=[(i,x) for i,x in enumerate(nodes) if x[0]=='activity']
            mainidx=[i for i,x in activities if x[1].get('name')==MAIN][0]
            next_activity=min([i for i,x in activities if i>mainidx]+[len(nodes)])
            section=nodes[mainidx:next_activity]
            assert any(tag=='action' and a.get('name')=='android.intent.action.MAIN' for tag,a,_ in section), 'MAIN action missing'
            assert any(tag=='category' and a.get('name')=='android.intent.category.LAUNCHER' for tag,a,_ in section), 'LAUNCHER category missing'
            assert any(tag=='action' and a.get('name')=='android.intent.action.APPLICATION_PREFERENCES' for tag,a,_ in section), 'App Settings entry missing'
            return {'package':PKG,'min_sdk':24,'target_sdk':37,'launcher_activity':MAIN,'preferences_route':'PRESENT'}

        def check_elf(abi, data):
            assert len(data)>100000, f'{abi} native library too small'
            assert data[:4]==b'\x7fELF',f'{abi} is not ELF'
            actual=struct.unpack_from('<H',data,18)[0]
            assert actual==ABI_MACHINE[abi],f'{abi} machine mismatch {actual}'
            assert data[4]==(2 if abi in ('arm64-v8a','x86_64') else 1),f'{abi} ELF width wrong'

        def check(path,require_all=True):
            p=Path(path);assert p.is_file() and p.stat().st_size>1000000,'APK missing or too small'
            with zipfile.ZipFile(p) as z:
                assert z.testzip() is None,'corrupt APK archive'
                ns=z.namelist();libmap={}
                for abi in ABI_MACHINE:
                    key=f'lib/{abi}/libmagisk.so'
                    if key not in ns:
                        if require_all: raise AssertionError(f'Missing ABI {abi}: {key}')
                        continue
                    data=z.read(key);check_elf(abi,data)
                    libmap[abi]=hashlib.sha256(data).hexdigest()
                assert 'classes.dex' in ns and z.getinfo('classes.dex').file_size>100000,'APK classes.dex missing'
                assert 'assets/stub.apk' in ns,'Original v30-style Hide stub missing'
                assert len(z.read('assets/stub.apk'))>10000,'Broken Hide stub'
                exp=z.read('assets/r139_expected_arm64_magisk.sha256').decode('ascii').strip()
                assert len(exp)==64 and exp==libmap['arm64-v8a'], 'Embedded daemon digest != APK ELF'
                manifest=z.read('AndroidManifest.xml')
                assert hashlib.sha256(manifest).hexdigest()==R134_MANIFEST_SHA256,'R13.4 launcher/manifest baseline changed unexpectedly'
                m=manifest_contract(elements(manifest))
