  r1313-api-coverage-gate:
    name: All 15 GUIs + same-run install/update + rooted Hide/Restore required
    needs:
    - r139-hardened-pair-build
    - r1313-gui-matrix
    - r1314-root-hide-restore-avd
    if: ${{ always() && inputs.operation == 'build_release' && needs.r139-hardened-pair-build.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - name: Download all emulator results for independent final coverage check
      uses: actions/download-artifact@v8
      with:
        pattern: R1313_GUI_SMOKE_API_*
        path: r1313-results
    - name: Download public pinned build identity and validator
      if: always()
      uses: actions/download-artifact@v8
      with:
        name: R13198_PUBLIC_SIGNING_INSTALLATION_IDENTITY
        path: r13198-build-identity
    - name: Download rooted Hide/Restore and install/update runtime evidence
      if: always()
      uses: actions/download-artifact@v8
      with:
        name: R1315_ROOT_HIDE_RESTORE_AVD_DIAGNOSTICS_NOT_PHONE_PASS
        path: r13198-root-evidence
    - name: Download exact final APK for hash binding and gated delivery
      if: always()
      uses: actions/download-artifact@v8
      with:
        name: R1313_MAGISK_ANDROID7_17_BUILD_ONLY_DEVICE_HOLD
        path: r13198-final-apk
    - name: R13.15 - Independently audit all 15 GUIs and actual rooted Hide/Restore
      shell: bash
      env:
        ROOT_JOB: ${{ needs.r1314-root-hide-restore-avd.result }}
        GUI_JOB: ${{ needs.r1313-gui-matrix.result }}
      run: |
        set -euo pipefail
        python3 - <<'R1313_COVERAGE_PY'
        import json,pathlib,os
        cases = [
          (24,'x86'),
          (24,'x86_64'),
          (25,'x86_64'),
          (26,'x86_64'),
          (27,'x86'),
          (28,'x86_64'),
          (29,'x86_64'),
          (30,'x86_64'),
          (31,'x86_64'),
          (32,'x86_64'),
          (33,'x86_64'),
          (34,'x86_64'),
          (35,'x86_64'),
          (36,'x86_64'),
          (37,'x86_64'),
        ]
        root=pathlib.Path('r1313-results')
        failed=[]; records=[]
        gui_job=os.environ.get('GUI_JOB','unknown')
        # Complete reports never override a failed, cancelled or skipped matrix job.
        if gui_job != 'success':
            failed.append('GUI_MATRIX_JOB_NOT_PASSED: '+gui_job)
        for api,abi in ([] if gui_job == 'skipped' else cases):
            p=root/f'R1313_GUI_SMOKE_API_{api}_{abi}'/'r1313-results'/f'api{api}-{abi}'/'R1313_GUI_RESULT.json'
            # GitHub upload-artifact may flatten the common root for a single subtree.
            if not p.is_file():
                found=list((root/f'R1313_GUI_SMOKE_API_{api}_{abi}').rglob('R1313_GUI_RESULT.json'))
                if len(found)==1:p=found[0]
            if not p.is_file():
                failed.append(f'API{api}/{abi}: missing report');continue
            o=json.loads(p.read_text())
            records.append(o)
            if o['result']!='GUI_SMOKE_PASS' or o['expected_sdk']!=api or o['expected_abi']!=abi or not o['launcher_intent_succeeded']:
                failed.append(f'API{api}/{abi}: {o}')
        gui_failures=failed.copy()
        if os.environ.get('ROOT_JOB') != 'success':
            failed.append('R13.18_ROOT_HIDE_RESTORE_E2E_NOT_PASSED: '+os.environ.get('ROOT_JOB','MISSING'))
        pathlib.Path('R1313_ANDROID7_TO17_FINAL_REPORT.json').write_text(json.dumps({
            'platform_range':'Android 7.0/API24 through Android 17/API37',
            'number_expected':len(cases),'number_recorded':len(records),'gui_job':gui_job,
            'gui_install_launch_matrix':'NOT_RUN' if gui_job=='skipped' else ('PASS' if not gui_failures else 'FAIL'),
            'isolated_rooted_avd_hide_restore':'PASS' if os.environ.get('ROOT_JOB')=='success' else 'FAIL',
            'physical_root_hide_restore':'NOT_TESTED',
            'device_release':'HOLD',
            'failures':failed,'records':records},indent=2)+'\n')
        if failed:raise SystemExit('R13.18 ROOTED_AVD_OR_ANDROID_GUI_RED: '+' | '.join(failed))
        print('R13.13 GUI API24..37 FULL MATRIX PASS: all 15 install/launch/launcher/proc checks')
        R1313_COVERAGE_PY
      if: always()
    - name: R13.19.8 - Require every actual CI result and bind the deliverable APK
      if: always()
      shell: bash
      env:
        BUILD_JOB: ${{ needs.r139-hardened-pair-build.result }}
        GUI_JOB: ${{ needs.r1313-gui-matrix.result }}
        ROOT_JOB: ${{ needs.r1314-root-hide-restore-avd.result }}
      run: |
        set -euo pipefail
        cat > R13198_FINAL_INSTALLATION_GATE.py <<'R13198_FINAL_GATE_PY'
        #!/usr/bin/env python3
        """Require the same-run build, 15 GUI cases, rooted test and install/update proof.

        This combines existing evidence. It never performs a device operation or promotes
        emulator evidence to a physical-phone approval.
        """
        from __future__ import annotations

        import argparse
        import hashlib
        import importlib.util
        import json
        import os
        from pathlib import Path
        import shutil


        def one_file(root: Path, filename: str) -> Path:
            matches = list(root.rglob(filename)) if root.is_dir() else []
            if len(matches) != 1:
                raise ValueError(f"Expected exactly one {filename}; found {len(matches)}")
            return matches[0]


        def read_json(path: Path) -> dict:
            data = json.loads(path.read_text())
            if not isinstance(data, dict):
                raise ValueError(f"JSON object required: {path.name}")
            return data


        def evaluate(workspace: Path) -> dict:
            report = {
                "schema": "r13198.complete-ci-installation-verdict-v1",
                "revision": "R13.19.8",
                "status": "FAIL",
                "github_run_id": os.environ.get("GITHUB_RUN_ID"),
                "physical_device_tested": False,
                "phone_in_place_update": "UNKNOWN",
                "phone_device_release": "NOT_ATTESTED",
                "hidden_state_update_tested": False,
                "supported_update_flow": "RESTORE_TO_ORIGINAL_MANAGER_THEN_MANUAL_PROJECT_APK_UPDATE_THEN_REHIDE",
                "failures": [],
            }
            failures = report["failures"]
            for name in ("BUILD_JOB", "GUI_JOB", "ROOT_JOB"):
                value = os.environ.get(name, "MISSING")
                report[name.lower()] = value
                if value != "success":
                    failures.append(name + "_NOT_SUCCESS: " + value)
            try:
                coverage = read_json(workspace / "R1313_ANDROID7_TO17_FINAL_REPORT.json")
                report["coverage"] = coverage
                if (coverage.get("number_expected") != 15
                        or coverage.get("number_recorded") != 15
                        or coverage.get("gui_install_launch_matrix") != "PASS"
                        or coverage.get("isolated_rooted_avd_hide_restore") != "PASS"
                        or coverage.get("failures") != []):
                    failures.append("ORIGINAL_GUI_AND_ROOT_COVERAGE_GATE_NOT_PASSED")
            except (OSError, ValueError) as exc:
                failures.append("COVERAGE_EVIDENCE_INVALID: " + str(exc))
            root_dir = workspace / "r13198-root-evidence"
            try:
                rooted = read_json(one_file(root_dir, "R1314_E2E_RESULT.json"))
                report["root_hide_restore"] = rooted
                if (rooted.get("schema") != "r1314.root-hide-restore-avd-v1"
                        or rooted.get("status") != "ROOT_HIDE_RESTORE_PASS"
                        or rooted.get("last_stage") != "COMPLETE"
                        or type(rooted.get("exit_code")) is not int
                        or rooted.get("exit_code") != 0
                        or rooted.get("physical_device_tested") is not False):
                    failures.append("ROOT_HIDE_RESTORE_RUNTIME_NOT_PASSED")
            except (OSError, ValueError) as exc:
                failures.append("ROOT_EVIDENCE_INVALID: " + str(exc))
            try:
                identity_dir = workspace / "r13198-build-identity"
                module_path = one_file(identity_dir, "R13198_RELEASE_INSTALLATION_AUDIT.py")
                spec = importlib.util.spec_from_file_location("r13198_release_identity", module_path)
                if spec is None or spec.loader is None:
                    raise ValueError("Installation validator cannot be loaded")
                module = importlib.util.module_from_spec(spec)
                spec.loader.exec_module(module)
                identity = read_json(one_file(identity_dir, "R13198_INSTALLATION_IDENTITY.json"))
                runtime = read_json(one_file(root_dir, "R13198_INSTALL_UPDATE_RESULT.json"))
                merged = module.merge_runtime(identity, runtime, require_runtime=True)
                module.write_report(workspace / "R13198_INSTALLATION_VERIFICATION.json", merged)
                report["installation"] = merged
                if merged.get("runtime_contract_valid") is not True:
                    failures.append("INSTALL_UPDATE_CONTRACT_NOT_PASSED")
                if runtime.get("github_run_id") != os.environ.get("GITHUB_RUN_ID"):
                    failures.append("INSTALL_UPDATE_CONTRACT_RUN_ID_MISMATCH")
                if runtime.get("hidden_state_update_tested") is not False:
                    failures.append("INSTALL_UPDATE_HIDDEN_SCOPE_NOT_SUPPORTED")
                candidate = one_file(workspace / "r13198-final-apk", "app-release.apk")
                candidate_sha = hashlib.sha256(candidate.read_bytes()).hexdigest()
                report["apk_sha256"] = candidate_sha
                if candidate_sha != merged.get("apk_sha256"):
                    failures.append("FINAL_APK_DIFFERS_FROM_VERIFIED_RELEASE")
            except (OSError, ValueError, KeyError, TypeError, ImportError) as exc:
                failures.append("INSTALLATION_EVIDENCE_INVALID: " + str(exc))
            if not failures:
                report["status"] = "CI_INSTALL_UPDATE_GUI_ROOT_HIDE_RESTORE_PASS"
            return report


        def main() -> int:
            parser = argparse.ArgumentParser(description=__doc__)
            parser.add_argument("--workspace", type=Path, default=Path.cwd())
            args = parser.parse_args()
            workspace = args.workspace.resolve()
            report = evaluate(workspace)
            (workspace / "R13198_FINAL_INSTALLATION_VERDICT.json").write_text(json.dumps(report, indent=2) + "\n")
            print(json.dumps({"status": report["status"], "failures": report["failures"]}))
            if report["status"] != "CI_INSTALL_UPDATE_GUI_ROOT_HIDE_RESTORE_PASS":
                return 2
            ready = workspace / "r13198-ready-apk"
            ready.mkdir(exist_ok=False)
            shutil.copyfile(one_file(workspace / "r13198-final-apk", "app-release.apk"), ready / "Magisk_R13198.apk")
            for name in ("R13198_FINAL_INSTALLATION_VERDICT.json", "R13198_INSTALLATION_VERIFICATION.json"):
                shutil.copyfile(workspace / name, ready / name)
            (ready / "Magisk_R13198.apk.sha256").write_text(report["apk_sha256"] + "  Magisk_R13198.apk\n")
            return 0


        if __name__ == "__main__":
            raise SystemExit(main())
        R13198_FINAL_GATE_PY
        python3 R13198_FINAL_INSTALLATION_GATE.py
    - name: Upload full-matrix verdict
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: R1315_ANDROID7_17_GUI_PLUS_ROOT_E2E_VERDICT_NOT_PHONE_RELEASE
        path: R1313_ANDROID7_TO17_FINAL_REPORT.json
        if-no-files-found: warn
        retention-days: 14
    - name: Publish final installation verdict even if a required check failed
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: R13198_FINAL_INSTALLATION_VERDICT
        path: |-
          R13198_FINAL_INSTALLATION_VERDICT.json
          R13198_INSTALLATION_VERIFICATION.json
        if-no-files-found: warn
        retention-days: 14
    - name: Publish exact APK only after complete install/update, GUI and Root Hide/Restore success
      if: success()
      uses: actions/upload-artifact@v7
      with:
        name: R13198_APK_STABLE_SIGNER_INSTALL_UPDATE_VERIFIED
        path: r13198-ready-apk/
        if-no-files-found: error
        retention-days: 14
  r13199-workflow-result:
    name: R13.19.9 Ergebnis – Vorbereitung und vollständigen Build getrennt ausweisen
    needs:
    - r13199-signing-setup
    - r139-hardened-pair-build
    - r1313-gui-matrix
    - r1314-root-hide-restore-avd
    - r1313-api-coverage-gate
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Summarize the requested operation without downloading absent build artifacts
      shell: bash
      env:
        OPERATION: ${{ inputs.operation }}
        SETUP_JOB: ${{ needs.r13199-signing-setup.result }}
        SETUP_STATUS: ${{ needs.r13199-signing-setup.outputs.status }}
        BUILD_PERMITTED: ${{ needs.r13199-signing-setup.outputs.build_permitted }}
        BUILD_JOB: ${{ needs.r139-hardened-pair-build.result }}
        GUI_JOB: ${{ needs.r1313-gui-matrix.result }}
        ROOT_JOB: ${{ needs.r1314-root-hide-restore-avd.result }}
        FINAL_GATE_JOB: ${{ needs.r1313-api-coverage-gate.result }}
      run: |
        set -euo pipefail
        cat > R13199_WORKFLOW_STATUS.py <<'R13199_WORKFLOW_STATUS_PY'
        #!/usr/bin/env python3
        """Distinguish a setup-only inspection from a fully completed signed build."""
        from __future__ import annotations

        import argparse
        import json
        import os
        from pathlib import Path

        REQUIRED_JOBS = ("SETUP_JOB", "BUILD_JOB", "GUI_JOB", "ROOT_JOB", "FINAL_GATE_JOB")
        SETUP_STATUSES = {"SETUP_REQUIRED", "CONFIGURATION_INVALID", "CONFIG_PRESENT_NOT_KEY_VALIDATED"}


        def evaluate(environment: dict[str, str]) -> tuple[dict, int]:
            operation = environment.get("OPERATION", "")
            jobs = {name: environment.get(name, "MISSING") for name in REQUIRED_JOBS}
            permitted = environment.get("BUILD_PERMITTED", "")
            setup_status = environment.get("SETUP_STATUS", "MISSING")
            report = {
                "schema": "r13199.workflow-status-v1", "revision": "R13.19.9",
                "operation": operation if operation in ("check_signing_setup", "build_release") else "INVALID",
                "github_run_id": environment.get("GITHUB_RUN_ID"),
                "status": "FAIL", "jobs": jobs, "setup_status": setup_status if setup_status in SETUP_STATUSES else "UNRECOGNIZED",
                "build_requested": operation == "build_release",
                "apk_built": True if jobs["BUILD_JOB"] == "success" else False if jobs["BUILD_JOB"] == "skipped" else None,
                "android_tests_executed": True if jobs["GUI_JOB"] == jobs["ROOT_JOB"] == "success" else False if jobs["GUI_JOB"] == jobs["ROOT_JOB"] == "skipped" else None,
                "android_tests_passed": jobs["GUI_JOB"] == jobs["ROOT_JOB"] == "success",
                "complete_ci_pass": False, "release_artifact_available": False,
                "physical_device_tested": False, "phone_installation_approval": "NOT_ESTABLISHED",
                "failures": [],
            }
            failures = report["failures"]
            if operation not in ("check_signing_setup", "build_release"):
                failures.append("UNKNOWN_OPERATION")
            elif operation == "check_signing_setup":
                if jobs["SETUP_JOB"] != "success":
                    failures.append("SETUP_INSPECTION_JOB_NOT_SUCCESS")
                if setup_status not in SETUP_STATUSES:
                    failures.append("SETUP_STATUS_OUTPUT_MISSING_OR_INVALID")
                if permitted != "false":
                    failures.append("SETUP_ONLY_MUST_NOT_PERMIT_A_BUILD")
                for name in REQUIRED_JOBS[1:]:
                    if jobs[name] != "skipped":
                        failures.append("UNEXPECTED_JOB_EXECUTION_IN_SETUP_ONLY_MODE_" + name)
                if not failures:
                    report["status"] = "SETUP_CHECK_COMPLETED_NO_APK"
            else:
                if jobs["SETUP_JOB"] != "success":
                    failures.append("SIGNING_SETUP_NOT_READY")
                    report["status"] = "SIGNED_BUILD_NOT_STARTED_SETUP_REJECTED"
                else:
                    if permitted != "true" or setup_status != "CONFIG_PRESENT_NOT_KEY_VALIDATED":
                        failures.append("SIGNED_BUILD_REQUEST_WITHOUT_VALID_SETUP_OUTPUTS")
                    for name in REQUIRED_JOBS[1:]:
                        if jobs[name] != "success":
                            failures.append("REQUIRED_JOB_NOT_SUCCESS_" + name)
                    if not failures:
                        report.update(status="SIGNED_BUILD_AND_ALL_CI_TESTS_PASSED",
                                      complete_ci_pass=True, release_artifact_available=True)
            return report, 2 if failures else 0


        def main() -> int:
            parser = argparse.ArgumentParser(description=__doc__)
            parser.add_argument("--report", type=Path, default=Path("R13199_WORKFLOW_STATUS.json"))
            args = parser.parse_args()
            report, code = evaluate(dict(os.environ))
            args.report.parent.mkdir(parents=True, exist_ok=True)
            temp = args.report.with_suffix(".tmp")
            temp.write_text(json.dumps(report, indent=2) + "\n")
            temp.replace(args.report)
            summary = os.environ.get("GITHUB_STEP_SUMMARY")
            if summary:
                title = "Einrichtung geprüft – keine APK gebaut" if report["status"] == "SETUP_CHECK_COMPLETED_NO_APK" else "Ergebnis des angeforderten signierten Builds"
                if report["operation"] == "check_signing_setup":
                    details = ("Dieser Lauf prüft ausschließlich die Signierkonfiguration. "
                               "Build, Android-Tests und APK-Veröffentlichung wurden nicht angefordert. "
                               "Ein grüner Vorbereitungsdurchlauf ist keine APK- oder Telefonfreigabe.")
                elif report["complete_ci_pass"]:
                    details = ("Der signierte Build, alle 15 GUI-Fälle, der echte Installations-/Updatevertrag "
                               "und Root/Hide/Restore haben ihre verpflichtenden Jobs bestanden. "
                               "Eine Telefoninstallation wurde nicht ausgeführt.")
                else:
                    details = ("Der angeforderte signierte Build ist nicht vollständig bestätigt. "
                               "Die fehlende Voraussetzung bzw. der fehlgeschlagene Job ist unten angegeben. "
                               "Es wird keine abgeschlossene APK-Freigabe behauptet.")
                text = "## " + title + "\n\n" + details + "\n\nStatus: `" + report["status"] + "`\n\n"
                text += "| Job | Ergebnis |\n|---|---|\n"
                for name, value in report["jobs"].items():
                    safe_value = value if value in ("success", "failure", "cancelled", "skipped") else "MISSING_OR_INVALID"
                    text += "| " + name + " | " + safe_value + " |\n"
                if report["failures"]:
                    text += "\n" + "\n".join("- `" + item + "`" for item in report["failures"]) + "\n"
                with open(summary, "a", encoding="utf-8") as output:
                    output.write(text)
            print(json.dumps({"status": report["status"], "complete_ci_pass": report["complete_ci_pass"], "failures": report["failures"]}))
            return code


        if __name__ == "__main__":
            raise SystemExit(main())
        R13199_WORKFLOW_STATUS_PY
        python3 R13199_WORKFLOW_STATUS.py
    - name: Publish truthful workflow status
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: R13199_WORKFLOW_STATUS
        path: R13199_WORKFLOW_STATUS.json
        if-no-files-found: warn
        retention-days: 14
run-name: ${{ inputs.operation == 'build_release' && 'R13.19.9 – Signierter APK-Build und vollständige Tests' ||
  'R13.19.9 – Einrichtung prüfen (keine APK)' }}
