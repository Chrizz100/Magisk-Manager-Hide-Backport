            }'''
        UI_NEW = replace_once(
            UI_OLD,
            '                viewModel.restoreManager()',
            '                android.util.Log.i("R13196RestoreUI", "CONFIRM_CALLBACK_RECEIVED")\n'
            '                viewModel.restoreManager()',
            'RESTORE_DIALOG_CALLBACK')

        def sha(s: str) -> str:
            return hashlib.sha256(s.encode('utf-8')).hexdigest()

        def apply(root: Path, report: Path) -> dict:
            paths = [root / MIGRATION, root / UI, root / VM]
            if not all(p.is_file() for p in paths):
                raise ValueError('R13196_EXPECTED_SOURCE_TREE_MISSING')
            m, u, v = (p.read_text(encoding='utf-8') for p in paths)
            if m.count(OLD_RESTORE) != 1:
                raise ValueError(f'R13196_UNEXPECTED_R1319_RESTORE_{m.count(OLD_RESTORE)}')
            if v.count(VM_OLD) != 1:
                raise ValueError(f'R13196_UNEXPECTED_VIEWMODEL_RESTORE_{v.count(VM_OLD)}')
            if u.count(UI_OLD) != 1:
                raise ValueError(f'R13196_UNEXPECTED_UI_CONFIRM_{u.count(UI_OLD)}')
            if 'R13196Restore' in m or 'R13196RestoreVM' in v or 'R13196RestoreUI' in u:
                raise ValueError('R13196_PATCH_ALREADY_PRESENT_OR_UNEXPECTED_SOURCE')
            if 'ORIGINAL_LAUNCHER_DISABLED_ORIGINAL_PACKAGE_KEPT' not in m:
                raise ValueError('R13196_ORIGINAL_LAUNCHER_HIDE_SOURCE_LOST')
            m2 = replace_once(m, OLD_RESTORE, RESTORE_METHOD_V2, 'RESTORE_METHOD')
            u2 = replace_once(u, UI_OLD, UI_NEW, 'RESTORE_UI')
            v2 = replace_once(v, VM_OLD, VM_NEW, 'RESTORE_VM')
            if m2.count('pm uninstall --user 0 ${context.packageName}') != 1 or \
                m2.count('pm uninstall') != 1 or 'pm uninstall --user 0 $APP_PACKAGE_NAME' in m2:
                raise ValueError('R13196_UNSAFE_UNINSTALL_TARGET_OR_DUPLICATE')
            if 'pm disable --user 0 $APP_PACKAGE_NAME/.ui.MainActivity' not in m2 or \
                'pm enable --user 0 $APP_PACKAGE_NAME/.ui.MainActivity' not in m2:
                raise ValueError('R13196_REVERSIBLE_LAUNCHER_CONTRACT_LOST')
            if 'Config.suManager = ""' not in m2 or 'r139SameDaemon(context)' not in m2:
                raise ValueError('R13196_TRUST_OR_BACKEND_GUARD_LOST')
            before = [sha(x) for x in (m,u,v)]
            after = [sha(x) for x in (m2,u2,v2)]
            for p, new_text in zip(paths,(m2,u2,v2)):
                p.write_text(new_text,encoding='utf-8')
            obj={
                'revision':'R13.19.6',
                'base':'R13.19.4 compiled and signed, R13.19.1 audited source',
                'patched_files':[MIGRATION,UI,VM],
                'before':before,'after':after,
                'restore_callback_trace':True,
                'restore_transaction_root_launch_before_unbind':True,
                'restore_cleanup_delayed_and_hidden_package_only':True,
                'restore_cleanup_after_verified_unbind':True,
                'original_launcher_reenable_required':True,
                'native_or_signer_changed':False,
                'physical_device_evidence':'NOT_EXECUTED',
                'phone_release':'HOLD',
            }
            report.parent.mkdir(parents=True,exist_ok=True)
            report.write_text(json.dumps(obj,indent=2)+'\n',encoding='utf-8')
            return obj

        if __name__ == '__main__':
            if len(sys.argv)!=3: raise SystemExit('Usage: R13196_RESTORE_TXN_PATCH.py MAGISK_ROOT REPORT.json')
            print(json.dumps(apply(Path(sys.argv[1]),Path(sys.argv[2])),indent=2))
        R13196_PATCH_PY
        python3 -m py_compile R13196_RESTORE_TXN_PATCH.py
        python3 R13196_RESTORE_TXN_PATCH.py magisk reports/R13196_SOURCE_REPAIR.json
        git -C magisk diff --check
        python3 - <<'R13196_PREFLIGHT'
