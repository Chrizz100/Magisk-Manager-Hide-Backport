        REMOVED_UI='''                // R13.12: Magisk v30 Hide is the first-stage repackaging action.
                        // Restore remains available from the hidden app. The original
                        // APK/package is not automatically uninstalled or disabled.
        '''

        # Magisk 31.1 package.rs normally uninstalls a mismatched manager. That is
        # hazardous during a signing migration; reject the mismatched certificate
        # without deleting the user's previously working manager. Certificate checks
        # remain fail-closed, never grant UID to a nonmatching APK.
