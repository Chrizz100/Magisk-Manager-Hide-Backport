    - name: R13.19.7 - Fit the Restore confirmation window and verify the complete source chain
      shell: bash
      run: |
        set -euo pipefail
        cat > R13197_RESTORE_DIALOG_PATCH.py <<'R13197_DIALOG_PATCH_PY'
        #!/usr/bin/env python3
        """R13.19.7: fit the short restore dialog to its platform window."""
        from __future__ import annotations
        import argparse
        import hashlib
        import json
        from pathlib import Path

        PATH = 'app/apk/src/main/java/com/topjohnwu/magisk/ui/home/HomeScreen.kt'
        BASE_SHA256 = 'ee94d75109ee0cee1bdc5bf84866e88f5096bb6f22d0dab30bb791316a39e576'
        RESTORE_DIALOG_OLD = '@Composable\nprivate fun RestoreAppDialog(\n    onDismiss: () -> Unit,\n    onConfirm: () -> Unit,\n    modifier: Modifier = Modifier,\n) {\n    MagiskDialog(\n        modifier = modifier,\n        onDismissRequest = onDismiss,\n        title = stringResource(CoreR.string.settings_restore_app_title),\n        confirmText = stringResource(android.R.string.ok),\n        onConfirm = onConfirm,\n        dismissText = stringResource(android.R.string.cancel),\n        onDismiss = onDismiss,\n    ) {\n        Text(stringResource(CoreR.string.restore_app_confirmation))\n    }\n}\n'
        RESTORE_DIALOG_NEW = '@Composable\nprivate fun RestoreAppDialog(\n    onDismiss: () -> Unit,\n    onConfirm: () -> Unit,\n    modifier: Modifier = Modifier,\n) {\n    // Keep window and accessibility coordinates in the same fitted coordinate space.\n    // A short edge-to-edge, wrap-content dialog is displaced by system bar insets\n    // on the Android 13 hidden-manager window (the actual R13.19.6 AVD failure).\n    androidx.compose.material3.AlertDialog(\n        modifier = modifier,\n        onDismissRequest = onDismiss,\n        title = { Text(stringResource(CoreR.string.settings_restore_app_title)) },\n        text = { Text(stringResource(CoreR.string.restore_app_confirmation)) },\n        confirmButton = {\n            androidx.compose.material3.TextButton(onClick = onConfirm) {\n                Text(stringResource(android.R.string.ok))\n            }\n        },\n        dismissButton = {\n            androidx.compose.material3.TextButton(onClick = onDismiss) {\n                Text(stringResource(android.R.string.cancel))\n            }\n        },\n        properties = androidx.compose.ui.window.DialogProperties(\n            decorFitsSystemWindows = true,\n        ),\n    )\n}\n'

        def sha(data: bytes) -> str:
            return hashlib.sha256(data).hexdigest()

        def patched_source(before: str) -> str:
            count = before.count(RESTORE_DIALOG_OLD)
            if count != 1:
                raise ValueError(f'R13197_UNEXPECTED_RESTORE_DIALOG_{count}')
            if sha(before.encode('utf-8')) != BASE_SHA256:
                raise ValueError('R13197_PREVIOUS_SOURCE_HASH_MISMATCH')
            return before.replace(RESTORE_DIALOG_OLD, RESTORE_DIALOG_NEW, 1)

        def apply(repo: Path, reports: Path) -> dict:
            target = repo / PATH
            before_bytes = target.read_bytes()
            after = patched_source(before_bytes.decode('utf-8'))
            after_bytes = after.encode('utf-8')
            report = {
                'schema': 'r13197.restore-dialog-source-v1',
                'status': 'PASS',
                'scope': 'RestoreAppDialog fitted window only; no backend, signer or native changes',
                'path': PATH,
                'before_sha256': sha(before_bytes),
                'after_sha256': sha(after_bytes),
                'runtime_validated': False,
            }
            target.write_bytes(after_bytes)
            reports.mkdir(parents=True, exist_ok=True)
            (reports / 'R13197_RESTORE_DIALOG_SOURCE.json').write_text(json.dumps(report, indent=2)+'\n')
            return report

        if __name__ == '__main__':
            parser = argparse.ArgumentParser()
            parser.add_argument('--repo', type=Path, default=Path('magisk'))
            parser.add_argument('--reports', type=Path, default=Path('reports'))
            args = parser.parse_args()
            print(json.dumps(apply(args.repo, args.reports), indent=2))
        R13197_DIALOG_PATCH_PY
        python3 -m py_compile R13197_RESTORE_DIALOG_PATCH.py
        python3 R13197_RESTORE_DIALOG_PATCH.py --repo magisk --reports reports
        python3 R13191_STRICT_GATE.py magisk reports dialogsource
