        RESTORE_METHOD_V2 = replace_once(
            RESTORE_METHOD_V2,
            'val verified = existing ?: return@withContext false',
            '''val verified = existing ?: run {
                            android.util.Log.e("R13196Restore", "ORIGINAL_PACKAGE_NOT_RESOLVED")
                            return@withContext false
                        }''',
            'EXISTING_PACKAGE_LOG')
        RESTORE_METHOD_V2 = replace_once(
            RESTORE_METHOD_V2,
            '''if (context.packageManager.getLaunchIntentForPackage(APP_PACKAGE_NAME) == null) {
                            android.util.Log.e("R1319Restore", "ORIGINAL_LAUNCH_INTENT_MISSING")
                            return@withContext false
                        }''',
            '''// A hidden stub may not be allowed to resolve another app's launch intent.
                        // Use the already authenticated root shell to verify the exact
                        // component we just re-enabled, BEFORE dropping manager binding.
                        val start = Shell.cmd("am start -W -n $APP_PACKAGE_NAME/.ui.MainActivity").await()
                        if (!start.isSuccess || start.out.none { it.trim() == "Status: ok" }) {
                            android.util.Log.e("R13196Restore", "ORIGINAL_EXPLICIT_START_FAILED")
                            return@withContext false
                        }
                        android.util.Log.i("R13196Restore", "ORIGINAL_EXPLICIT_START_OK")''',
            'EXPLICIT_START')
        RESTORE_METHOD_V2 = replace_once(
            RESTORE_METHOD_V2,
            '''        if (!restored) return false
                val launched = launchApp(context, APP_PACKAGE_NAME)
                android.util.Log.i("R1310Restore", if (launched)
                    "ORIGINAL_LAUNCHED_CLEANUP_SCHEDULED_VERIFY_IN_E2E" else
                    "ORIGINAL_LAUNCH_FAILED_HIDDEN_RETAINED_UNTIL_DELAYED_PREFLIGHT")
