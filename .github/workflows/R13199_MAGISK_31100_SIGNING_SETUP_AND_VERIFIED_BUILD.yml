        #!/usr/bin/env python3
        """R13.17 verify all four native daemon assets are byte-exact to ELF and signed APK.

        The running daemon must match the digest for the actual device architecture.
        This is a static build/packaging gate, NOT a physical device approval.
        """
        import hashlib, json, struct, sys, zipfile
        from pathlib import Path

