              'after_sha256':sha(changed.encode('utf-8')),
              'signed_apk_elf_equality':'REQUIRED_POSTBUILD',
              'compiled_daemon_hash_attestation':'REQUIRED_POSTBUILD',
              'physical_device_test':'NOT_EXECUTED',
              'root_flash_install_approval':'HOLD',
