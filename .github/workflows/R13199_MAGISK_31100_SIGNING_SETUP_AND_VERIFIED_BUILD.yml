        #!/usr/bin/env python3
        """Verify one CI-built APK's v2 signing certificate agrees with the native TRUSTED_CERT.

        The output is a genuine *build-pair* assertion, explicitly not an installed-runtime assertion.
        """
        from __future__ import annotations
        import base64
        import hashlib
        import json
        from pathlib import Path
        import re
        import subprocess
        import sys
        import zipfile

        def paired_build_evidence(root: Path, report_path: Path) -> dict:
            root=root.resolve();apk=root/'out/app-release.apk';flags=root/'native/out/generated/flags.rs'
            assert apk.is_file() and apk.stat().st_size>1_000_000
            assert flags.is_file(), 'native trusted cert generated flags missing'
            t=flags.read_text()
            match=re.search(r'TRUSTED_CERT\s*:\s*.*?=\s*&\[(.*?)\];',t,re.S)
            assert match, 'native TRUSTED_CERT initializer not found'
            val=bytes(int(v,16) for v in re.findall(r'0x([0-9a-fA-F]{2})',match.group(1)))
            assert len(val)>100,'native TRUSTED_CERT missing'
            native_cert_digest=hashlib.sha256(val).hexdigest()
            key=root/'r6-ci-only.p12'
            assert key.is_file(),'CI signing key missing (build-specific key should never be distributed)'
            props={}
            for line in (root.parent/'r6-build.prop').read_text().splitlines():
                if '=' in line:
                    k,v=line.split('=',1);props[k]=v
            if not props.get('keyAlias') or not props.get('keyStorePass'):
                raise RuntimeError('R139 missing signer properties')
            key_rfc=subprocess.check_output(['keytool','-exportcert','-rfc','-alias',props['keyAlias'],
                '-keystore',str(key),'-storepass',props['keyStorePass']],stderr=subprocess.DEVNULL).decode('utf-8')
            cert=base64.b64decode(''.join(re.findall(r'-----BEGIN CERTIFICATE-----([A-Za-z0-9+/=\s]+)-----END CERTIFICATE-----',key_rfc,re.S)).strip())
            assert cert,'Unable to read signing certificate'
            keystore_cert_digest=hashlib.sha256(cert).hexdigest()
            assert native_cert_digest==keystore_cert_digest, 'Signer mismatch: native TRUSTED_CERT != keystore used for APK'
            sdk_root=Path(__import__('os').environ.get('ANDROID_HOME') or __import__('os').environ.get('ANDROID_SDK_ROOT') or '/opt/android-sdk')
            signers=sorted(sdk_root.glob('build-tools/*/apksigner'),key=lambda x:x.parent.name)
            assert signers,'Android SDK apksigner missing'
            result=subprocess.check_output([str(signers[-1]),'verify','-v','--print-certs',str(apk)],text=True,stderr=subprocess.STDOUT)
            assert 'Verified using v2 scheme (APK Signature Scheme v2): true' in result,'APK v2 signature missing'
            a=re.search(r'(?:V2 )?Signer:\s+certificate SHA-256 digest:\s*([0-9a-fA-F]{64})',result)
            assert a, 'APK v2 certificate SHA256 not in apksigner output'
            apk_cert_digest=a.group(1).lower()
            assert apk_cert_digest==keystore_cert_digest,'APK signing certificate != native/keystore'
            with zipfile.ZipFile(apk) as z:
                assert z.testzip() is None
                stub=z.read('assets/stub.apk')
                assert len(stub)>10000
                native=z.read('lib/arm64-v8a/libmagisk.so')
                assert native.startswith(b'\x7fELF'), 'ARM64 native executable not ELF'
                assert z.getinfo('lib/arm64-v8a/libmagisk.so').file_size >100_000
                arm32=z.read('lib/armeabi-v7a/libmagisk.so')
                assert arm32.startswith(b'\x7fELF')
            rep={
                'revision':'R13.8','scope':'SAME_CI_RUN_BUILD_PAIR_ONLY',
                'native_trusted_cert_sha256':native_cert_digest,
                'apk_signer_cert_sha256':apk_cert_digest,
                'ci_keystore_cert_sha256':keystore_cert_digest,
                'native_arm64_magisk_so_sha256':hashlib.sha256(native).hexdigest(),
                'native_arm32_magisk_so_sha256':hashlib.sha256(arm32).hexdigest(),
                'apk_sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),
                'apk_bytes':apk.stat().st_size,
                'native_apk_signer_pair_valid':True,
                'signing_key_temporary_ci_only':(root.parent/'reports/R139_SIGNING_MODE.txt').read_text().strip()!='STABLE_SECRET',
                'native_patched_daemon_running_on_phone':False,
                'compatible_with_original_31100_device_daemon':'NOT_PROVEN',
                'device_authorized':'NO',
                'installable_with_existing_root_manager':'NOT_PROVEN',
                'phone_release':'HOLD',
                'boot_release':'HOLD',
                'sensitive_private_key_in_artifact':False,
            }
            report_path.parent.mkdir(parents=True,exist_ok=True)
            report_path.write_text(json.dumps(rep,indent=2)+'\n')
