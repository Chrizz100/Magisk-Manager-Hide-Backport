name: 'Magisk R13.3 - Official 31.1 full-function phone beta candidate (no automatic flash)'
permissions:
  contents: read
jobs:
  r115-integrated-avd:
    name: R12.1 official Magisk 31.1 strict integration regression and full-function AVD gates
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    steps:
    - name: Fetch official pinned v31.1 and its historical sources
      uses: actions/checkout@v6
      with:
        repository: topjohnwu/Magisk
        ref: 0972f67d97f9b6302b67c5171283330c74114b4a
        path: magisk
        fetch-depth: 0
        submodules: recursive
        persist-credentials: false
    - name: Restore original signer, APK-XML and key generator files
      shell: bash
      run: "set -euo pipefail\nsource_commit=0972f67d97f9b6302b67c5171283330c74114b4a\nlegacy_commit=ea16c8141eb64dc28b56a0e7fb536689ef465429\ntest \"$(git -C magisk rev-parse HEAD)\" = \"$source_commit\"\ngit -C magisk merge-base --is-ancestor \"$legacy_commit\" \"$source_commit\"\nmkdir -p reports\n: > reports/restored_sha256.txt\nmkdir -p magisk/app/core/src/main/java/com/topjohnwu/magisk/core/signing\nmapfile -t signer_files < <(git -C magisk ls-tree -r --name-only \"$legacy_commit\" app/core/src/main/java/com/topjohnwu/magisk/core/signing/ | grep -E '\\.java$')\ntest \"${#signer_files[@]}\" -eq 5\nfor path in \"${signer_files[@]}\" \\\n  app/core/src/main/java/com/topjohnwu/magisk/core/utils/AXML.kt \\\n  app/core/src/main/java/com/topjohnwu/magisk/core/utils/Keygen.kt; do\n  git -C magisk cat-file -e \"$legacy_commit:$path\"\n  mkdir -p \"magisk/$(dirname \"$path\")\"\n  git -C magisk show \"$legacy_commit:$path\" > \"magisk/$path\"\n  test -s \"magisk/$path\"\n  sha256sum \"magisk/$path\" >> reports/restored_sha256.txt\ndone\ntest \"$(wc -l < reports/restored_sha256.txt)\" -eq 7\nprintf 'Recovered %s historical signer/XML/keystore files\\n' \"$(wc -l < reports/restored_sha256.txt)\"\n"
    - name: Apply reviewed R3 native and R4 app bridge patches
      shell: bash
      run: "set -euo pipefail\nmkdir -p reports\ncat > reports/r3-native.patch <<'R3_NATIVE_PATCH'\ndiff --git a/native/src/core/db.rs b/native/src/core/db.rs\nindex a2b94dbd5..495303c7d 100644\n--- a/native/src/core/db.rs\n+++ b/native/src/core/db.rs\n@@ -260,0 +261,21 @@ impl MagiskD {\n+    /// Read the optional legacy `requester` name as TEXT from v31.1's existing\n+    /// `settings` table. SQLite's INTEGER affinity supports text rows, so this\n+    /// does not downgrade the database or reintroduce the removed `strings` table.\n+    /// Treat the value as *untrusted* until package.rs validates its APKs.\n+    pub fn get_repackaged_manager_pkg(&self) -> String {\n+        let mut value = String::new();\n+        let mut on_row = |_: &[String], row: &DbValues| {\n+            value.clear();\n+            value.push_str(row.get_text(0));\n+        };\n+        self.db_exec_with_rows(\n+            \"SELECT COALESCE(CAST(value AS TEXT), '') FROM settings WHERE key='requester' LIMIT 1\",\n+            &[],\n+            &mut on_row,\n+        )\n+        .sql_result()\n+        .log()\n+        .ok();\n+        value\n+    }\n+\ndiff --git a/native/src/core/package.rs b/native/src/core/package.rs\nindex 94fea3ae4..a05cd45d7 100644\n--- a/native/src/core/package.rs\n+++ b/native/src/core/package.rs\n@@ -6 +5,0 @@ use base::WalkResult::{Abort, Continue, Skip};\n-use base::const_format::concatcp;\n@@ -9 +8 @@ use base::{\n-    Utf8CString, cstr, error, pre_order_walk,\n+    Utf8CString, cstr, error, fd_get_attr, pre_order_walk,\n@@ -15,0 +15 @@ use std::io::{Cursor, Read, Seek, SeekFrom};\n+use std::os::fd::AsRawFd;\n@@ -51 +51 @@ macro_rules! bad_apk {\n-fn read_certificate(apk: &mut File) -> Vec<u8> {\n+fn read_certificate(apk: &mut File, min_version_code: i32) -> Vec<u8> {\n@@ -96 +96 @@ fn read_certificate(apk: &mut File) -> Vec<u8> {\n-        if MAGISK_VER_CODE > apk_ver {\n+        if min_version_code > apk_ver {\n@@ -150 +150 @@ fn read_certificate(apk: &mut File) -> Vec<u8> {\n-fn find_apk_path() -> Option<Utf8CString> {\n+fn find_apk_path(pkg: &str) -> Option<Utf8CString> {\n@@ -157 +157 @@ fn find_apk_path() -> Option<Utf8CString> {\n-        if name.starts_with(concatcp!(APP_PACKAGE_NAME, \"-\")) {\n+        if name.starts_with(pkg) && name.as_bytes().get(pkg.len()) == Some(&b'-') {\n@@ -211 +211 @@ fn check_apk(tracked: &mut TrackedFile) -> bool {\n-    let Some(apk) = find_apk_path() else {\n+    let Some(apk) = find_apk_path(APP_PACKAGE_NAME) else {\n@@ -216 +216 @@ fn check_apk(tracked: &mut TrackedFile) -> bool {\n-        Ok(mut fd) => read_certificate(&mut fd),\n+        Ok(mut fd) => read_certificate(&mut fd, MAGISK_VER_CODE),\n@@ -232,0 +233,54 @@ fn check_apk(tracked: &mut TrackedFile) -> bool {\n+// Research-stage native integration only. The repackaged package is NOT authorized\n+// merely because a database row exists: it must have an installed stub and an\n+// original-signature-verified dynamic Magisk APK owned by the same Android app.\n+// Do not accept a repackaged manager in builds without a pinned signing cert.\n+fn valid_repackaged_pkg(pkg: &str) -> bool {\n+    if pkg == APP_PACKAGE_NAME || pkg.len() > 200 || pkg.len() < 3 || !pkg.contains('.') {\n+        return false;\n+    }\n+    pkg.split('.').all(|segment| {\n+        let mut chars = segment.bytes();\n+        matches!(chars.next(), Some(b'a'..=b'z'))\n+            && chars.all(|c| c.is_ascii_lowercase() || c.is_ascii_digit() || c == b'_')\n+    })\n+}\n+\n+fn check_repackaged_manager(user: i32, pkg: &str) -> Option<i32> {\n+    // The original APK must be signed with the certificate embedded at build.\n+    // An unsigned/unpinned research build must never silently grant manager UID.\n+    if !valid_repackaged_pkg(pkg) || TRUSTED_CERT.is_empty() {\n+        return None;\n+    }\n+\n+    // Verify this package really has an installed repackaged stub APK.\n+    let stub = find_apk_path(pkg)?;\n+    let mut stub_fd = stub.open(OFlag::O_RDONLY | OFlag::O_CLOEXEC).ok()?;\n+    if read_certificate(&mut stub_fd, -1).is_empty() {\n+        return None;\n+    }\n+\n+    // The real manager code in the stub's private storage must be Magisk-signed.\n+    // Do not trust arbitrary data from the requester settings row.\n+    let uid = get_package_uid(user, pkg);\n+    if !(AID_APP_START..=AID_APP_END).contains(&to_app_id(uid)) {\n+        return None;\n+    }\n+    let dyn_path = cstr::buf::default()\n+        .join_path(APP_DATA_DIR)\n+        .join_path_fmt(user)\n+        .join_path(pkg)\n+        .join_path(\"dyn\")\n+        .join_path(\"current.apk\");\n+    let mut dyn_fd = dyn_path.open(OFlag::O_RDONLY | OFlag::O_CLOEXEC).ok()?;\n+    let dyn_owner = fd_get_attr(dyn_fd.as_raw_fd()).ok()?.st.st_uid as i32;\n+    if dyn_owner != uid {\n+        return None;\n+    }\n+    let cert = read_certificate(&mut dyn_fd, MAGISK_VER_CODE);\n+    if cert.as_slice() != TRUSTED_CERT {\n+        error!(\"pkg: dynamic manager signature mismatch: {}\", dyn_path);\n+        return None;\n+    }\n+    Some(uid)\n+}\n+\n@@ -234,0 +289,5 @@ impl MagiskD {\n+        // Preserve v31.1's original manager lookup as the fallback.\n+        let pkg = self.get_repackaged_manager_pkg();\n+        if let Some(uid) = check_repackaged_manager(user, &pkg) {\n+            return uid;\n+        }\nR3_NATIVE_PATCH\nprintf '%s  reports/r3-native.patch\\n' 'be9db0343e7f416368851b404a82b5ea21e773bdaaf36c9ba083d6b0e46cf9d2' | sha256sum -c -\ngit -C magisk apply --unidiff-zero --check ../reports/r3-native.patch\ngit -C magisk apply --unidiff-zero ../reports/r3-native.patch\ncat > reports/r4-app-bridge.patch <<'R4_APP_BRIDGE_PATCH'\ndiff --git a/app/core/build.gradle.kts b/app/core/build.gradle.kts\nindex 1646bb14f..672cc0160 100644\n--- a/app/core/build.gradle.kts\n+++ b/app/core/build.gradle.kts\n@@ -44,0 +45 @@ dependencies {\n+    implementation(libs.bcpkix)\ndiff --git a/app/core/src/main/java/com/topjohnwu/magisk/core/Config.kt b/app/core/src/main/java/com/topjohnwu/magisk/core/Config.kt\nindex cde22fd93..8f8a4c3fe 100644\n--- a/app/core/src/main/java/com/topjohnwu/magisk/core/Config.kt\n+++ b/app/core/src/main/java/com/topjohnwu/magisk/core/Config.kt\n@@ -7,0 +8,2 @@ import com.topjohnwu.magisk.core.repository.PreferenceConfig\n+import kotlinx.coroutines.Dispatchers\n+import kotlinx.coroutines.runBlocking\n@@ -24,0 +27,2 @@ object Config : PreferenceConfig, DBConfig {\n+        const val SU_MANAGER = \"requester\"\n+        const val KEYSTORE = \"keystore\"\n@@ -115,0 +120,11 @@ object Config : PreferenceConfig, DBConfig {\n+    // Only used from the migration worker, not the UI thread. SQLite failures are fatal.\n+    // The historical on-disk strings table was removed in DB schema 13; these read\n+    // the two whitelisted text keys from the existing settings table instead.\n+    var suManager: String\n+        get() = runBlocking(Dispatchers.IO) { settingsDB.fetchHideText(Key.SU_MANAGER) }\n+        set(value) = runBlocking(Dispatchers.IO) { settingsDB.putHideText(Key.SU_MANAGER, value) }\n+\n+    var keyStoreRaw: String\n+        get() = runBlocking(Dispatchers.IO) { settingsDB.fetchHideText(Key.KEYSTORE) }\n+        set(value) = runBlocking(Dispatchers.IO) { settingsDB.putHideText(Key.KEYSTORE, value) }\n+\ndiff --git a/app/core/src/main/java/com/topjohnwu/magisk/core/data/magiskdb/ManagerPackageNames.kt b/app/core/src/main/java/com/topjohnwu/magisk/core/data/magiskdb/ManagerPackageNames.kt\nnew file mode 100644\nindex 000000000..3af59b084\n--- /dev/null\n+++ b/app/core/src/main/java/com/topjohnwu/magisk/core/data/magiskdb/ManagerPackageNames.kt\n@@ -0,0 +1,10 @@\n+package com.topjohnwu.magisk.core.data.magiskdb\n+\n+/** Matches the restricted ASCII package format accepted by R3's native manager check. */\n+object ManagerPackageNames {\n+    private const val ORIGINAL_MANAGER = \"com.topjohnwu.magisk\"\n+    private val VALID = Regex(\"[a-z][a-z0-9_]*(\\\\.[a-z][a-z0-9_]*)+\")\n+\n+    fun isCandidate(value: String): Boolean =\n+        value.length in 3..200 && value != ORIGINAL_MANAGER && VALID.matches(value)\n+}\ndiff --git a/app/core/src/main/java/com/topjohnwu/magisk/core/data/magiskdb/SettingsDao.kt
        b/app/core/src/main/java/com/topjohnwu/magisk/core/data/magiskdb/SettingsDao.kt\nindex 6089caf0a..56c08c678 100644\n--- a/app/core/src/main/java/com/topjohnwu/magisk/core/data/magiskdb/SettingsDao.kt\n+++ b/app/core/src/main/java/com/topjohnwu/magisk/core/data/magiskdb/SettingsDao.kt\n@@ -2,0 +3,2 @@ package com.topjohnwu.magisk.core.data.magiskdb\n+import com.topjohnwu.magisk.core.ktx.await\n+\n@@ -19,0 +22,42 @@ class SettingsDao : MagiskDB() {\n+\n+    /** Legacy app-hiding storage using the existing v13 settings table.\n+     *  The requester and keystore keys are the only accepted text entries.\n+     *  This is a source bridge; it does not itself install or hide an APK.\n+     */\n+    suspend fun fetchHideText(key: String): String {\n+        require(key == \"requester\" || key == \"keystore\")\n+        val query = \"SELECT CAST(value AS TEXT) AS value FROM ${Table.SETTINGS} WHERE key=\\\"$key\\\" LIMIT 1\"\n+        val out = com.topjohnwu.superuser.Shell.cmd(\"magisk --sqlite '$query'\").await()\n+        check(out.isSuccess) { \"Magisk database read failed for $key\" }\n+        val value = out.out.firstOrNull { it.startsWith(\"value=\") }?.removePrefix(\"value=\").orEmpty()\n+        validateHideText(key, value)\n+        return value\n+    }\n+\n+    suspend fun putHideText(key: String, value: String) {\n+        validateHideText(key, value)\n+        val query = if (value.isEmpty()) {\n+            \"DELETE FROM ${Table.SETTINGS} WHERE key=\\\"$key\\\"\"\n+        } else {\n+            \"REPLACE INTO ${Table.SETTINGS} (key,value) VALUES(\\\"$key\\\",\\\"$value\\\")\"\n+        }\n+        val result = com.topjohnwu.superuser.Shell.cmd(\"magisk --sqlite '$query'\").await()\n+        check(result.isSuccess) { \"Magisk database write failed for $key\" }\n+        // A failed or ignored write must not permit a manager switch.\n+        check(fetchHideText(key) == value) { \"Magisk database verification failed for $key\" }\n+    }\n+\n+    private fun validateHideText(key: String, value: String) {\n+        when (key) {\n+            \"requester\" -> require(value.isEmpty() || ManagerPackageNames.isCandidate(value)) {\n+                \"Invalid repackaged manager package\"\n+            }\n+            \"keystore\" -> require(value.length <= 100_000 && value.all {\n+                it.isAsciiAlphaNumeric() || it == '+' || it == '/' || it == '='\n+            }) { \"Invalid encoded keystore\" }\n+            else -> throw IllegalArgumentException(\"Unknown Magisk text database key\")\n+        }\n+    }\n+\n+    private fun Char.isAsciiAlphaNumeric(): Boolean =\n+        this in 'a'..'z' || this in 'A'..'Z' || this in '0'..'9'\ndiff --git a/app/gradle/libs.versions.toml b/app/gradle/libs.versions.toml\nindex 0c54f8e7d..33984deb5 100644\n--- a/app/gradle/libs.versions.toml\n+++ b/app/gradle/libs.versions.toml\n@@ -17,0 +18 @@ wire = \"7.0.3\"\n+bcpkix = { module = \"org.bouncycastle:bcpkix-jdk18on\", version = \"1.86\" }\nR4_APP_BRIDGE_PATCH\nprintf '%s  reports/r4-app-bridge.patch\\n' 'aa8bdb40a37836e0fa3dd1eefd7ae480da600f03b88f9bbc0a648f975d26781a' | sha256sum -c -\ngit -C magisk apply --unidiff-zero --check ../reports/r4-app-bridge.patch\ngit -C magisk apply --unidiff-zero ../reports/r4-app-bridge.patch\ngit -C magisk diff --check\npython3 - <<'PY_R4_AUDIT'\nfrom pathlib import Path\nroot = Path('magisk')\np=(root/'native/src/core/package.rs').read_text()\nd=(root/'native/src/core/db.rs').read_text()\nc=(root/'app/core/src/main/java/com/topjohnwu/magisk/core/Config.kt').read_text()\ns=(root/'app/core/src/main/java/com/topjohnwu/magisk/core/data/magiskdb/SettingsDao.kt').read_text()\nassert 'check_repackaged_manager' in p\nassert 'TRUSTED_CERT.is_empty()' in p\nassert 'get_repackaged_manager_pkg()' in p\nassert \"WHERE key='requester'\" in d\nassert 'get() = runBlocking(Dispatchers.IO)' in c\nassert 'set(value) = runBlocking(Dispatchers.IO)' in c\nassert 'fun putHideText(' in s and 'fun fetchHideText(' in s\nassert 'check(fetchHideText(key) == value)' in s\nassert 'libs.bcpkix' in (root/'app/core/build.gradle.kts').read_text()\nfor n in ('JarMap', 'SignApk', 'ApkSignerV2'):\n  assert (root/f'app/core/src/main/java/com/topjohnwu/magisk/core/signing/{n}.java').exists()\nprint('R3+R4 cross-component source validation: PASS')\nPY_R4_AUDIT\ngit -C magisk diff --stat > reports/applied_source_stats.txt\ngit -C magisk diff --binary > reports/reviewed_core_changes.diff\n"
    - name: Restore pinned historical Stub APK build and asset embed (R5)
      shell: bash
      run: "set -euo pipefail\ncat > r5_restore.py <<'R5_PY_SOURCE'\n#!/usr/bin/env python3\n\"\"\"R5: restore historical stub build and package it as an asset on Magisk 31.1.\n\nResearch-only, no device changes, no live root manager switching. Pinned upstream\nsources, source diff and tests are reproducible. The app-hide UI is NOT present.\n\"\"\"\nfrom pathlib import Path\nimport subprocess\nimport sys\n\nBASE = '0972f67d97f9b6302b67c5171283330c74114b4a'\nOLD = 'ea16c8141eb64dc28b56a0e7fb536689ef465429'\n\n\ndef git(repo, *args):\n    return subprocess.run(['git', '-C', str(repo), *args], capture_output=True, text=True, check=True).stdout\n\n\ndef replace_once(path, before, after):\n    text = path.read_text()\n    if text.count(before) != 1:\n        raise AssertionError(f'{path}: expected exactly one patch anchor, got {text.count(before)}: {before[:80]}')\n    path.write_text(text.replace(before, after, 1))\n\n\ndef apply(repo):\n    repo = Path(repo).resolve()\n    assert git(repo, 'rev-parse', 'HEAD').strip() == BASE, 'Wrong Magisk 31.1 source SHA'\n    assert 'check_repackaged_manager' in (repo/'native/src/core/package.rs').read_text(), 'Apply R3 first'\n    assert 'fetchHideText' in (repo/'app/core/src/main/java/com/topjohnwu/magisk/core/data/magiskdb/SettingsDao.kt').read_text(), 'Apply R4 first'\n    assert not (repo/'app/stub').exists(), 'Not an original v31.1 tree (stub already restored)'\n    assert git(repo, 'cat-file', '-t', OLD).strip() == 'commit', 'Missing complete upstream Git history'\n\n    # Restore only historical stub-specific modules and generator. Don't revert\n    # the modern UI, modern database or newer root authorization policies.\n    git(repo, 'restore', '--source', OLD, '--worktree', '--',\n        'app/stub', 'app/stub-res', 'app/shared',\n        'app/build-logic/src/main/java/Stub.kt')\n\n    gradle = repo/'app/settings.gradle.kts'\n    replace_once(gradle, 'include(\":apk\", \":core\", \":test\")',\n                 'include(\":apk\", \":core\", \":shared\", \":stub\", \":stub-res\", \":test\")')\n\n    plugins = repo/'app/build.gradle.kts'\n    replace_once(plugins, '    alias(libs.plugins.moshix) apply false',\n                 '    alias(libs.plugins.lsparanoid) apply false\\n    alias(libs.plugins.moshix) apply false')\n\n    libs = repo/'app/gradle/libs.versions.toml'\n    replace_once(libs, 'moshix = { id = \"dev.zacsweers.moshix\", version = \"0.37.0\" }',\n                 'lsparanoid = { id = \"org.lsposed.lsparanoid\", version = \"0.6.0\" }\\nmoshix = { id = \"dev.zacsweers.moshix\", version = \"0.37.0\" }')\n\n    props = repo/'app/gradle.properties'\n    replace_once(props, 'magisk.versionCode=31100', 'magisk.stubVersion=41\\nmagisk.versionCode=31100')\n\n    plugin = repo/'app/build-logic/src/main/java/Plugin.kt'\n    replace_once(plugin, 'import java.util.Properties\\n',\n                 'import java.util.Properties\\nimport java.util.Random\\n\\n'\n                 '// R5 stub class names are stable on GitHub CI, random elsewhere.\\n'\n                 'val RAND_SEED = if (System.getenv(\"CI\") != null) 42 else 0\\n'\n                 'lateinit var RANDOM: Random\\n')\n    replace_once(plugin, '    val versionCode: Int get() = get(\"magisk.versionCode\")!!.toInt()\\n',\n                 '    val versionCode: Int get() = get(\"magisk.versionCode\")!!.toInt()\\n'\n                 '    val stubVersion: String get() = get(\"magisk.stubVersion\")!!\\n')\n    replace_once(plugin, '    private fun Project.applyPlugin() {\\n',\n                 '    private fun Project.applyPlugin() {\\n'\n                 '        initRandom(rootProject.file(\"dict.txt\"))\\n')\n\n    setup = repo/'app/build-logic/src/main/java/Setup.kt'\n    replace_once(setup, '            val syncAssets = tasks.register(\"sync${variantCapped}Assets\", SyncWithDir::class) {',\n                 '            val stubTask = tasks.getByPath(\":stub:transform${variantCapped}Apk\")\\n'\n                 '            val syncAssets = tasks.register(\"sync${variantCapped}Assets\", SyncWithDir::class) {')\n    replace_once(setup, '                filesMatching(\"**/util_functions.sh\") {',\n                 '                from(stubTask) {\\n'\n                 '                    include { it.name.endsWith(\".apk\") }\\n'\n                 '                    rename { \"stub.apk\" }\\n'\n                 '                }\\n'\n                 '                filesMatching(\"**/util_functions.sh\") {')\n    replace_once(setup, '\"versionCode=${Config.versionCode}\\\\n\").toByteArray()',\n                 '\"versionCode=${Config.versionCode}\\\\n\" +\\n'\n                 '                            \"stubVersion=${Config.stubVersion}\\\\n\").toByteArray()')\n\n    # Old stub APK's asset is required by the future migration component.  No\n    # launch UI and no installation are enabled at this stage.\n    assert 'from(stubTask)' in setup.read_text()\n    assert (repo/'app/stub/src/main/java/com/topjohnwu/magisk/DynLoad.java').is_file()\n    assert (repo/'app/shared/src/main/java/com/topjohnwu/magisk/StubApk.java').is_file()\n    assert 'magisk.versionCode=31100' in props.read_text()\n    assert git(repo, 'diff', '--check') == ''\n\n    print('R5 upstream stub modules, asset integration and 31.1 integrity: PASS')\n\nif __name__ == '__main__':\n    if len(sys.argv) != 2:\n        print('Usage: apply_r5.py /path/to/magisk', file=sys.stderr)\n        sys.exit(2)\n    apply(sys.argv[1])\nR5_PY_SOURCE\npython3 r5_restore.py magisk\ngit -C magisk diff --check\ngit -C magisk status --short > reports/R5_source_status.txt\ngit -C magisk diff --binary > reports/R5_final_tracked_changes.diff\ngit -C magisk diff --stat > reports/R5_final_tracked_summary.txt\n# Restore only tracks known upstream git objects; no downloaded patch blob.\ngit -C magisk ls-tree -r --name-only ea16c8141eb64dc28b56a0e7fb536689ef465429 app/stub app/stub-res app/shared > reports/R5_restored_historical_paths.txt\nwc -l < reports/R5_restored_historical_paths.txt > reports/R5_historical_file_count.txt\npython3 - <<'R5_STATIC'\nfrom pathlib import Path\nimport tomllib\nfrom xml.etree import ElementTree\np=Path('magisk')\nassert 'magisk.stubVersion=41' in (p/'app/gradle.properties').read_text()\nassert 'stub.apk' in (p/'app/build-logic/src/main/java/Setup.kt').read_text()\nassert 'setupStubApk()' in (p/'app/stub/build.gradle.kts').read_text()\nassert 'app/stub-res' in (p/'app/build-logic/src/main/java/Stub.kt').read_text() or ':stub-res' in (p/'app/build-logic/src/main/java/Stub.kt').read_text()\nassert 'initRandom(rootProject.file(\"dict.txt\"))' in (p/'app/build-logic/src/main/java/Plugin.kt').read_text()\nconfig=tomllib.loads((p/'app/gradle/libs.versions.toml').read_text())\nassert config['plugins']['lsparanoid']['version']=='0.6.0'\nassert 'getDynDir(info)' in (p/'app/shared/src/main/java/com/topjohnwu/magisk/StubApk.java').read_text()\nassert '\"/data/user_de\"' in (p/'native/src/include/consts.rs').read_text()\nxmls=list((p/'app/stub').rglob('*.xml'))+list((p/'app/stub-res').rglob('*.xml'))\nfor x in xmls: ElementTree.parse(x)\nprint(f'R5 stub topology and {len(xmls)} XML resources PASS')\nR5_STATIC\n"
    - name: Integrate historical app migration and v31.1 Compose UI (R6)
      shell: bash
      run: "set -euo pipefail\ncat > r6_migration.py <<'R6_VERIFIED_SOURCE'\n#!/usr/bin/env python3\n\"\"\"R6: recover historical Magisk app migration and bridge it with v31.1 Compose UI.\n\nSource-only research. Applies to Magisk 31.1 after the R3/R4/R5 restore.\nNo device operations are executed by this script; they are in Android source only.\n\"\"\"\nfrom pathlib import Path\nimport subprocess\nimport sys\nimport re\n\nBASE='0972f67d97f9b6302b67c5171283330c74114b4a'\nOLD='ea16c8141eb64dc28b56a0e7fb536689ef465429'\n\n\ndef git(root,*args):\n    return subprocess.run(['git','-C',str(root),*args],check=True,text=True,capture_output=True).stdout\n\n\ndef replace_once(path,before,after):\n    content=path.read_text()\n    count=content.count(before)\n    if count != 1:\n        raise AssertionError(f'R6 {path} anchor expected once, got {count}: {before[:110]!r}')\n    path.write_text(content.replace(before,after,1))\n\n\ndef section_replace(path,start_marker,end_marker,text):\n    data=path.read_text()\n    assert data.count(start_marker)==1, (path,start_marker)\n    assert data.count(end_marker)==1, (path,end_marker)\n    first=data.index(start_marker)\n    last=data.index(end_marker,first)\n    path.write_text(data[:first]+text+data[last:])\n\n\ndef apply(repo):\n    repo=Path(repo).resolve()\n    assert git(repo,'rev-parse','HEAD').strip()==BASE\n    assert (repo/'app/stub/src/main/java/com/topjohnwu/magisk/DynLoad.java').is_file(), 'R5 required'\n    assert 'get_repackaged_manager_pkg' in (repo/'native/src/core/db.rs').read_text(), 'R3 required'\n    assert 'fun putHideText(' in (repo/'app/core/src/main/java/com/topjohnwu/magisk/core/data/magiskdb/SettingsDao.kt').read_text(), 'R4 required'\n    assert 'from(stubTask)' in (repo/'app/build-logic/src/main/java/Setup.kt').read_text(), 'R5 asset required'\n\n    # The v31.0 migration implementation is restored from an exact Git object,\n    # not an unverified download.  Adjust only changed v31.1 contracts.\n    migration_path='app/core/src/main/java/com/topjohnwu/magisk/core/tasks/AppMigration.kt'\n    migration=repo/migration_path\n    assert not migration.exists(), 'R6 already applied'\n    migration.parent.mkdir(parents=True,exist_ok=True)\n    migration.write_text(git(repo,'show',f'{OLD}:{migration_path}'))\n    replace_once(migration, 'import com.topjohnwu.magisk.core.Const\\n','import com.topjohnwu.magisk.core.Info\\nimport com.topjohnwu.magisk.core.isRunningAsStub\\nimport com.topjohnwu.magisk.core.data.magiskdb.ManagerPackageNames\\n')\n    replace_once(migration, 'import android.widget.Toast\\n','')\n    replace_once(migration, 'import com.topjohnwu.magisk.core.R\\n','')\n    replace_once(migration, 'import com.topjohnwu.magisk.core.ktx.toast\\n','')\n    replace_once(migration, 'import java.io.IOException\\n','import java.io.IOException\\n')\n\n    # Generate only valid ASCII package identifiers allowed by native R3 and R4.\n    section_replace(migration,'    private fun genPackageName(): String {','    private fun classNameGenerator() = sequence {', '''    private fun genPackageName(): String {\n        val random = SecureRandom()\n        val count = 2 + random.nextInt(2)\n        return (0 until count).joinToString(\".\") {\n            val n = 4 + random.nextInt(5)\n            buildString {\n                append(ALPHA[random.nextInt(ALPHA.length)])\n                repeat(n - 1) { append(ALPHA[random.nextInt(ALPHA.length)]) }\n            }\n        }\n    }\n\n''')\n    replace_once(migration, '    private const val ALPHADOTS = \"$ALPHA.....\"\\n','')\n\n    # Stop passing the pre-31.1 Config Parcelable; the new Config has no\n    # toBundle()/PREV_CONFIG.  Settings are already persisted to Magisk DB.\n    section_replace(migration, '    private fun launchApp(context: Context, pkg: String) {','    suspend fun patchAndHide(context: Context, label: String, pkg: String? = null): Boolean {', '''    private fun launchApp(context: Context, pkg: String): Boolean {\n        return try {\n            val intent = context.packageManager.getLaunchIntentForPackage(pkg) ?: return false\n            if (context !is Activity) intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)\n            val options = ActivityOptions.makeBasic()\n            if (Build.VERSION.SDK_INT >= 34) options.setShareIdentityEnabled(true)\n            context.startActivity(intent, options.toBundle())\n            if (context is Activity) context.finish()\n            true\n        } catch (e: Exception) {\n            Timber.e(e, \"Failed to launch migrated manager\")\n            false\n        }\n    }\n\n''')\n\n    # The old flow could update requester before verifying install, and mixed\n    # blocking root calls into main thread.  R6 runs mutation off main, then\n    # launches only on the main dispatcher. The original app remains installed\n    # as fallback (no uninstall on failure).\n    section_replace(migration,'    suspend fun patchAndHide(context: Context, label: String, pkg: String? = null): Boolean {','    suspend fun restoreApp(context: Context): Boolean {', '''    suspend fun patchAndHide(context: Context, label: String, pkg: String? = null): Boolean {\n        if (context.packageName != APP_PACKAGE_NAME || isRunningAsStub || !Info.env.isActive) return false\n        if (label.isBlank() || label.length > MAX_LABEL_LENGTH || label.any(Char::isISOControl)) return false\n        val target = pkg ?: genPackageName()\n        if (!ManagerPackageNames.isCandidate(target)) return false\n\n        val installed = withContext(Dispatchers.IO) {\n            try {\n                val stub = File(context.cacheDir, \"stub.apk\")\n                context.assets.open(\"stub.apk\").writeTo(stub)\n\n                // If a package name is already taken, do not overwrite its APK.\n                val alreadyPresent = try {\n                    context.packageManager.getApplicationInfo(target, 0)\n                    true\n                } catch (_: PackageManager.NameNotFoundException) {\n                    false\n                }\n                if (alreadyPresent) return@withContext false\n\n                Config.keyStoreRaw = \"\" // Fresh per-migration signing key.\n                val repack = File(context.cacheDir, \"patched-$target.apk\")\n                val signed = repack.outputStream().use { patch(context, stub, it, target, label) }\n                if (!signed) return@withContext false\n                if (!Shell.cmd(\"adb_pm_install $repack $target\").await().isSuccess) return@withContext false\n                try {\n                    context.packageManager.getApplicationInfo(target, 0)\n                } catch (_: PackageManager.NameNotFoundException) {\n                    return@withContext false\n                }\n\n                // Commit the manager switch only after installation succeeds.\n                // Native R3 still validates both package UID and signed dynamic APK.\n                Config.suManager = target\n                Shell.cmd(\"touch $AppApkPath\").await()\n                true\n            } catch (e: Exception) {\n                Timber.e(e, \"Failed to prepare or install repackaged manager\")\n                false\n            }\n        }\n        if (!installed) return false\n        if (launchApp(context, target)) return true\n        // A failed launch must not strand root permissions on an unusable manager.\n        withContext(Dispatchers.IO) {\n            runCatching { Config.suManager = \"\" }.onFailure { Timber.e(it, \"Manager switch rollback failed\") }\n        }\n        return false\n    }\n\n''')\n    section_replace(migration,'    suspend fun restoreApp(context: Context): Boolean {','    suspend fun upgradeStub(context: Context, apk: File): Intent? {','''    suspend fun restoreApp(context: Context): Boolean {\n        if (!isRunningAsStub || context.packageName == APP_PACKAGE_NAME || !Info.env.isActive) return false\n        val installed = withContext(Dispatchers.IO) {\n            try {\n                val apk = StubApk.current(context)\n                if (!apk.isFile || apk.length() == 0L) return@withContext false\n                if (!Shell.cmd(\"\
        adb_pm_install $apk $APP_PACKAGE_NAME\").await().isSuccess) return@withContext false\n                Config.suManager = \"\"\n                Shell.cmd(\"touch $AppApkPath\").await()\n                true\n            } catch (e: Exception) {\n                Timber.e(e, \"Failed to restore original manager\")\n                false\n            }\n        }\n        return installed && launchApp(context, APP_PACKAGE_NAME)\n    }\n\n''')\n\n    # Source snapshot's hidden-loader App needs the historic constructor(Object)\n    # and has to attach an Application context from the stub.\n    app=repo/'app/core/src/main/java/com/topjohnwu/magisk/core/App.kt'\n    app.write_text('''package com.topjohnwu.magisk.core\n\nimport android.app.Application\nimport android.content.Context\nimport com.topjohnwu.magisk.StubApk\nimport com.topjohnwu.magisk.core.utils.RootUtils\n\nopen class App() : Application() {\n    constructor(rawStubData: Any) : this() {\n        val data = StubApk.Data(rawStubData)\n        data.classToComponent[RootUtils::class.java.name] = data.rootService.name\n        data.rootService = RootUtils::class.java\n        Info.stub = data\n    }\n\n    override fun attachBaseContext(context: Context) {\n        if (context is Application) {\n            AppContext.attachApplication(context)\n        } else {\n            super.attachBaseContext(context)\n            AppContext.attachApplication(this)\n        }\n    }\n}\n''')\n    info=repo/'app/core/src/main/java/com/topjohnwu/magisk/core/Info.kt'\n    replace_once(info,'import androidx.lifecycle.MutableLiveData\\n','import androidx.lifecycle.MutableLiveData\\nimport com.topjohnwu.magisk.StubApk\\n')\n    replace_once(info,'object Info {\\n','val isRunningAsStub get() = Info.stub != null\\n\\nobject Info {\\n    var stub: StubApk.Data? = null\\n')\n    context=repo/'app/core/src/main/java/com/topjohnwu/magisk/core/AppContext.kt'\n    replace_once(context,'import androidx.profileinstaller.ProfileInstaller\\n','import androidx.profileinstaller.ProfileInstaller\\nimport com.topjohnwu.magisk.StubApk\\n')\n    replace_once(context,'        AppApkPath = base.packageResourcePath\\n', '''        AppApkPath = if (isRunningAsStub) {\n            StubApk.current(base).path\n        } else {\n            base.packageResourcePath\n        }\n''')\n\n    # Compose home screen: explicit confirmation and progress. Button gated on\n    # active v31.1 environment, no auto-migration on startup.\n    home=repo/'app/apk/src/main/java/com/topjohnwu/magisk/ui/home/HomeScreen.kt'\n    replace_once(home,'import androidx.compose.material.icons.filled.Security\\n','import androidx.compose.material.icons.filled.Security\\nimport androidx.compose.material.icons.filled.Visibility\\nimport androidx.compose.material.icons.filled.VisibilityOff\\n')\n    replace_once(home,'import androidx.compose.material3.MaterialTheme\\n','import androidx.compose.material3.MaterialTheme\\nimport androidx.compose.material3.OutlinedTextField\\n')\n    replace_once(home,'import com.topjohnwu.magisk.core.Info\\n','import com.topjohnwu.magisk.core.Info\\nimport com.topjohnwu.magisk.core.isRunningAsStub\\n')\n    replace_once(home,'import com.topjohnwu.magisk.core.model.UpdateInfo\\n','import com.topjohnwu.magisk.core.model.UpdateInfo\\nimport com.topjohnwu.magisk.core.tasks.AppMigration\\n')\n    replace_once(home,'    val scrollBehavior = TopAppBarDefaults.pinnedScrollBehavior()\\n','    val scrollBehavior = TopAppBarDefaults.pinnedScrollBehavior()\\n    var showHideDialog by rememberSaveable { mutableStateOf(false) }\\n    var showRestoreDialog by rememberSaveable { mutableStateOf(false) }\\n')\n    replace_once(home,'    LoadingDialog(visible = uiState.showLoading)\\n','    LoadingDialog(visible = uiState.showLoading)\\n')\n    replace_once(home,'    val scrollState = rememberScrollState()\\n', '''    if (showHideDialog) {\n        HideAppDialog(\n            onDismiss = { showHideDialog = false },\n            onConfirm = { label ->\n                showHideDialog = false\n                viewModel.hideManager(label)\n            }\n        )\n    }\n    if (showRestoreDialog) {\n        RestoreAppDialog(\n            onDismiss = { showRestoreDialog = false },\n            onConfirm = {\n                showRestoreDialog = false\n                viewModel.restoreManager()\n            }\n        )\n    }\n\n    val scrollState = rememberScrollState()\n''')\n    replace_once(home,'                    progress = uiState.managerProgress,\\n                    onManagerPressed = viewModel::onManagerPressed,','''                    progress = uiState.managerProgress,\n                    isHidden = isRunningAsStub,\n                    onManagerPressed = viewModel::onManagerPressed,\n                    onHideRestorePressed = {\n                        if (!uiState.showLoading) {\n                            if (isRunningAsStub) showRestoreDialog = true else showHideDialog = true\n                        }\n                    },''')\n    replace_once(home,'    progress: Int,\\n    onManagerPressed: () -> Unit,','    progress: Int,\\n    isHidden: Boolean,\\n    onManagerPressed: () -> Unit,\\n    onHideRestorePressed: () -> Unit,')\n    needle='''                if (actionLabel != null) {\n                    InstallButton(\n                        label = actionLabel,\n                        onClick = onManagerPressed,\n                    )\n                }\n'''\n    replacement='''                Row(verticalAlignment = Alignment.CenterVertically) {\n                    if (Info.env.isActive && Info.env.versionCode == BuildConfig.APP_VERSION_CODE) {\n                        IconButton(onClick = onHideRestorePressed) {\n                            Icon(\n                                imageVector = if (isHidden) Icons.Default.Visibility else Icons.Default.VisibilityOff,\n                                contentDescription = stringResource(\n                                    if (isHidden) CoreR.string.settings_restore_app_title\n                                    else CoreR.string.settings_hide_app_title\n                                ),\n                                modifier = Modifier.size(20.dp),\n                            )\n                        }\n                    }\n                    if (actionLabel != null) {\n                        Spacer(Modifier.width(4.dp))\n                        InstallButton(label = actionLabel, onClick = onManagerPressed)\n                    }\n                }\n'''\n    replace_once(home,needle,replacement)\n    home.write_text(home.read_text()+'''\n\n@Composable\nprivate fun HideAppDialog(\n    onDismiss: () -> Unit,\n    onConfirm: (String) -> Unit,\n    modifier: Modifier = Modifier,\n) {\n    val defaultName = stringResource(CoreR.string.settings)\n    var appName by rememberSaveable { mutableStateOf(defaultName) }\n    val invalid = appName.isBlank() || appName.length > AppMigration.MAX_LABEL_LENGTH\n    MagiskDialog(\n        modifier = modifier,\n        onDismissRequest = onDismiss,\n        title = stringResource(CoreR.string.settings_hide_app_title),\n        confirmText = stringResource(android.R.string.ok),\n        onConfirm = { if (!invalid) onConfirm(appName) },\n        confirmEnabled = !invalid,\n        dismissText = stringResource(android.R.string.cancel),\n        onDismiss = onDismiss,\n    ) {\n        Column(modifier = Modifier.padding(top = 8.dp)) {\n            OutlinedTextField(\n                value = appName,\n                onValueChange = { appName = it },\n                modifier = Modifier.fillMaxWidth(),\n                label = { Text(stringResource(CoreR.string.settings_app_name_hint)) },\n                isError = invalid,\n            )\n        }\n    }\n}\n\n@Composable\nprivate fun RestoreAppDialog(\n    onDismiss: () -> Unit,\n    onConfirm: () -> Unit,\n    modifier: Modifier = Modifier,\n) {\n    MagiskDialog(\n        modifier = modifier,\n        onDismissRequest = onDismiss,\n        title = stringResource(CoreR.string.settings_restore_app_title),\n        confirmText = stringResource(android.R.string.ok),\n        onConfirm
        = onConfirm,\n        dismissText = stringResource(android.R.string.cancel),\n        onDismiss = onDismiss,\n    ) {\n        Text(stringResource(CoreR.string.restore_app_confirmation))\n    }\n}\n''')\n\n    # Mutations live in the existing activity-scoped ViewModel, so rotation or\n    # closing a Compose sheet does not cancel an ongoing root transaction.\n    vm=repo/'app/apk/src/main/java/com/topjohnwu/magisk/ui/home/HomeViewModel.kt'\n    replace_once(vm,'import com.topjohnwu.magisk.core.tasks.MagiskInstaller\\n',\n                 'import com.topjohnwu.magisk.core.tasks.MagiskInstaller\\nimport com.topjohnwu.magisk.core.tasks.AppMigration\\n')\n    replace_once(vm,'    fun fixEnv() {\\n','''    fun hideManager(label: String) {\n        if (_uiState.value.showLoading) return\n        viewModelScope.launch {\n            val success = try {\n                withLoading {\n                    val context = AppContext.foregroundActivity ?: AppContext\n                    AppMigration.patchAndHide(context, label)\n                }\n            } catch (e: Exception) {\n                false\n            }\n            if (!success) showToast(CoreR.string.failure)\n        }\n    }\n\n    fun restoreManager() {\n        if (_uiState.value.showLoading) return\n        viewModelScope.launch {\n            val success = try {\n                withLoading {\n                    val context = AppContext.foregroundActivity ?: AppContext\n                    AppMigration.restoreApp(context)\n                }\n            } catch (e: Exception) {\n                false\n            }\n            if (!success) showToast(CoreR.string.failure)\n        }\n    }\n\n    fun fixEnv() {\n''')\n\n    # Add English strings. Other locales fall back to the original source's\n    # English resources; do not overwrite translation files.\n    strings=repo/'app/core/src/main/res/values/strings.xml'\n    for name in ['settings_hide_app_title','settings_restore_app_title','settings_app_name_hint','restore_app_confirmation']:\n        assert f'name=\"{name}\"' not in strings.read_text(), name\n    replace_once(strings,'</resources>', '''    <string name=\"settings_hide_app_title\">Hide the Magisk app</string>\n    <string name=\"settings_restore_app_title\">Restore the Magisk app</string>\n    <string name=\"settings_app_name_hint\">New name</string>\n    <string name=\"restore_app_confirmation\">Restore the hidden manager to its original package?</string>\n</resources>''')\n\n    # The dynamic stub reflects on App(Object).  R8 must not strip or rename it.\n    proguard=repo/'app/core/proguard-rules.pro'\n    replace_once(proguard,'# Strip Timber verbose and debug logging',\n                 '# Keep the historical stub-facing Application constructor used via reflection.\\n'\n                 '-keep class com.topjohnwu.magisk.core.App { <init>(java.lang.Object); }\\n\\n'\n                 '# Strip Timber verbose and debug logging')\n\n    # Restore only four official historical German translations (English\n    # values above serve as fallback for all other existing translations).\n    german=repo/'app/core/src/main/res/values-de/strings.xml'\n    old_german=git(repo,'show',f'{OLD}:app/core/src/main/res/values-de/strings.xml')\n    labels=('settings_hide_app_title','settings_restore_app_title','settings_app_name_hint','restore_app_confirmation')\n    original=german.read_text()\n    translations=[]\n    for key in labels:\n        assert f'name=\"{key}\"' not in original\n        found=re.search(r'^\\s*<string name=\"'+re.escape(key)+r'\">.*</string>\\s*$',old_german,re.M)\n        assert found, f'Authentic translation missing for {key}'\n        translations.append(found.group(0).strip())\n    replace_once(german,'</resources>',\n                 ''.join('    '+val+'\\n' for val in translations)+'</resources>')\n\n    # Build gate: retained JNI and signing paths, no original version changes.\n    assert 'magisk.versionCode=31100' in (repo/'app/gradle.properties').read_text()\n    assert 'check_repackaged_manager' in (repo/'native/src/core/package.rs').read_text()\n    assert 'Info.stub = data' in app.read_text()\n    assert 'StubApk.current(base).path' in context.read_text()\n    assert 'assets.open(\"stub.apk\")' in migration.read_text()\n    assert 'viewModel.hideManager(label)' in home.read_text()\n    assert 'viewModel.restoreManager()' in home.read_text()\n    assert git(repo,'diff','--check')==''\n    print('R6 migration, dynamic Application bridge and Compose UI: SOURCE PASS')\n\nif __name__=='__main__':\n    if len(sys.argv)!=2:\n        sys.exit('usage: apply_r6.py <Magisk 31.1 checkout after R5>')\n    apply(sys.argv[1])\nR6_VERIFIED_SOURCE\nprintf '%s  r6_migration.py\\n' '489ece815abe1f779445feaa9f3e880965e77f294c6f917a8522501cd349c001' | sha256sum -c -\npython3 r6_migration.py magisk\n# R6.1: restore the exact original Magisk :core -> :shared Gradle API edge.\n# R5 already restored :shared; R6 introduced imports of StubApk in core,\n# but the removed API edge was not restored. That caused the 42517049587\n# :core:compileReleaseKotlin \"Unresolved reference StubApk\" failure.\npython3 - <<'PY_R61_SHARED_LINK'\nfrom pathlib import Path\nroot=Path('magisk/app')\ncore=root/'core/build.gradle.kts'\nsource=root/'shared/src/main/java/com/topjohnwu/magisk/StubApk.java'\nsettings=(root/'settings.gradle.kts').read_text()\ntext=core.read_text()\nanchor='dependencies {\\n    coreLibraryDesugaring(libs.jdk.libs)\\n'\nassert text.count(anchor) == 1, 'Core Gradle dependencies changed unexpectedly'\nassert 'api(project(\":shared\"))' not in text, 'Dependency already injected; refuse duplicate'\nassert 'implementation(project(\":shared\"))' not in text, 'Other shared dependency already present'\nassert source.is_file() and 'public class StubApk' in source.read_text(), 'Pinned StubApk.java missing'\nassert 'include(\":apk\", \":core\", \":shared\", \":stub\", \":stub-res\", \":test\")' in settings, 'shared Gradle module not configured'\ntext=text.replace(anchor,anchor+'    api(project(\":shared\"))\\n',1)\ncore.write_text(text)\nassert text.count('api(project(\":shared\"))') == 1\nprint('R6.1 original Magisk :core -> :shared API link restored: PASS')\nPY_R61_SHARED_LINK\n# R6.2: the historical shared library manifest forces Android's back\n# dispatcher callback to false, but pinned 31.1 core requires true.\n# A shared library must not override the app's modern back handling.\n# Keep the official v31.1 core setting intact; remove only the obsolete\n# library override. Assert there are no other conflicting app attributes.\npython3 - <<'PY_R62_MANIFEST'\nfrom pathlib import Path\nfrom xml.etree import ElementTree as ET\nroot=Path('magisk/app')\nmanifests={name: root/name/'src/main/AndroidManifest.xml'\n           for name in ('core', 'shared', 'apk', 'stub')}\nfor path in manifests.values():\n    assert path.is_file(), f'Missing pinned module manifest: {path}'\nandroid='{http://schemas.android.com/apk/res/android}'\nkey=android+'enableOnBackInvokedCallback'\ndef attrs(name):\n    el=ET.parse(manifests[name]).getroot().find('application')\n    assert el is not None, f'No application element in {name}'\n    return el.attrib\nbefore_core=attrs('core')\nbefore_shared=attrs('shared')\napk=attrs('apk')\nassert before_core.get(key)=='true', 'Official 31.1 back callback setting changed'\nassert before_shared.get(key)=='false', 'Historical shared manifest baseline changed'\nassert key not in apk, 'APK manifest now owns the callback setting'\ncollisions={k:(before_core[k],before_shared[k])\n            for k in set(before_core)&set(before_shared)\n            if before_core[k]!=before_shared[k]}\nassert collisions=={key:('true','false')}, f'Other manifest collisions: {collisions}'\npath=manifests['shared']\ncontent=path.read_text(encoding='utf-8')\nobsolete='        android:enableOnBackInvokedCallback=\"false\"\\n'\nassert content.count(obsolete)==1, 'Unexpected historical back callback layout'\npath.write_text(content.replace(obsolete,'',1),encoding='utf-8')\nassert key not in attrs('shared'), 'Obsolete override was not removed'\nassert attrs('core').get(key)=='true',
        'Official Magisk v31.1 core was altered'\n# Check ALL shared application attributes, not only the known conflict.\ncore,shared=attrs('core'),attrs('shared')\nremaining={k:(core[k],shared[k]) for k in set(core)&set(shared)\n           if core[k]!=shared[k]}\nassert not remaining, f'Inconsistent app manifest attributes remain: {remaining}'\nassert attrs('stub') is not None\nprint('R6.2 31.1/shared/stub APK manifest compatibility: PASS')\nPY_R62_MANIFEST\ncp magisk/app/shared/src/main/AndroidManifest.xml reports/R6_2_reviewed_shared_AndroidManifest.xml\ngit -C magisk diff --check\ngit -C magisk diff --binary > reports/R6_tracked_source.diff\ngit -C magisk diff --stat > reports/R6_tracked_stats.txt\ngit -C magisk status --short > reports/R6_source_status.txt\nsha256sum \\\n  magisk/app/core/src/main/java/com/topjohnwu/magisk/core/tasks/AppMigration.kt \\\n  magisk/app/core/src/main/java/com/topjohnwu/magisk/core/App.kt \\\n  magisk/app/core/src/main/java/com/topjohnwu/magisk/core/AppContext.kt \\\n  magisk/app/core/src/main/java/com/topjohnwu/magisk/core/Info.kt \\\n  magisk/app/apk/src/main/java/com/topjohnwu/magisk/ui/home/HomeScreen.kt \\\n  magisk/app/apk/src/main/java/com/topjohnwu/magisk/ui/home/HomeViewModel.kt \\\n  magisk/app/core/src/main/res/values/strings.xml > reports/R6_source_SHA256SUMS.txt\n"
    - name: R9.5 - Restore pinned Magisk Stub resources and component mapping
