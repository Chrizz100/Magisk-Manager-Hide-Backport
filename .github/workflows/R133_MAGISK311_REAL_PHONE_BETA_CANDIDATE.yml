    - name: Compile signed research Magisk 31.1 with R6 migration and stub.apk
      id: r92_compile
      shell: bash
      run: "set -euo pipefail\n# Existing R9.1 Magisk source and build logic are unchanged. Retry ONLY\n# for temporary HTTP/network failures while keeping Gradle's downloads.\n# Do not turn compiler errors into retries or report a false success.\nfor attempt in 1 2 3; do\n  echo \"R9.2 complete Magisk build attempt ${attempt}/3\"\n  log=\"reports/full_build_attempt_${attempt}.log\"\n  if (cd magisk && python3 build.py -vr -c ../r6-build.prop all) 2>&1 | tee \"$log\"; then\n    cp \"$log\" reports/full_build.log\n    printf 'BUILD_PASS_ON_ATTEMPT=%s\\n' \"$attempt\" > reports/R92_BUILD_RETRY_STATUS.txt\n    break\n  fi\n  cp \"$log\" reports/full_build.log\n  if ! grep -Eiq 'HTTP[^0-9]*5[0-9][0-9]|status code[^0-9]*5[0-9][0-9]|Received status code 5[0-9][0-9]|Gateway Time-out|Gateway Timeout|Service Unavailable|Connection reset|Connection timed out|Read timed out|Remote host terminated|Temporary failure in name resolution|UnknownHostException|TLS handshake' \"$log\"; then\n    printf 'NON_TRANSIENT_BUILD_FAILURE_AT_ATTEMPT=%s\\n' \"$attempt\" > reports/R92_BUILD_RETRY_STATUS.txt\n    echo 'R9.2: compiler / non-transient failure: refusing blind retries' >&2\n    exit 1\n  fi\n  if [ \"$attempt\" -ge 3 ]; then\n    printf 'TRANSIENT_DOWNLOAD_FAILURE_AFTER_THREE_ATTEMPTS\\n' > reports/R92_BUILD_RETRY_STATUS.txt\n    echo 'R9.2: dependency download still failing after three attempts' >&2\n    exit 1\n  fi\n  echo \"R9.2: transient download problem; retain verified Gradle cache and retry.\"\n  sleep \"$((attempt * 12))\"\ndone\ntest -s magisk/out/app-release.apk\npython3 - <<'PY_VERIFY'\nimport hashlib, pathlib, zipfile\nroot=pathlib.Path('magisk/out')\napk=root/'app-release.apk'\nassert apk.is_file() and apk.stat().st_size>1_000_000\nwith zipfile.ZipFile(apk) as z:\n  assert z.testzip() is None\n  dex=[n for n in z.namelist() if n.startswith('classes') and n.endswith('.dex')]\n  assert dex\nwith zipfile.ZipFile(apk) as z:\n  names=z.namelist()\n  assert 'assets/stub.apk' in names, 'Stub APK was not packaged in Magisk manager'\n  from io import BytesIO\n  with zipfile.ZipFile(BytesIO(z.read('assets/stub.apk'))) as stub:\n    assert stub.testzip() is None\n    assert 'AndroidManifest.xml' in stub.namelist()\n    assert 'classes.dex' in stub.namelist()\nflags=(pathlib.Path('magisk/native/out/generated/flags.rs')).read_text()\nassert 'TRUSTED_CERT' in flags\nimport re\ncert=re.search(r'TRUSTED_CERT:.*?= &\\[(.*?)\\];',flags,re.S)\nassert cert and len(re.findall('0x[0-9a-f]{2}', cert.group(1)))>100, 'Trusted cert missing in native build'\nsha=hashlib.sha256(apk.read_bytes()).hexdigest()\npathlib.Path('reports/app-release-sha256.txt').write_text(f'{sha}  app-release.apk\\n')\npathlib.Path('reports/BUILD_STATUS.txt').write_text(\n  'R6 native ARM64/ARM32, Android APK and nested stub.apk built.\\n'\n  'R6 AppMigration and Compose UI compiled, but runtime migration still UNTESTED.\\n'\n  'DO NOT INSTALL OR FLASH THIS EXPERIMENTAL RESEARCH FORK.\\n'\n)\nprint('R6 stub.apk, app migration UI and native trusted certificate compiled PASS; research-only')\nPY_VERIFY\n"
