      run: "set -euo pipefail\n# Upgrade R9.7's emulator harness with concrete module UI checks.\n# Only the QEMU Android-13 instance is allowed to run this test.\npython3 - <<'PY_R11_MODULE_SUITE'\nfrom pathlib import Path\np=Path('r9_root_emulator.py')\ns=p.read_text()\nstart='    def run(self):\\n        try:\\n            self.root_setup()\\n            self.enable_gui()\\n'\nassert s.count(start)==1, 'R11: pinned R9.7 harness run() changed'\nassert '    def hide_verify(self):\\n' in s\nmethod='''    def r11_module_roundtrip(self):\n        # Identity and genuine Magisk daemon/root must have been checked already.\n        if not all(self.stages.get(x) for x in ('AVD_ONLY','MAGISK_DAEMON_31100','MAGISK_SU')):\n            raise RuntimeError('R11 module test requires official rooted Android-13 QEMU')\n        import io, zipfile\n        mod='r11_beta_e2e_probe'\n        basedir='/data/adb/modules/'+mod\n        descriptor='id='+mod+'\\\\nname=R11 E2E Testmodul\\\\nversion=1\\\\nversionCode=1\\\\nauthor=R11-Automation\\\\ndescription=Isolated CI verification only\\\\n'\n        # Populate a benign fixture in the same on-device directory that Magisk's UI reads.\n        self.adb('mkdir -p '+basedir)\n        self.adb('printf %s '+shlex.quote(descriptor)+' > '+basedir+'/module.prop')\n        self.adb('chmod 0644 '+basedir+'/module.prop')\n        if 'R11 E2E Testmodul' not in self.adb('cat '+basedir+'/module.prop'):\n            raise RuntimeError('R11 module fixture not installed on AVD')\n        self.mark('R11_MODULE_VISIBLE_ON_DISK')\n        self.adb('pm grant '+ORIGINAL+' android.permission.POST_NOTIFICATIONS', check=False)\n        self.adb('am force-stop '+ORIGINAL)\n        self.adb('am start -W -n '+ACTIVITY,timeout=50)\n        xml=self.ui_dump('r11_home_before_module')\n        self.tap(xml,'Modules')\n        # Verify native Magisk ModuleScreen renders the fixture.\n        def module_ui():\n            xml=self.ui_dump('r11_modules_screen')\n            return xml if 'R11 E2E Testmodul' in xml else None\n        xml=self.wait(module_ui,'Magisk Modules UI fixture',seconds=80)\n        self.mark('R11_MODULE_UI_VISIBLE')\n        def toggle(xml, expected_checked):\n            root=ET.fromstring(xml)\n            matches=[]\n            for node in root.iter('node'):\n                # Compose/Android UIAutomator puts the accessible label on a\n                # nested child, while checked/clickable live on its parent.\n                if node.get('checkable')!='true' or node.get('clickable')!='true':\n                    continue\n                if not any(child.get('content-desc','')=='R11 E2E Testmodul'\n                           for child in node.iter('node')):\n                    continue\n                matches.append(node)\n            if len(matches)!=1:\n                raise RuntimeError('R11: expected exactly one target module switch, found '+str(len(matches)))\n            node=matches[0]\n            desired='true' if expected_checked else 'false'\n            if node.get('checked')!=desired:\n                raise RuntimeError('R11: wrong module switch state: expected '+desired+\n                                   ', got '+str(node.get('checked')))\n            bounds=re.fullmatch(r'\\\\[(\\\\d+),(\\\\d+)\\\\]\\\\[(\\\\d+),(\\\\d+)\\\\]',node.get('bounds',''))\n            if not bounds:\n                raise RuntimeError('R11: labeled module switch has no valid bounds')\n            x0,y0,x1,y1=map(int,bounds.groups())\n            if x1<=x0 or y1<=y0:\n                raise RuntimeError('R11: invalid nonpositive switch area')\n            self.adb(f'input tap {(x0+x1)//2} {(y0+y1)//2}')\n            time.sleep(2)\n        toggle(xml, True)\n        self.wait(lambda:self.adb('test -f '+basedir+'/disable && echo YES || true')=='YES',\n                  'module disabled marker from actual GUI',seconds=35)\n        self.mark('R11_MODULE_GUI_DISABLED')\n        xml=self.ui_dump('r11_module_disabled')\n        toggle(xml, False)\n        self.wait(lambda:self.adb('test ! -e '+basedir+'/disable && echo YES || true')=='YES',\n                  'module enabled marker from actual GUI',seconds=35)\n        self.mark('R11_MODULE_GUI_ENABLED')\n        self.adb('input keyevent KEYCODE_BACK')\n        self.adb('am start -W -n '+ACTIVITY,timeout=50)\n        # Real Magisk CLI install goes to its staging location until next boot.\n        archive=self.report/'r11_module_install.zip'\n        with zipfile.ZipFile(archive,'w',zipfile.ZIP_DEFLATED) as z:\n            z.writestr('module.prop',descriptor)\n        self.cmd(['adb','push',str(archive),'/data/local/tmp/r11_module_install.zip'])\n        result=self.adb('/data/adb/magisk/magisk --install-module /data/local/tmp/r11_module_install.zip',timeout=95,check=False,\n                        output='r11_magisk_module_install.txt')\n        staged=self.adb('test -f /data/adb/modules_update/'+mod+'/module.prop && echo YES || true')\n        if staged!='YES':\n            raise RuntimeError('R11 actual Magisk CLI ZIP installation not staged: '+result[-700:])\n        self.mark('R11_MODULE_CLI_INSTALL_STAGED')\n\n'''\n# Backslash pattern correction from Python triple-quoted text to regex literal.\nmethod=method.replace(\"r'\\\\\\\\[(\\\\\\\\d+),(\\\\\\\\d+)\\\\\\\\]\\\\\\\\[(\\\\\\\\d+),(\\\\\\\\d+)\\\\\\\\]'\", \"r'\\\\[(\\\\d+),(\\\\d+)\\\\]\\\\[(\\\\d+),(\\\\d+)\\\\]'\")\nnew=s.replace('    def run(self):\\n',method+'    def run(self):\\n',1)\nnew=new.replace(start,start.replace('            self.enable_gui()\\n','            self.r11_module_roundtrip()\\n            self.enable_gui()\\n'),1)\nassert new.count('self.r11_module_roundtrip()')==1\np.write_text(new)\nprint('R11 module integration injected into pinned emulator test harness')\nPY_R11_MODULE_SUITE\npython3 -m py_compile r9_root_emulator.py\npython3 r9_root_emulator.py --selftest\n"
