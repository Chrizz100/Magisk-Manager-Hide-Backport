    - name: R8.1 - Verify official ONDK and Gradle archives (retries + SHA-256)
      shell: bash
      run: "set -euo pipefail\ncat > r81_prepare_tools.py <<'R81_PINNED_TOOLCHAIN_PY'\n#!/usr/bin/env python3\n\"\"\"Pinned, SHA-verified source archives for isolated Magisk 31.1 CI builds.\n\nDoes not modify the project's Magisk application or native sources. It only\ninstalls the official ONDK under Android SDK and points the Gradle wrapper at\nthe verified official distribution, eliminating a second network fetch.\n\"\"\"\nfrom __future__ import annotations\n\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport shutil\nimport sys\nimport tarfile\nimport time\nimport urllib.request\nfrom urllib.parse import urlparse\nfrom dataclasses import dataclass\nfrom typing import Callable\n\n@dataclass(frozen=True)\nclass PinnedArchive:\n    filename: str\n    size: int\n    sha256: str\n    urls: tuple[str, ...]\n\n# SHA-256 digests and byte counts are from the official GitHub release asset metadata.\nONDK = PinnedArchive(\n    filename='ondk-r30.1-linux.tar.xz',\n    size=396326124,\n    sha256='a05e40a2b44e57c3103dd09721d3c2fccd3211e35db1ff9818e6f2a44e210289',\n    urls=(\n        'https://github.com/topjohnwu/ondk/releases/download/r30.1/ondk-r30.1-linux.tar.xz',\n        'https://api.github.com/repos/topjohnwu/ondk/releases/assets/494403685',\n    ),\n)\nGRADLE = PinnedArchive(\n    filename='gradle-9.7.1-bin.zip',\n    size=151433392,\n    sha256='acd53f1edaf02f1a8ff99879f8a34b302661a057d9b063ae9e35b552f804d20a',\n    urls=(\n        'https://downloads.gradle.org/distributions/gradle-9.7.1-bin.zip',\n        'https://api.github.com/repos/gradle/gradle-distributions/releases/assets/520945879',\n        'https://github.com/gradle/gradle-distributions/releases/download/v9.7.1/gradle-9.7.1-bin.zip',\n    ),\n)\n\n\ndef digest_file(path: Path) -> tuple[str, int]:\n    h = hashlib.sha256()\n    size = 0\n    with path.open('rb') as f:\n        for chunk in iter(lambda: f.read(1024 * 1024), b''):\n            size += len(chunk)\n            h.update(chunk)\n    return h.hexdigest(), size\n\n\ndef verified(path: Path, source: PinnedArchive) -> bool:\n    if not path.is_file():\n        return False\n    sha, size = digest_file(path)\n    return size == source.size and sha == source.sha256\n\n\ndef ensure_download(source: PinnedArchive, cache: Path, *, rounds: int = 3,\n                    sleeper: Callable[[float], None] = time.sleep) -> tuple[Path, str, int]:\n    \"\"\"Use verified cache or bounded retries across official URLs; reject partial data.\"\"\"\n    cache.mkdir(parents=True, exist_ok=True)\n    target = cache / source.filename\n    if verified(target, source):\n        print(f'{source.filename}: cached archive verified SHA-256 ({source.size} bytes)', flush=True)\n        return target, 'verified-cache', 0\n    if target.exists():\n        print(f'{source.filename}: invalid cache rejected; removing', flush=True)\n        target.unlink()\n\n    failures: list[str] = []\n    count = 0\n    for cycle in range(rounds):\n        for url in source.urls:\n            count += 1\n            temporary = cache / (source.filename + '.part')\n            temporary.unlink(missing_ok=True)\n            print(f'{source.filename}: attempt {count} via {urlparse(url).netloc}', flush=True)\n            try:\n                request = urllib.request.Request(\n                    url, headers={\n                        'User-Agent': 'Magisk-R8.1-Verified-CI/1',\n                        'Accept': 'application/octet-stream',\n                    },\n                )\n                hasher = hashlib.sha256()\n                byte_count = 0\n                with urllib.request.urlopen(request, timeout=180) as response, temporary.open('wb') as f:\n                    for chunk in iter(lambda: response.read(1024 * 1024), b''):\n                        byte_count += len(chunk)\n                        # Limit unexpectedly large downloads even if remote is incorrect.\n                        if byte_count > source.size:\n                            raise ValueError('archive exceeds official expected byte count')\n                        hasher.update(chunk)\n                        f.write(chunk)\n                actual = hasher.hexdigest()\n                if byte_count != source.size or actual != source.sha256:\n                    raise ValueError(f'archive integrity mismatch: size={byte_count}, sha256={actual}')\n                temporary.replace(target)\n                print(f'{source.filename}: integrity verified SHA-256; source attempt {count} accepted', flush=True)\n                return target, url, count\n            except Exception as error:\n                temporary.unlink(missing_ok=True)\n                msg = f'{type(error).__name__}: {error}'\n                failures.append(f'attempt {count}: {msg}')\n                print(f'{source.filename}: attempt {count} failed: {msg}', flush=True)\n                if count < rounds * len(source.urls):\n                    sleeper(min(5 * count, 25))\n    raise RuntimeError(f'Cannot securely obtain {source.filename} after {count} attempts; '\n                       + ' | '.join(failures[-4:]))\n\n\ndef install_ondk(archive: Path, sdk: Path) -> Path:\n    \"\"\"Reproduce the pinned Magisk build.py setup_ndk layout, from a verified archive.\"\"\"\n    parent = sdk / 'ndk'\n    original = parent / 'ondk-r30.1'\n    final = parent / 'magisk'\n    parent.mkdir(parents=True, exist_ok=True)\n    if original.exists() or original.is_symlink():\n        shutil.rmtree(original) if original.is_dir() and not original.is_symlink() else original.unlink()\n    with tarfile.open(archive, 'r:xz') as tar:\n        # Match the pinned Magisk build.py extraction filter (Python 3.13).\n        tar.extractall(parent, filter='tar')\n    if not (original / 'ndk-build').is_file() or not (original / 'toolchains' / 'rust').is_dir():\n        raise RuntimeError('Official ONDK archive did not produce its expected root layout')\n    if final.exists() or final.is_symlink():\n        shutil.rmtree(final) if final.is_dir() and not final.is_symlink() else final.unlink()\n    original.rename(final)\n    assert (final / 'ndk-build').is_file()\n    assert (final / 'toolchains' / 'rust').is_dir()\n    print(f'Magisk native build tools verified at {final}', flush=True)\n    return final\n\n\ndef configure_gradle(archive: Path, wrapper_properties: Path) -> str:\n    \"\"\"Use official SHA-matched local ZIP so Gradle wrapper won't hit GitHub redirects.\"\"\"\n    original = r'distributionUrl=https\\://services.gradle.org/distributions/gradle-9.7.1-bin.zip'\n    props = wrapper_properties.read_text()\n    if props.count(original) != 1:\n        raise RuntimeError('Pinned Magisk 31.1 Gradle wrapper baseline mismatch')\n    if 'distributionSha256Sum=' in props:\n        raise RuntimeError('Gradle wrapper integrity setting unexpectedly changed')\n    if not verified(archive, GRADLE):\n        raise RuntimeError('Refusing to select unverified Gradle distribution')\n    # Java .properties requires a backslash before ':' in the URL scheme.\n    local = archive.resolve().as_uri()\n    escaped = local.replace(':', r'\\:', 1)\n    props = props.replace(original, 'distributionUrl=' + escaped)\n    props = props.replace('networkTimeout=10000', 'networkTimeout=120000')\n    props = props.rstrip('\\n') + '\\n' + 'distributionSha256Sum=' + GRADLE.sha256 + '\\n'\n    wrapper_properties.write_text(props)\n    assert ('distributionUrl=' + escaped) in props\n    print('Gradle 9.7.1 wrapper now uses verified local archive (no redirect)', flush=True)\n    return local\n\n\ndef run() -> None:\n    sdk_value = os.environ.get('ANDROID_HOME') or os.environ.get('ANDROID_SDK_ROOT')\n    if not sdk_value:\n        sys.exit('Android SDK missing: ANDROID_HOME / ANDROID_SDK_ROOT not configured')\n    cache = Path.home() / '.cache' / 'magisk-r81-verified-tools'\n    out = Path('reports')\n    out.mkdir(parents=True, exist_ok=True)\n    info = {\n        'base': 'Official Magisk 31.1 pinned 0972f67d97f9b6302b67c5171283330c74114b4a',\n        'note': 'Only CI tool archives and Gradle wrapper URL; no Magisk feature modifications',\n        'archives': {},\n  \
        \      'success': False,\n    }\n    try:\n        ndk, ndk_source, ndk_tries = ensure_download(ONDK, cache)\n        info['archives']['ondk'] = {'sha256': ONDK.sha256, 'bytes': ONDK.size,\n                                    'source': ndk_source, 'attempts': ndk_tries}\n        zipfile, gradle_source, gradle_tries = ensure_download(GRADLE, cache)\n        info['archives']['gradle'] = {'sha256': GRADLE.sha256, 'bytes': GRADLE.size,\n                                       'source': gradle_source, 'attempts': gradle_tries}\n        install_ondk(ndk, Path(sdk_value))\n        wrapper = Path('magisk/app/gradle/wrapper/gradle-wrapper.properties')\n        configure_gradle(zipfile, wrapper)\n        info['success'] = True\n        print('R8.1 official ONDK r30.1 and Gradle 9.7.1 integrity/installation: PASS', flush=True)\n    finally:\n        (out / 'R8_1_TOOLCHAIN_STATUS.json').write_text(json.dumps(info, indent=2, sort_keys=True) + '\\n')\n\n\nif __name__ == '__main__':\n    run()\nR81_PINNED_TOOLCHAIN_PY\npython3 -m py_compile r81_prepare_tools.py\npython3 r81_prepare_tools.py 2>&1 | tee reports/r8_1_tools.log\ntest -s reports/R8_1_TOOLCHAIN_STATUS.json\npython3 - <<'R81_CHECK'\nimport json\nfrom pathlib import Path\nobj=json.loads(Path('reports/R8_1_TOOLCHAIN_STATUS.json').read_text())\nassert obj['success'] is True\nassert set(obj['archives'])=={'ondk','gradle'}\nassert Path('magisk/app/gradle/wrapper/gradle-wrapper.properties').read_text().count('distributionSha256Sum=')==1\nprint('R8.1 official ONDK/Gradle toolchain ready: PASS')\nR81_CHECK\n"
