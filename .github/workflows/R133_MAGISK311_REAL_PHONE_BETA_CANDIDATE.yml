<init>(java.lang.Object); }\\n'\nnew_rule = '-keep class com.topjohnwu.magisk.core.utils.RootUtils { <init>(java.lang.Object); }\\n'\nassert new_rule not in rules, 'RootUtils reflection rule already exists; stop'\nrules = replace_once(rules, before, before + new_rule)\nproguard_path.write_text(rules)\nassert new_rule in proguard_path.read_text(), 'Reflection preservation rule absent'\nassert git('diff','--check') == '', 'Source whitespace error'\n\nreport={\n    'stage':'R9.6 historical RootUtils real constructor',\n    'original_commit':source,\n    'historic_commit':old,\n    'rootutils_before_blob':pinned_blob,\n    'rootutils_after_blob':legacy_blob,\n    'rootutils_exact_historic_match':True,\n    'special_root_service_constructor':'RootUtils(java.lang.Object)',\n    'kept_by_R8':True,\n    'root_service_runtime_tested':False,\n    'real_device_modified':False,\n}\nPath('reports/R96_ROOTUTILS_CONSTRUCTOR.json').write_text(json.dumps(report,indent=2)+'\\n')\nprint('R9.6 exact historical RootUtils constructor and R8 keep rule: PASS')\nPY_R96_RESTORE\ngit -C magisk diff -- app/core/src/main/java/com/topjohnwu/magisk/core/utils/RootUtils.kt app/core/proguard-rules.pro > reports/R96_ROOTUTILS_ONLY.diff\ntest -s reports/R96_ROOTUTILS_CONSTRUCTOR.json\n"
    - name: R9.7 - Restore retained original only after byte-exact APK verification
      shell: bash
      run: "set -euo pipefail\ncat > r97_restore_patch.py <<'PY_R97_PATCH'\n#!/usr/bin/env python3\n\"\"\"R9.7, fail-closed correction for the R6 experimental restore path.\n\nOnly changes the restoreApp() function and imports MessageDigest in the already\nreconstructed Magisk 31.1 sources. Must run after R6 and R9.5/R9.6 steps.\nDoes NOT change Magisk native code or install/uninstall any package itself.\n\"\"\"\nfrom __future__ import annotations\nimport hashlib\nimport json\nimport sys\nfrom pathlib import Path\n\nSTART = '    suspend fun restoreApp(context: Context): Boolean {\\n'\nEND = '    suspend fun upgradeStub(context: Context, apk: File): Intent? {\\n'\nOLD_REQUIRED = (\n    'if (!isRunningAsStub || context.packageName == APP_PACKAGE_NAME || !Info.env.isActive) return false',\n    'StubApk.current(context)',\n    'adb_pm_install $apk $APP_PACKAGE_NAME',\n    'Config.suManager = \"\"',\n    'return installed && launchApp(context, APP_PACKAGE_NAME)',\n)\nNEW_FUNC = '''    suspend fun restoreApp(context: Context): Boolean {\n        // R9.7: R6 intentionally RETAINS com.topjohnwu.magisk as a rollback.\n        // Do not call adb_pm_install on an already installed original package.\n        // The pinned Magisk 31.1 adb_pm_install helper uses `pm install` without -r.\n        if (!isRunningAsStub || context.packageName == APP_PACKAGE_NAME || !Info.env.isActive) {\n            android.util.Log.e(\"R97Restore\", \"PRECONDITION_FAILED\")\n            return false\n        }\n\n        // Compare the full dynamically loaded original APK (copied byte for byte\n        // by historical DynLoad) to the still-installed original. Never trust\n        // package name alone and never silently substitute an unknown APK.\n        fun sha256Of(file: File): ByteArray {\n            val digest = MessageDigest.getInstance(\"SHA-256\")\n            file.inputStream().buffered().use { stream ->\n                val buffer = ByteArray(65536)\n                while (true) {\n                    val count = stream.read(buffer)\n                    if (count < 0) break\n                    if (count > 0) digest.update(buffer, 0, count)\n                }\n            }\n            return digest.digest()\n        }\n\n        val switched = withContext(Dispatchers.IO) {\n            try {\n                val preserved = StubApk.current(context)\n                val info = context.packageManager.getApplicationInfo(APP_PACKAGE_NAME, 0)\n                val installedOriginal = File(info.sourceDir)\n                if (!preserved.isFile || !installedOriginal.isFile ||\n                    preserved.length() <= 0 || preserved.length() != installedOriginal.length()) {\n                    android.util.Log.e(\"R97Restore\", \"ORIGINAL_APK_MISSING_OR_LENGTH_MISMATCH\")\n                    return@withContext false\n                }\n                if (!MessageDigest.isEqual(sha256Of(preserved), sha256Of(installedOriginal))) {\n                    android.util.Log.e(\"R97Restore\", \"ORIGINAL_APK_SHA256_MISMATCH\")\n                    return@withContext false\n                }\n                android.util.Log.i(\"R97Restore\", \"ORIGINAL_APK_SHA256_VERIFIED\")\n                // Only commit the manager selection after identity validation.\n                // SettingsDao.putHideText() already checks the SQL result and reads\n                // it back. Do not re-open another root shell after changing the\n                // requester: the hidden manager may immediately lose SU access.\n                // The isolated test also verifies the DB independently via ADB root.\n                Config.suManager = \"\"\n                android.util.Log.i(\"R97Restore\", \"REQUESTER_CLEAR_SETTER_COMPLETED\")\n                true\n            } catch (e: Exception) {\n                android.util.Log.e(\"R97Restore\", \"RESTORE_TRANSACTION_EXCEPTION\", e)\n                false\n            }\n        }\n        if (!switched) return false\n        val launched = launchApp(context, APP_PACKAGE_NAME)\n        android.util.Log.i(\"R97Restore\", if (launched) \"ORIGINAL_LAUNCH_SUBMITTED\" else \"ORIGINAL_LAUNCH_FAILED\")\n        return launched\n    }\n\n'''\n\n\ndef apply(repo_path: Path) -> dict:\n    repo_path = repo_path.resolve()\n    src = repo_path / 'app/core/src/main/java/com/topjohnwu/magisk/core/tasks/AppMigration.kt'\n    assert src.is_file(), 'Expected reconstructed R6 AppMigration.kt'\n    old = src.read_text(encoding='utf-8')\n    assert old.count(START) == 1 and old.count(END) == 1, 'Original R6 restore markers mismatch'\n    begin, finish = old.index(START), old.index(END)\n    assert begin < finish\n    body = old[begin:finish]\n    for guard in OLD_REQUIRED:\n        assert guard in body, f'R6 restore baseline changed: {guard}'\n    assert 'import java.security.MessageDigest\\n' not in old, 'Unexpected existing digest import'\n    assert old.count('import java.security.SecureRandom\\n') == 1, 'SecureRandom import anchor changed'\n    new = old[:begin] + NEW_FUNC + old[finish:]\n    new = new.replace('import java.security.SecureRandom\\n',\n                      'import java.security.SecureRandom\\nimport java.security.MessageDigest\\n', 1)\n    assert new.count('suspend fun restoreApp(context: Context): Boolean') == 1\n    assert new.count('adb_pm_install $apk $APP_PACKAGE_NAME') == 0, 'Old unsafe restore install persists'\n    assert new.count('MessageDigest.isEqual(sha256Of(preserved), sha256Of(installedOriginal))') == 1\n    assert new.count('Config.suManager = \"\"') >= 1\n    src.write_text(new, encoding='utf-8')\n    summary = {\n        'revision': 'R9.7',\n        'scope': 'R6 restoreApp only plus one import',\n        'old_sha256': hashlib.sha256(old.encode()).hexdigest(),\n        'new_sha256': hashlib.sha256(new.encode()).hexdigest(),\n        'reinstall_original': False,\n        'requires_original_installed': True,\n        'requires_byte_exact_original_apk': True,\n        'db_write_verified_by_existing_SettingsDao': True,\n        'independent_adb_root_db_check': True,\n        'core_risk': 'Research-mode original package remains installed; not proof of concealment',\n        'android_runtime_tested': False,\n    }\n    report = repo_path.parent / 'reports' / 'R97_RESTORE_PATCH_STATUS.json'\n    report.parent.mkdir(parents=True, exist_ok=True)\n    report.write_text(json.dumps(summary, indent=2) + '\\n', encoding='utf-8')\n    return summary\n\n\nif __name__ == '__main__':\n    if len(sys.argv) != 2:\n        sys.exit('usage: python3 r97_restore_patch.py <reconstructed Magisk source directory>')\n    print(json.dumps(apply(Path(sys.argv[1])), indent=2))\nPY_R97_PATCH\npython3 -m py_compile r97_restore_patch.py\npython3 r97_restore_patch.py magisk\ngit -C magisk diff --check\ngit -C magisk diff -- app/core/src/main/java/com/topjohnwu/magisk/core/tasks/AppMigration.kt > reports/R97_RESTORE_CODE_CHANGE.diff\ntest -s reports/R97_RESTORE_PATCH_STATUS.json\n"
    - name: R11.4 - AVD-only app-owned original concealment and verified restore source
      shell: bash
      run: "set -euo pipefail\n# APP-owned, explicitly confirmed hide/restore for disposable x86_64 AVD ONLY.\n# Never enable this source path in an installable Alpha-device APK.\ncat > r114_patch_concealment.py <<'PY_R114_SOURCE'\n#!/usr/bin/env python3\n\"\"\"R11.4 experimental, emulator-only app-driven package concealment.\n\nOnly modifies reconstructed official 31.1 Magisk's AppMigration, HomeScreen,\nHomeViewModel after R9.7 patch; NEVER intended for a real-device release.\n\"\"\"\nfrom pathlib import Path\nimport hashlib, json, sys\n\nMARKER='r114_original.sha256'\nMETHOD='''    /**\n     * Emulator research only: make the original manager invisible for user 0.\n     * This is deliberately a second, confirmed action from the LIVE hidden app.\n     * It is not a general-purpose phone or Magisk Alpha operation.\n     */\n    suspend fun finalizeConcealmentAvd(context: Context): Boolean {\n        if (!isRunningAsStub || !Info.isEmulator || Const.USER_ID != 0 ||\n            context.packageName == APP_PACKAGE_NAME || !Info.env.isActive ||\n            Config.suManager != context.packageName) return false\n        return withContext(Dispatchers.IO) {\n            try {\n                val original = File(context.packageManager.getApplicationInfo(APP_PACKAGE_NAME, 0).sourceDir)\n                val retained = StubApk.current(context)\n                if (!original.isFile || !retained.isFile || original.length() <= 0 ||\n                    original.length() != retained.length() ||\n                    !MessageDigest.isEqual(r114Digest(original), r114Digest(retained))) {\n                    android.util.Log.e(\"R114Conceal\", \"ORIGINAL_BACKUP_MISMATCH\")\n                    return@withContext false\n                }\n                val saved = File(context.filesDir, \"r114_original.sha256\")\n                val hex = r114Digest(retained).joinToString(\"\") { \"%02x\".format(it.toInt() and 255) }\n                saved.writeText(hex + \"\\\\n\")\n                if (saved.readText().trim() != hex) return@withContext false\n                // Probe that the running stub is actually installed and still the requester.\n                if (Shell.cmd(\"pm path ${context.packageName}\").await().out.none { it.startsWith(\"package:\") }) {\n                    return@withContext false\n                }\n                // Preserve original application data when the package is removed for user 0.\n                val result = Shell.cmd(\"pm uninstall -k --user 0 $APP_PACKAGE_NAME\").await()\n                if (!result.isSuccess || result.out.none { it.trim() == \"Success\" }) {\n                    android.util.Log.e(\"R114Conceal\", \"UNINSTALL_NOT_CONFIRMED\")\n                    return@withContext false\n                }\n                val stillVisible = Shell.cmd(\"pm path $APP_PACKAGE_NAME\").await().out.any { it.startsWith(\"package:\") }\n                val active = Shell.cmd(\"pm path ${context.packageName}\").await().out.any { it.startsWith(\"package:\") }\n                if (stillVisible || !active) {\n                    android.util.Log.e(\"R114Conceal\", \"POST_UNINSTALL_PACKAGE_CHECK_FAILED\")\n                    return@withContext false\n                }\n                android.util.Log.i(\"R114Conceal\", \"ORIGINAL_UNINSTALLED_USER0_VERIFIED\")\n                true\n            } catch (e: Exception) {\n                android.util.Log.e(\"R114Conceal\", \"TRANSACTION_ERROR\", e)\n                false\n            }\n        }\n    }\n\n    private fun r114Digest(file: File): ByteArray {\n        val digest = MessageDigest.getInstance(\"SHA-256\")\n        file.inputStream().buffered().use { stream ->\n            val bytes = ByteArray(65536)\n            while (true) {\n                val count = stream.read(bytes)\n                if (count < 0) break\n                if (count > 0) digest.update(bytes, 0, count)\n            }\n        }\n        return digest.digest()\n    }\n\n'''\n\nRESTORE='''    suspend fun restoreApp(context: Context): Boolean {\n        // R11.4: AVD-only recovery from a deliberately uninstalled original.\n        // Keep R9.7's in-place hash comparison for the ordinary still-installed case.\n        if (!isRunningAsStub || context.packageName == APP_PACKAGE_NAME || !Info.env.isActive) {\n            android.util.Log.e(\"R97Restore\", \"PRECONDITION_FAILED\")\n            return false\n        }\n        val switched = withContext(Dispatchers.IO) {\n            try {\n                val preserved = StubApk.current(context)\n                if (!preserved.isFile || preserved.length() <= 0) return@withContext false\n                var existing = try {\n                    File(context.packageManager.getApplicationInfo(APP_PACKAGE_NAME, 0).sourceDir)\n                } catch (_: PackageManager.NameNotFoundException) {\n                    null\n                }\n                if (existing == null) {\n                    if (!Info.isEmulator || Const.USER_ID != 0 || Config.suManager != context.packageName) {\n                        android.util.Log.e(\"R97Restore\", \"AVD_ONLY_REINSTALL_GUARD_REJECTED\")\n                        return@withContext false\n                    }\n                    val saved = File(context.filesDir, \"r114_original.sha256\")\n                    val hex = r114Digest(preserved).joinToString(\"\") { \"%02x\".format(it.toInt() and 255) }\n                    if (!saved.isFile || saved.readText().trim() != hex) {\n                        android.util.Log.e(\"R97Restore\", \"BACKUP_SHA256_PIN_MISMATCH\")\n                        return@withContext false\n                    }\n                    // Try reinstalling for user 0 without changing the application data.\n                    val previous = Shell.cmd(\"cmd package install-existing --user 0 $APP_PACKAGE_NAME\").await()\n                    existing = try {\n                        File(context.packageManager.getApplicationInfo(APP_PACKAGE_NAME, 0).sourceDir)\n                    } catch (_: PackageManager.NameNotFoundException) {\n                        null\n                    }\n                    if (existing == null) {\n                        // The system may discard a sole-user APK; restore from the exact\n                        // retained, hash-checked original held by the dynamic stub.\n                        val installed = Shell.cmd(\"adb_pm_install $preserved $APP_PACKAGE_NAME\").await()\n                        if (!installed.isSuccess) {\n                            android.util.Log.e(\"R97Restore\", \"AVD_REINSTALL_FAILED\")\n                            return@withContext false\n                        }\n                        existing = try {\n                            File(context.packageManager.getApplicationInfo(APP_PACKAGE_NAME, 0).sourceDir)\n                        } catch (_: PackageManager.NameNotFoundException) {\n                            null\n                        }\n                    }\n                }\n                val source = existing ?: return@withContext false\n                if (!source.isFile || preserved.length() != source.length() ||\n                    !MessageDigest.isEqual(r114Digest(preserved), r114Digest(source))) {\n                    android.util.Log.e(\"R97Restore\", \"ORIGINAL_APK_SHA256_MISMATCH\")\n                    return@withContext false\n                }\n                android.util.Log.i(\"R97Restore\", \"ORIGINAL_APK_SHA256_VERIFIED\")\n                // Changes requester only AFTER the original package is restored and verified.\n                Config.suManager = \"\"\n                android.util.Log.i(\"R97Restore\", \"REQUESTER_CLEAR_SETTER_COMPLETED\")\n                true\n            } catch (e: Exception) {\n                android.util.Log.e(\"R97Restore\", \"RESTORE_TRANSACTION_EXCEPTION\", e)\n                false\n            }\n        }\n        if (!switched) return false\n        val launched = launchApp(context, APP_PACKAGE_NAME)\n        android.util.Log.i(\"R97Restore\", if (launched) \"ORIGINAL_LAUNCH_SUBMITTED\" else \"ORIGINAL_LAUNCH_FAILED\")\n        return launched\n    }\n\n'''\n\nVIEWMODEL='''\
        \    /** R11.4 AVD-only explicitly requested final package-concealment step. */\n    fun finalizeConcealmentAvd() {\n        if (_uiState.value.showLoading || !Info.isEmulator) return\n        viewModelScope.launch {\n            val success = try {\n                withLoading {\n                    val context = AppContext.foregroundActivity ?: AppContext\n                    AppMigration.finalizeConcealmentAvd(context)\n                }\n            } catch (e: Exception) { false }\n            if (!success) showToast(CoreR.string.failure)\n        }\n    }\n\n'''\n\nUI='''                // Research-only two-phase app concealment: run only in the AVD.\n                if (isRunningAsStub && Info.isEmulator) {\n                    Button(onClick = viewModel::finalizeConcealmentAvd) {\n                        Text(\"Complete Hide (AVD only)\")\n                    }\n                }\n\n'''\n\n\ndef patch(root):\n    root=Path(root)\n    src=root/'app/core/src/main/java/com/topjohnwu/magisk/core/tasks/AppMigration.kt'\n    ui=root/'app/apk/src/main/java/com/topjohnwu/magisk/ui/home/HomeScreen.kt'\n    vm=root/'app/apk/src/main/java/com/topjohnwu/magisk/ui/home/HomeViewModel.kt'\n    for p in (src,ui,vm):\n        if not p.is_file():raise RuntimeError('Missing pinned source: '+str(p))\n    before={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in (src,ui,vm)}\n    code=src.read_text()\n    start='    suspend fun restoreApp(context: Context): Boolean {\\n'\n    end='    suspend fun upgradeStub(context: Context, apk: File): Intent? {\\n'\n    if code.count(start)!=1 or code.count(end)!=1:raise AssertionError('R9.7 restore boundaries changed')\n    a,b=code.index(start),code.index(end)\n    old=code[a:b]\n    for guard in ['MessageDigest.isEqual(sha256Of(preserved), sha256Of(installedOriginal))','ORIGINAL_APK_SHA256_VERIFIED','REQUESTER_CLEAR_SETTER_COMPLETED']:\n        if guard not in old:raise AssertionError('R9.7 original restore contract changed: '+guard)\n    if 'finalizeConcealmentAvd(' in code or 'r114Digest(' in code:raise AssertionError('Reapplication prohibited')\n    code=code[:a] + METHOD + RESTORE + code[b:]\n    # R11.4.1: R6 deliberately removed this import; the new AVD guards use Const.USER_ID.\n    # Fail before Gradle if the reconstructed source/imports differ from the pinned baseline.\n    config_import='import com.topjohnwu.magisk.core.Config\\n'\n    const_import='import com.topjohnwu.magisk.core.Const\\n'\n    if code.count(config_import)!=1 or const_import in code:\n        raise AssertionError('R11.4.1: unexpected AppMigration import baseline')\n    code=code.replace(config_import,config_import+const_import,1)\n    if code.count('Const.USER_ID')!=2 or code.count(const_import)!=1:\n        raise AssertionError('R11.4.1: missing or duplicate Const import/AVD guards')\n    src.write_text(code)\n    u=ui.read_text()\n    anchor='                StatusCard()\\n'\n    if u.count(anchor)!=1:raise AssertionError('R11.4 HomeScreen insertion anchor moved')\n    if 'isRunningAsStub' not in u:raise AssertionError('Historical stub indicator missing')\n    ui.write_text(u.replace(anchor,anchor+'\\n'+UI,1))\n    v=vm.read_text()\n    v_anchor='    fun restoreManager() {\\n'\n    if v.count(v_anchor)!=1:raise AssertionError('R11.4 ViewModel method anchor moved')\n    if 'AppMigration' not in v or 'AppContext' not in v:raise AssertionError('R6 ViewModel root context imports changed')\n    vm.write_text(v.replace(v_anchor,VIEWMODEL+v_anchor,1))\n    after={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in (src,ui,vm)}\n    policy={'revision':'R11.4','scope':'EXPERIMENTAL_ANDROID_13_AVD_ONLY','original_manager_package':'com.topjohnwu.magisk','original_uninstall_requires_explicit_ui_tap':True,'original_apk_sha256_checked_before_remove':True,'original_apk_sha256_checked_after_restore':True,'original_data_kept_during_package_remove':True,'device_alpha_compatibility_tested':False,'phone_beta_release_authorized':False,'before_sha256':before,'after_sha256':after}\n    return policy\n\nif __name__=='__main__':\n    if len(sys.argv)!=3:raise SystemExit('usage: r114_patch_concealment.py MAGISK_ROOT JSON_REPORT')\n    policy=patch(sys.argv[1])\n    out=Path(sys.argv[2]);out.parent.mkdir(parents=True,exist_ok=True);out.write_text(json.dumps(policy,indent=2,sort_keys=True)+'\\n')\n    print('R11.4 AVD-only source patch:',json.dumps({k:policy[k] for k in ('revision','scope','original_uninstall_requires_explicit_ui_tap','phone_beta_release_authorized')}))\nPY_R114_SOURCE\npython3 -m py_compile r114_patch_concealment.py\npython3 r114_patch_concealment.py magisk reports/R114_EXPERIMENTAL_POLICY.json\ngit -C magisk diff --check\ntest -s reports/R114_EXPERIMENTAL_POLICY.json\n"
    - name: R9.9 - Guard official on-device Direct Install (never replace Alpha by accident)
      shell: bash
      run: "set -euo pipefail\nmkdir -p reports\ncat > DirectInstallPolicy.kt <<'R99_EOF_DIRECTINSTALLPOLICY'\npackage com.topjohnwu.magisk.core.tasks\n\n/**\n * Prevent accidental replacement of a different Magisk implementation.\n * No writes occur in this policy. The actual patch + write remains the\n * already existing MagiskInstaller.direct() / boot_patch.sh / direct_install.\n *\n * This is deliberately strict. Unknown backend flavours fail closed.\n */\ninternal object DirectInstallPolicy {\n    data class Environment(\n        val rooted: Boolean,\n        val rootShellGranted: Boolean,\n        val daemonActive: Boolean,\n        val actualVersionCode: Int,\n        val expectedVersionCode: Int,\n        val actualVersionName: String,\n        val expectedVersionName: String,\n        val managerPackage: String,\n        val emulator: Boolean,\n    )\n\n    fun reasons(env: Environment): List<String> = buildList {\n        if (env.emulator) add(\"Direct installation on an emulator is disabled\")\n        if (!env.rooted || !env.rootShellGranted || !env.daemonActive) {\n            add(\"No confirmed matching Magisk root backend\")\n        }\n        if (env.actualVersionCode <= 0 || env.actualVersionCode != env.expectedVersionCode) {\n            add(\"Magisk version code differs\")\n        }\n        if (env.actualVersionName.isBlank() || env.expectedVersionName.isBlank() ||\n            env.actualVersionName != env.expectedVersionName) {\n            add(\"Magisk native flavour/build differs (Alpha is NOT an official build)\")\n        }\n        if (env.managerPackage != \"com.topjohnwu.magisk\") {\n            add(\"Not the original Magisk manager package\")\n        }\n    }\n}\nR99_EOF_DIRECTINSTALLPOLICY\ncat > r99_apply.py <<'R99_EOF_R99_APPLY'\n#!/usr/bin/env python3\n\"\"\"Add an explicit fail-closed guard to the existing Magisk Direct Installer.\n\nFor use after the already tested R9.7 source reconstruction, before compilation.\nNo replacement installer, partition-writing command or auto-start action is added.\n\"\"\"\nfrom pathlib import Path\nimport hashlib\nimport json\nimport sys\n\nPOLICY = Path(__file__).with_name('DirectInstallPolicy.kt').read_text(encoding='utf-8')\nANCHOR = '    protected suspend fun direct() = findImage() && extractFiles() && patchBoot() && flashBoot()'\nREPLACEMENT = '''    protected suspend fun direct(): Boolean {\n        // Do not flash an Alpha-patched phone using a different official build.\n        // In particular, matching numeric versionCode=31100 is NOT enough.\n        val blockers = DirectInstallPolicy.reasons(\n            DirectInstallPolicy.Environment(\n                rooted = Info.isRooted,\n                rootShellGranted = shell.isRoot,\n                daemonActive = Info.env.isActive,\n                actualVersionCode = Info.env.versionCode,\n                expectedVersionCode = BuildConfig.APP_VERSION_CODE,\n                actualVersionName = Info.env.versionString,\n                expectedVersionName = BuildConfig.APP_VERSION_NAME,\n                managerPackage = context.packageName,\n                emulator = Info.isEmulator,\n            )\n        )\n        if (blockers.isNotEmpty()) {\n            console.add(\"! PC-free direct installation refused: ${blockers.joinToString(\"; \")}\")\n            return false\n        }\n        // Reuse the reviewed official boot_image patch + direct_install pipeline.\n        if (!findImage()) return false\n        val imagePath = targetImage.path\n        if (!imagePath.startsWith(\"/dev/block/\") ||\n            !shell.newJob().add(\"[ -b '$imagePath' ]\").exec().isSuccess\n        ) {\n            console.add(\"! Boot target is not a verified /dev/block device; refusing flash\")\n            return false\n        }\n        return extractFiles() && patchBoot() && flashBoot()\n    }'''\n\ndef apply(root: Path) -> dict:\n    source = root/'app/core/src/main/java/com/topjohnwu/magisk/core/tasks/MagiskInstaller.kt'\n    policy = source.with_name('DirectInstallPolicy.kt')\n    original = source.read_text(encoding='utf-8')\n    if original.count(ANCHOR) != 1:\n        raise RuntimeError(f'Direct installer anchor missing or modified: {original.count(ANCHOR)}')\n    if policy.exists():\n        raise RuntimeError('Refusing to overwrite existing DirectInstallPolicy.kt')\n    if original.count('protected suspend fun direct() =') != 1:\n        raise RuntimeError('Unexpected original direct() implementation')\n    new = original.replace(ANCHOR, REPLACEMENT)\n    assert new.replace(REPLACEMENT, ANCHOR) == original\n    assert 'protected suspend fun secondSlot()' in original\n    assert 'protected suspend fun patchFile(' in original\n    assert 'class Direct(' in original\n    assert 'flashBoot() = \"direct_install $installDir $targetImage\".sh().isSuccess' in original\n    policy.write_text(POLICY, encoding='utf-8')\n    source.write_text(new, encoding='utf-8')\n    result = {\n        'mode': 'original Magisk Direct + fail-closed flavour/partition gate',\n        'original_sha256': hashlib.sha256(original.encode()).hexdigest(),\n        'new_sha256': hashlib.sha256(new.encode()).hexdigest(),\n        'policy_sha256': hashlib.sha256(POLICY.encode()).hexdigest(),\n        'does_not_modify_original_native_flash_scripts': True,\n        'does_not_auto_flash_at_app_start': True,\n        'alpha_31100_enabled': False,\n    }\n    return result\n\nif __name__=='__main__':\n    if len(sys.argv)!=2:\n        raise SystemExit('usage: apply_r99.py <magisk-repo-root>')\n    print(json.dumps(apply(Path(sys.argv[1])), indent=2))\nR99_EOF_R99_APPLY\npython3 r99_apply.py magisk > reports/R99_DIRECT_INSTALL_GATE.json\npython3 - <<'PY_R99_VERIFY'\nimport json\nfrom pathlib import Path\nrecord=json.loads(Path('reports/R99_DIRECT_INSTALL_GATE.json').read_text())\nassert record['alpha_31100_enabled'] is False\nassert record['does_not_modify_original_native_flash_scripts'] is True\nassert record['does_not_auto_flash_at_app_start'] is True\np=Path('magisk/app/core/src/main/java/com/topjohnwu/magisk/core/tasks')\npolicy=(p/'DirectInstallPolicy.kt').read_text()\ninstaller=(p/'MagiskInstaller.kt').read_text()\nassert 'actualVersionName != env.expectedVersionName' in policy\nassert 'env.managerPackage != \"com.topjohnwu.magisk\"' in policy\nassert 'env.emulator' in policy\nassert 'shell.isRoot' in installer\nassert 'findImage()' in installer and 'patchBoot() && flashBoot()' in installer\nassert 'imagePath.startsWith(\"/dev/block/\")' in installer\nprint('R9.9 original on-device Direct Install gated; no auto flash; Alpha blocked: PASS')\nPY_R99_VERIFY\n"
    - name: R11.5 - Attach real Beta Root+Module controls to proven Hide/Restore manager (AVD only)
      run: "set -euo pipefail\ncat > BetaRootBridge.kt <<'R115_BRIDGE'\npackage com.topjohnwu.magisk.ui.home\n\nimport java.util.concurrent.TimeUnit\n\n/** R11: explicitly invoked Magisk root operations. No automatic su on application launch. */\ninternal object BetaRootBridge {\n    private val moduleId = Regex(\"[A-Za-z0-9_][A-Za-z0-9_.-]{0,79}\")\n    private const val MODULES = \"/data/adb/modules\"\n    private const val MODULES_UPDATE = \"/data/adb/modules_update\"\n\n    internal fun validModuleId(id: String): Boolean = moduleId.matches(id) && id != \".\" && id != \"..\" && \"..\" !in id\n\n    /** Only fixed, owner-triggered commands. Returns stdout/stderr for in-app diagnosis. */\n    private fun rooted(script: String, timeoutSeconds: Long = 20): String {\n        val process = ProcessBuilder(\"su\", \"-c\", script).redirectErrorStream(true).start()\n        if (!process.waitFor(timeoutSeconds, TimeUnit.SECONDS)) {\n            process.destroyForcibly()\n            return \"ERROR: ROOT_TIMEOUT\"\n        }\n        val output = process.inputStream.bufferedReader().use { it.readText().take(12000) }\n        return if (process.exitValue() == 0) output.ifBlank { \"OK\" }\n               else \"ERROR: SU_EXIT_${process.exitValue()}\\n\" + output.take(1000)\n    }\n\n    fun status(): String = rooted(\"printf 'UID='; id -u; printf 'MAGISK='; magisk -v; printf 'CODE='; magisk -V; printf 'ANDROID='; getprop ro.build.version.release; printf 'DEVICE='; getprop ro.product.device\")\n\n    fun modules(): String = rooted(\"for d in $MODULES/*; do \" +\n        \"[ -d \\\"\\$d\\\" ] || continue; \" +\n        \"n=\\${d##*/}; [ -f \\\"\\$d/module.prop\\\" ] || continue; \" +\n        \"if [ -e \\\"\\$d/remove\\\" ]; then s=REMOVE; \" +\n        \"elif [ -e \\\"\\$d/disable\\\" ]; then s=DISABLED; else s=ENABLED; fi; \" +\n        \"printf '%s | %s\\\\n' \\\"\\$n\\\" \\\"\\$s\\\"; done\")\n\n    fun policies(): String = rooted(\"magisk --sqlite 'SELECT uid,policy FROM policies LIMIT 60;'\", 15)\n\n    /** Changes only the matching module's disable marker. UI must obtain explicit confirmation. */\n    fun setEnabled(id: String, enabled: Boolean): String {\n        if (!validModuleId(id)) return \"ERROR: INVALID_MODULE_ID\"\n        val directory = \"$MODULES/$id\"\n        val operation = if (enabled) \"rm -f '$directory/disable'\" else \"touch '$directory/disable'\"\n        return rooted(\"[ -f '$directory/module.prop' ] || exit 21; $operation; \" +\n            (if (enabled) \"[ ! -e '$directory/disable' ]\" else \"[ -f '$directory/disable' ]\"))\n    }\n\n    /** Only schedule removal for the next reboot, do not recursively delete files. */\n    fun scheduleRemoval(id: String): String {\n        if (!validModuleId(id)) return \"ERROR: INVALID_MODULE_ID\"\n        val directory = \"$MODULES/$id\"\n        return rooted(\"[ -f '$directory/module.prop' ] || exit 21; touch '$directory/remove'; [ -f '$directory/remove' ]\")\n    }\n\n    /** Install a caller-supplied, locally verified module archive. Uses Magisk's installer. */\n    fun installModuleZip(appPrivateAbsolutePath: String): String {\n        val validPath = Regex(\"/data/(?:user/0|data)/[A-Za-z0-9_.-]+/cache/r11_module_[A-Za-z0-9_-]+\\\\.zip\")\n        if (!validPath.matches(appPrivateAbsolutePath)) return \"ERROR: INVALID_LOCAL_ZIP_PATH\"\n        return rooted(\"[ -f '$appPrivateAbsolutePath' ] && [ -s '$appPrivateAbsolutePath' ] || exit 22; \" +\n            \"magisk --install-module '$appPrivateAbsolutePath'\", 90)\n    }\n}\n\nR115_BRIDGE\ncat > BetaRootCard.kt <<'R115_CARD'\npackage com.topjohnwu.magisk.ui.home\n\nimport android.net.Uri\nimport androidx.activity.compose.rememberLauncherForActivityResult\nimport androidx.activity.result.contract.ActivityResultContracts\nimport androidx.compose.foundation.layout.Arrangement\nimport androidx.compose.foundation.layout.Column\nimport androidx.compose.foundation.layout.fillMaxWidth\nimport androidx.compose.foundation.layout.padding\nimport androidx.compose.material3.AlertDialog\nimport androidx.compose.material3.Button\nimport androidx.compose.material3.Card\nimport androidx.compose.material3.OutlinedTextField\nimport androidx.compose.material3.Text\nimport androidx.compose.material3.TextButton\nimport androidx.compose.material3.MaterialTheme\nimport androidx.compose.runtime.Composable\nimport androidx.compose.runtime.getValue\nimport androidx.compose.runtime.mutableStateOf\nimport androidx.compose.runtime.remember\nimport androidx.compose.runtime.rememberCoroutineScope\nimport androidx.compose.runtime.setValue\nimport androidx.compose.ui.Modifier\nimport androidx.compose.ui.platform.LocalContext\nimport androidx.compose.ui.unit.dp\nimport kotlinx.coroutines.Dispatchers\nimport kotlinx.coroutines.launch\nimport kotlinx.coroutines.withContext\nimport java.io.File\nimport java.util.UUID\nimport java.util.zip.ZipFile\n\n/** Explicitly selected feature operations; none executes when the activity starts. */\n@Composable\ninternal fun BetaRootCard() {\n    val context = LocalContext.current\n    val scope = rememberCoroutineScope()\n    var output by remember { mutableStateOf(\"R11 Beta: noch keine Root-Aktion ausgeführt.\") }\n    var module by remember { mutableStateOf(\"\") }\n    var pending by remember { mutableStateOf<Pair<String, () -> String>?>(null) }\n    var busy by remember { mutableStateOf(false) }\n    var pendingZip by remember { mutableStateOf<Uri?>(null) }\n    val launcher = rememberLauncherForActivityResult(ActivityResultContracts.GetContent()) { uri ->\n        if (uri != null) pendingZip = uri\n    }\n    fun run(operation: () -> String) {\n        if (busy) return\n        busy = true\n        scope.launch {\n            output = withContext(Dispatchers.IO) { try { operation() } catch (e: Exception) { \"ERROR: \" + e.javaClass.simpleName } }\n            busy = false\n        }\n    }\n    Card(modifier = Modifier.fillMaxWidth()) {\n        Column(modifier = Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {\n            Text(\"R11 Funktions-Beta – Root und Module\", style = MaterialTheme.typography.titleMedium)\n            Text(\"Nur manuelle Aktionen. Kein Boot-Flash und kein Wechsel des Magisk-Alpha-Managers.\", style = MaterialTheme.typography.bodySmall)\n            Button(enabled = !busy, onClick = { run(BetaRootBridge::status) }) { Text(\"Magisk und Root abfragen\") }\n            Button(enabled = !busy, onClick = { run(BetaRootBridge::modules) }) { Text(\"Installierte Module anzeigen\") }\n            Button(enabled = !busy, onClick = { run(BetaRootBridge::policies) }) { Text(\"Superuser-Regeln anzeigen\") }\n            OutlinedTextField(value = module, onValueChange = { module = it.take(80) }, label = { Text(\"Modul-ID (aus der Liste)\") }, singleLine = true)\n            Button(enabled = !busy && BetaRootBridge.validModuleId(module), onClick = {\n                val id = module\n                pending = \"Modul $id wirklich deaktivieren?\" to { BetaRootBridge.setEnabled(id, false) }\n            }) { Text(\"Modul deaktivieren\") }\n            Button(enabled = !busy && BetaRootBridge.validModuleId(module), onClick = {\n                val id = module\n                pending = \"Modul $id wirklich aktivieren?\" to { BetaRootBridge.setEnabled(id, true) }\n            }) { Text(\"Modul aktivieren\") }\n            Button(enabled = !busy && BetaRootBridge.validModuleId(module), onClick = {\n                val id = module\n                pending = \"Modul $id beim nächsten Neustart entfernen?\" to { BetaRootBridge.scheduleRemoval(id) }\n            }) { Text(\"Entfernung vormerken\") }\n            Button(enabled = !busy, onClick = { launcher.launch(\"application/zip\") }) { Text(\"Test-Modul-ZIP auswählen\") }\n            pendingZip?.let { uri ->\n                Text(\"ZIP gewählt. Installation verändert Module und benötigt eine bewusste Bestätigung.\")\n                Button(enabled = !busy, onClick = {\n                    pending = \"Ausgewählte Modul-ZIP mit Magisk installieren?\" to {\n                        val tmp = File(context.cacheDir, \"r11_module_\" + UUID.randomUUID().toString().replace(\"\
        -\", \"\") + \".zip\")\n                        try {\n                            context.contentResolver.openInputStream(uri)?.use { input ->\n                                tmp.outputStream().use { out ->\n                                    var total = 0L\n                                    val buf = ByteArray(64 * 1024)\n                                    while (true) {\n                                        val n = input.read(buf)\n                                        if (n < 0) break\n                                        total += n\n                                        require(total <= 15L * 1024 * 1024) { \"ZIP größer als 15 MiB\" }\n                                        out.write(buf, 0, n)\n                                    }\n                                }\n                            } ?: error(\"ZIP nicht lesbar\")\n                            ZipFile(tmp).use { zip -> require(zip.getEntry(\"module.prop\") != null) { \"module.prop fehlt\" } }\n                            BetaRootBridge.installModuleZip(tmp.absolutePath)\n                        } finally { tmp.delete() }\n                    }\n                }) { Text(\"Modul-ZIP installieren …\") }\n            }\n            Text(output.take(3500), style = MaterialTheme.typography.bodySmall)\n        }\n    }\n    pending?.let { current ->\n        AlertDialog(onDismissRequest = { pending = null },\n            title = { Text(\"Root-Aktion bestätigen\") },\n            text = { Text(current.first) },\n            confirmButton = { TextButton(onClick = { pending = null; run(current.second) }) { Text(\"Ausführen\") } },\n            dismissButton = { TextButton(onClick = { pending = null }) { Text(\"Abbrechen\") } })\n    }\n}\n\nR115_CARD\npython3 - <<'PY_R115_ATTACH'\nfrom pathlib import Path\nimport hashlib,json\nbase=Path('magisk/app/apk/src/main/java/com/topjohnwu/magisk/ui/home')\nassert base.is_dir(), 'Original pinned Magisk HomeScreen missing'\nfor name in ('BetaRootBridge.kt','BetaRootCard.kt'):\n target=base/name\n assert not target.exists(), 'Refuse to overwrite an existing '+str(target)\n target.write_bytes(Path(name).read_bytes())\nhome=base/'HomeScreen.kt'\ns=home.read_text()\n# AppCard and R11.4 Hide/Restore remain in their EXACT original positions.\n# Insert the manually operated Beta card AFTER AppCard at end of first column.\nanchor='            },\\n            second = {\\n'\nassert s.count(anchor)==1, 'R115: UI attachment location changed'\nassert s.count('Complete Hide (AVD only)')==1, 'R11.4 AVD Hide UI missing'\nassert 'showRestoreDialog' in s, 'Historical Restore UI missing'\nnew=s.replace(anchor,'                BetaRootCard()\\n'+anchor,1)\nassert new.count('BetaRootCard()')==1\nhome.write_text(new)\n# Never give phone release or change the running installed Magisk Alpha.\nchecks={\n 'revision':'R11.5',\n 'branch':'AVD-INTEGRATED-ONLY',\n 'app_id':'com.topjohnwu.magisk',\n 'not_the_phone_beta':True,\n 'real_phone_flash_allowed':False,\n 'alpha_compatibility_confirmed':False,\n 'root_module_ui_code_same_as_R11.4.4':True,\n 'hide_restore_same_as_R11.4.4':True,\n 'retains_R9.9_boot_flash_guard':True,\n 'checksums':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in (home,base/'BetaRootBridge.kt',base/'BetaRootCard.kt')},\n}\nPath('reports/R115_SOURCE_INTEGRATION.json').parent.mkdir(exist_ok=True)\nPath('reports/R115_SOURCE_INTEGRATION.json').write_text(json.dumps(checks,indent=2)+'\\n')\nprint('R115: integrated beta module panel into original root/hide/restore manager for AVD only')\nPY_R115_ATTACH\n(cd magisk && git diff --check)\npython3 - <<'PY_R115_VALIDATE'\nfrom pathlib import Path\nx=Path('magisk/app/apk/src/main/java/com/topjohnwu/magisk/ui/home')\nassert 'fun scheduleRemoval' in (x/'BetaRootBridge.kt').read_text()\nassert 'fun installModuleZip' in (x/'BetaRootBridge.kt').read_text()\nassert 'BetaRootCard()' in (x/'HomeScreen.kt').read_text()\nassert 'Complete Hide (AVD only)' in (x/'HomeScreen.kt').read_text()\nassert 'Config.suManager' in Path('magisk/app/core/src/main/java/com/topjohnwu/magisk/core/tasks/AppMigration.kt').read_text()\nprint('R115 full UI integration source guards PASS')\nPY_R115_VALIDATE\n"
    - name: R13.3 - Enable confirmed Hide and Restore for a matching official 31.1 runtime (not Alpha)
      shell: bash
      run: |
        set -euo pipefail
        cat > R133_PROMOTE_PHONE_SOURCE.py <<'R133_SOURCE_EOF'
        #!/usr/bin/env python3
        """R13.3: make the existing R12.1 integrated Magisk 31.1 hide/restore UI
        operable on real Android devices *with a matching modified Magisk daemon*.
        
        No boot writing. Applied after R11.5 source integration and BEFORE compilation.
        Leaves all other Magisk source unchanged. Strict marker matching, fail closed.
        """
        from pathlib import Path
        import hashlib
        import json
        import sys
        
        PINNED_VERSION = '0972f67d'
        PINNED_CODE = 31100
        
        
        def once(text: str, old: str, new: str, label: str) -> str:
            n = text.count(old)
            if n != 1:
                raise AssertionError(f'{label}: required exact source anchor count=1, got={n}')
            if old == new:
                raise AssertionError(f'{label}: no-op patch not accepted')
            return text.replace(old, new, 1)
        
        
        def plan(root: Path) -> dict:
            base = root/'app/core/src/main/java/com/topjohnwu/magisk/core/tasks/AppMigration.kt'
            screen = root/'app/apk/src/main/java/com/topjohnwu/magisk/ui/home/HomeScreen.kt'
            viewmodel = root/'app/apk/src/main/java/com/topjohnwu/magisk/ui/home/HomeViewModel.kt'
            paths = (base,screen,viewmodel)
            for p in paths:
                if not p.is_file():
                    raise AssertionError(f'missing previously integrated app file: {p}')
            before = {p: p.read_text(encoding='utf-8') for p in paths}
            migration, ui, vm = (before[p] for p in paths)
        
            # Do not trust merely matching numeric version 31100: the running Alpha
            # backend reports 0972f67d-alpha, while our new official fork is 0972f67d.
            # This is a compatibility guard, not a cryptographic attestation of backend.
            backend = f'''    private fun r133MatchingBackend(): Boolean =
                Info.env.isActive && Info.env.versionCode == {PINNED_CODE} &&
                    Info.env.versionString.substringBefore(':') == "{PINNED_VERSION}"
        
        '''
            migration = once(
                migration,
                '    suspend fun finalizeConcealmentAvd(context: Context): Boolean {\n',
                backend + '    suspend fun finalizeConcealmentAvd(context: Context): Boolean {\n',
                'insert narrow backend compatibility gate'
            )
            migration = once(
                migration,
                'if (!isRunningAsStub || !Info.isEmulator || Const.USER_ID != 0 ||',
                'if (!isRunningAsStub || !r133MatchingBackend() || Const.USER_ID != 0 ||',
                'remove AVD-only original concealment restriction'
            )
            migration = once(
                migration,
                'if (!Info.isEmulator || Const.USER_ID != 0 || Config.suManager != context.packageName) {',
                'if (!r133MatchingBackend() || Const.USER_ID != 0 || Config.suManager != context.packageName) {',
                'make restore reinstall conditional on matching Magisk backend'
            )
            migration = once(
                migration,
                'if (context.packageName != APP_PACKAGE_NAME || isRunningAsStub || !Info.env.isActive) return false',
                'if (context.packageName != APP_PACKAGE_NAME || isRunningAsStub || !r133MatchingBackend()) return false',
                'guard first-stage Hide against active Magisk Alpha'
            )
            migration = once(
                migration,
                'if (!isRunningAsStub || context.packageName == APP_PACKAGE_NAME || !Info.env.isActive) {',
                'if (!isRunningAsStub || context.packageName == APP_PACKAGE_NAME || !r133MatchingBackend()) {',
                'guard Restore against other runtimes'
            )
            migration = once(migration,
                '"AVD_ONLY_REINSTALL_GUARD_REJECTED"',
                '"BACKEND_OR_USER_REINSTALL_GUARD_REJECTED"',
                'fix old-only diagnostic')
            migration = once(migration,
                '"AVD_REINSTALL_FAILED"',
                '"REINSTALL_FAILED"',
                'fix old-only error diagnostic')
        
            ui = once(ui,
                'if (isRunningAsStub && Info.isEmulator) {',
                'if (isRunningAsStub) {',
                'enable final confirmed concealment button for physical Android')
            ui = once(ui,
                'Text("Complete Hide (AVD only)")',
                'Text(if (Info.isEmulator) "Complete Hide (AVD only)" else "Complete Hide")',
                'keep proven AVD UI label and use clear physical label')
            vm = once(vm,
                'if (_uiState.value.showLoading || !Info.isEmulator) return',
                'if (_uiState.value.showLoading) return',
                'enable explicit concealment UI action outside AVD')
        
            # Physical code is still executed ONLY after app Hide and then manual
            # Complete Hide confirmation; runtime must match official 31.1 fork.
            assert migration.count('r133MatchingBackend()') == 5
            assert migration.count('!Info.isEmulator') == 0
            assert 'pm uninstall -k --user 0 $APP_PACKAGE_NAME' in migration
            assert 'MessageDigest.isEqual(r114Digest(preserved), r114Digest(source))' in migration
            assert 'Config.suManager = ""' in migration
            assert 'r114_original.sha256' in migration
            assert ui.count('Complete Hide (AVD only)') == 1
            assert 'if (isRunningAsStub && Info.isEmulator)' not in ui
            assert 'viewModel::finalizeConcealmentAvd' in ui
            assert 'fun finalizeConcealmentAvd()' in vm
            assert 'viewModelScope.launch' in vm
            after = dict(zip(paths, (migration, ui, vm)))
            return {'before':before, 'after':after}
        
        
        def apply(root: Path, output: Path) -> dict:
            root = root.resolve()
            proposal = plan(root)
            before, after = proposal['before'],proposal['after']
            changed = [p for p in before if before[p] != after[p]]
            if len(changed) != 3:
                raise AssertionError(f'Expected three precisely modified files, got {len(changed)}')
            report = {
                'revision':'R13.3',
                'base':'Magisk v31.1 0972f67d + proven R12.1 Hide/Restore source',
                'modified_files':{},
                'physical_android_concealment_ui_enabled':True,
                'root_backend_required':f'{PINNED_VERSION} (code {PINNED_CODE}), not Alpha',
                'original_manager_concealment_requires_second_user_confirmation':True,
                'original_manager_sha256_checked_before_uninstall':True,
                'restore_sha256_checked_before_binding_original':True,
                'device_flashing_performed':False,
                'alpha_daemon_switch_implemented':False,
                'real_arm64_device_tested':False,
                'temporary_CI_signature_is_not_suitable_for_updates':True,
                'flash_release_authorized':False,
            }
            # Compute all mutations before writing anything. No network, root, flash.
            for p in changed:
                report['modified_files'][p.relative_to(root).as_posix()] = {
                    'original_sha256':hashlib.sha256(before[p].encode()).hexdigest(),
                    'new_sha256':hashlib.sha256(after[p].encode()).hexdigest(),
                }
            for p in changed:
                p.write_text(after[p],encoding='utf-8')
            output.parent.mkdir(parents=True,exist_ok=True)
            output.write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
            return report
        
        
        if __name__=='__main__':
            if len(sys.argv)!=3:
                raise SystemExit('Usage: python3 R133_PROMOTE_PHONE_SOURCE.py MAGISK_DIR REPORT.json')
