    - name: R9.1 - Verify and pin official BusyBox and bootctl before Gradle
      shell: bash
      run: "set -euo pipefail\ncat > r91_prefetch_core_assets.py <<'R91_ASSET_SCRIPT'\n#!/usr/bin/env python3\n\"\"\"R9.1: fail-closed prefetch of official Magisk 31.1 core JNI dependencies.\n\nDownload only the specific BusyBox and bootctl archives referenced by pinned\nMagisk 31.1 Setup.kt, verify size/SHA256/ZIP integrity, and copy each into the\nproject-local Gradle download cache BEFORE invoking Gradle. Does not modify\nMagisk sources, signing, device, native libraries, or APKs.\n\"\"\"\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass\nfrom pathlib import Path\nfrom typing import Callable\nimport hashlib\nimport json\nimport os\nimport shutil\nimport time\nimport urllib.request\nimport zipfile\n\nRELEASE = \"https://github.com/topjohnwu/magisk-files/releases/download/files/\"\nAPI_ASSETS = \"https://api.github.com/repos/topjohnwu/magisk-files/releases/assets/\"\n\n@dataclass(frozen=True)\nclass Asset:\n    name: str\n    size: int\n    sha256: str\n    asset_id: int\n    def sources(self):\n        return (RELEASE + self.name, API_ASSETS + str(self.asset_id))\n\n# Checksums must match the ORIGINAL Magisk 31.1 Setup.kt (commit 0972f67d).\n# Sizes and API asset IDs are from the official topjohnwu/magisk-files release.\nASSETS = (\n    Asset(\"busybox-1.36.1.1.zip\", 4592672,\n          \"b4d0551feabaf314e53c79316c980e8f66432e9fb91a69dbbf10a93564b40951\",\n          197195919),\n    Asset(\"bootctl-android-14.0.0_r1.zip\", 250025,\n          \"2cf515aeb17259e88393a1322671ebab1968925864bc04ae57dad54e53ccf15b\",\n          531630586),\n)\n\n\ndef inspect_file(path: Path, asset: Asset) -> bool:\n    if not path.is_file() or path.stat().st_size != asset.size:\n        return False\n    h = hashlib.sha256()\n    with path.open(\"rb\") as f:\n        for chunk in iter(lambda: f.read(1024 * 1024), b\"\"):\n            h.update(chunk)\n    if h.hexdigest() != asset.sha256:\n        return False\n    try:\n        with zipfile.ZipFile(path) as zf:\n            return zf.testzip() is None and len(zf.namelist()) > 0\n    except (OSError, zipfile.BadZipFile):\n        return False\n\n\ndef fetch_asset(asset: Asset, cache: Path,\n                opener: Callable = urllib.request.urlopen,\n                sleeper: Callable = time.sleep,\n                retries: int = 3) -> tuple[Path, str]:\n    cache.mkdir(parents=True, exist_ok=True)\n    final = cache / asset.name\n    if inspect_file(final, asset):\n        return final, \"validated-cache\"\n    final.unlink(missing_ok=True)\n    errors: list[str] = []\n    for round_num in range(retries):\n        for source in asset.sources():\n            candidate = cache / (asset.name + \".partial\")\n            candidate.unlink(missing_ok=True)\n            try:\n                headers = {\"User-Agent\": \"Magisk-R9.1-Pinned-CI/1\", \"Accept\": \"application/octet-stream\"}\n                request = urllib.request.Request(source, headers=headers)\n                with opener(request, timeout=60) as response, candidate.open(\"wb\") as out:\n                    while True:\n                        block = response.read(1024 * 256)\n                        if not block:\n                            break\n                        if out.tell() + len(block) > asset.size:\n                            raise ValueError(\"response exceeds official asset size\")\n                        out.write(block)\n                if not inspect_file(candidate, asset):\n                    raise ValueError(\"size, SHA-256 or ZIP integrity mismatch\")\n                candidate.replace(final)\n                return final, source\n            except Exception as exc:\n                errors.append(f\"round {round_num+1}, {source}: {type(exc).__name__}: {str(exc)[:180]}\")\n            finally:\n                candidate.unlink(missing_ok=True)\n        if round_num < retries - 1:\n            sleeper(min(3 + 3 * round_num, 10))\n    raise RuntimeError(f\"Unable to obtain official pinned {asset.name}. Fail closed.\\n\" + \"\\n\".join(errors))\n\n\ndef validate_source(setup: Path) -> None:\n    if not setup.is_file():\n        raise RuntimeError(\"Missing Magisk 31.1 app/build-logic/src/main/java/Setup.kt\")\n    text = setup.read_text(encoding=\"utf-8\")\n    for asset, symbol in zip(ASSETS, (\"BUSYBOX\", \"BOOTCTL\")):\n        if (f'\"{RELEASE}{asset.name}\"' not in text or\n            f'\"{asset.sha256}\"' not in text or\n            f\"{symbol}_ZIP_CHECKSUM\" not in text):\n            raise RuntimeError(\"Pinned source does not match original \"+asset.name)\n    # Gradle's Project is :core when setupCoreLib() calls downloadFile().\n    for fragment in (\"fun Project.setupCoreLib()\", \"layout.buildDirectory.file(checksum)\",\n                     \"from(zipTree(downloadFile(BUSYBOX_DOWNLOAD_URL, BUSYBOX_ZIP_CHECKSUM)))\",\n                     \"from(zipTree(downloadFile(BOOTCTL_DOWNLOAD_URL, BOOTCTL_ZIP_CHECKSUM)))\"):\n        if fragment not in text:\n            raise RuntimeError(\"Magisk Gradle cache behavior changed: \" + fragment)\n\n\ndef prepare(workspace: Path, cache: Path) -> dict:\n    repo = workspace / \"magisk\"\n    validate_source(repo / \"app/build-logic/src/main/java/Setup.kt\")\n    report = {\"source_commit_expected\": \"0972f67d97f9b6302b67c5171283330c74114b4a\", \"assets\": {}}\n    for asset in ASSETS:\n        file, source = fetch_asset(asset, cache)\n        # In Setup.kt, downloadFile() is a Project extension called from :core.\n        # Thus layout.buildDirectory.file(checksum) resolves in app/core/build/.\n        dest = repo / \"app/core/build\" / asset.sha256\n        dest.parent.mkdir(parents=True, exist_ok=True)\n        shutil.copyfile(file, dest)\n        if not inspect_file(dest, asset):\n            dest.unlink(missing_ok=True)\n            raise RuntimeError(\"Failed to preseed Gradle core build cache with verified \" + asset.name)\n        report[\"assets\"][asset.name] = {\n            \"sha256\": asset.sha256, \"size_bytes\": asset.size,\n            \"location\": str(dest.relative_to(workspace)), \"source\": source,\n            \"verified_sha256\": True, \"zip_ok\": True,\n        }\n    return report\n\n\ndef main() -> None:\n    workspace = Path(os.environ.get(\"GITHUB_WORKSPACE\", os.getcwd()))\n    cache = Path.home() / \".cache\" / \"magisk-r91-runtime-assets\"\n    report = prepare(workspace, cache)\n    out = workspace / \"reports\" / \"r91_core_assets.json\"\n    out.parent.mkdir(exist_ok=True, parents=True)\n    out.write_text(json.dumps(report, indent=2, ensure_ascii=False) + \"\\n\")\n    print(\"R9.1 verified original BusyBox and bootctl and preseeded Gradle cache: PASS\")\n    for name, detail in report[\"assets\"].items():\n        print(name, detail[\"sha256\"], detail[\"source\"])\n\nif __name__ == \"__main__\":\n    main()\nR91_ASSET_SCRIPT\npython3 r91_prefetch_core_assets.py\ntest -s magisk/app/core/build/b4d0551feabaf314e53c79316c980e8f66432e9fb91a69dbbf10a93564b40951\ntest -s magisk/app/core/build/2cf515aeb17259e88393a1322671ebab1968925864bc04ae57dad54e53ccf15b\ntest -s reports/r91_core_assets.json\n"
