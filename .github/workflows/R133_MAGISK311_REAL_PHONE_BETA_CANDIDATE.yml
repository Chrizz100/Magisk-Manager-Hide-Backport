'Restore the Magisk app')\n        dialog = self.ui_dump('restore_dialog')\n        find_node(dialog, 'Restore the hidden manager to its original package?')\n        find_node(dialog, 'OK')\n        self.mark('RESTORE_DIALOG')\n        self.r112_confirm_restore(dialog)\n        self.capture_restore_state('after_confirm')\n\n    def r112_confirm_restore(self, initial_dialog):\n        \"\"\"Confirm the *actual* Android-13 dialog, never trust stale UI coordinates.\n\n        On the recorded R11 run, OK moved 101 px while the dialog animated;\n        the old harness tapped the stale position and did not invoke restore.\n        A retry is permitted ONLY while the exact same restore prompt remains.\n        No requester/sqlite mutation is performed by this helper.\n        \"\"\"\n        prompt = 'Restore the hidden manager to its original package?'\n        title = 'Restore the Magisk app'\n        if prompt not in initial_dialog or title not in initial_dialog:\n            raise RuntimeError('R11.2: initial restore confirmation dialog mismatch')\n        trace = []\n        trace_path = self.report / 'R112_RESTORE_CONFIRM_TRACE.json'\n        try:\n            for attempt in range(1, 4):\n                stable = None\n                prev = None\n                for snapshot in range(1, 6):\n                    fresh = self.ui_dump(f'r112_confirm_pre_{attempt}_{snapshot}')\n                    if prompt not in fresh or title not in fresh:\n                        # Dialog disappeared: never tap a different window.\n                        trace.append({'attempt': attempt, 'event': 'dialog_absent_before_tap'})\n                        return\n                    xy = find_node(fresh, 'OK')\n                    trace.append({'attempt': attempt, 'snapshot': snapshot,\n                                  'ok_center': list(xy), 'event': 'observe'})\n                    if xy == prev:\n                        stable = xy\n                        break\n                    prev = xy\n                    time.sleep(0.85)\n                if stable is None:\n                    raise RuntimeError('R11.2: restore dialog OK never stabilized; no blind tap')\n                x, y = stable\n                self.adb(f'input tap {x} {y}')\n                trace.append({'attempt': attempt, 'event': 'tap_stable_ok',\n                              'x': x, 'y': y})\n                time.sleep(2)\n                after = self.ui_dump(f'r112_confirm_after_{attempt}')\n                if self.requester() == '':\n                    trace.append({'attempt': attempt, 'event': 'requester_cleared_by_app'})\n                    return\n                if prompt not in after or title not in after:\n                    # Dismissal has started; restore_verify() independently\n                    # validates the requester, original app and root state.\n                    trace.append({'attempt': attempt, 'event': 'dialog_closed_wait_for_transaction'})\n                    return\n                trace.append({'attempt': attempt, 'event': 'same_dialog_still_open'})\n            raise RuntimeError('R11.2: restore OK dialog persisted after 3 verified taps')\n        finally:\n            trace_path.write_text(json.dumps(trace, indent=2) + '\\n')\n\n    def _focus_is(self, package):\n        data = self.adb('dumpsys activity activities')\n        return any(package + '/' in m for m in re.findall(r'topResumedActivity\\s*=\\s*ActivityRecord\\{[^\\n]*', data))\n\n    def restore_verify(self):\n        self.wait(lambda: self.requester() == '', 'cleared Magisk requester binding')\n        self.mark('REQUESTER_CLEARED')\n        self.wait(lambda: self._focus_is(ORIGINAL), 'original Magisk manager foreground')\n        self.focus(ORIGINAL)\n        xml = self.ui_dump('restored_home')\n        if 'Home' not in xml or 'Magisk' not in xml:\n            raise RuntimeError('Restored Magisk home is missing UI labels')\n        self.mark('ORIGINAL_FOREGROUND')\n        self.ensure_su('MAGISK_SU_AFTER_RESTORE')\n        self.restored_by_ui = True\n        self.capture_restore_state('success')\n\n    def cleanup(self):\n        if not self.stages.get('AVD_ONLY'):\n            return\n        # Never confuse manual recovery with a successful feature restore.\n        if self.root_setup_started and self.original_present:\n            try:\n                if self.requester():\n                    self.sqlite_clear_requester()\n                    (self.report / 'manual_rollback.txt').write_text('Native requester DB cleared after incomplete UI restoration.\\n')\n            except Exception as e:\n                (self.report / 'manual_rollback_error.txt').write_text(str(e) + '\\n')\n            if self.target and PACKAGE_RE.fullmatch(self.target):\n                try:\n                    self.cmd(['adb', 'uninstall', self.target], timeout=55, check=False,\n                             output='emulator_stub_cleanup.txt')\n                except Exception as e:\n                    (self.report / 'stub_cleanup_error.txt').write_text(str(e) + '\\n')\n\n    def finish(self):\n        if self.stages.get('AVD_ONLY'):\n            try:\n                self.adb('logcat -d -v threadtime', timeout=90, output='logcat.txt')\n                self.adb('dumpsys activity activities', output='final_activities.txt')\n            except Exception as e:\n                (self.report / 'log_collection_error.txt').write_text(str(e))\n        ok = self.error is None and all(self.stages.get(x) for x in REQUIRED_STAGES)\n        outcome = {\n            'base': 'pinned Magisk 31.1, R6.4 source bridge, R8.1 verified toolchain',\n            'test': 'official Magisk AVD daemon + real Android 13 manager hide and restore',\n            'checks': self.stages, 'missing_checks': [s for s in REQUIRED_STAGES if s not in self.stages],\n            'root_permissions_tested': bool(self.stages.get('MAGISK_SU')),\n            'hide_and_restore_tested': bool(self.restored_by_ui),\n            'physical_device_modified': False, 'target': self.target,\n            'original_visible_while_hidden': self.original_visible_while_hidden,\n            'actual_package_concealment_proven':
        self.original_visible_while_hidden is False,\n            'physical_device_ready': False,\n            'error': self.error,\n            'result': 'ROOT_HIDE_RESTORE_PASS' if ok else 'ROOT_HIDE_RESTORE_FAILED_OR_INCOMPLETE',\n        }\n        (self.report / 'R9_RESULT.json').write_text(json.dumps(outcome, indent=2) + '\\n')\n        print('R9 actual root and hide/restore outcome:', outcome['result'], flush=True)\n        if self.error:\n            print('R9 FAILED STAGE:', self.error, file=sys.stderr, flush=True)\n        return 0 if ok else 1\n\n    def run(self):\n        try:\n            self.root_setup()\n            self.enable_gui()\n            self.hide_verify()\n            self.restore_verify()\n        except Exception as e:\n            self.error = str(e)\n            if self.stages.get('RESTORE_DIALOG'):\n                self.capture_restore_state('before_cleanup')\n        finally:\n            self.cleanup()\n            return self.finish()\n\n\nif __name__ == '__main__':\n    if len(sys.argv) == 2 and sys.argv[1] == '--selftest':\n        test_pure()\n    elif len(sys.argv) == 1:\n        if not os.environ.get('GITHUB_WORKSPACE'):\n            sys.exit('R9 only supports the isolated GitHub Actions emulator runner')\n        sys.exit(R9().run())\n    else:\n        sys.exit('Usage: r9_root_emulator.py [--selftest]')\nPY_R97_PAYLOAD\npython3 - <<'PY_R97_HARNESS'\nfrom pathlib import Path\nimport hashlib\np=Path('r9_root_emulator.py')\nold=p.read_text(encoding='utf-8')\nassert hashlib.sha256(old.encode()).hexdigest() == '179a5d88f5e9cbe6bad825ff8d465c2477353dbac636d780904ec886368bcf8c', 'R9.6 harness changed unexpectedly'\nnew=Path('r97_harness_payload.py').read_text(encoding='utf-8')\np.write_text(new, encoding='utf-8')\nassert hashlib.sha256(p.read_bytes()).hexdigest() == '8431f930ee52360fcadd59a9e3c59fe22ab02bce950d842a6b4c1dd3914cf39b', 'R11.2 post-confirm harness digest mismatch'\nprint('R9.7 diagnostics loaded from reviewed original 