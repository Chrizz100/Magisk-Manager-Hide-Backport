    - name: R11.4 - Observe genuine app concealment and restored original on AVD
      shell: bash
      run: "set -euo pipefail\n# Observe app-driven package removal and its recovery; the test harness\n# never removes/reinstalls a package on behalf of the app.\ncat > r114_patch_harness.py <<'PY_R114_HARNESS'\n#!/usr/bin/env python3\n\"\"\"R11.4 Android-13 QEMU-only end-to-end: APP-owned original removal and restore.\nStrict: never let the TEST HARNESS uninstall the original package for the app.\n\"\"\"\nfrom pathlib import Path\nimport hashlib,json,sys\n\nBEFORE='''        # R9.7 scope: existing original stays installed as research rollback.\n        # This is NOT proof that a detector cannot see its package name.\n        self.original_visible_while_hidden = 'package:' in self.adb('pm path ' + ORIGINAL, check=False)\n'''\nAFTER='''        # R11.4 AVD preflight: the ORIGINAL package must exist before the\n        # hidden app owns the concealment step. Test harness NEVER uninstalls it.\n        if 'package:' not in self.adb('pm path ' + ORIGINAL, check=False):\n            raise RuntimeError('R11.4: original package absent BEFORE app-owned removal')\n'''\nORIGINAL_STUB='''        self.mark('STUB_FOREGROUND')\n        xml = self.wait_stub_restore_ui()\n'''\nNEW_STUB='''        self.mark('STUB_FOREGROUND')\n        # Only the running hidden manager may perform the actual package change.\n        # The harness observes, but does not call pm uninstall or reinstall.\n        def finalize_visible():\n            xml = self.ui_dump('r114_concealment_button')\n            return xml if 'Complete Hide (AVD only)' in xml else None\n        xml = self.wait(finalize_visible, 'AVD-only app-managed hide confirmation', seconds=70)\n        find_node(xml, 'Complete Hide (AVD only)')\n        self.tap(xml, 'Complete Hide (AVD only)')\n        def app_original_removed():\n            path = self.adb('pm path ' + ORIGINAL, check=False)\n            return 'package:' not in path\n        self.wait(app_original_removed, 'app-owned original package removal', seconds=90)\n        self.original_visible_while_hidden = 'package:' in self.adb('pm path ' + ORIGINAL, check=False)\n        user_list = self.adb('pm list packages --user 0 ' + ORIGINAL)\n        if ('package:' + ORIGINAL) in user_list.splitlines():\n            raise RuntimeError('R11.4: original package still listed for user 0')\n        if not self._focus_is(target):\n            raise RuntimeError('R11.4: hidden manager lost foreground after original removal')\n        trace = self.adb(\"logcat -d -v brief -s 'R114Conceal:*'\", check=False,\n                         output='R114_APP_CONCEALMENT_TRACE.txt')\n        if 'ORIGINAL_UNINSTALLED_USER0_VERIFIED' not in trace:\n            raise RuntimeError('R11.4: missing app-owned successful concealment trace')\n        self.mark('R114_CONCEALMENT_APP_CONFIRMED')\n        xml = self.wait_stub_restore_ui()\n'''\nORIGINAL_RESTORE='''        self.mark('ORIGINAL_FOREGROUND')\n        self.ensure_su('MAGISK_SU_AFTER_RESTORE')\n'''\nNEW_RESTORE='''        self.mark('ORIGINAL_FOREGROUND')\n        if 'package:' not in self.adb('pm path ' + ORIGINAL, check=False):\n            raise RuntimeError('R11.4: original package not reinstalled after restore')\n        self.mark('R114_ORIGINAL_REINSTALLED')\n        self.ensure_su('MAGISK_SU_AFTER_RESTORE')\n'''\n\ndef patch(src):\n    p=Path(src);s=p.read_text()\n    for title,original,new in [('old original visibility probe',BEFORE,AFTER),('app-owned hide gate',ORIGINAL_STUB,NEW_STUB),('restore post-condition',ORIGINAL_RESTORE,NEW_RESTORE)]:\n        occurrences=s.count(original)\n        if occurrences!=1:raise AssertionError(f'R11.4: {title} expected once; found {occurrences}')\n        s=s.replace(original,new,1)\n    if s.count('R114_CONCEALMENT_APP_CONFIRMED')!=1:raise AssertionError('R11.4 app proof stage missing')\n    if 'self.adb(\\'pm uninstall' in s or 'self.adb(\\'pm install' in s:\n        raise AssertionError('R11.4 test harness must never uninstall or install original itself')\n    p.write_text(s)\n    return {'revision':'R11.4','script_sha256':hashlib.sha256(s.encode()).hexdigest(),'harness_only_observes_package_visibility':True}\n\nif __name__=='__main__':\n    if len(sys.argv)!=3:raise SystemExit('usage: r114_patch_harness.py PYTEST JSON')\n    report=patch(sys.argv[1]);out=Path(sys.argv[2]);out.parent.mkdir(exist_ok=True,parents=True);out.write_text(json.dumps(report,indent=2)+'\\n')\n    print('R11.4 harness checks installed:',report)\nPY_R114_HARNESS\npython3 -m py_compile r114_patch_harness.py\npython3 r114_patch_harness.py r9_root_emulator.py reports/R114_HARNESS_POLICY.json\npython3 -m py_compile r9_root_emulator.py\npython3 r9_root_emulator.py --selftest\ntest -s reports/R114_HARNESS_POLICY.json\n"
