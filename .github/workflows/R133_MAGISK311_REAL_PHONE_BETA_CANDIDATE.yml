t[\'actions\'][\'MODULE_REMOVE_MARKED_BY_INTEGRATED_UI\']=\'PASS\';save()\n        self.adb(\'rm -f \'+rootdir+\'/remove\') # controlled cleanup on throwaway fixture\n        # ZIP selector and import are a separate strict gate; never claim ZIP UI was tested.\n        report[\'actions\'][\'MODULE_ZIP_INSTALL_FROM_INTEGRATED_UI\']=\'NOT_TESTED\'\n        report[\'result\']=\'R115_INTEGRATED_BETA_UI_PARTIAL_PASS\'\n        save()\n        self.mark(\'R115_BETA_ROOT_UI\')\n        self.mark(\'R115_BETA_MODULE_UI\')\n        # Restore initial navigation so the pinned R9 Hide/Restore harness continues.\n        self.adb(\'am force-stop \'+ORIGINAL)\n        self.adb(\'am start -W -n \'+ACTIVITY,timeout=60)\n'
