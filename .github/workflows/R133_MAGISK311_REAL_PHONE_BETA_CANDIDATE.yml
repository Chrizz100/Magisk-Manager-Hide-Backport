    - name: R13.2 - Validate real compiled ARM32/ARM64 ELF binaries and actual Magisk-patched emulator image
      shell: bash
      run: |
        set -euo pipefail
        cat > r132_arm_verify.py <<'PY_R132_ARM_VERIFY'
        #!/usr/bin/env python3
        """R13.2 read-only ARM ABI + real app-generated image audit.
        
        Can run in GitHub Actions and offline against the R12.1 evidence.
        It deliberately cannot authorize installing/flashing a physical Android phone.
        """
        from __future__ import annotations
        import argparse
        import hashlib
        import io
        import json
        import os
        from pathlib import Path
        import struct
        import subprocess
        import shutil
        import sys
        import zipfile
        
        LIBS = ('libbootctl.so', 'libbusybox.so', 'libinit-ld.so', 'libmagisk.so',
                'libmagiskboot.so', 'libmagiskinit.so', 'libmagiskpolicy.so')
        ARCH = {'arm64-v8a': (2, 183), 'armeabi-v7a': (1, 40), 'x86_64': (2, 62)}
        BASE_COMMIT = '0972f67d97f9b6302b67c5171283330c74114b4a'
        
        
        def sha(b: bytes) -> str:
            return hashlib.sha256(b).hexdigest()
        
        
        def boot_parts(data: bytes) -> dict:
            if len(data) < 2048 or data[:8] != b'ANDROID!':
                raise ValueError('Android boot image magic/header missing')
            ksize, kaddr, rsize, raddr, ssize, saddr, tags, page, hv, osver = struct.unpack_from('<10I', data, 8)
            if not (page in (2048,4096,8192,16384) and ksize > 1_000_000 and rsize > 100_000 and hv == 0):
                raise ValueError('Emulator boot-image v0 header invalid')
            ramoff = page + ((ksize + page - 1)//page)*page
            if ramoff + rsize > len(data):
                raise ValueError('Emulator ramdisk extends past file end')
            return {'boot_version':hv,'page_size':page,'kernel_size':ksize,'ramdisk_size':rsize,
                    'kernel_sha256':sha(data[page:page+ksize]),
                    'ramdisk_sha256':sha(data[ramoff:ramoff+rsize]),
                    'os_header':osver}
        
        
        def audit(apk: Path, reports: Path) -> dict:
            checks: dict[str,dict] = {}
            def ck(name: str, condition: bool, **detail):
                checks[name] = {'result': 'PASS' if condition else 'FAIL', **detail}
        
            info={'revision':'R13.2','scope':'R12.1 research APK and x86_64 emulator image pair',
                  'official_magisk_31_1_commit':BASE_COMMIT,'checks':checks,
                  'arm64_device_runtime':'NOT_TESTED','real_arm32_device_runtime':'NOT_TESTED',
                  'sweet_boot_header_v2_patch':'NOT_TESTED','sweet_stock_firmware_match':'NOT_PROVEN',
                  'alpha_31100_to_official_311_runtime_migration':'NOT_TESTED',
                  'independent_recovery_path':'NOT_TESTED',
                  'apksigner_key':'THROWAWAY_CI_KEY', 'automatic_boot_flash':'NOT_TESTED',
                  'device_release_allowed':False,'device_release_status':'HOLD_NOT_READY'}
            try:
                ck('apk_exists', apk.is_file() and apk.stat().st_size>1_000_000,
                   apk_size=apk.stat().st_size if apk.exists() else 0)
                if not checks['apk_exists']['result']=='PASS':
                    raise ValueError('APK missing')
                info['apk_sha256']=sha(apk.read_bytes())
                with zipfile.ZipFile(apk) as z:
                    ck('apk_crc',z.testzip() is None)
                    names=z.namelist()
                    ck('apk_no_duplicate_members', len(set(names))==len(names))
                    ck('app_resources',{'AndroidManifest.xml','classes.dex','resources.arsc','assets/stub.apk'}<=set(names))
                    with zipfile.ZipFile(io.BytesIO(z.read('assets/stub.apk'))) as stub:
                        ck('stub_crc',stub.testzip() is None)
                    for abi,(cl,mach) in ARCH.items():
                        good=True; details=[]
                        for mod in LIBS:
                            name=f'lib/{abi}/{mod}'
                            if name not in names:
                                good=False; details.append('MISSING:'+mod);continue
                            e=z.read(name)
                            if len(e)<64 or e[:4]!=b'\x7fELF':
                                good=False;details.append('BAD_ELF:'+mod);continue
                            em=struct.unpack_from('<H',e,18)[0]
                            typ=struct.unpack_from('<H',e,16)[0]
                            valid=e[4]==cl and e[5]==1 and em==mach and typ in (2,3)
                            good=good and valid
                            details.append(f'{mod}:ELF{32 if cl==1 else 64}:e_machine={em}:e_type={typ}:'+('PASS' if valid else 'FAIL'))
                        ck('abi_'+abi,good,verified_elfs=details)
            except Exception as ex:
                ck('apk_archive_validation',False,error=f'{type(ex).__name__}: {ex}')
        
            root=reports/'r9_emulator'
            try:
                gate=json.loads((reports/'R121_FULL_FUNCTION_GATE.json').read_text())
                ck('r121_app_e2e',gate.get('android_emulator_full_function_pass') is True
                   and all(gate.get('new_checks',{}).get(k) is True for k in
                           ('R121_HIDDEN_APP_ROOT_UID0','R121_MODULE_ZIP_FROM_APP_UI','R121_BOOT_FILE_PATCH_FROM_APP_UI'))
                   and gate.get('real_phone_tested') is False and gate.get('device_install_authorized') is False)
                fixture=json.loads((root/'R121_BOOT_FIXTURE.json').read_text())
                patched_report=json.loads((root/'R121_BOOT_PATCH.json').read_text())
                sdata=(root/'r121_stock_boot.img').read_bytes()
                pdata=(root/'r121_patched_boot.img').read_bytes()
                s=boot_parts(sdata);p=boot_parts(pdata)
                ck('emulator_fixture_provenance',fixture['sha256']==sha(sdata)
                   and fixture.get('source_emulator_only') is True
                   and patched_report.get('avd_only') is True)
                ck('emulator_image_hashes',patched_report.get('input_sha256')==sha(sdata)
                   and patched_report.get('patched_sha256')==sha(pdata)
                   and patched_report.get('boot_partition_write') is False,
                   stock_sha256=sha(sdata),patched_sha256=sha(pdata))
                ck('emulator_kernel_unchanged',s['kernel_sha256']==p['kernel_sha256'],
                   kernel_sha256_original=s['kernel_sha256'],kernel_sha256_patched=p['kernel_sha256'])
                ck('emulator_ramdisk_modified',s['ramdisk_sha256']!=p['ramdisk_sha256'],
                   original_bytes=s['ramdisk_size'],patched_bytes=p['ramdisk_size'])
                ck('emulator_boot_header', s['boot_version']==0 and p['boot_version']==0
                   and s['page_size']==p['page_size'] and s['kernel_size']==p['kernel_size'],
                   header_version_original=s['boot_version'],header_version_patched=p['boot_version'],
                   page_size=s['page_size'])
            except Exception as ex:
                ck('emulator_image_audit',False,error=f'{type(ex).__name__}: {ex}')
        
            # The APK in the R12.1 pipeline is always freshly signed with a disposable
            # certificate and contains emulator-only hide/concealment guards.
            # Checking an ELF is NOT an ARM64 Android boot test.
            info['static_verification_passed']=all(v['result']=='PASS' for v in checks.values())
            info['build_verdict']='ARM_ABI_AND_EMULATOR_PATCH_STATIC_PASS' if info['static_verification_passed'] else 'STATIC_TEST_FAILED'
            info['blockers']=[
                'No Android ARM64 or ARM32 on-device Magisk runtime/hide-restore test',
                'Tested boot image uses Android header v0 / x86_64 QEMU, not sweet header v2 / ARM64',
                'No boot image from currently running sweet firmware paired with its R13.2 patched counterpart',
                'No validation of Magisk Alpha -> signed beta manager compatibility or stable signing identity',
                'R13.3 source enables phone concealment, but runtime on physical ARM64 device is still untested',
                'No independently tested boot-image recovery path without working Android'
            ]
            return info
        
        
        def main():
            p=argparse.ArgumentParser()
            p.add_argument('--apk', type=Path, required=True)
            p.add_argument('--reports', type=Path, required=True)
            p.add_argument('--out', type=Path, default=Path('R132_ARM_RELEASE_GATE.json'))
            a=p.parse_args()
            result=audit(a.apk,a.reports)
            a.out.parent.mkdir(parents=True,exist_ok=True)
            a.out.write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
            print('R13.2 static:',result['build_verdict'])
            for k,v in result['checks'].items():print(' ',k,'=',v['result'])
            print('R13.2 physical-device release:',result['device_release_status'])
            return 0 if result['static_verification_passed'] else 1
        
        
        if __name__=='__main__':
            sys.exit(main())
        PY_R132_ARM_VERIFY
        python3 -m py_compile r132_arm_verify.py
        python3 r132_arm_verify.py \
          --apk magisk/out/app-release.apk \
          --reports reports \
          --out reports/R132_ARM_RELEASE_GATE.json
        # This audit checks static Android ARM ABI contents, not ARM64 hardware runtime.
        # Intentionally keep physical-device release forbidden until separately proven.
        python3 - <<'PY_R132_RELEASE_HOLD'
        import json
        from pathlib import Path
        r = json.loads(Path('reports/R132_ARM_RELEASE_GATE.json').read_text())
        assert r['static_verification_passed'] and not r['device_release_allowed']
        assert r['device_release_status'] == 'HOLD_NOT_READY'
        print('R13.2: Static ARM32/ARM64 ELF + emulator boot patch validation PASS; phone release HOLD')
        PY_R132_RELEASE_HOLD
    - name: R13.2 - Verify actual APK signing scheme, manifest package and SDK levels
      shell: bash
      run: |
        set -euo pipefail
        SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
        if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT/build-tools" ]; then
          echo 'Missing Android SDK build-tools; release gate fails closed' >&2
          exit 1
        fi
        APKSIGNER=$(find "$SDK_ROOT/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n1)
        AAPT=$(find "$SDK_ROOT/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -n1)
        if [ -z "$APKSIGNER" ] || [ -z "$AAPT" ]; then
          echo 'Missing apksigner/aapt; release gate fails closed' >&2
          exit 1
        fi
        "$APKSIGNER" verify --verbose --print-certs magisk/out/app-release.apk > reports/R132_APK_SIGNATURE.txt
        "$AAPT" dump badging magisk/out/app-release.apk > reports/R132_APK_MANIFEST.txt
        grep -Fq "package: name='com.topjohnwu.magisk'" reports/R132_APK_MANIFEST.txt
        grep -Fq "sdkVersion:'24'" reports/R132_APK_MANIFEST.txt
        grep -Eq "targetSdkVersion:'(37|3[789])'" reports/R132_APK_MANIFEST.txt
        echo 'R13.2 APK signature verified; manifest fields checked (signer is disposable research key)'
    - name: R13.3 - Assert beta APK has active phone Hide Restore source and independent install-only policy
