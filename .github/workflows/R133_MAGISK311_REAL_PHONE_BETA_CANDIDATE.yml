    - name: R8 - Validate emulator ABI and create real GUI navigation test
      shell: bash
      run: "set -euo pipefail\ngrep -Fq '\"x86_64\": \"x86_64-linux-android\"' magisk/build.py\ngrep -Fxq 'abiList=arm64-v8a,armeabi-v7a,x86_64' r6-build.prop\ntest -s magisk/out/app-release.apk\ngrep -Fq 'Info.env.isActive && Info.env.versionCode == BuildConfig.APP_VERSION_CODE' magisk/app/apk/src/main/java/com/topjohnwu/magisk/ui/home/HomeScreen.kt\nmkdir -p reports/r8_emulator\nprintf '%s\\n' 'R8 API 33 x86_64 navigation smoke; no physical phone, no Magisk daemon, no hide/restore operation.' > reports/r8_emulator/SCOPE.txt\ncat > r8_emulator_gui.sh <<'R8_SCRIPT'\n#!/usr/bin/env bash\n# R8: genuine UI navigation test on an isolated Android 13 x86_64 emulator.\n# No Magisk daemon/root installation, hide/restore execution, or physical-device action.\nset -Eeuo pipefail\nPKG=com.topjohnwu.magisk\nACT=com.topjohnwu.magisk/.ui.MainActivity\n: \"${GITHUB_WORKSPACE:?Only run in GitHub Actions emulator runner}\"\nAPK=\"$GITHUB_WORKSPACE/magisk/out/app-release.apk\"\nREPORT=\"$GITHUB_WORKSPACE/reports/r8_emulator\"\nmkdir -p \"$REPORT\"\nprintf 'OUTCOME=NOT_COMPLETED\\nHIDE_RESTORE=NOT_TESTED_NO_MAGISK_DAEMON\\nROOT_PERMISSIONS=NOT_TESTED_NO_MAGISK_DAEMON\\n' > \"$REPORT/result.env\"\nmark() { printf '%s=%s\\n' \"$1\" \"$2\" >> \"$REPORT/result.env\"; }\nfinish() {\n  local rc=$?\n  trap - EXIT\n  set +e\n  adb logcat -d -v threadtime > \"$REPORT/logcat.txt\" 2>&1\n  adb shell dumpsys activity activities > \"$REPORT/final_activities.txt\" 2>&1\n  R8_RC=\"$rc\" REPORT=\"$REPORT\" python3 - <<'PY_REPORT'\nimport json,os,pathlib,re\np=pathlib.Path(os.environ['REPORT'])\nflags={}\nfor line in (p/'result.env').read_text().splitlines():\n    if '=' in line:\n        a,b=line.split('=',1);flags[a]=b\nrequired=[\n  'APK_PRESENT','ANDROID_13_X86_64_QEMU','APK_INSTALL','NOTIFICATION_PERMISSION_GRANTED',\n  'FOREGROUND_MAGISK_HOME','HOME_UI_VERIFIED','SETTINGS_NAVIGATION','SETTINGS_SCREEN_VERIFIED',\n  'BACK_TO_HOME','RELAUNCH_HOME_VERIFIED','NO_MANAGER_FATAL_EXCEPTION'\n]\nmissing=[k for k in required if flags.get(k)!='true']\ncrash=[]\nlines=(p/'logcat.txt').read_text(errors='replace').splitlines() if (p/'logcat.txt').exists() else []\nfor i,line in enumerate(lines):\n    if 'FATAL EXCEPTION' in line and any(re.search(r'Process: com\\.topjohnwu\\.magisk(?:,|\\s|$)',x) for x in lines[i+1:i+11]):\n        crash.append(line)\nsuccess=int(os.environ['R8_RC'])==0 and not missing and not crash\nout={\n 'base':'Pinned Magisk 31.1 + unchanged R6.4 patches',\n 'test':'Real Android 13 API 33 x86_64 emulator GUI navigation after permission grant',\n 'checks':flags,'missing_checks':missing,'manager_fatal_exceptions':crash[:10],\n 'root_daemon_installed':False,'hide_and_restore_tested':False,'root_permissions_tested':False,\n 'physical_device_modified':False,'result':'GUI_PASS' if success else 'GUI_FAILED_OR_INCOMPLETE',\n 'original_exit_code':int(os.environ['R8_RC'])}\n(p/'R8_RESULT.json').write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\\n')\nprint('R8 actual GUI outcome:',out['result'])\nPY_REPORT\n  exit \"$rc\"\n}\ntrap finish EXIT\n\n# Strict emulator gate: prevents accidental execution on a connected real device.\ntest -s \"$APK\"\nmark APK_PRESENT true\nadb wait-for-device\nSDK=\"$(adb shell getprop ro.build.version.sdk | tr -d '\\r')\"\nABI=\"$(adb shell getprop ro.product.cpu.abi | tr -d '\\r')\"\nQEMU=\"$(adb shell getprop ro.kernel.qemu | tr -d '\\r')\"\nprintf 'API=%s\\nABI=%s\\nQEMU=%s\\n' \"$SDK\" \"$ABI\" \"$QEMU\" | tee \"$REPORT/device.txt\"\nif [ \"$SDK\" != 33 ] || [ \"$ABI\" != x86_64 ] || [ \"$QEMU\" != 1 ]; then\n  echo 'R8: refusing non-Android-13 x86_64 emulator' >&2\n  exit 2\nfi\nmark ANDROID_13_X86_64_QEMU true\nadb logcat -c\nadb install -r \"$APK\" 2>&1 | tee \"$REPORT/install.txt\"\nmark APK_INSTALL true\nadb shell pm path \"$PKG\" | tee \"$REPORT/package_path.txt\" | grep -q 'package:'\n\n# Grant the standard Android 13 notification runtime permission in this disposable\n# emulator only. This avoids incorrectly counting a permission dialog as app UI.\nadb shell pm grant \"$PKG\" android.permission.POST_NOTIFICATIONS\nmark NOTIFICATION_PERMISSION_GRANTED true\nadb shell am force-stop \"$PKG\"\nadb shell am start -W -n \"$ACT\" | tee \"$REPORT/first_launch.txt\"\nsleep 6\n\nassert_focus() {\n  local label=\"$1\"\n  local file=\"$REPORT/${label}_activities.txt\"\n  adb shell dumpsys activity activities > \"$file\"\n  python3 - \"$file\" <<'PY_FOCUS'\nimport pathlib,re,sys\ns=pathlib.Path(sys.argv[1]).read_text(errors='replace')\nif not re.search(r'topResumedActivity\\s*=\\s*ActivityRecord\\{[^\\n]*com\\.topjohnwu\\.magisk/\\.ui\\.MainActivity',s):\n    sys.exit('Magisk MainActivity is not the top-resumed app')\nPY_FOCUS\n}\n\ndump_ui() {\n  local name=\"$1\"\n  local dest=\"$REPORT/${name}.xml\" remote=\"/sdcard/r8_${name}.xml\"\n  local n\n  for n in 1 2 3; do\n    if timeout 55s adb shell uiautomator dump \"$remote\" > \"$REPORT/${name}_ui_dump_${n}.txt\" 2>&1 && \\\n       adb pull \"$remote\" \"$dest\" > \"$REPORT/${name}_adb_pull_${n}.txt\" 2>&1 && \\\n       python3 - \"$dest\" <<'PY_XML'\nimport pathlib,sys,xml.etree.ElementTree as ET\np=pathlib.Path(sys.argv[1]);root=ET.parse(p).getroot()\nassert root.tag=='hierarchy' and list(root.iter('node'))\nPY_XML\n    then return 0; fi\n    sleep 2\n  done\n  echo \"R8: failed to read actual foreground UI hierarchy: $name\" >&2\n  return 1\n}\n\n# Assertions match observed English Android-13 test image and real Compose UI.\nui_assert() {\n  local doc=\"$1\" kind=\"$2\"\n  python3 - \"$doc\" \"$kind\" <<'PY_UI'\nimport pathlib,sys,xml.etree.ElementTree as ET\nroot=ET.parse(sys.argv[1]).getroot();mode=sys.argv[2]\nnodes=list(root.iter('node'))\nactive=[n for n in nodes if n.get('package')=='com.topjohnwu.magisk']\nif not active:\n    sys.exit('Foreground UI hierarchy does not contain Magisk package')\nif any(n.get('package','').endswith('permissioncontroller') for n in nodes):\n    sys.exit('Android runtime-permission popup still covers the GUI')\ntexts={v.strip() for n in nodes for v in (n.get('text',''),n.get('content-desc','')) if v.strip()}\nif mode=='home':\n    required={'Home','Magisk'}\nelif mode=='settings':\n    required={'Settings','Customization'}\nelse:sys.exit('unknown screen test')\nmissing=required-texts\nif missing:sys.exit(f'Actual {mode} UI is missing expected labels: {missing}. Visible={sorted(texts)[:45]}')\nprint(f'R8 {mode} GUI labels and package: PASS; visible={sorted(texts)[:18]}')\nPY_UI\n}\n\nui_tap() {\n  local xml=\"$1\" label=\"$2\" xy\n  xy=\"$(python3 - \"$xml\" \"$label\" <<'PY_TAP'\nimport re,sys,xml.etree.ElementTree as ET\nroot=ET.parse(sys.argv[1]).getroot();label=sys.argv[2]\nfound=[]\nfor n in root.iter('node'):\n    if label not in {n.get('text'),n.get('content-desc')}:continue\n    m=re.fullmatch(r'\\[(\\d+),(\\d+)\\]\\[(\\d+),(\\d+)\\]',n.get('bounds',''))\n    if m:\n        x1,y1,x2,y2=map(int,m.groups())\n        if x2>x1 and y2>y1:found.append(((y1+y2)//2,(x1+x2)//2))\nif not found:sys.exit('Cannot locate requested navigation item: '+label)\n# Prefer bottom navigation; ignores similarly-named title in top bar.\ny,x=max(found)\nprint(x,y)\nPY_TAP\n)\"\n  local x y\n  read -r x y <<< \"$xy\"\n  printf 'Tap %s at %s,%s\\n' \"$label\" \"$x\" \"$y\" | tee -a \"$REPORT/navigation.txt\"\n  adb shell input tap \"$x\" \"$y\"\n}\n\nassert_focus first_home\nmark FOREGROUND_MAGISK_HOME true\ndump_ui first_home\nui_assert \"$REPORT/first_home.xml\" home\nmark HOME_UI_VERIFIED true\nadb exec-out screencap -p > \"$REPORT/home.png\"\ntest -s \"$REPORT/home.png\"\n\nui_tap \"$REPORT/first_home.xml\" Settings\nsleep 3\nassert_focus settings\ndump_ui settings\nui_assert \"$REPORT/settings.xml\" settings\nmark SETTINGS_NAVIGATION true\nmark SETTINGS_SCREEN_VERIFIED true\nadb exec-out screencap -p > \"$REPORT/settings.png\"\ntest -s \"$REPORT/settings.png\"\n\nui_tap \"$REPORT/settings.xml\" Home\nsleep 2\nassert_focus returned_home\ndump_ui returned_home\nui_assert \"$REPORT/returned_home.xml\" home\nmark BACK_TO_HOME true\n\nadb shell am force-stop \"$PKG\"\nadb shell am start -W -n \"$ACT\" | tee \"$REPORT/relaunch.txt\"\nsleep 5\nassert_focus relaunch\ndump_ui
        relaunch\nui_assert \"$REPORT/relaunch.xml\" home\nadb exec-out screencap -p > \"$REPORT/relaunch.png\"\ntest -s \"$REPORT/relaunch.png\"\nmark RELAUNCH_HOME_VERIFIED true\n\n# Root-based repackaging deliberately NOT exercised on an unrooted emulator.\n# Record whether this image is debuggable for planning a future isolated daemon test.\nadb shell getprop ro.debuggable | tr -d '\\r' > \"$REPORT/ro_debuggable.txt\" || true\nadb logcat -d -v threadtime > \"$REPORT/logcat.txt\" 2>&1\nR8_LOG=\"$REPORT/logcat.txt\" python3 - <<'PY_CRASH'\nimport os,pathlib,re,sys\ns=pathlib.Path(os.environ['R8_LOG']).read_text(errors='replace').splitlines()\nfor i,line in enumerate(s):\n    if 'FATAL EXCEPTION' in line and any(re.search(r'Process: com\\.topjohnwu\\.magisk(?:,|\\s|$)',v) for v in s[i+1:i+11]):\n        sys.exit('R8: FATAL EXCEPTION in Magisk app process')\nprint('No Magisk-process FATAL EXCEPTION in Android logcat')\nPY_CRASH\nmark NO_MANAGER_FATAL_EXCEPTION true\nsed -i 's/^OUTCOME=NOT_COMPLETED$/OUTCOME=GUI_PASS/' \"$REPORT/result.env\"\necho 'R8 real GUI navigation PASS: Home -> Settings -> Home -> relaunch. Hide/restore NOT TESTED.'\nR8_SCRIPT\nbash -n r8_emulator_gui.sh\nchmod 0700 r8_emulator_gui.sh\necho 'R8 emulator GUI script and ABI compatibility: PASS'\n"
    - name: R9.6 - Validate historical root service and capture hidden GUI readiness
      shell: bash
      run: "set -euo pipefail\nmkdir -p reports/r9_emulator\nprintf '%s\\n' 'R9: official Magisk 31.1 AVD daemon only; temporary research signature; API33 x86_64 QEMU; no real phone.' > reports/r9_emulator/SCOPE.txt\ntest -s magisk/out/app-release.apk\ntest \"$(git -C magisk rev-parse HEAD)\" = 0972f67d97f9b6302b67c5171283330c74114b4a\ntest -f magisk/scripts/avd_setup.sh\ngrep -Fq 'def setup_avd():' magisk/build.py\ncat > r9_root_emulator.py <<'PY_R9_SCRIPT'\n#!/usr/bin/env python3\n\"\"\"R9: strict API-33 AVD-only Magisk daemon + manager hide/restore smoke.\n\nResearch-only. Never run on a physical device. All changes take place on a\nthrowaway emulator using a freshly built research APK and temporary CI key.\n\"\"\"\nimport json\nimport os\nimport re\nimport shlex\nimport subprocess\nimport sys\nimport time\nimport xml.etree.ElementTree as ET\nfrom pathlib import Path\n\nORIGINAL = 'com.topjohnwu.magisk'\nACTIVITY = ORIGINAL + '/.ui.MainActivity'\nEXPECTED = {'ro.kernel.qemu': '1', 'ro.build.version.sdk': '33', 'ro.product.cpu.abi': 'x86_64'}\nPACKAGE_RE = re.compile(r'[a-z][a-z0-9_]*(?:\\.[a-z][a-z0-9_]*)+')\nREQUIRED_STAGES = ('AVD_ONLY', 'ADB_ROOT', 'MAGISK_DAEMON_31100', 'MAGISK_SU',\n                   'ANDROID_FRAMEWORK_RESTORED',\n                   'HIDE_BUTTON', 'HIDE_DIALOG', 'STUB_INSTALLED', 'REQUESTER_BOUND',\n                   'STUB_FOREGROUND', 'STUB_RESTORE_BUTTON', 'RESTORE_DIALOG',\n                   'REQUESTER_CLEARED', 'ORIGINAL_FOREGROUND', 'MAGISK_SU_AFTER_RESTORE')\n\n\ndef extract_requester(output):\n    lines = [line.strip() for line in output.splitlines() if line.startswith('value=')]\n    if not lines:\n        return ''\n    if len(lines) != 1:\n        raise RuntimeError('Unexpected multiple requester DB values')\n    value = lines[0][6:]\n    if value and (not PACKAGE_RE.fullmatch(value) or value == ORIGINAL):\n        raise RuntimeError('Malformed requester DB value')\n    return value\n\n\ndef find_node(xml_text, label):\n    root = ET.fromstring(xml_text)\n    for node in root.iter('node'):\n        if label not in (node.get('text', ''), node.get('content-desc', '')):\n            continue\n        match = re.fullmatch(r'\\[(\\d+),(\\d+)\\]\\[(\\d+),(\\d+)\\]', node.get('bounds', ''))\n        if not match:\n            continue\n        x0, y0, x1, y1 = map(int, match.groups())\n        if x1 > x0 and y1 > y0:\n            return ((x0 + x1) // 2, (y0 + y1) // 2)\n    raise RuntimeError('UI element not found: ' + label)\n\n\ndef test_pure():\n    x = '<hierarchy><node text=\"Hide the Magisk app\" bounds=\"[12,20][52,80]\" /></hierarchy>'\n    assert find_node(x, 'Hide the Magisk app') == (32, 50)\n    for bad in ('random', 'com.topjohnwu.magisk', 'foo.bar;rm', 'UPPER.pkg'):\n        try:\n            extract_requester('value=' + bad)\n        except RuntimeError:\n            pass\n        else:\n            raise AssertionError('Invalid requester accepted: ' + bad)\n    assert extract_requester('') == ''\n    assert extract_requester('value=abc.def\\n') == 'abc.def'\n    assert len(REQUIRED_STAGES) == len(set(REQUIRED_STAGES))\n    print('R9_SELFTEST_PASS: XML bounds, DB validation, unique strict gates')\n\n\nclass R9:\n    def __init__(self):\n        self.workspace = Path(os.environ['GITHUB_WORKSPACE']).resolve()\n        self.report = self.workspace / 'reports' / 'r9_emulator'\n        self.report.mkdir(parents=True, exist_ok=True)\n        self.apk = self.workspace / 'magisk' / 'out' / 'app-release.apk'\n        self.stages = {}\n        self.target = None\n        self.original_present = False\n        self.error = None\n        self.root_setup_started = False\n        self.restored_by_ui = False\n\n    def cmd(self, argv, *, timeout=45, check=True, output=None, cwd=None):\n        try:\n            p = subprocess.run(argv, cwd=cwd, text=True, errors='replace',\n                               stdout=subprocess.PIPE, stderr=subprocess.STDOUT,\n                               timeout=timeout)\n            if output:\n                (self.report / output).write_text(p.stdout)\n            if check and p.returncode:\n                raise RuntimeError(f'Command failed ({p.returncode}): {argv[:3]}: {p.stdout[-700:]}')\n            return p.stdout.strip()\n        except subprocess.TimeoutExpired as e:\n            raise RuntimeError('Timed out: ' + str(argv[:3])) from e\n\n    def adb(self, remote, *, timeout=45, check=True, output=None):\n        return self.cmd(['adb', 'shell', remote], timeout=timeout, check=check, output=output)\n\n    def mark(self, stage):\n        self.stages[stage] = True\n        print('R9_PASS:', stage, flush=True)\n\n    def identity(self):\n        devices = [line.split()[0] for line in self.cmd(['adb', 'devices']).splitlines()[1:]\n                   if line.strip() and line.split()[-1] == 'device']\n        if len(devices) != 1 or not devices[0].startswith('emulator-'):\n            raise RuntimeError('Strict R9 gate: exactly one AVD emulator required')\n        info = {key: self.adb('getprop ' + key).strip() for key in EXPECTED}\n        info['adb_serial'] = devices[0]\n        (self.report / 'device.json').write_text(json.dumps(info, indent=2) + '\\n')\n        if any(info.get(key) != expected for key, expected in EXPECTED.items()):\n            raise RuntimeError('Strict R9 gate: wrong device: ' + str(info))\n        self.mark('AVD_ONLY')\n\n    def requester(self):\n        sql = 'SELECT value FROM settings WHERE key=\"requester\" LIMIT 1'\n        remote = '/data/adb/magisk/magisk --sqlite ' + shlex.quote(sql)\n        return extract_requester(self.adb(remote))\n\n    def sqlite_clear_requester(self):\n        sql = 'DELETE FROM settings WHERE key=\"requester\"'\n        return self.adb('/data/adb/magisk/magisk --sqlite ' + shlex.quote(sql), check=False)\n\n    def ui_dump(self, label):\n        dest = self.report / (label + '.xml')\n        remote = '/sdcard/r9_' + label + '.xml'\n        for attempt in range(1, 4):\n            try:\n                self.adb('uiautomator dump ' + shlex.quote(remote), timeout=55)\n                self.cmd(['adb', 'pull', remote, str(dest)], timeout=25)\n                root = ET.parse(dest).getroot()\n                assert root.tag == 'hierarchy' and len(list(root.iter('node'))) > 0\n                return dest.read_text()\n            except (RuntimeError, ET.ParseError, AssertionError):\n                if attempt == 3:\n                    raise\n                time.sleep(2)\n        raise RuntimeError('unreachable')\n\n    def tap(self, xml, text):\n        x, y = find_node(xml, text)\n        self.adb(f'input tap {x} {y}')\n        time.sleep(2)\n\n    def focus(self, expected):\n        data = self.adb('dumpsys activity activities', output='activity_' + expected.replace('.', '_') + '.txt')\n        matches = re.findall(r'topResumedActivity\\s*=\\s*ActivityRecord\\{[^\\n]*', data)\n        if not matches or not any((expected + '/') in s for s in matches):\n            raise RuntimeError('Expected top-resumed package is absent: ' + expected)\n\n    def wait(self, action, description, seconds=75):\n        deadline = time.monotonic() + seconds\n        last = None\n        while time.monotonic() < deadline:\n            try:\n                value = action()\n                if value:\n                    return value\n            except RuntimeError as e:\n                last = e\n            time.sleep(3)\n        raise RuntimeError('Timed out waiting for ' + description + (' (' + str(last) + ')' if last else ''))\n\n    def root_setup(self):\n        self.identity()  # BEFORE any privilege escalation or installation\n        if not self.apk.is_file() or self.apk.stat().st_size < 1_000_000:\n            raise RuntimeError('Pinned research APK is missing')\n        if self.requester_or_unavailable():\n            raise RuntimeError('Emulator already has an unexpected Magisk manager binding')\n        self.original_present = 'package:' in self.adb('pm path ' + ORIGINAL)\n        if not self.original_present:\n            raise RuntimeError('R8 research manager is not installed')\n        self.cmd(['adb', 'root'], timeout=35,
        output='adb_root.txt')\n        self.cmd(['adb', 'wait-for-device'], timeout=60)\n        if self.adb('id -u') != '0':\n            raise RuntimeError('ADB root did not activate on this official AVD')\n        self.mark('ADB_ROOT')\n        # Official pinned Magisk script (no third-party emulation root helper).\n        self.root_setup_started = True\n        self.cmd(['python3', 'build.py', 'emulator', str(self.apk)], timeout=240,\n                 cwd=self.workspace / 'magisk', output='official_avd_setup.txt')\n        self.cmd(['adb', 'wait-for-device'], timeout=60)\n        version = self.adb('/data/adb/magisk/magisk -V')\n        if version != '31100':\n            raise RuntimeError('Unexpected Magisk daemon version code: ' + version)\n        self.mark('MAGISK_DAEMON_31100')\n        self.ensure_su('MAGISK_SU')\n        self.wait_for_framework()  # official avd_setup.sh restarts zygote/system_server\n\n    def wait_for_framework(self, *, timeout_seconds=180, poll_seconds=3):\n        \"\"\"After official avd_setup.sh stop/start, wait for system_server services.\n\n        'adb wait-for-device' only proves adbd is responding, NOT that Android's\n        ActivityManager/PackageManager have finished restarting. Never issue\n        UI interactions before both service binders and boot have recovered.\n        \"\"\"\n        if not self.stages.get('AVD_ONLY') or not self.stages.get('ADB_ROOT'):\n            raise RuntimeError('Framework wait requires verified AVD and ADB root')\n        deadline = time.monotonic() + timeout_seconds\n        log = self.report / 'framework_wait.jsonl'\n        consecutive = 0\n        attempts = 0\n        probes = (\n            ('zygote', 'getprop init.svc.zygote'),\n            ('boot', 'getprop sys.boot_completed'),\n            ('activity', 'service check activity'),\n            ('package', 'service check package'),\n            ('manager', 'pm path ' + ORIGINAL),\n        )\n        last = {}\n        while time.monotonic() < deadline:\n            attempts += 1\n            status = {}\n            for name, remote in probes:\n                try:\n                    status[name] = self.adb(remote, check=False, timeout=12)\n                except RuntimeError as exc:\n                    status[name] = 'ADB_ERROR: ' + str(exc)[:220]\n            ready = (\n                status['zygote'] == 'running'\n                and status['boot'] == '1'\n                and 'Service activity: found' in status['activity']\n                and 'Service package: found' in status['package']\n                and 'package:' in status['manager']\n            )\n            consecutive = consecutive + 1 if ready else 0\n            last = status\n            with log.open('a') as f:\n                f.write(json.dumps({'attempt': attempts, 'ready': ready,\n                                    'stable_passes': consecutive, 'services': status}) + '\\n')\n            if consecutive >= 2:\n                self.mark('ANDROID_FRAMEWORK_RESTORED')\n                return\n            time.sleep(poll_seconds)\n        try:\n            self.adb('logcat -d -t 400', timeout=35, check=False,\n                     output='framework_recovery_logcat.txt')\n        except RuntimeError:\n            pass\n        raise RuntimeError('Android services not recovered after official Magisk AVD stop/start'\n                           ' (activity, package, boot); see framework_wait.jsonl. '\n                           + json.dumps(last))\n\n    def requester_or_unavailable(self):\n        # Before activating the daemon its database might not exist.\n        return self.adb('test -f /data/adb/magisk.db && echo present || true') == 'present'\n\n    def ensure_su(self, stage):\n        result = self.adb('/debug_ramdisk/su -c id', timeout=40)\n        if 'uid=0(' not in result:\n            raise RuntimeError('Magisk SU did not grant uid=0: ' + result)\n        self.mark(stage)\n\n    def enable_gui(self):\n        # The official Magisk AVD setup reinstalls the research APK and restarts\n        # Android. R8's earlier POST_NOTIFICATIONS grant is not necessarily\n        # retained; in R9.3 the real permission-controller dialog blocked focus.\n        # Never grant anything until the isolated rooted emulator is verified.\n        required = ('AVD_ONLY', 'ADB_ROOT', 'MAGISK_DAEMON_31100',\n                    'ANDROID_FRAMEWORK_RESTORED')\n        if not all(self.stages.get(stage) for stage in required):\n            raise RuntimeError('R9 notification regrant requires verified rooted AVD and framework')\n        self.adb('pm grant ' + ORIGINAL + ' android.permission.POST_NOTIFICATIONS',\n                 output='r94_notification_grant.txt')\n        self.adb('am force-stop ' + ORIGINAL)\n        self.adb('am start -W -n ' + ACTIVITY, timeout=50)\n        try:\n            self.wait(lambda: self._focus_is(ORIGINAL),\n                      'Magisk foreground after Android 13 notification permission grant', seconds=60)\n        except RuntimeError:\n            # Preserve what is actually covering the app, never fake a GUI_PASS.\n            self.adb('dumpsys activity activities', check=False,\n                     output='r94_focus_failure_activities.txt')\n            raise\n        self.focus(ORIGINAL)\n        xml = self.ui_dump('root_home')\n        if 'Hide the Magisk app' not in xml:\n            raise RuntimeError('Root manager-hiding button is not displayed in active Magisk UI')\n        self.mark('HIDE_BUTTON')\n        self.tap(xml, 'Hide the Magisk app')\n        dialog = self.ui_dump('hide_dialog')\n        find_node(dialog, 'New name')\n        find_node(dialog, 'OK')\n        self.mark('HIDE_DIALOG')\n        self.tap(dialog, 'OK')\n\n    def wait_stub_restore_ui(self):\n        \"\"\"Do not mistake a blank first Compose frame for a working hidden manager.\n\n        Capture repeated real UI hierarchy snapshots; never synthesize the button.\n        The title only counts if Android actually exposes a tappable node.\n        \"\"\"\n        label = 'Restore the Magisk app'\n        attempts=[]\n        for index in range(1, 7):\n            xml = self.ui_dump(f'stub_probe_{index:02d}')\n            (self.report / 'stub_home.xml').write_text(xml)\n            root = ET.fromstring(xml)\n            labels = sorted(set(t for node in root.iter('node')\n                                for t in (node.get('text', ''),node.get('content-desc', ''))\n                                if t))\n            probe={'index':index, 'total_nodes':len(list(root.iter('node'))),\n                   'visible_labels':labels[:35], 'has_restore_button':False}\n            try:\n                find_node(xml, label)\n                probe['has_restore_button']=True\n                attempts.append(probe)\n                (self.report/'R96_STUB_UI_READINESS.json').write_text(json.dumps(attempts,indent=2)+'\\n')\n                return xml\n            except RuntimeError:\n                attempts.append(probe)\n                (self.report/'R96_STUB_UI_READINESS.json').write_text(json.dumps(attempts,indent=2)+'\\n')\n                if index < 6:\n                    time.sleep(5)\n        # Preserve diagnostics before the unconditional emulator cleanup.\n        self.adb('dumpsys activity activities',output='r96_blank_ui_activities.txt',check=False)\n        self.adb('logcat -d -v threadtime',timeout=95,output='r96_blank_ui_logcat.txt',check=False)\n        self.adb('screencap -p /sdcard/r96_blank_ui.png',check=False)\n        self.cmd(['adb','pull','/sdcard/r96_blank_ui.png',str(self.report/'r96_blank_ui.png')],check=False)\n        raise RuntimeError('R9.6: hidden manager has no Restore UI after six real snapshots; see R96_STUB_UI_READINESS.json and Android diagnostics')\n\n    def hide_verify(self):\n        target = self.wait(self.requester, 'new requester DB binding')\n        self.target = target\n        if 'package:' not in self.adb('pm path ' + shlex.quote(target)):\n            raise RuntimeError('Repackaged manager is not installed: ' + target)\n        self.mark('STUB_INSTALLED')\n        if self.requester() != target:\n            raise
        RuntimeError('Native requester package binding changed unexpectedly')\n        self.mark('REQUESTER_BOUND')\n        self.wait(lambda: self._focus_is(target), 'migrated app foreground')\n        self.focus(target)\n        self.mark('STUB_FOREGROUND')\n        xml = self.wait_stub_restore_ui()\n        find_node(xml, 'Restore the Magisk app')\n        self.mark('STUB_RESTORE_BUTTON')\n        self.tap(xml, 'Restore the Magisk app')\n        dialog = self.ui_dump('restore_dialog')\n        find_node(dialog, 'Restore the hidden manager to its original package?')\n        find_node(dialog, 'OK')\n        self.mark('RESTORE_DIALOG')\n        self.tap(dialog, 'OK')\n\n    def _focus_is(self, package):\n        data = self.adb('dumpsys activity activities')\n        return any(package + '/' in m for m in re.findall(r'topResumedActivity\\s*=\\s*ActivityRecord\\{[^\\n]*', data))\n\n    def restore_verify(self):\n        self.wait(lambda: self.requester() == '', 'cleared Magisk requester binding')\n        self.mark('REQUESTER_CLEARED')\n        self.wait(lambda: self._focus_is(ORIGINAL), 'original Magisk manager foreground')\n        self.focus(ORIGINAL)\n        xml = self.ui_dump('restored_home')\n        if 'Home' not in xml or 'Magisk' not in xml:\n            raise RuntimeError('Restored Magisk home is missing UI labels')\n        self.mark('ORIGINAL_FOREGROUND')\n        self.ensure_su('MAGISK_SU_AFTER_RESTORE')\n        self.restored_by_ui = True\n\n    def cleanup(self):\n        if not self.stages.get('AVD_ONLY'):\n            return\n        # Never confuse manual recovery with a successful feature restore.\n        if self.root_setup_started and self.original_present:\n            try:\n                if self.requester():\n                    self.sqlite_clear_requester()\n                    (self.report / 'manual_rollback.txt').write_text('Native requester DB cleared after incomplete UI restoration.\\n')\n            except Exception as e:\n                (self.report / 'manual_rollback_error.txt').write_text(str(e) + '\\n')\n            if self.target and PACKAGE_RE.fullmatch(self.target):\n                try:\n                    self.cmd(['adb', 'uninstall', self.target], timeout=55, check=False,\n                             output='emulator_stub_cleanup.txt')\n                except Exception as e:\n                    (self.report / 'stub_cleanup_error.txt').write_text(str(e) + '\\n')\n\n    def finish(self):\n        if self.stages.get('AVD_ONLY'):\n            try:\n                self.adb('logcat -d -v threadtime', timeout=90, output='logcat.txt')\n                self.adb('dumpsys activity activities', output='final_activities.txt')\n            except Exception as e:\n                (self.report / 'log_collection_error.txt').write_text(str(e))\n        ok = self.error is None and all(self.stages.get(x) for x in REQUIRED_STAGES)\n        outcome = {\n            'base': 'pinned Magisk 31.1, R6.4 source bridge, R8.1 verified toolchain',\n            'test': 'official Magisk AVD daemon + real Android 13 manager hide and restore',\n            'checks': self.stages, 'missing_checks': [s for s in REQUIRED_STAGES if s not in self.stages],\n            'root_permissions_tested': bool(self.stages.get('MAGISK_SU')),\n            'hide_and_restore_tested': bool(self.restored_by_ui),\n            'physical_device_modified': False, 'target': self.target,\n            'error': self.error,\n            'result': 'ROOT_HIDE_RESTORE_PASS' if ok else 'ROOT_HIDE_RESTORE_FAILED_OR_INCOMPLETE',\n        }\n        (self.report / 'R9_RESULT.json').write_text(json.dumps(outcome, indent=2) + '\\n')\n        print('R9 actual root and hide/restore outcome:', outcome['result'], flush=True)\n        if self.error:\n            print('R9 FAILED STAGE:', self.error, file=sys.stderr, flush=True)\n        return 0 if ok else 1\n\n    def run(self):\n        try:\n            self.root_setup()\n            self.enable_gui()\n            self.hide_verify()\n            self.restore_verify()\n        except Exception as e:\n            self.error = str(e)\n        finally:\n            self.cleanup()\n            return self.finish()\n\n\nif __name__ == '__main__':\n    if len(sys.argv) == 2 and sys.argv[1] == '--selftest':\n        test_pure()\n    elif len(sys.argv) == 1:\n        if not os.environ.get('GITHUB_WORKSPACE'):\n            sys.exit('R9 only supports the isolated GitHub Actions emulator runner')\n        sys.exit(R9().run())\n    else:\n        sys.exit('Usage: r9_root_emulator.py [--selftest]')\nPY_R9_SCRIPT\npython3 -m py_compile r9_root_emulator.py\npython3 r9_root_emulator.py --selftest | tee reports/r9_emulator/preflight.txt\necho 'R9 root test harness is ready; actual Magisk service has not yet been started.'\n"
    - name: R9.7 - Preserve post-confirm diagnostics before recovery
      shell: bash
      run: "set -euo pipefail\ntest -f r9_root_emulator.py\ntest -f reports/R97_RESTORE_PATCH_STATUS.json\ncat > r97_harness_payload.py <<'PY_R97_PAYLOAD'\n#!/usr/bin/env python3\n\"\"\"R9: strict API-33 AVD-only Magisk daemon + manager hide/restore smoke.\n\nResearch-only. Never run on a physical device. All changes take place on a\nthrowaway emulator using a freshly built research APK and temporary CI key.\n\"\"\"\nimport json\nimport os\nimport re\nimport shlex\nimport subprocess\nimport sys\nimport time\nimport xml.etree.ElementTree as ET\nfrom pathlib import Path\n\nORIGINAL = 'com.topjohnwu.magisk'\nACTIVITY = ORIGINAL + '/.ui.MainActivity'\nEXPECTED = {'ro.kernel.qemu': '1', 'ro.build.version.sdk': '33', 'ro.product.cpu.abi': 'x86_64'}\nPACKAGE_RE = re.compile(r'[a-z][a-z0-9_]*(?:\\.[a-z][a-z0-9_]*)+')\nREQUIRED_STAGES = ('AVD_ONLY', 'ADB_ROOT', 'MAGISK_DAEMON_31100', 'MAGISK_SU',\n                   'ANDROID_FRAMEWORK_RESTORED',\n                   'HIDE_BUTTON', 'HIDE_DIALOG', 'STUB_INSTALLED', 'REQUESTER_BOUND',\n                   'STUB_FOREGROUND', 'STUB_RESTORE_BUTTON', 'RESTORE_DIALOG',\n                   'REQUESTER_CLEARED', 'ORIGINAL_FOREGROUND', 'MAGISK_SU_AFTER_RESTORE')\n\n\ndef extract_requester(output):\n    lines = [line.strip() for line in output.splitlines() if line.startswith('value=')]\n    if not lines:\n        return ''\n    if len(lines) != 1:\n        raise RuntimeError('Unexpected multiple requester DB values')\n    value = lines[0][6:]\n    if value and (not PACKAGE_RE.fullmatch(value) or value == ORIGINAL):\n        raise RuntimeError('Malformed requester DB value')\n    return value\n\n\ndef find_node(xml_text, label):\n    root = ET.fromstring(xml_text)\n    for node in root.iter('node'):\n        if label not in (node.get('text', ''), node.get('content-desc', '')):\n            continue\n        match = re.fullmatch(r'\\[(\\d+),(\\d+)\\]\\[(\\d+),(\\d+)\\]', node.get('bounds', ''))\n        if not match:\n            continue\n        x0, y0, x1, y1 = map(int, match.groups())\n        if x1 > x0 and y1 > y0:\n            return ((x0 + x1) // 2, (y0 + y1) // 2)\n    raise RuntimeError('UI element not found: ' + label)\n\n\ndef test_pure():\n    x = '<hierarchy><node text=\"Hide the Magisk app\" bounds=\"[12,20][52,80]\" /></hierarchy>'\n    assert find_node(x, 'Hide the Magisk app') == (32, 50)\n    for bad in ('random', 'com.topjohnwu.magisk', 'foo.bar;rm', 'UPPER.pkg'):\n        try:\n            extract_requester('value=' + bad)\n        except RuntimeError:\n            pass\n        else:\n            raise AssertionError('Invalid requester accepted: ' + bad)\n    assert extract_requester('') == ''\n    assert extract_requester('value=abc.def\\n') == 'abc.def'\n    assert len(REQUIRED_STAGES) == len(set(REQUIRED_STAGES))\n    print('R9_SELFTEST_PASS: XML bounds, DB validation, unique strict gates')\n\n\nclass R9:\n    def __init__(self):\n        self.workspace = Path(os.environ['GITHUB_WORKSPACE']).resolve()\n        self.report = self.workspace / 'reports' / 'r9_emulator'\n        self.report.mkdir(parents=True, exist_ok=True)\n        self.apk = self.workspace / 'magisk' / 'out' / 'app-release.apk'\n        self.stages = {}\n        self.target = None\n        self.original_present = False\n        self.error = None\n        self.root_setup_started = False\n        self.restored_by_ui = False\n        self.original_visible_while_hidden = None\n\n    def cmd(self, argv, *, timeout=45, check=True, output=None, cwd=None):\n        try:\n            p = subprocess.run(argv, cwd=cwd, text=True, errors='replace',\n                               stdout=subprocess.PIPE, stderr=subprocess.STDOUT,\n                               timeout=timeout)\n            if output:\n                (self.report / output).write_text(p.stdout)\n            if check and p.returncode:\n                raise RuntimeError(f'Command failed ({p.returncode}): {argv[:3]}: {p.stdout[-700:]}')\n            return p.stdout.strip()\n        except subprocess.TimeoutExpired as e:\n            raise RuntimeError('Timed out: ' + str(argv[:3])) from e\n\n    def adb(self, remote, *, timeout=45, check=True, output=None):\n        return self.cmd(['adb', 'shell', remote], timeout=timeout, check=check, output=output)\n\n    def mark(self, stage):\n        self.stages[stage] = True\n        print('R9_PASS:', stage, flush=True)\n\n    def identity(self):\n        devices = [line.split()[0] for line in self.cmd(['adb', 'devices']).splitlines()[1:]\n                   if line.strip() and line.split()[-1] == 'device']\n        if len(devices) != 1 or not devices[0].startswith('emulator-'):\n            raise RuntimeError('Strict R9 gate: exactly one AVD emulator required')\n        info = {key: self.adb('getprop ' + key).strip() for key in EXPECTED}\n        info['adb_serial'] = devices[0]\n        (self.report / 'device.json').write_text(json.dumps(info, indent=2) + '\\n')\n        if any(info.get(key) != expected for key, expected in EXPECTED.items()):\n            raise RuntimeError('Strict R9 gate: wrong device: ' + str(info))\n        self.mark('AVD_ONLY')\n\n    def requester(self):\n        sql = 'SELECT value FROM settings WHERE key=\"requester\" LIMIT 1'\n        remote = '/data/adb/magisk/magisk --sqlite ' + shlex.quote(sql)\n        return extract_requester(self.adb(remote))\n\n    def sqlite_clear_requester(self):\n        sql = 'DELETE FROM settings WHERE key=\"requester\"'\n        return self.adb('/data/adb/magisk/magisk --sqlite ' + shlex.quote(sql), check=False)\n\n    def ui_dump(self, label):\n        dest = self.report / (label + '.xml')\n        remote = '/sdcard/r9_' + label + '.xml'\n        for attempt in range(1, 4):\n            try:\n                self.adb('uiautomator dump ' + shlex.quote(remote), timeout=55)\n                self.cmd(['adb', 'pull', remote, str(dest)], timeout=25)\n                root = ET.parse(dest).getroot()\n                assert root.tag