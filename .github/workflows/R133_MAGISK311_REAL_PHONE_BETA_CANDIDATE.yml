      run: "set -euo pipefail\nsource_commit='0972f67d97f9b6302b67c5171283330c74114b4a'\nlegacy_commit='ea16c8141eb64dc28b56a0e7fb536689ef465429'\npath='app/core/src/main/java/com/topjohnwu/magisk/core/Hacks.kt'\noriginal_blob='3cae9af7858dca211f5abad6ae0f0f58aa13566e'\nlegacy_blob='7bcf46aa4c287105d32baaedd5d69d8af3b1bc83'\ntest \"$(git -C magisk rev-parse HEAD)\" = \"$source_commit\"\ntest \"$(git -C magisk hash-object \"$path\")\" = \"$original_blob\"\ntest \"$(git -C magisk rev-parse \"$legacy_commit:$path\")\" = \"$legacy_blob\"\n# Restore exactly the upstream code predating Manager-Hide removal.\n# On Android 13 this adds the dynamically loaded full APK resources\n# before ContentProvider initialization, and maps stub components.\ngit -C magisk show \"$legacy_commit:$path\" > \"magisk/$path\"\ntest \"$(git -C magisk hash-object \"$path\")\" = \"$legacy_blob\"\npython3 - <<'R95_RESOURCE_CONTRACT'\nfrom pathlib import Path\nimport json\npath = Path('magisk/app/core/src/main/java/com/topjohnwu/magisk/core/Hacks.kt')\ns = path.read_text()\nassert 'import com.topjohnwu.magisk.StubApk' in s\nassert 'fun Resources.addAssetPath(path: String) = StubApk.addAssetPath(this, path)' in s\nassert 'if (isRunningAsStub)\\n        addAssetPath(AppApkPath)' in s\nassert 'Info.stub?.classToComponent?.get(name) ?: name' in s\nctx = Path('magisk/app/core/src/main/java/com/topjohnwu/magisk/core/AppContext.kt').read_text()\nassert 'StubApk.current(base).path' in ctx\nstub = Path('magisk/app/shared/src/main/java/com/topjohnwu/magisk/StubApk.java').read_text()\nassert 'res.addLoaders(getResourcesLoader(new File(path)))' in stub\nassert 'ResourcesProvider.loadFromApk(fd)' in stub\nPath('reports/R95_HISTORICAL_STUB_RESOURCES.json').write_text(json.dumps({\n    'result':'PINNED_LEGACY_STUB_RESOURCE_BRIDGE_RESTORED',\n    'upstream_commit':'ea16c8141eb64dc28b56a0e7fb536689ef465429',\n    'old_worktree_blob':'3cae9af7858dca211f5abad6ae0f0f58aa13566e',\n    'restored_blob':'7bcf46aa4c287105d