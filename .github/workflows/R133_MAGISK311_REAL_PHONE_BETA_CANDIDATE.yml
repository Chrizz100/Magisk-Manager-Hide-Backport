ager same APK Root+Module+Hide+Restore\',\'scope\':\'Android-13 rooted QEMU only\',\n                \'package\':ORIGINAL,\'uid\':uid,\'actions\':{},\'alpha_31100_tested\':False,\n                \'boot_partition_written\':False,\'physical_device_modified\':False}\n        def save():\n            (self.report/\'R115_INTEGRATED_BETA_UI.json\').write_text(json.dumps(report,indent=2)+\'\\n\')\n        def nodes(stage,index):\n            xml=self.ui_dump(f\'r115_{stage}_{index}\')\n            return xml,ET.fromstring(xml)\n        def next_action(root, label, attempt):\n            """Choose only an actually visible tap; otherwise scroll in the needed direction.\n\n            The R11.5 evidence showed the MODULES label at y=92..147, ABOVE\n            Android\'s fixed top bar. A blind upward swipe moved it farther off-screen.\n            """\n            for node in root.iter(\'node\'):\n                if node.get(\'text\',\'\') != label and node.get(\'content-desc\',\'\') != label:\n                    continue\n                m = re.fullmatch(r\'\\[(\\d+),(\\d+)\\]\\[(\\d+),(\\d+)\\]\', node.get(\'bounds\',\'\'))\n                if not m:\n                    continue\n                x0,y0,x1,y1 = map(int, m.groups())\n                if x0 >= x1 or y0 >= y1:\n                    continue\n                if y0 >= 260 and y1 <= 2080:\n                    return \'tap\',((x0+x1)//2,(y0+y1)//2)\n                if y1 <= 260:\n                    return \'down\',None  # finger DOWN = content DOWN; uncover control above\n                if y0 >= 2080:\n                    return \'up\',None   # finger UP = content UP; uncover control below\n            # Compose may omit items beyond the viewport. Start by searching towards\n            # the top, then scan down. Do not assume every missing item is below us.\n            return (\'down\' if attempt < 6 else \'up\'),None\n\n        def click(label,stage):\n            for k in range(20):\n                _,tree=no