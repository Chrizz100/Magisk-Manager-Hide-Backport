    - name: R12.1 - Attach verified hidden-app Root, in-app module ZIP and boot patch E2E (AVD only)
      shell: bash
      run: "set -euo pipefail\ncat > r121_extend_harness.py <<'PY_R121_EXTENSION'\n#!/usr/bin/env python3\n\"\"\"R12.1: Extend pinned, fully assembled R12.0 AVD harness in a fail-closed fashion.\n\nNever run on a real device. It does not change any Magisk product source file.\nAll additional writes happen to a disposable GitHub Android 13 emulator.\n\"\"\"\nfrom pathlib import Path\nimport ast\nimport hashlib\nimport json\nimport sys\n\nPATH = Path('r9_root_emulator.py')\n\nMETHODS = r'''    def r121_preflight(self):\n        needed = ('AVD_ONLY', 'ADB_ROOT', 'MAGISK_DAEMON_31100', 'MAGISK_SU',\n                  'ANDROID_FRAMEWORK_RESTORED', 'R115_BETA_ROOT_UI', 'R115_BETA_MODULE_UI')\n        if not all(self.stages.get(k) for k in needed):\n            raise RuntimeError('R121: old R12.0 gates must pass BEFORE extra tests')\n        checks = {k: self.adb('getprop '+k) for k in EXPECTED}\n        if checks != EXPECTED:\n            raise RuntimeError('R121: testing outside exact Android-13 x86_64 QEMU is prohibited')\n        # This is an app test; no app on a physical device may ever be targeted.\n        if not self.cmd(['adb','get-serialno']).strip().startswith('emulator-'):\n            raise RuntimeError('R121: not a disposable AVD')\n\n    def r121_click(self, label, tag, *, screen='app', tries=22):\n        \"\"\"Tap a visible, exact UI label, never coordinates derived from old screenshots.\"\"\"\n        for attempt in range(tries):\n            xml=self.ui_dump('r121_'+tag+'_'+str(attempt))\n            if screen=='app':\n                low,high=260,2080\n            else:\n                low,high=65,2220\n            try:\n                root=ET.fromstring(xml)\n            except ET.ParseError:\n                raise RuntimeError('R121: malformed Android accessibility tree in '+tag)\n            for node in root.iter('node'):\n                if node.get('text','') != label and node.get('content-desc','') != label:\n                    continue\n                m=re.fullmatch(r'\\[(\\d+),(\\d+)\\]\\[(\\d+),(\\d+)\\]',node.get('bounds',''))\n                if m is None:\n                    continue\n                x0,y0,x1,y1=map(int,m.groups())\n                if x0>=x1 or y0>=y1 or y0<low or y1>high:\n                    continue\n                self.adb(f'input tap {(x0+x1)//2} {(y0+y1)//2}')\n                time.sleep(1.0)\n                return\n            if attempt < 4:\n                self.adb('input swipe 525 720 525 1590 450')\n            else:\n                self.adb('input swipe 525 1670 525 760 440')\n            time.sleep(.55)\n        raise RuntimeError('R121: exact visible UI control not found: '+label+' at '+tag)\n\n    def r121_wait_label(self, needle, tag, timeout=80):\n        deadline=time.monotonic()+timeout\n        count=0\n        while time.monotonic()<deadline:\n            xml=self.ui_dump('r121_'+tag+'_'+str(count))\n            count+=1\n            if needle in xml:\n                return xml\n            # Scroll bottom on app outputs; do not fake a success if missing.\n            if count%3==0:\n                self.adb('input swipe 525 1600 525 760 380')\n            time.sleep(1)\n        raise RuntimeError('R121: UI did not render '+needle+' in '+tag)\n\n    def r121_picker(self, filename, tag):\n        \"\"\"Drive a genuine ACTION_GET_CONTENT system picker and choose exact fixture.\"\"\"\n        visited=set()\n        for attempt in range(28):\n            xml=self.ui_dump('r121_'+tag+'_'+str(attempt))\n            root=ET.fromstring(xml)\n            texts={n.get('text','') for n in root.iter('node')}\n            if filename in texts:\n                self.r121_click(filename,tag+'_file',screen='picker',tries=1)\n                return\n            # Android DocumentsUI can start in Recents or a system file-app chooser.\n            navigations=('Browse...', 'Browse', 'Files', 'Downloads',\n                         'Download', 'Show roots', 'Browse files in other apps')\n            for label in navigations:\n                if label in texts and label not in visited:\n                    visited.add(label)\n                    self.r121_click(label,tag+'_nav_'+str(attempt),screen='picker',tries=1)\n                    break\n            else:\n                if attempt < 6:\n                    self.adb('input swipe 510 700 510 1610 400')\n                else:\n                    self.adb('input swipe 510 1640 510 720 400')\n            time.sleep(.7)\n        raise RuntimeError('R121: original Android file-picker could not select '+filename)\n\n    def r121_zip_module_from_real_ui(self):\n        \"\"\"Use the app's own picker, SHA-checked ZIP, confirmation and installer.\"\"\"\n        self.r121_preflight()\n        import zipfile\n        mod='r121_zip_via_manager'\n        filename=mod+'.zip'\n        staged='/data/adb/modules_update/'+mod+'/module.prop'\n        # Precondition: a pre-existing fixture cannot count as proof.\n        if self.adb('test -e '+staged+' && echo PRESENT || true')=='PRESENT':\n            raise RuntimeError('R121: ZIP fixture already staged before UI test')\n        fixture=self.report/filename\n        descriptor=('id='+mod+'\\nname=R121 UI Installer Fixture\\nversion=1\\n'\n                    'versionCode=1\\nauthor=R121-AVD-only\\n'\n                    'description=Only a harmless CI test; no service scripts\\n')\n        with zipfile.ZipFile(fixture,'w',zipfile.ZIP_DEFLATED) as z:\n            z.writestr('module.prop',descriptor)\n        self.cmd(['adb','push',str(fixture),'/sdcard/Download/'+filename],timeout=40)\n        # Best-effort media indexing. The real picker must still expose and select it.\n        self.adb('am broadcast -a android.intent.action.MEDIA_SCANNER_SCAN_FILE -d '\n                 'file:///sdcard/Download/'+filename,check=False)\n        self.r121_click('Test-Modul-ZIP auswählen','zip_ui_start')\n        self.r121_picker(filename,'zip_picker')\n        self.r121_wait_label('Modul-ZIP installieren','zip_after_pick')\n        self.r121_click('Modul-ZIP installieren …','zip_confirm_open')\n        self.r121_wait_label('Ausgewählte Modul-ZIP mit Magisk installieren?','zip_confirm_dialog')\n        self.r121_click('Ausführen','zip_confirm_execute',screen='picker')\n        # Real staging by the app, not by our test harness or Magisk CLI.\n        def installed():\n            data=self.adb('test -f '+staged+' && cat '+staged+' || true',check=False)\n            return 'id='+mod in data\n        self.wait(installed,'R121 module staged by in-app file picker and confirmation',seconds=95)\n        self.mark('R121_MODULE_ZIP_FROM_APP_UI')\n        (self.report/'R121_MODULE_ZIP.json').write_text(json.dumps({\n            'source':'APK ActivityResult GetContent, real system picker, confirmation, app-owned installation',\n            'module_id':mod,'staged_by_test_harness':False,'ui_pass':True,\n            'fixture_sha256':__import__('hashlib').sha256(fixture.read_bytes()).hexdigest()\n        },indent=2)+'\\n')\n        # Isolated AVD fixture only. Do not leave it for later tests.\n        self.adb('rm -rf /data/adb/modules_update/'+mod)\n        self.adb('am force-stop '+ORIGINAL)\n        self.adb('am start -W -n '+ACTIVITY,timeout=60)\n\n    def r121_make_stock_boot(self):\n        \"\"\"Build a throwaway Android v0 boot.img from genuine emulator image pieces.\"\"\"\n        import hashlib,struct\n        sdk=Path(os.getenv('ANDROID_HOME') or os.getenv('ANDROID_SDK_ROOT') or '/usr/local/lib/android/sdk')\n        imgroot=sdk/'system-images/android-33/google_apis/x86_64'\n        if not imgroot.is_dir():\n            raise RuntimeError('R121: Android SDK 33 emulator system image is absent')\n        kernel=next((p for n in ('kernel-ranchu-64','kernel-ranchu','kernel-qemu')\n                     if (p:=imgroot/n).is_file()),None)\n        ramdisk=imgroot/'ramdisk.img'\n        if kernel is None or not ramdisk.is_file():\n            raise RuntimeError('R121: authentic emulator kernel or ramdisk missing')\n        k=kernel.read_bytes()\n        r=ramdisk.read_bytes()\n        if not (len(k)>100_000 and len(r)>100_000):\n\
        \            raise RuntimeError('R121: emulator boot pieces too small')\n        page=2048\n        # Android boot image v0: header followed by page-aligned kernel + ramdisk.\n        header=__import__('struct').pack('<8s10I16s512s32s1024s',\n            b'ANDROID!',len(k),0x10008000,len(r),0x11000000,\n            0,0,0x10000100,page,0,0,b'r121_avd_ci',b'console=ttyS0',b'',b'')\n        def padded(data):return data+b'\\0'*((-len(data))%page)\n        stock=self.report/'r121_stock_boot.img'\n        stock.write_bytes(padded(header)+padded(k)+padded(r))\n        (self.report/'R121_BOOT_FIXTURE.json').write_text(json.dumps({\n            'origin':'SDK Android 33 Google APIs x86_64 emulator kernel and ramdisk',\n            'header':'Android boot image v0','source_emulator_only':True,\n            'sha256':hashlib.sha256(stock.read_bytes()).hexdigest(),\n            'bytes':stock.stat().st_size\n        },indent=2)+'\\n')\n        return stock\n\n    def r121_boot_patch_from_real_ui(self):\n        \"\"\"Select and patch a disposable boot image through the real Magisk app; NEVER FLASH.\"\"\"\n        self.r121_preflight()\n        stock=self.r121_make_stock_boot()\n        self.cmd(['adb','push',str(stock),'/sdcard/Download/r121_stock_boot.img'])\n        self.adb('am broadcast -a android.intent.action.MEDIA_SCANNER_SCAN_FILE -d '\n                 'file:///sdcard/Download/r121_stock_boot.img',check=False)\n        # Reject malformed synthetic fixtures BEFORE blaming the app or touching its UI.\n        stock_parse=self.adb('mkdir -p /data/local/tmp/r121_stock_check && '\n                 'cd /data/local/tmp/r121_stock_check && '\n                 '(/data/adb/magisk/magiskboot unpack /sdcard/Download/r121_stock_boot.img '\n                 '&& echo R121_STOCK_UNPACK_OK) || echo R121_STOCK_UNPACK_FAIL',\n                 check=False,timeout=75,output='r121_stock_parse.txt')\n        if 'R121_STOCK_UNPACK_OK' not in stock_parse:\n            raise RuntimeError('R121: invalid emulator boot-image test fixture, app test not attempted')\n        self.adb('rm -rf /data/local/tmp/r121_stock_check')\n        self.adb('am force-stop '+ORIGINAL)\n        self.adb('am start -W -n '+ACTIVITY,timeout=60)\n        self.r121_click('Reinstall','boot_reinstall_home')\n        # Official v31.1 InstallDialog -> Patch Image: not a custom test shortcut.\n        self.r121_click('Patch firmware / image','boot_patch_method')\n        # PatchDialog uses ACTION_GET_CONTENT and then confirmation.\n        self.r121_wait_label('Select from storage','boot_patch_dialog',timeout=40)\n        self.r121_click('Select from storage','boot_patch_choose_file')\n        self.r121_picker('r121_stock_boot.img','boot_picker')\n        # Depending on the Compose dialog's async URI flow, an explicit OK may be shown.\n        for attempt in range(8):\n            xml=self.ui_dump('r121_boot_confirm_'+str(attempt))\n            if 'OK' in xml:\n                self.r121_click('OK','boot_patch_go',screen='picker',tries=1)\n                break\n            if 'Flashing' in xml or 'Installing' in xml or 'Image' in xml:\n                break\n            time.sleep(1)\n        # Verify genuine output created by the application, not a CLI copy.\n        if self.adb('ls /sdcard/Download/magisk_patched*.img 2>/dev/null || true',check=False).strip():\n            raise RuntimeError('R121: patched image existed BEFORE the app patch test')\n        def patched_file():\n            listing=self.adb('ls -1 /sdcard/Download/magisk_patched*.img 2>/dev/null || true',check=False)\n            return [x.strip() for x in listing.splitlines() if x.strip().endswith('.img')]\n        self.r121_wait_label('Done!','boot_app_success',timeout=150)\n        outputs=self.wait(patched_file,'APK generated patched boot image in Downloads',seconds=30)\n        if len(outputs)!=1:\n            raise RuntimeError('R121: boot patch output ambiguous, count '+str(len(outputs)))\n        remote=outputs[0]\n        self.cmd(['adb','pull',remote,str(self.report/'r121_patched_boot.img')],timeout=95)\n        patched=(self.report/'r121_patched_boot.img')\n        if patched.stat().st_size < 150_000 or patched.read_bytes()==stock.read_bytes():\n            raise RuntimeError('R121: invalid or unmodified patched boot image')\n        # The native boot parser must recognize the app's resulting output.\n        import hashlib\n        validate=self.adb('cd /data/local/tmp && mkdir -p r121_boot_check && cd r121_boot_check && '\n               '(/data/adb/magisk/magiskboot unpack '+shlex.quote(remote)+\n               ' && echo R121_UNPACK_OK) || echo R121_UNPACK_FAIL',timeout=75,\n               check=False,output='r121_magiskboot_unpack.txt')\n        if not patched.read_bytes().startswith(b'ANDROID!') or 'R121_UNPACK_OK' not in validate:\n            raise RuntimeError('R121: Magisk app output not recognized as boot.img')\n        self.mark('R121_BOOT_FILE_PATCH_FROM_APP_UI')\n        (self.report/'R121_BOOT_PATCH.json').write_text(json.dumps({\n            'tested':'Original Magisk v31.1 app Patch Image method + system picker; file only',\n            'input_sha256':hashlib.sha256(stock.read_bytes()).hexdigest(),\n            'patched_sha256':hashlib.sha256(patched.read_bytes()).hexdigest(),\n            'output_path':remote,'boot_partition_write':False,'avd_only':True,\n            'app_output_verified':True\n        },indent=2)+'\\n')\n        self.adb('rm -rf /data/local/tmp/r121_boot_check')\n        self.adb('am force-stop '+ORIGINAL)\n        self.adb('am start -W -n '+ACTIVITY,timeout=60)\n\n    def r121_hidden_manager_root(self):\n        \"\"\"The hidden *app itself* must obtain uid=0; adb root never counts.\"\"\"\n        self.r121_preflight()\n        if not self.target or self.requester()!=self.target:\n            raise RuntimeError('R121: hidden manager requester no longer bound')\n        if 'package:' in self.adb('pm path '+ORIGINAL,check=False):\n            raise RuntimeError('R121: hidden phase still exposes original manager')\n        if 'package:' not in self.adb('pm path '+shlex.quote(self.target),check=False):\n            raise RuntimeError('R121: dynamic stub not installed')\n        if not self._focus_is(self.target):\n            raise RuntimeError('R121: hidden manager not in foreground')\n        # Exercise the actual Compose beta card while it is hosted by the dynamic stub.\n        self.r121_click('Magisk und Root abfragen','hidden_root_button')\n        xml=self.r121_wait_label('UID=0','hidden_root_result',timeout=85)\n        if 'MAGISK=' not in xml or 'CODE=31100' not in xml:\n            raise RuntimeError('R121: hidden UI response lacks actual Magisk 31.1 runtime')\n        self.mark('R121_HIDDEN_APP_ROOT_UID0')\n        (self.report/'R121_HIDDEN_ROOT.json').write_text(json.dumps({\n            'hidden_package':self.target,'old_package_absent':True,\n            'root_proven_by_app_ui':True,'adb_root_is_not_sufficient':True,\n            'real_device_tested':False\n        },indent=2)+'\\n')\n        # Reset to the top; the old Hide/Restore script will now use the real stub UI.\n        self.adb('input swipe 525 720 525 1760 440')\n        time.sleep(1)\n\n'''\n\n\ndef patch(source):\n    marker='    def run(self):\\n'\n    assert source.count(marker)==1, 'R121: original run method no longer unique'\n    # Old, green R12.0 code and source remain byte-identical: only add testing.\n    names=('r121_preflight','r121_zip_module_from_real_ui',\n           'r121_boot_patch_from_real_ui','r121_hidden_manager_root')\n    assert all('    def '+n+'(' not in source for n in names)\n    assert \"            self.r115_integrated_beta_ui()\\n            self.enable_gui()\" in source\n    assert \"        self.mark('R114_CONCEALMENT_APP_CONFIRMED')\\n        xml = self.wait_stub_restore_ui()\" in source\n    source=source.replace(marker,METHODS+marker,1)\n    # IMPORTANT: run all three fresh checks on the SAME previously proven Magisk 31.1 service.\n    source=source.replace(\"            self.r115_integrated_beta_ui()\\n            self.enable_gui()\",\n       \"            self.r115_integrated_beta_ui()\\\
        n\"\n       \"            self.r121_zip_module_from_real_ui()\\n\"\n       \"            self.r121_boot_patch_from_real_ui()\\n\"\n       \"            self.enable_gui()\",1)\n    source=source.replace(\"        self.mark('R114_CONCEALMENT_APP_CONFIRMED')\\n        xml = self.wait_stub_restore_ui()\",\n       \"        self.mark('R114_CONCEALMENT_APP_CONFIRMED')\\n\"\n       \"        self.r121_hidden_manager_root()\\n\"\n       \"        xml = self.wait_stub_restore_ui()\",1)\n    ast.parse(source)\n    for name in names:\n        assert source.count('    def '+name+'(')==1\n    assert source.count('self.r121_hidden_manager_root()')==1\n    assert source.count('self.r121_zip_module_from_real_ui()')==1\n    assert source.count('self.r121_boot_patch_from_real_ui()')==1\n    # Absolute phone-safety restriction: no device flash command permitted in extension.\n    assert 'fastboot flash' not in METHODS and 'dd if=' not in METHODS\n    return source\n\n\ndef main():\n    if not PATH.exists():raise SystemExit('R121: baseline root GUI harness absent')\n    old=PATH.read_text()\n    updated=patch(old)\n    PATH.write_text(updated)\n    report={'revision':'R12.1','source_reference':'official Magisk v31.1 (R12.0), no product source changes',\n            'original_harness_sha256':hashlib.sha256(old.encode()).hexdigest(),\n            'extended_harness_sha256':hashlib.sha256(updated.encode()).hexdigest(),\n            'source_unchanged':True,'target_only':'Android 13 x86_64 QEMU',\n            'added_actual_UI_checks':['module ZIP picker and confirmation','boot.img patch-file picker',\n                                      'root from dynamically hidden manager'],\n            'phone_beta_authorized':False}\n    p=Path('reports/R121_HARNESS_EXTENSION.json');p.parent.mkdir(exist_ok=True,parents=True)\n    p.write_text(json.dumps(report,indent=2)+'\\n')\n    print('R12.1 strict real-UI emulator checks attached; original source unchanged')\n\nif __name__=='__main__':main()\nPY_R121_EXTENSION\npython3 r121_extend_harness.py\npython3 -m py_compile r9_root_emulator.py r121_extend_harness.py\npython3 r9_root_emulator.py --selftest\n"
    - name: R8 GUI + R9 hide/restore - Android 13 x86_64 emulator
      id: r92_emulator
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
      with:
        api-level: 33
        target: google_apis
        arch: x86_64
        profile: pixel_5
        cores: 2
        ram-size: 3072M
        emulator-boot-timeout: 900
        emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -camera-back none
        script: bash r8_emulator_gui.sh && python3 r9_root_emulator.py
    - name: R8 - Verify actual UI outcome and untested root scope
      if: ${{ steps.r92_emulator.outcome == 'success' }}
      shell: bash
      run: "set -euo pipefail\nmkdir -p reports/r8_emulator\nif [ ! -f reports/r8_emulator/R8_RESULT.json ]; then\n  printf '%s\\n' 'EMULATOR_NOT_COMPLETED: no R8 GUI result file' > reports/r8_emulator/EMULATOR_NOT_COMPLETED.txt\nfi\npython3 - <<'R8_STATUS'\nfrom pathlib import Path\nimport json\np=Path('reports/r8_emulator/R8_RESULT.json')\nif p.is_file():\n    o=json.loads(p.read_text())\n    assert o['hide_and_restore_tested'] is False\n    assert o['root_permissions_tested'] is False\n    assert o['physical_device_modified'] is False\n    assert o['result']=='GUI_PASS', 'R8 real GUI navigation did not pass'\n    print('R8 actual GUI outcome:',o['result'])\nelse:\n    raise SystemExit('R8 emulator has not produced a real GUI result; see logs')\nR8_STATUS\n"
    - name: R9 - Verify real Root + Hide + Restore (never infer from R8 success)
      if: ${{ steps.r92_emulator.outcome == 'success' }}
      shell: bash
      run: "set -euo pipefail\nmkdir -p reports/r9_emulator\nif [ ! -f reports/r9_emulator/R9_RESULT.json ]; then\n  echo 'R9_NOT_EXECUTED: root or emulator setup never finished' > reports/r9_emulator/R9_NOT_EXECUTED.txt\nfi\npython3 - <<'PY_R9_RESULT'\nimport json\nfrom pathlib import Path\np=Path('reports/r9_emulator/R9_RESULT.json')\nif not p.is_file():\n    raise SystemExit('R9 root/hide/restore test was not executed')\nresult=json.loads(p.read_text())\nassert result['physical_device_modified'] is False\nassert result['root_permissions_tested'] is True\nassert result['hide_and_restore_tested'] is True\nassert result['result']=='ROOT_HIDE_RESTORE_PASS', result.get('error') or result.get('missing_checks')\nprint('R9 confirmed full manager hide+restore with real Magisk service')\nPY_R9_RESULT\n"
    - name: R11 - BLOCK phone-beta unless original package is truly invisible during Hide
      run: "set -euo pipefail\npython3 - <<'PY_R11_STRICT'\nimport json\nfrom pathlib import Path\np=Path('reports/r9_emulator/R9_RESULT.json')\nif not p.is_file(): raise SystemExit('R11: actual root E2E outcome missing')\nr=json.loads(p.read_text())\nrequired=('AVD_ONLY','MAGISK_DAEMON_31100','MAGISK_SU',\n          'R11_MODULE_UI_VISIBLE','R11_MODULE_GUI_DISABLED','R11_MODULE_GUI_ENABLED',\n          'R11_MODULE_CLI_INSTALL_STAGED','R114_CONCEALMENT_APP_CONFIRMED',\n  'R114_ORIGINAL_REINSTALLED','REQUESTER_BOUND','REQUESTER_CLEARED',\n          'ORIGINAL_FOREGROUND','MAGISK_SU_AFTER_RESTORE')\nmissing=[x for x in required if not r.get('checks',{}).get(x)]\nreport={'source_run':'R11 rooted emulator','result':r.get('result'),\n        'missing':missing,'original_visible_while_hidden':r.get('original_visible_while_hidden'),\n        'package_concealment_proven':r.get('actual_package_concealment_proven') is True,\n        'restore_verified':r.get('checks',{}).get('REQUESTER_CLEARED') is True,\n        'phone_root_alpha_verified':False,'boot_partition_flashing_permitted':False}\nPath('reports/R11_E2E_CONCEALMENT_GATE.json').write_text(json.dumps(report,indent=2)+'\\n')\nif missing: raise SystemExit('R11 HOLD: required functional checks missing: '+repr(missing))\nif report['result']!='ROOT_HIDE_RESTORE_PASS': raise SystemExit('R11 HOLD: original Root Hide/Restore failed')\nif report['original_visible_while_hidden'] is not False: \n    raise SystemExit('R11 HOLD: ORIGINAL MAGISK PACKAGE VISIBLE AFTER HIDE. This is NOT an actual concealment beta.')\nprint('R11 E2E concealment+restore+module gate PASS on Android-13 QEMU')\nPY_R11_STRICT\n"
    - name: R11.5 - Strict integrated beta function matrix, no device APK release
      run: "set -euo pipefail\npython3 - <<'PY_R115_MATRIX'\nimport json\nfrom pathlib import Path\nreport=Path('reports/r9_emulator/R115_INTEGRATED_BETA_UI.json')\nassert report.exists(),'R115 combined UI report absent'\na=json.loads(report.read_text())\nrequired={'ROOT_FROM_INTEGRATED_UI','MODULE_LIST_FROM_INTEGRATED_UI',\n          'SUPERUSER_LIST_FROM_INTEGRATED_UI','MODULE_DISABLE_FROM_INTEGRATED_UI',\n          'MODULE_ENABLE_FROM_INTEGRATED_UI','MODULE_REMOVE_MARKED_BY_INTEGRATED_UI'}\nmissing=[x for x in required if a.get('actions',{}).get(x)!='PASS']\nif missing:raise SystemExit('R115 combined beta controls not yet proven: '+str(missing))\nr9=json.loads(Path('reports/r9_emulator/R9_RESULT.json').read_text())\nassert r9['result']=='ROOT_HIDE_RESTORE_PASS' and r9['actual_package_concealment_proven'] is True\nassert r9['hide_and_restore_tested'] is True\nmatrix={'revision':'R11.5','result':'INTEGRATED_AVD_CORE_PASS',\n        'app_package':'com.topjohnwu.magisk','all_core_actions_same_apk':True,\n        'root_and_modules':{k:a['actions'][k] for k in sorted(required)},\n        'hide_restore':'PASS','original_pkg_concealment':'PASS',\n        'module_zip_install_from_same_app':'NOT_TESTED',\n        'boot_image_file_patching':'NOT_TESTED',\n        'direct_boot_flash':'BLOCKED',\n        'magisk_alpha_31100_device_compatibility':'NOT_TESTED',\n        'separately_signed_phone_beta':'NOT_BUILT',\n        'phone_release_allowed':False}\nPath('reports/R115_FUNCTION_MATRIX.json').write_text(json.dumps(matrix,indent=2)+'\\n')\nprint('R115: INTEGRATED_AVD_CORE_PASS, phone release remains NOT allowed')\nPY_R115_MATRIX\n"
    - name: R9.2 - Summarize primary failure instead of duplicating it
      if: always()
      env:
        R92_BUILD_OUTCOME: ${{ steps.r92_compile.outcome }}
