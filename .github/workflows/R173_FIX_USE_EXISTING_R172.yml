name: R17.3 FIX - SWEET ARM64 build using existing R172 ZIP
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-root-child-peer:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Check pinned R173_main.zip and unpack safely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYZIP'
          import hashlib,stat,zipfile
          from pathlib import Path,PurePosixPath
          p=Path('R172_main.zip')
          if not p.is_file(): raise SystemExit('R172_main.zip missing from repository root')
          h=hashlib.sha256(p.read_bytes()).hexdigest()
          if h != '86f3b5ff40e51e256ada8d2d457204d44f4ff74a39bd75fc6356649862234efe': raise SystemExit('R172 source SHA mismatch: '+h)
          with zipfile.ZipFile(p) as z:
              if z.testzip() is not None: raise SystemExit('Corrupt archive')
              seen=set()
              for i in z.infolist():
                  n=i.filename
                  if n in seen or n.startswith('/') or '\\' in n or '..' in PurePosixPath(n).parts or stat.S_IFMT(i.external_attr >> 16)==stat.S_IFLNK:
                      raise SystemExit('Unsafe archive member: '+n)
                  seen.add(n)
              z.extractall('source')
          # Verified and fail-closed: R17.2 archive is already committed to main.
          target=Path('source/src/root_peer.cpp')
          original=target.read_text(encoding='utf-8')
          unused='constexpr int kWriteTimeoutSeconds = 2;\n'
          old_version='sweet414-root-peer R17.2; read-only UID-0 proof; no exploit; no Magisk'
          new_version='sweet414-root-peer R17.3; read-only UID-0 proof; no exploit; no Magisk'
          if original.count(unused) != 1 or original.count(old_version) != 1:
              raise SystemExit('R173_PATCH_INPUT_MISMATCH')
          corrected=original.replace(unused,'',1).replace(old_version,new_version,1)
          target.write_text(corrected,encoding='utf-8')
          expected='b4cd1bc8599f21e78dfd152750587495f51ac9c590cd8c2ecdf838bd009a6daa'
          if hashlib.sha256(target.read_bytes()).hexdigest() != expected:
              raise SystemExit('R173_PATCH_OUTPUT_SHA_MISMATCH')
          print('R173_SOURCE_PATCHED_AND_SHA256_VERIFIED')
          for needed in ('src/root_peer.cpp','src/peer_policy.hpp','tests/peer_policy_test.cpp','tests/test_r172_guards.py','reference/AndroidRootPeerProbe.java','CMakeLists.txt'):
              if not (Path('source')/needed).is_file(): raise SystemExit('Missing: '+needed)
          print('R173_PINNED_SOURCE_OK')
          PYZIP
      - name: Host C++ tests and policy guards
        shell: bash
        run: |
          set -euo pipefail
          cmake -S source -B source/.build-host -DCMAKE_BUILD_TYPE=Release
          cmake --build source/.build-host -j 2
          ctest --test-dir source/.build-host --output-on-failure
          python3 -m unittest discover -s source/tests -p 'test_*.py' -v
          source/.build-host/peer_policy_test
          set +e
          source/.build-host/sweet414-root-peer --serve-once --app-uid 10291 >/tmp/r172_denied.log 2>&1
          rc=$?
          set -e
          if [[ "$rc" != 77 && "$rc" != 78 ]]; then
            cat /tmp/r172_denied.log
            echo 'R173_NONPRIVILEGED_START_UNEXPECTED'; exit 1
          fi
          echo "R173_HOST_START_DENIED_AS_EXPECTED=$rc"
      - name: Strict host Clang regression (same Werror as Android build)
        shell: bash
        run: |
          set -euo pipefail
          clang++ --version
          clang++ -std=c++17 -O2 -Wall -Wextra -Werror -fsyntax-only -I source/src source/src/root_peer.cpp
          echo R173_STRICT_CLANG_WARNINGS_ZERO
      - name: Prepare Android NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK" || { echo 'Android SDK missing'; exit 1; }
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [[ ! -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++" ]]; then
            NDK="$SDK/ndk/27.2.12479018"
            if [[ ! -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++" ]]; then
              MGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
              if [[ ! -x "$MGR" ]]; then
                for p in "$SDK"/cmdline-tools/*/bin/sdkmanager; do
                  if [[ -x "$p" ]]; then MGR="$p"; break; fi
                done
              fi
              test -x "$MGR" || { echo 'sdkmanager missing'; exit 1; }
              "$MGR" --sdk_root="$SDK" 'ndk;27.2.12479018'
            fi
          fi
          test -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++"
          echo "R173_NDK=$NDK" >> "$GITHUB_ENV"
      - name: Build actual Android ARM64 ELF (not APK; no exploit)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          CXX="$R173_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++"
          "$CXX" -std=c++17 -O2 -Wall -Wextra -Werror -fPIE -pie -I source/src \
            source/src/root_peer.cpp -o artifacts/R173-sweet414-root-peer-arm64
          file artifacts/R173-sweet414-root-peer-arm64 | tee artifacts/R173_BINARY_TYPE.txt
          readelf -h artifacts/R173-sweet414-root-peer-arm64 | tee artifacts/R173_ELF_HEADER.txt
          readelf -l artifacts/R173-sweet414-root-peer-arm64 | tee artifacts/R173_ELF_SEGMENTS.txt
          grep -q 'AArch64' artifacts/R173_ELF_HEADER.txt
          grep -q 'DYN (Position-Independent Executable file)' artifacts/R173_ELF_HEADER.txt
          grep -q '/system/bin/linker64' artifacts/R173_ELF_SEGMENTS.txt
          sha256sum artifacts/R173-sweet414-root-peer-arm64 | tee artifacts/SHA256SUMS.txt
          python3 - <<'PYREPORT'
          from pathlib import Path
          import hashlib,json
          p=Path('artifacts/R173-sweet414-root-peer-arm64')
          obj={"revision":"R17.3","architecture":"AArch64 Android PIE",
               "binary_name":p.name,"sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
               "root_exploit_included":False,"magisk_daemon_started":False,
               "device_test":"NOT_PERFORMED","root_proof":False,
               "service_behavior":"UID0-only, target-bound, one-shot read-only SO_PEERCRED"}
          Path('artifacts/R173_BUILD_REPORT.json').write_text(json.dumps(obj,indent=2)+'\n')
          PYREPORT
      - name: Publish root-child peer bridge (not a root package)
        uses: actions/upload-artifact@v4
        with:
          name: R173-SWEET-RootChild-Peer-ARM64-NO-ROOT
          path: |
            artifacts/
            source/README_DE.md
          if-no-files-found: error
