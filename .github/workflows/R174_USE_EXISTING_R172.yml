name: R17.4 - SWEET Root-child bridge Android ARM64 hardened
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-root-child-peer:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Reconstruct and verify R17.4 from existing R172 ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_SOURCE'
          import base64,hashlib,json,stat,zipfile,zlib
          from pathlib import Path,PurePosixPath
          base=Path('R172_main.zip')
          if not base.is_file(): raise SystemExit('R174_BASE_MISSING: R172_main.zip expected in repository root')
          if hashlib.sha256(base.read_bytes()).hexdigest()!='86f3b5ff40e51e256ada8d2d457204d44f4ff74a39bd75fc6356649862234efe':
              raise SystemExit('R174_BASE_SHA256_MISMATCH')
          out=Path('source')
          with zipfile.ZipFile(base) as zz:
              if zz.testzip() is not None: raise SystemExit('R174_CORRUPT_BASE')
              names=set()
              for info in zz.infolist():
                  n=info.filename
                  if n in names or n.startswith('/') or '\\' in n or '..' in PurePosixPath(n).parts or stat.S_IFMT(info.external_attr>>16)==stat.S_IFLNK:
                      raise SystemExit('R174_UNSAFE_SOURCE: '+n)
                  names.add(n)
              zz.extractall(out)
          # Reproducible, pinned replacements, never applying an unverified patch to older ZIP.
          updates={
              'src/root_peer.cpp':('','ff042922c5a64b360651e8c433e389261251f9998d16b15411828e87e45f6529'),
              'src/peer_policy.hpp':('','ae97bf6018e13e9f826bb84846acbd8b5b91d7fa093d6ae3cc4a88fe8a84691a'),
              'tests/peer_policy_test.cpp':('','65ce181203f5675a9a69762ab886c236578e776010aefe926990a7fa9b83ab6c'),
              'tests/test_r172_guards.py':('','c7dea664fbcb5d609c8c8a74cf2412760bea89c28a83d7ec9fac8663c7e96032'),
              'tests/test_r174_guards.py':('','9e0893312fd2200ab06484cabb594f90934e7806becbcea0328e28b097cf6aa0'),
              'CMakeLists.txt':('','eb90713373adce290f875565b21e0153ca8c1452c60e91d12749af6798cb9185'),
              'README_DE.md':('','d556393137a98c56082f746a17282924253b938688f097ca1ed796673eedc589'),
          }
          for rel,(payload,expected_sha) in updates.items():
              target=out/rel
              value=zlib.decompress(base64.b64decode(payload))
              if hashlib.sha256(value).hexdigest()!=expected_sha: raise SystemExit('R174_PAYLOAD_SHA256_MISMATCH: '+rel)
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(value)
              if hashlib.sha256(target.read_bytes()).hexdigest()!=expected_sha: raise SystemExit('R174_WRITTEN_FILE_SHA256_MISMATCH: '+rel)
          if 'sweet414-root-peer-v1' not in (out/'src/peer_policy.hpp').read_text(): raise SystemExit('R174_SOCKET_CHANGED')
          if 'ROOT_PEER_NOT_ROOT' not in (out/'src/root_peer.cpp').read_text(): raise SystemExit('R174_MISSING_ROOT_GUARD')
          print('R174_SOURCE_RECONSTRUCTED_SHA256_VERIFIED')
          PY_SOURCE
      - name: Host C++ tests, Python guards and non-root refusal
        shell: bash
        run: |
          set -euo pipefail
          cmake -S source -B source/.build-host -DCMAKE_BUILD_TYPE=Release
          cmake --build source/.build-host -j 2
          ctest --test-dir source/.build-host --output-on-failure
          python3 -m unittest discover -s source/tests -p 'test_*.py' -v
          source/.build-host/peer_policy_test
          set +e
          source/.build-host/sweet414-root-peer --serve-once >/tmp/r174_nonroot.log 2>&1
          rc=$?
          set -e
          if [[ "$rc" != 77 && "$rc" != 78 ]]; then
            cat /tmp/r174_nonroot.log
            echo R174_UNPRIVILEGED_EXECUTION_UNEXPECTED; exit 1
          fi
          echo R174_HOST_START_REFUSED_AS_EXPECTED=$rc
      - name: Strict host Clang regression
        shell: bash
        run: |
          set -euo pipefail
          clang++ --version
          clang++ -std=c++17 -O0 -Wall -Wextra -Werror -fsyntax-only -I source/src source/src/root_peer.cpp
          echo R174_STRICT_CLANG_ZERO_WARNINGS
      - name: Prepare Android NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK" || { echo 'Android SDK missing'; exit 1; }
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [[ ! -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++" ]]; then
            NDK="$SDK/ndk/27.2.12479018"
            if [[ ! -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++" ]]; then
              MGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
              if [[ ! -x "$MGR" ]]; then
                for p in "$SDK"/cmdline-tools/*/bin/sdkmanager; do
                  if [[ -x "$p" ]]; then MGR="$p"; break; fi
                done
              fi
              test -x "$MGR" || { echo 'sdkmanager missing'; exit 1; }
              "$MGR" --sdk_root="$SDK" 'ndk;27.2.12479018'
            fi
          fi
          test -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++"
          echo "R174_NDK=$NDK" >> "$GITHUB_ENV"
      - name: Build Android AArch64 PIE with static C++ runtime and verify ELF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          CXX="$R174_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++"
          "$CXX" -std=c++17 -O2 -Wall -Wextra -Werror -fPIE -pie -static-libstdc++ -I source/src \
            source/src/root_peer.cpp -o artifacts/R174-sweet414-root-peer-arm64
          file artifacts/R174-sweet414-root-peer-arm64 | tee artifacts/R174_BINARY_TYPE.txt
          readelf -h artifacts/R174-sweet414-root-peer-arm64 | tee artifacts/R174_ELF_HEADER.txt
          readelf -l artifacts/R174-sweet414-root-peer-arm64 | tee artifacts/R174_ELF_SEGMENTS.txt
          readelf -d artifacts/R174-sweet414-root-peer-arm64 | tee artifacts/R174_ELF_DYNAMIC.txt
          python3 - <<'PY_ELF'
          from pathlib import Path
          import hashlib,json,re
          header=Path('artifacts/R174_ELF_HEADER.txt').read_text()
          segments=Path('artifacts/R174_ELF_SEGMENTS.txt').read_text()
          dynamic=Path('artifacts/R174_ELF_DYNAMIC.txt').read_text()
          if 'AArch64' not in header or 'DYN (Position-Independent Executable file)' not in header or '/system/bin/linker64' not in segments:
              raise SystemExit('R174_BAD_ANDROID_ARM64_ELF')
          needed=re.findall(r'Shared library: \[([^]]+)\]', dynamic)
          if 'libc++_shared.so' in needed:
              raise SystemExit('R174_MISSING_CPP_RUNTIME_REGRESSION: libc++_shared.so not bundled')
          allowed={'libc.so','libm.so','libdl.so'}
          if not set(needed).issubset(allowed):
              raise SystemExit('R174_UNEXPECTED_DYNAMIC_DEPENDENCIES: '+str(needed))
          p=Path('artifacts/R174-sweet414-root-peer-arm64')
          report={'revision':'R17.4','binary_name':p.name,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
                  'elf':'AArch64 PIE; Android linker64','dynamic_libraries':needed,
                  'cpp_runtime':'linked statically; libc++_shared.so dependency forbidden',
                  'root_exploit_included':False,'magiskd_started':False,'hardware_test':'NOT_RUN','uid0_proven':False}
          Path('artifacts/R174_BUILD_REPORT.json').write_text(json.dumps(report,indent=2)+'\n')
          print('R174_ANDROID_ELF_DEPENDENCIES_OK='+','.join(needed))
          PY_ELF
          sha256sum artifacts/R174-sweet414-root-peer-arm64 | tee artifacts/SHA256SUMS.txt
      - name: Publish root-child ARM64 bridge (not a root package)
        uses: actions/upload-artifact@v4
        with:
          name: R174-SWEET-RootChild-ARM64-PROVIDER-ABSENT
          path: |
            artifacts/
            source/README_DE.md
          if-no-files-found: error
