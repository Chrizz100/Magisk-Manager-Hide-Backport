          ui=read('app/apk/src/main/java/com/topjohnwu/magisk/ui/home/HomeScreen.kt')
          assert 'constructor(rawStubData: Any)' in app
          assert 'Info.stub = data' in app
          assert 'StubApk.current(base).path' in ctx
          assert 'val isRunningAsStub' in info
          assert 'if (!Shell.cmd("adb_pm_install $repack $target").await().isSuccess)' in migration
          assert 'Config.suManager = target' in migration
          assert migration.index('adb_pm_install $repack') < migration.index('Config.suManager = target')
          assert 'runCatching { Config.suManager = "" }' in migration
          assert 'PackageManager.NameNotFoundException' in migration
          assert 'suspend fun restoreApp' in migration
          assert 'fun hideManager(label: String)' in vm and 'fun restoreManager()' in vm
          assert 'viewModelScope.launch' in vm
          # R6.3: the Compose screen must not own a coroutine that is unused.
          # Work and progress remain in ViewModel; prevent stale missing imports.
          assert 'rememberCoroutineScope()' not in ui, 'Stale Compose coroutine invocation'
          assert 'migrationScope' not in ui and 'migrationBusy' not in ui, 'Unused UI coroutine state'
          assert 'HideAppDialog(' in ui and 'RestoreAppDialog(' in ui
          assert 'AppMigration.patchAndHide' not in ui
          assert 'Config.toBundle()' not in migration
          assert 'dbStrings(Key.SU_MANAGER' not in read('app/core/src/main/java/com/topjohnwu/magisk/core/Config.kt')
          assert 'get_repackaged_manager_pkg' in read('native/src/core/db.rs')
          assert (m/'app/stub/src/main/java/com/topjohnwu/magisk/DynLoad.java').is_file()
          assert 'api(project(":shared"))' in read('app/core/build.gradle.kts'), 'R6.1 shared-API dependency missing'
          # Recheck manifest overlay compatibility in a separate workflow step.
          an='{http://schemas.android.com/apk/res/android}'
          core=ET.parse(m/'app/core/src/main/AndroidManifest.xml').getroot().find('application').attrib
          shared=ET.parse(m/'app/shared/src/main/AndroidManifest.xml').getroot().find('application').attrib
          app=ET.parse(m/'app/apk/src/main/AndroidManifest.xml').getroot().find('application').attrib
          assert core.get(an+'enableOnBackInvokedCallback')=='true'
          assert an+'enableOnBackInvokedCallback' not in shared
          assert an+'enableOnBackInvokedCallback' not in app
          assert not {k:(core[k],shared[k]) for k in set(core)&set(shared) if core[k]!=shared[k]}
          assert 'from(stubTask)' in read('app/build-logic/src/main/java/Setup.kt')
          root=ET.parse(m/'app/core/src/main/res/values/strings.xml').getroot()
          names={e.get('name') for e in root if e.tag=='string'}
          assert {'settings_hide_app_title','settings_restore_app_title','settings_app_name_hint','restore_app_confirmation'} <= names
          print('R6 source, transaction ordering, app class loader, UI and XML contracts: PASS')
          R6_CONTRACTS

