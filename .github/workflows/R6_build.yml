          assert (m/'app/stub/src/main/java/com/topjohnwu/magisk/DynLoad.java').is_file()
          assert 'api(project(":shared"))' in read('app/core/build.gradle.kts'), 'R6.1 shared-API dependency missing'
          assert 'from(stubTask)' in read('app/build-logic/src/main/java/Setup.kt')
          root=ET.parse(m/'app/core/src/main/res/values/strings.xml').getroot()
          names={e.get('name') for e in root if e.tag=='string'}
          assert {'settings_hide_app_title','settings_restore_app_title','settings_app_name_hint','restore_app_confirmation'} <= names
          print('R6 source, transaction ordering, app class loader, UI and XML contracts: PASS')
          R6_CONTRACTS

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Python 3
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Obtain official Magisk ONDK
        shell: bash
        run: |
          set -euo pipefail
          (cd magisk && python3 build.py -v ndk) 2>&1 | tee reports/ondk.log

      - name: Generate throwaway R6 CI signing certificate (never distribute)
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt \
            -keystore "$GITHUB_WORKSPACE/magisk/r6-ci-only.p12" -storetype PKCS12 \
            -storepass 'R6-Test-Only' -keypass 'R6-Test-Only' \
            -alias r6-research -keyalg RSA -keysize 3072 -validity 2 \
            -dname 'CN=Disposable R6 Research Build, O=Local CI, C=DE' >/dev/null
          cat > r6-build.prop <<EOF
          abiList=arm64-v8a,armeabi-v7a
          keyStore=$GITHUB_WORKSPACE/magisk/r6-ci-only.p12
          keyStorePass=R6-Test-Only
          keyPass=R6-Test-Only
          keyAlias=r6-research
          EOF
          keytool -list -keystore "$GITHUB_WORKSPACE/magisk/r6-ci-only.p12" -storepass 'R6-Test-Only' -alias r6-research >/dev/null

      - name: Compile signed research Magisk 31.1 with R6 migration and stub.apk
        shell: bash
        run: |
          set -euo pipefail
          (cd magisk && python3 build.py -vr -c ../r6-build.prop all) 2>&1 | tee reports/full_build.log
          python3 - <<'PY_VERIFY'
          import hashlib, pathlib, zipfile
          root=pathlib.Path('magisk/out')
          apk=root/'app-release.apk'
          assert apk.is_file() and apk.stat().st_size>1_000_000
          with zipfile.ZipFile(apk) as z:
            assert z.testzip() is None
            dex=[n for n in z.namelist() if n.startswith('classes') and n.endswith('.dex')]
            assert dex
          with zipfile.ZipFile(apk) as z:
            names=z.namelist()
            assert 'assets/stub.apk' in names, 'Stub APK was not packaged in Magisk manager'
            from io import BytesIO
            with zipfile.ZipFile(BytesIO(z.read('assets/stub.apk'))) as stub:
              assert stub.testzip() is None
              assert 'AndroidManifest.xml' in stub.namelist()
              assert 'classes.dex' in stub.namelist()
          flags=(pathlib.Path('magisk/native/out/generated/flags.rs')).read_text()
          assert 'TRUSTED_CERT' in flags
          import re
          cert=re.search(r'TRUSTED_CERT:.*?= &\[(.*?)\];',flags,re.S)
          assert cert and len(re.findall('0x[0-9a-f]{2}', cert.group(1)))>100, 'Trusted cert missing in native build'
          sha=hashlib.sha256(apk.read_bytes()).hexdigest()
          pathlib.Path('reports/app-release-sha256.txt').write_text(f'{sha}  app-release.apk\n')
          pathlib.Path('reports/BUILD_STATUS.txt').write_text(
            'R6 native ARM64/ARM32, Android APK and nested stub.apk built.\n'
            'R6 AppMigration and Compose UI compiled, but runtime migration still UNTESTED.\n'
            'DO NOT INSTALL OR FLASH THIS EXPERIMENTAL RESEARCH FORK.\n'
          )
          print('R6 stub.apk, app migration UI and native trusted certificate compiled PASS; research-only')
          PY_VERIFY

      - name: Upload compiler and source evidence only (no APK, no signing key)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: R6_1_COMPILER_EVIDENCE_DO_NOT_FLASH
          path: reports/
          if-no-files-found: error
          retention-days: 14
