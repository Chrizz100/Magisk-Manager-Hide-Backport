          python3 - <<'PY_VERIFY'
          import hashlib, pathlib, zipfile
          root=pathlib.Path('magisk/out')
          apk=root/'app-release.apk'
          assert apk.is_file() and apk.stat().st_size>1_000_000
          with zipfile.ZipFile(apk) as z:
            assert z.testzip() is None
