                  if self.root_setup_started and self.original_present:
                      try:
                          if self.requester():
                              self.sqlite_clear_requester()
                              (self.report / 'manual_rollback.txt').write_text('Native requester DB cleared after incomplete UI restoration.\n')
                      except Exception as e:
                          (self.report / 'manual_rollback_error.txt').write_text(str(e) + '\n')
                      if self.target and PACKAGE_RE.fullmatch(self.target):
                          try:
                              self.cmd(['adb', 'uninstall', self.target], timeout=55, check=False,
                                       output='emulator_stub_cleanup.txt')
                          except Exception as e:
                              (self.report / 'stub_cleanup_error.txt').write_text(str(e) + '\n')

              def finish(self):
                  if self.stages.get('AVD_ONLY'):
                      try:
                          self.adb('logcat -d -v threadtime', timeout=90, output='logcat.txt')
                          self.adb('dumpsys activity activities', output='final_activities.txt')
                      except Exception as e:
                          (self.report / 'log_collection_error.txt').write_text(str(e))
                  ok = self.error is None and all(self.stages.get(x) for x in REQUIRED_STAGES)
                  outcome = {
                      'base': 'pinned Magisk 31.1, R6.4 source bridge, R8.1 verified toolchain',
                      'test': 'official Magisk AVD daemon + real Android 13 manager hide and restore',
                      'checks': self.stages, 'missing_checks': [s for s in REQUIRED_STAGES if s not in self.stages],
                      'root_permissions_tested': bool(self.stages.get('MAGISK_SU')),
                      'hide_and_restore_tested': bool(self.restored_by_ui),
                      'physical_device_modified': False, 'target': self.target,
                      'error': self.error,
                      'result': 'ROOT_HIDE_RESTORE_PASS' if ok else 'ROOT_HIDE_RESTORE_FAILED_OR_INCOMPLETE',
                  }
                  (self.report / 'R9_RESULT.json').write_text(json.dumps(outcome, indent=2) + '\n')
                  print('R9 actual root and hide/restore outcome:', outcome['result'], flush=True)
                  if self.error:
                      print('R9 FAILED STAGE:', self.error, file=sys.stderr, flush=True)
                  return 0 if ok else 1

              def run(self):
                  try:
                      self.root_setup()
                      self.enable_gui()
                      self.hide_verify()
                      self.restore_verify()
                  except Exception as e:
                      self.error = str(e)
                  finally:
                      self.cleanup()
                      return self.finish()


          if __name__ == '__main__':
