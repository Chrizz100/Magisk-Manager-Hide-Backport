                             'STUB_FOREGROUND', 'STUB_RESTORE_BUTTON', 'RESTORE_DIALOG',
                             'REQUESTER_CLEARED', 'ORIGINAL_FOREGROUND', 'MAGISK_SU_AFTER_RESTORE')


          def extract_requester(output):
              lines = [line.strip() for line in output.splitlines() if line.startswith('value=')]
              if not lines:
                  return ''
              if len(lines) != 1:
                  raise RuntimeError('Unexpected multiple requester DB values')
              value = lines[0][6:]
              if value and (not PACKAGE_RE.fullmatch(value) or value == ORIGINAL):
                  raise RuntimeError('Malformed requester DB value')
