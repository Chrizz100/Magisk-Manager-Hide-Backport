          set -euo pipefail
          cat > r98_isolate_source.py <<'PY_R98_ISOLATE_SOURCE'
          #!/usr/bin/env python3
          """R9.8: separate package, display label and non-root-only shell for UI testing.
          
          Runs only after the original R9.7 full emulator PASS, and ONLY in the
          fresh working checkout. Does not change the user's existing R6_build.yml.
          """
          from __future__ import annotations
          import hashlib
          import json
          import re
          import sys
          from pathlib import Path
          
          PKG = 'org.chrizz100.magiskhide.uitest'
          LABEL = 'MH R9.8 UI Test (No Root)'
          
          
          def replace_exact(path: Path, old: str, new: str) -> tuple[str, str]:
              raw = path.read_text(encoding='utf-8')
              assert raw.count(old) == 1, f'{path}: expected one exact pinned anchor, found {raw.count(old)}: {old[:100]}'
              replaced = raw.replace(old, new, 1)
              path.write_text(replaced, encoding='utf-8')
              return (hashlib.sha256(raw.encode()).hexdigest(), hashlib.sha256(replaced.encode()).hexdigest())
          
          
          def apply(base: Path, report: Path) -> dict:
              base = base.resolve()
              assert (base / 'app' / 'build-logic' / 'src' / 'main' / 'java' / 'Setup.kt').is_file(), 'Expected pinned Magisk source tree missing'
              assert (base / 'app' / 'core' / 'src' / 'main' / 'java' / 'com' / 'topjohnwu' / 'magisk' / 'core' / 'AppContext.kt').is_file()
              setup = base / 'app/build-logic/src/main/java/Setup.kt'
              core = base / 'app/core/build.gradle.kts'
              context = base / 'app/core/src/main/java/com/topjohnwu/magisk/core/AppContext.kt'
              manifest = base / 'app/apk/src/main/AndroidManifest.xml'
              files = {}
              files['setup'] = replace_exact(setup,
                  'applicationId = "com.topjohnwu.magisk"',
                  f'applicationId = "{PKG}"')
              files['core'] = replace_exact(core,
                  'buildConfigField("String", "APP_PACKAGE_NAME", "\\"com.topjohnwu.magisk\\"")',
                  f'buildConfigField("String", "APP_PACKAGE_NAME", "\\"{PKG}\\"")')
              files['context'] = replace_exact(context,
                  '.setFlags(Shell.FLAG_MOUNT_MASTER)',
                  '.setFlags(Shell.FLAG_NON_ROOT_SHELL)')
              files['manifest'] = replace_exact(manifest,
                  '<application android:localeConfig="@xml/locale_config">',
                  f'<application android:localeConfig="@xml/locale_config" android:label="{LABEL}" tools:replace="android:label">')
              # Verify that no original package identifier is used for app ID or exported
              # BuildConfig package, but keep the original Java namespace unchanged.
              assert f'applicationId = "{PKG}"' in setup.read_text()
              assert f'APP_PACKAGE_NAME", "\\"{PKG}\\"' in core.read_text()
              assert '.setFlags(Shell.FLAG_NON_ROOT_SHELL)' in context.read_text()
              assert '.setFlags(Shell.FLAG_MOUNT_MASTER)' not in context.read_text()
              assert LABEL in manifest.read_text()
              from xml.etree import ElementTree as ET
              ET.parse(manifest)
              out = {'purpose': 'UI-only, NO root, NO manager hide, NO root/Alpha compatibility',
                     'package': PKG, 'label': LABEL, 'key_policy': 'ephemeral CI research signing key, not exported',
                     'root_shell_mode': 'Shell.FLAG_NON_ROOT_SHELL',
                     'baseline_pinned_magisk': '0972f67d97f9b6302b67c5171283330c74114b4a',
                     'files_sha256_before_after': {k:{'before':a,'after':b} for k,(a,b) in files.items()}}
              report.parent.mkdir(parents=True,exist_ok=True)
              report.write_text(json.dumps(out, indent=2) + '\n',encoding='utf-8')
              return out
          
          
          if __name__=='__main__':
              if len(sys.argv)!=3:
                  sys.exit('Usage: isolate_r98.py PINNED_MAGISK_DIR REPORT_JSON')
              print('R9.8 isolated source configuration:',json.dumps(apply(Path(sys.argv[1]),Path(sys.argv[2])),sort_keys=True))
          PY_R98_ISOLATE_SOURCE
          python3 r98_isolate_source.py magisk reports/R98_ISOLATION.json
          test "$(git -C magisk rev-parse HEAD)" = 0972f67d97f9b6302b67c5171283330c74114b4a
          mkdir -p reports dist
          for attempt in 1 2 3; do
            log="reports/r98_ui_only_build_${attempt}.log"
            if (cd magisk && python3 build.py -vr -c ../r6-build.prop app) 2>&1 | tee "$log"; then
              printf 'UI_BUILD_PASS_ON_ATTEMPT=%s\n' "$attempt" > reports/R98_UI_BUILD_STATUS.txt
              break
            fi
            if ! grep -Eiq 'HTTP[^0-9]*5[0-9][0-9]|status code[^0-9]*5[0-9][0-9]|Gateway Time-out|Gateway Timeout|Service Unavailable|Connection reset|Connection timed out|Read timed out|UnknownHostException|TLS handshake' "$log"; then
              echo 'R9.8: real compiler failure; refusing retry' >&2
              exit 1
            fi
            test "$attempt" -lt 3 || { echo 'R9.8: dependency network failed three times' >&2; exit 1; }
            sleep "$((attempt*10))"
          done
          test -s magisk/out/app-release.apk
          cp magisk/out/app-release.apk dist/R98_UI_ONLY_NOT_ROOT.apk
          python3 - <<'PY_R98_VERIFY'
          import json,hashlib,zipfile
          from pathlib import Path
          p=Path('dist/R98_UI_ONLY_NOT_ROOT.apk')
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert any(n.startswith('classes') and n.endswith('.dex') for n in z.namelist())
          report=json.loads(Path('reports/R98_ISOLATION.json').read_text())
          assert report['package']=='org.chrizz100.magiskhide.uitest'
          assert report['root_shell_mode']=='Shell.FLAG_NON_ROOT_SHELL'
          sha=hashlib.sha256(p.read_bytes()).hexdigest()
          Path('dist/SHA256.txt').write_text(sha+'  R98_UI_ONLY_NOT_ROOT.apk\n')
          print('R9.8: separately packaged UI-only ZIP/APK integrity: PASS',sha)
          PY_R98_VERIFY
          AAPT2="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/build-tools/37.0.0/aapt2"
          APKSIGNER="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/build-tools/37.0.0/apksigner"
          test -x "$AAPT2" && test -x "$APKSIGNER"
          "$AAPT2" dump packagename dist/R98_UI_ONLY_NOT_ROOT.apk | tee reports/R98_ANDROID_PACKAGE.txt
          grep -Fx 'org.chrizz100.magiskhide.uitest' reports/R98_ANDROID_PACKAGE.txt
          "$APKSIGNER" verify --verbose --print-certs dist/R98_UI_ONLY_NOT_ROOT.apk > reports/R98_APK_SIGNER.txt
          grep -Eq '^Verified$|Verifies$' reports/R98_APK_SIGNER.txt || { echo 'APK signer verification did not report Verified'; cat reports/R98_APK_SIGNER.txt; exit 1; }
          cat > dist/READ_ME_FIRST.txt <<'UI_ONLY_NOTICE'
          R9.8 MAGISK MANAGER-HIDE UI TEST -- NO ROOT AND NO REAL HIDE TEST
          APK package: org.chrizz100.magiskhide.uitest
          This is an independently packaged visual test of the R9.7 app.
          It forces the libsu builder to FLAG_NON_ROOT_SHELL and is NOT a working
          Magisk Alpha 31100 manager. Do not use any Install/Uninstall/Hide actions.
          It does NOT fix banking app root detection. If the Android installer
          reports a collision, stop: do not uninstall or replace Magisk Alpha.
          Original R9.7 workflow remains unchanged. Signing certificate is
          generated per CI run; upgrading a previous test build requires its
          removal first, never an overwrite of Magisk Alpha.
          UI_ONLY_NOTICE

      - name: R9.8 - Prepare isolated Android-13 UI test
        shell: bash
        run: |
          set -euo pipefail
          cat > r98_ui_smoke.sh <<'SH_R98_UI_SMOKE'
          #!/usr/bin/env bash
          # Emulator only: deliberately never call `su`, `magisk --sqlite`, or `build.py emulator`.
          set -Eeuo pipefail
          PKG='org.chrizz100.magiskhide.uitest'
          APK="$GITHUB_WORKSPACE/dist/R98_UI_ONLY_NOT_ROOT.apk"
          REP="$GITHUB_WORKSPACE/reports/r98_ui"
          mkdir -p "$REP"
          fail() { printf '%s\n' "$*" | tee "$REP/FAILURE.txt" >&2; exit 1; }
          [[ -s "$APK" ]] || fail 'R98 APK absent'
          [[ "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" == '33' ]] || fail 'Require Android 13 emulator'
          [[ "$(adb shell getprop ro.kernel.qemu | tr -d '\r')" == '1' ]] || fail 'Refusing non-emulator target'
          [[ "$(adb devices | awk 'NR>1 && $2=="device"{print $1}' | wc -l)" -eq 1 ]] || fail 'Not exactly one emulator'
          [[ "$(adb devices | awk 'NR>1 && $2=="device"{print $1}')" == emulator-* ]] || fail 'Non-emulator serial'
          # Install without -r; no other installed app can be replaced.
          adb install "$APK" | tee "$REP/install.txt"
          adb shell pm path "$PKG" | tee "$REP/package_path.txt" | grep -F 'package:' >/dev/null || fail 'Isolated package not installed'
          # Notification prompt can cover UI in Android 13. Grant only on throwaway emulator.
          adb shell pm grant "$PKG" android.permission.POST_NOTIFICATIONS >"$REP/notification.txt" 2>&1 || true
          adb shell am start -W -n "$PKG/com.topjohnwu.magisk.ui.MainActivity" | tee "$REP/launch.txt"
          sleep 6
          get_ui() {
            local name="$1" found=0
            for attempt in 1 2 3 4 5; do
              adb shell uiautomator dump "/sdcard/r98_${name}.xml" >"$REP/${name}_dump_${attempt}.txt" 2>&1 || true
              if adb pull "/sdcard/r98_${name}.xml" "$REP/${name}.xml" >"$REP/${name}_pull_${attempt}.txt" 2>&1; then
                if python3 - "$REP/${name}.xml" <<'PYXML'
          import sys,xml.etree.ElementTree as E
          r=E.parse(sys.argv[1]).getroot()
          labels=[v for el in r.iter() for field in ('text','content-desc') if (v:=el.get(field))]
          assert 'Home' in labels and 'Magisk' in labels
          PYXML
                then found=1; break; fi
              fi
              sleep 3
            done
            [[ "$found" -eq 1 ]] || fail "No functional Magisk UI hierarchy: ${name}"
          }
          get_ui home
          adb shell input tap 900 2236
          sleep 3
          # The Settings page is present in the genuine app; no root functions called.
          for attempt in 1 2 3 4 5; do
            adb shell uiautomator dump /sdcard/r98_settings.xml >"$REP/settings_dump_${attempt}.txt" 2>&1 || true
            adb pull /sdcard/r98_settings.xml "$REP/settings.xml" >"$REP/settings_pull_${attempt}.txt" 2>&1 || true
            if python3 - "$REP/settings.xml" <<'PYXML'
          import sys,xml.etree.ElementTree as E
          r=E.parse(sys.argv[1]).getroot()
          t={v for el in r.iter() for f in ('text','content-desc') if (v:=el.get(f))}
          assert {'Settings','Customization'} <= t, sorted(t)
          PYXML
            then break; fi
            [[ "$attempt" -lt 5 ]] || fail 'Settings screen failed to load'
            sleep 3
          done
          adb shell input tap 180 2236
          sleep 2
          get_ui returned_home
          adb logcat -d -v brief > "$REP/logcat.txt" 2>&1 || true
          python3 - "$REP" <<'PYRESULT'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          import json, sys
          p=Path(sys.argv[1]);home=ET.parse(p/'returned_home.xml').getroot()
          labels={v for n in home.iter() for f in ('text','content-desc') if (v:=n.get(f))}
          assert {'Magisk','Home'}<=labels
          # Never claim root compatibility or app concealment from this smoke test.
          d={'result':'ISOLATED_UI_PASS','package':'org.chrizz100.magiskhide.uitest',
             'api':33,'install_without_replace':True,'home':True,'settings':True,
             'root_access_tested':False,'manager_hide_tested':False,'alpha_31100_compatibility_tested':False,
             'physical_device_modified':False,'scope':'UI-only on throwaway x86_64 AVD'}
          (p/'RESULT.json').write_text(json.dumps(d,indent=2)+'\n')
          print('R9.8 separate UI-only emulator PASS; no root, no hide, no physical phone touched')
          PYRESULT
          SH_R98_UI_SMOKE
          chmod +x r98_ui_smoke.sh
          bash -n r98_ui_smoke.sh
          test -s dist/R98_UI_ONLY_NOT_ROOT.apk

