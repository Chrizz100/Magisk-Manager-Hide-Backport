          import os
          import re
          import shlex
          import subprocess
          import sys
          import time
          import xml.etree.ElementTree as ET
          from pathlib import Path

          ORIGINAL = 'com.topjohnwu.magisk'
          ACTIVITY = ORIGINAL + '/.ui.MainActivity'
