          PACKAGE_RE = re.compile(r'[a-z][a-z0-9_]*(?:\.[a-z][a-z0-9_]*)+')
          REQUIRED_STAGES = ('AVD_ONLY', 'ADB_ROOT', 'MAGISK_DAEMON_31100', 'MAGISK_SU',
