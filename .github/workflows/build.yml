name: Magisk Manager-Hide R3 - Native Compile Gate

# SOURCE-ONLY verification. No APK installation, flashing or phone interaction.
# This is an official Magisk v31.1 research fork, not Magisk Alpha 31100.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-compile-gate:
    name: Apply targeted native patch and compile arm64 + arm32
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact original Magisk 31.1 with submodules
        uses: actions/checkout@v6
        with:
          repository: topjohnwu/Magisk
          ref: 0972f67d97f9b6302b67c5171283330c74114b4a
          fetch-depth: 1
          submodules: recursive
          path: magisk
          persist-credentials: false

      - name: Apply reviewed two-file native manager patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          test "$(git -C magisk rev-parse HEAD)" = '0972f67d97f9b6302b67c5171283330c74114b4a'
          cat > reports/native-manager-r3.patch <<'R3_NATIVE_PATCH'
          diff --git a/native/src/core/db.rs b/native/src/core/db.rs
          index a2b94dbd5..495303c7d 100644
          --- a/native/src/core/db.rs
          +++ b/native/src/core/db.rs
          @@ -258,6 +258,27 @@ impl MagiskD {
                   val
               }
           
          +    /// Read the optional legacy `requester` name as TEXT from v31.1's existing
          +    /// `settings` table. SQLite's INTEGER affinity supports text rows, so this
          +    /// does not downgrade the database or reintroduce the removed `strings` table.
          +    /// Treat the value as *untrusted* until package.rs validates its APKs.
          +    pub fn get_repackaged_manager_pkg(&self) -> String {
          +        let mut value = String::new();
          +        let mut on_row = |_: &[String], row: &DbValues| {
          +            value.clear();
          +            value.push_str(row.get_text(0));
          +        };
          +        self.db_exec_with_rows(
          +            "SELECT COALESCE(CAST(value AS TEXT), '') FROM settings WHERE key='requester' LIMIT 1",
          +            &[],
          +            &mut on_row,
          +        )
          +        .sql_result()
          +        .log()
          +        .ok();
          +        value
          +    }
          +
               pub fn get_db_settings(&self) -> SqliteResult<DbSettings> {
                   let mut cfg = DbSettings {
                       zygisk: self.is_emulator,
          diff --git a/native/src/core/package.rs b/native/src/core/package.rs
          index 94fea3ae4..a05cd45d7 100644
          --- a/native/src/core/package.rs
          +++ b/native/src/core/package.rs
          @@ -3,16 +3,16 @@ use crate::daemon::{AID_APP_END, AID_APP_START, MagiskD, to_app_id};
           #[cfg(all(feature = "check-signature", not(debug_assertions)))]
           use crate::ffi::uninstall_pkg;
           use base::WalkResult::{Abort, Continue, Skip};
          -use base::const_format::concatcp;
           use base::{
               BufReadExt, Directory, FsPathBuilder, LoggedResult, ReadExt, ResultExt, Utf8CStrBuf,
          -    Utf8CString, cstr, error, pre_order_walk,
          +    Utf8CString, cstr, error, fd_get_attr, pre_order_walk,
           };
           use bit_set::BitSet;
           use nix::fcntl::OFlag;
           use std::fs::File;
           use std::io;
           use std::io::{Cursor, Read, Seek, SeekFrom};
          +use std::os::fd::AsRawFd;
           use std::time::Duration;
           
           const EOCD_MAGIC: u32 = 0x06054B50;
          @@ -48,7 +48,7 @@ macro_rules! bad_apk {
            * This method extracts the first certificate of the first signer
            * within the APK v2 signature block.
            */
          -fn read_certificate(apk: &mut File) -> Vec<u8> {
          +fn read_certificate(apk: &mut File, min_version_code: i32) -> Vec<u8> {
               let res = || -> io::Result<Vec<u8>> {
                   let mut u32_val = 0u32;
                   let mut u64_val = 0u64;
          @@ -93,7 +93,7 @@ fn read_certificate(apk: &mut File) -> Vec<u8> {
                           true
                       }
                   });
          -        if MAGISK_VER_CODE > apk_ver {
          +        if min_version_code > apk_ver {
                       Err(bad_apk!("APK version too low"))?;
                   }
           
          @@ -147,14 +147,14 @@ fn read_certificate(apk: &mut File) -> Vec<u8> {
               res.log().unwrap_or(vec![])
           }
           
          -fn find_apk_path() -> Option<Utf8CString> {
          +fn find_apk_path(pkg: &str) -> Option<Utf8CString> {
               let mut buf = Utf8CString::default();
               pre_order_walk(cstr!("/data/app"), |e, path| {
                   if !e.is_dir() {
                       return Ok(Skip);
                   }
                   let name = e.name();
          -        if name.starts_with(concatcp!(APP_PACKAGE_NAME, "-")) {
          +        if name.starts_with(pkg) && name.as_bytes().get(pkg.len()) == Some(&b'-') {
                       // Found the APK path, we can abort now
                       buf.append_path(path).append_path("base.apk");
                       return Ok(Abort);
          @@ -208,12 +208,12 @@ impl TrackedFile {
           }
           
           fn check_apk(tracked: &mut TrackedFile) -> bool {
          -    let Some(apk) = find_apk_path() else {
          +    let Some(apk) = find_apk_path(APP_PACKAGE_NAME) else {
                   return false;
               };
           
               let cert = match apk.open(OFlag::O_RDONLY | OFlag::O_CLOEXEC) {
          -        Ok(mut fd) => read_certificate(&mut fd),
          +        Ok(mut fd) => read_certificate(&mut fd, MAGISK_VER_CODE),
                   Err(_) => return false,
               };
           
          @@ -230,8 +230,67 @@ fn check_apk(tracked: &mut TrackedFile) -> bool {
               true
           }
           
          +// Research-stage native integration only. The repackaged package is NOT authorized
          +// merely because a database row exists: it must have an installed stub and an
          +// original-signature-verified dynamic Magisk APK owned by the same Android app.
          +// Do not accept a repackaged manager in builds without a pinned signing cert.
          +fn valid_repackaged_pkg(pkg: &str) -> bool {
          +    if pkg == APP_PACKAGE_NAME || pkg.len() > 200 || pkg.len() < 3 || !pkg.contains('.') {
          +        return false;
          +    }
          +    pkg.split('.').all(|segment| {
          +        let mut chars = segment.bytes();
          +        matches!(chars.next(), Some(b'a'..=b'z'))
          +            && chars.all(|c| c.is_ascii_lowercase() || c.is_ascii_digit() || c == b'_')
          +    })
          +}
          +
          +fn check_repackaged_manager(user: i32, pkg: &str) -> Option<i32> {
          +    // The original APK must be signed with the certificate embedded at build.
          +    // An unsigned/unpinned research build must never silently grant manager UID.
          +    if !valid_repackaged_pkg(pkg) || TRUSTED_CERT.is_empty() {
          +        return None;
          +    }
          +
          +    // Verify this package really has an installed repackaged stub APK.
          +    let stub = find_apk_path(pkg)?;
          +    let mut stub_fd = stub.open(OFlag::O_RDONLY | OFlag::O_CLOEXEC).ok()?;
          +    if read_certificate(&mut stub_fd, -1).is_empty() {
          +        return None;
          +    }
          +
          +    // The real manager code in the stub's private storage must be Magisk-signed.
          +    // Do not trust arbitrary data from the requester settings row.
          +    let uid = get_package_uid(user, pkg);
          +    if !(AID_APP_START..=AID_APP_END).contains(&to_app_id(uid)) {
          +        return None;
          +    }
          +    let dyn_path = cstr::buf::default()
          +        .join_path(APP_DATA_DIR)
          +        .join_path_fmt(user)
          +        .join_path(pkg)
          +        .join_path("dyn")
          +        .join_path("current.apk");
          +    let mut dyn_fd = dyn_path.open(OFlag::O_RDONLY | OFlag::O_CLOEXEC).ok()?;
          +    let dyn_owner = fd_get_attr(dyn_fd.as_raw_fd()).ok()?.st.st_uid as i32;
          +    if dyn_owner != uid {
          +        return None;
          +    }
          +    let cert = read_certificate(&mut dyn_fd, MAGISK_VER_CODE);
          +    if cert.as_slice() != TRUSTED_CERT {
          +        error!("pkg: dynamic manager signature mismatch: {}", dyn_path);
          +        return None;
          +    }
          +    Some(uid)
          +}
          +
           impl MagiskD {
               pub fn get_manager_uid(&self, user: i32) -> i32 {
          +        // Preserve v31.1's original manager lookup as the fallback.
          +        let pkg = self.get_repackaged_manager_pkg();
          +        if let Some(uid) = check_repackaged_manager(user, &pkg) {
          +            return uid;
          +        }
                   let mut tracked = self.manager_info.lock();
                   if tracked.is_same() {
                       return if &tracked.path == PACKAGES_XML {
          R3_NATIVE_PATCH
          printf '%s  reports/native-manager-r3.patch\n' '537ec36cde696b1a9f6a379493b704b2cbd8a1e5a87cbe4ca5e036955ac60dd7' | sha256sum -c -
          git -C magisk apply --check ../reports/native-manager-r3.patch
          git -C magisk apply ../reports/native-manager-r3.patch
          git -C magisk diff --check
          git -C magisk diff --stat | tee reports/change_summary.txt
          git -C magisk diff --binary > reports/applied_source.diff

      - name: Verify database compatibility without changing schema
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VALIDATE_R3'
          import sqlite3
          from pathlib import Path
          p=Path('magisk/native/src/core/package.rs').read_text()
          d=Path('magisk/native/src/core/db.rs').read_text()
          assert 'check_repackaged_manager' in p
          assert 'TRUSTED_CERT.is_empty()' in p
          assert 'fd_get_attr(dyn_fd.as_raw_fd())' in p
          assert 'get_repackaged_manager_pkg()' in p
          assert "SELECT COALESCE(CAST(value AS TEXT), '') FROM settings WHERE key='requester' LIMIT 1" in d
          con=sqlite3.connect(':memory:')
          con.execute('CREATE TABLE settings (key TEXT, value INT, PRIMARY KEY(key))')
          con.execute("INSERT INTO settings VALUES ('multiuser_mode',2)")
          con.execute("INSERT INTO settings VALUES ('requester','sample.manager')")
          assert con.execute("SELECT value FROM settings WHERE key='requester'").fetchone()[0]=='sample.manager'
          assert con.execute("SELECT value FROM settings WHERE key='multiuser_mode'").fetchone()[0]==2
          print('Native source prerequisites and v13 settings compatibility: PASS')
          PY_VALIDATE_R3

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Python 3
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Obtain pinned official Magisk ONDK
        shell: bash
        run: |
          set -euo pipefail
          (cd magisk && python3 build.py -v ndk) 2>&1 | tee reports/ondk.log

      - name: Compile Magisk native ARM64 and ARM32 source
        shell: bash
        run: |
          set -euo pipefail
          printf 'abiList=arm64-v8a,armeabi-v7a\n' > r3-abis.prop
          (cd magisk && python3 build.py -vr -c ../r3-abis.prop native magisk) 2>&1 | tee reports/native_build.log
          echo 'Native source compilation succeeded (not a full Magisk build).' | tee reports/BUILD_STATUS.txt

      - name: Upload patch, exact source diff and compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: R3_NATIVE_COMPILER_EVIDENCE_NOT_FLASHABLE
          path: reports/
          if-no-files-found: warn
          retention-days: 14
