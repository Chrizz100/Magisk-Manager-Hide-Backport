name: Magisk Manager-Hide R1 - Source Audit

on:
  push:
    branches: [main]
    paths:
      - 'main.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      compile_historical_snapshot:
        description: 'Experimental old Magisk reference build (NOT a Magisk Alpha 31100 fix; DO NOT FLASH)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  source-audit:
    name: Verify pinned Magisk historical sources
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository containing main.zip
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Extract main.zip and verify embedded workflow
        shell: bash
        run: |
          set -euo pipefail
          test -f main.zip
          unzip -t main.zip > /dev/null
          mkdir -p kit
          unzip -oq main.zip -d kit
          cmp .github/workflows/build.yml kit/.github/workflows/build.yml
          (cd kit && sha256sum -c MANIFEST.sha256)
          test -f kit/tools/audit.py

      - name: Checkout Magisk snapshot immediately BEFORE app-hide removal
        uses: actions/checkout@v4
        with:
          repository: topjohnwu/Magisk
          ref: ea16c8141eb64dc28b56a0e7fb536689ef465429
          path: pre-removal
          persist-credentials: false

      - name: Checkout official Magisk v31.1
        uses: actions/checkout@v4
        with:
          repository: topjohnwu/Magisk
          ref: 0972f67d97f9b6302b67c5171283330c74114b4a
          path: final-31-1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pinned audit YAML parser
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Validate workflow syntax and audit safety guards
        run: python3 kit/tools/validate_workflow.py .github/workflows/build.yml

      - name: Run Python tests
        run: python3 -m unittest discover -s kit/tests -v

      - name: Compare original code and removed manager-hide components
        run: |
          python3 kit/tools/audit.py \
            --pre pre-removal \
            --final final-31-1 \
            --output reports/source-audit.json

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MAGISK_MANAGER_HIDE_R1_SOURCE_AUDIT
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  historical-build:
    name: Compile old Magisk reference (optional; DO NOT FLASH)
    needs: source-audit
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.compile_historical_snapshot == true }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository containing main.zip
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Extract main.zip and verify embedded workflow
        shell: bash
        run: |
          set -euo pipefail
          test -f main.zip
          unzip -t main.zip > /dev/null
          mkdir -p kit
          unzip -oq main.zip -d kit
          cmp .github/workflows/build.yml kit/.github/workflows/build.yml
          (cd kit && sha256sum -c MANIFEST.sha256)

      - name: Checkout exact historical source with submodules
        uses: actions/checkout@v4
        with:
          repository: topjohnwu/Magisk
          ref: ea16c8141eb64dc28b56a0e7fb536689ef465429
          path: magisk
          submodules: recursive
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify historical source and selected device ABIs
        shell: bash
        run: |
          test "$(git -C magisk rev-parse HEAD)" = 'ea16c8141eb64dc28b56a0e7fb536689ef465429'
          test -f magisk/app/core/src/main/java/com/topjohnwu/magisk/core/tasks/AppMigration.kt
          test -f magisk/app/stub/build.gradle.kts
          grep -q '^magisk.versionCode=31000$' magisk/app/gradle.properties
          grep -q '^abiList=arm64-v8a,armeabi-v7a$' kit/config/sweet.prop
          javac -version
          test -n "${ANDROID_HOME:-}"

      - name: Obtain original Magisk ONDK toolchain
        shell: bash
        run: cd magisk && python3 build.py -v ndk

      - name: Build historical ARM32 and ARM64 APK only (no flash)
        shell: bash
        run: cd magisk && python3 build.py -vr -c ../kit/config/sweet.prop all

      - name: Inspect compiled research APK
        shell: bash
        run: |
          python3 kit/tools/verify_build.py \
            --apk magisk/out/app-release.apk \
            --output reports/build-check.json

      - name: Add DO NOT INSTALL notice
        shell: bash
        run: |
          mkdir -p magisk/out
          cat > magisk/out/DO_NOT_INSTALL_ON_PHONE.txt <<'EOF'
          EXPERIMENTAL HISTORICAL MAGISK (versionCode 31000).
          This is NOT Magisk Alpha 31100 and NOT a tested 31.1 backport.
          NOT FOR INSTALLATION OR FLASHING. NO DEVICE/ROLLBACK TEST.
          EOF

      - name: Upload untested historical reference build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: UNTESTED_MAGISK_PRE_REMOVAL_REFERENCE_DO_NOT_FLASH
          path: |
            magisk/out/
            reports/build-check.json
          if-no-files-found: error
          retention-days: 7
