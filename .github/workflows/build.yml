name: Magisk Manager-Hide - Clean Source Recovery

# Read-only source recovery: never installs, flashes, or claims a working backport.
# This workflow deliberately does not use the old main.zip or hidden YAML archives.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-source:
    name: Fetch authentic 31.1 history and check all 8 removals
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Get exact Magisk 31.1 with complete Git history
        uses: actions/checkout@v6
        with:
          repository: topjohnwu/Magisk
          ref: 0972f67d97f9b6302b67c5171283330c74114b4a
          path: magisk
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Validate pinned upstream source
        shell: bash
        run: |
          set -euo pipefail
          cd magisk
          base=0972f67d97f9b6302b67c5171283330c74114b4a
          test "$(git rev-parse HEAD)" = "$base"
          git merge-base --is-ancestor ea16c8141eb64dc28b56a0e7fb536689ef465429 HEAD
          for sha in \
            e31ef291d401faa21c20fb791c38f1e60bedfa2e \
            d22fea290654dcf7bad9128f79834535ee3f47c3 \
            c86a8776cee88689dd684ec1dd7d584d77540110 \
            447a8f9965198f32a125b6c2c33644ca9604976e \
            5f2faee61879859004acb34811051f45d51a5191 \
            7d9b0dfb3e58ab0959021533e0d19ba362b766a7 \
            1240c2e35ca3f232d7a125238a33e634e9ab3231 \
            58477458401a298c02604b99caf5afcdb9ed9e3f; do
            test "$(git cat-file -t "$sha")" = commit
            git merge-base --is-ancestor "$sha" "$base"
          done

      - name: Package complete Git history for offline repair
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          git -C magisk bundle create "$GITHUB_WORKSPACE/reports/Magisk_v31.1_history.bundle" HEAD
          git -C magisk bundle verify "$GITHUB_WORKSPACE/reports/Magisk_v31.1_history.bundle"
          git -C magisk bundle list-heads "$GITHUB_WORKSPACE/reports/Magisk_v31.1_history.bundle" > reports/bundle_heads.txt
          grep -q 0972f67d97f9b6302b67c5171283330c74114b4a reports/bundle_heads.txt
          test -s reports/Magisk_v31.1_history.bundle
          sha256sum reports/Magisk_v31.1_history.bundle > reports/SHA256SUMS.txt

      - name: Check all eight removal commits separately and collect paths
        shell: bash
        run: |
          set -euo pipefail
          base=0972f67d97f9b6302b67c5171283330c74114b4a
          printf 'REMOVAL_COMMIT\tRESULT\tUNMERGED_FILES\n' > reports/independent_reverts.tsv
          errors=0
          for sha in \
            e31ef291d401faa21c20fb791c38f1e60bedfa2e \
            d22fea290654dcf7bad9128f79834535ee3f47c3 \
            c86a8776cee88689dd684ec1dd7d584d77540110 \
            447a8f9965198f32a125b6c2c33644ca9604976e \
            5f2faee61879859004acb34811051f45d51a5191 \
            7d9b0dfb3e58ab0959021533e0d19ba362b766a7 \
            1240c2e35ca3f232d7a125238a33e634e9ab3231 \
            58477458401a298c02604b99caf5afcdb9ed9e3f; do
            work="$RUNNER_TEMP/hide-review-$sha"
            git -C magisk worktree add --detach "$work" "$base" > /dev/null
            if git -C "$work" revert --no-commit "$sha" > reports/last_revert.log 2>&1; then
              result=APPLIES_IN_ISOLATION
            else
              result=GIT_REVERT_FAILED
            fi
            files="$(git -C "$work" diff --name-only --diff-filter=U | paste -sd ',' -)"
            if [ "$result" = GIT_REVERT_FAILED ]; then
              if [ -n "$files" ]; then
                result=MERGE_CONFLICT
              else
                result=UNEXPECTED_GIT_ERROR
                cat reports/last_revert.log >> reports/unexpected_git_errors.log
                errors=$((errors + 1))
              fi
            fi
            printf '%s\t%s\t%s\n' "$sha" "$result" "$files" >> reports/independent_reverts.tsv
            git -C magisk worktree remove --force "$work"
          done
          test "$(($(wc -l < reports/independent_reverts.tsv) - 1))" -eq 8
          cat reports/independent_reverts.tsv
          rm -f reports/last_revert.log
          test "$errors" -eq 0

      - name: Mark source artifact as research only
        if: always()
        shell: bash
        run: |
          mkdir -p reports
          cat > reports/READ_ME_FIRST.txt <<'EOF'
          OFFICIAL MAGISK v31.1 SOURCE + GIT HISTORY (open-source reference).
          The eight checks are INDEPENDENT and do not prove a complete port.
          This is NOT Magisk Alpha 31100, NOT a flashable module or APK.
          No installation, boot modification, or device testing occurred.
          EOF

      - name: Upload source and conflict inventory
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MAGISK_31_1_SOURCE_FOR_OFFLINE_BACKPORT
          path: reports/
          if-no-files-found: error
          retention-days: 7
